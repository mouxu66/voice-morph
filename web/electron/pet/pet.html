      setStatus("按住不放说话，松手就发", "");
      return;
    }
    void fireSend();
  });
}

// 引擎分段（唯一启停入口）：点已选中的 = 启动/停止，点另一个 = 切过去。
// dataset.eng 与 ENGINES 的键一一对应。
[engRvcBtn, engQwenBtn].forEach((b) => {
  if (b) b.addEventListener("click", () => { void pickEngine(b.dataset.eng); });
});

// 状态条上的药丸是**唯一**的变声开关：引擎分段只是「选哪个引擎 + 启停已选中的」。
// （改版前药丸与「RVC / 千问」分段都能启停，同一个 toggleLive 挂了两处入口 ——
//   代码注释里自己都写着"不存在两套逻辑"，那是解释，不是理由。）
if (pillEl && pillEl.addEventListener) pillEl.addEventListener("click", () => {
  if (!CAP.live) {
    setStatus("实时变声能力已关闭：主界面 → 桌面 → 插件里打开它", "err");
    return;
  }
  void toggleLive();
});

// ---------------- 按住说话（主按钮的默认手势）----------------
//
// 手势：按住主按钮 → `micDown` → 主进程 POST `/api/capture/mic/start`；松手 → `micUp` →
// 主进程 POST `/api/capture/mic/stop`（顺手 RVC 换声）→ `sendWechatWav` 发进微信。
//
// ★ 为什么状态机在主进程、这里只镜像：录音什么时候停由**用户松手**决定，而松手有三种意外
//   ——早于 start 的响应、指针滑出按钮、根本不松手。主进程必须把「已经按下了」这件事
//   持有一段跨 IPC 的时间；渲染进程做不到（面板在鼠标移开 500ms 后就会收起）。
//   所以 micPhase 只是**显示用**的镜像，真值由 `pet:mic-state` 推回来。
//   （它的声明与 MIC_TIP 一起前移到了 DOM 引用段 —— refreshFire 会读它们。）

// ---------------- 发送前预检：微信开没开 / 这次会不会重启 ----------------
//
// 这条链路的顺序是「录 0..59 秒 → 换声十几秒 → 才轮到发送」，而「微信没开」是**按下
// 之前**就能知道的事。后端 /api/wechat/precheck 是只读的（不动声卡、不碰微信），里面的
// block_reason 就是 send_text 那条 _send_preflight 的判据 —— **不在前端重写一份**：
// 本仓在 kangaroo → kangaroo_v2 上吃过「两处各抄一份判断、漂掉一个」的亏。
//
// ★ 只告警、**不拦人**：预检数据可能过期（用户刚把微信打开），拿旧数据去禁用按钮会把
//   「我刚开了微信」变成「按不了了」—— 那比不告警更糟。按下后一切照旧，真失败仍会有报错。
const PRECHECK_TTL = 5000;   // precheck 要枚举进程/窗口，别跟 tick 的 1s 轮询同频
let precheckAt = 0;

/** 取分因文案的第一句（冒号/句号/括号之前）——只做截断，不改写后端的判据。 */
function firstClause(s) {
  return String(s || "").split(/[：:。；;，,（(]/)[0].trim();
}

function renderWechatPrecheck(d) {
  const running = d && typeof d.wechat_running === "boolean" ? d.wechat_running : null;
  if (running === null) {
    // 200 但没有这个字段 = 前后端版本不一致（pet.html 是热替换的，后端可能还是旧的）。
    // 绝不能当成「微信没开」—— 那会把用户指去查微信，方向完全错。
    setWechatNote("预检没有结论（后端版本比桌宠旧？）", "warn");
    return;
  }
  if (d.block_reason) {
    // 非空 = 后端已判定这次**注定失败**（分因来自 find_wechat_hwnd）。
    // 完整原因进 title：单行条放不下，而省略号正好会切掉最该看的那半句。
    setWechatNote("⚠ " + firstClause(d.block_reason), "bad", d.block_reason);
    return;
  }
  if (!running) {
    // 没有硬失败 = auto/1 模式会自己把它拉起来 → 说清要等，而不是说「发不出去」
    setWechatNote("微信没在运行 · 这次会先拉起它（要等十几秒）", "warn");
    return;
  }
  if (d.restart_needed) {
    setWechatNote("这次会重启微信 · 约十几秒", "warn", d.reason || "");
    return;
  }
  setWechatNote("微信已打开", "ok", "", true);
}

/**
 * 拉一次预检并上屏。force=false 时 5s 内不重复（tick 每 1s 都会路过这里）。
 *
 * 改版前的判据是「只在看着『按住』那一页时刷」。页签没了之后换成「面板可见时刷」——
 * 预检只在悬停看面板时才有意义，而按住就是这个面板的默认手势，所以不能再等一次切页。
 */
async function refreshWechatPrecheck(force) {
  if (MOCK || !hintEl) return;
  if (!CAP.wechat) return;            // 能力关掉时主按钮直接写「微信能力已关闭」
  if (micHolding()) return;           // 按住/换声期间不抢后端，也不改文案（那几秒该显示进度）
  const now = Date.now();
  if (!force && now - precheckAt < PRECHECK_TTL) return;
  precheckAt = now;
  try {
    const r = await fetch(PRECHECK_API, { cache: "no-store" });
    if (!r.ok) {
      // 预检打不开**不影响发送**（它只是提前告知），所以只给 warn，不吓人
      setWechatNote(r.status === 404 ? "预检接口不在（后端比桌宠旧）" : "预检打不开（HTTP " + r.status + "）", "warn",
        "预检是只读的，打不开不影响发送；但「微信没开」这类问题会退化成松手后才发现");
      return;
    }
    renderWechatPrecheck(await r.json());
  } catch {
    setWechatNote("预检打不开（后端没起来？）", "warn");
  }
}

/** 录制中的秒数。要报出来——不报的话用户不知道按了几秒，也不知道离上限还有多久。 */
function tickMicSec() {
  if (!micSecEl) return;
  if (micPhase === "idle") { micSecEl.textContent = ""; return; }
  if (micPhase !== "recording" && micPhase !== "arming") {
    micSecEl.textContent = MIC_TIP[micPhase] || "";
    return;
  }
  const sec = Math.max(0, (Date.now() - micStartedAt) / 1000);
  micSecEl.textContent = `${sec.toFixed(1)}s / ${micMaxS}s`;
}

/**
 * 录音状态的**唯一**镜像点：装填区的波形块 + 主按钮 + 提示行，一次刷完。
 * 改版前这里只改 #holdMic 的 class 和文案 —— 那颗按钮只在「按住」页里存在，
 * 切走了就看不见。现在主按钮常驻，所以「按着时它是什么样」必须在这里统一表达。
 */
function renderMic() {
  const rec = micPhase !== "idle";
  // 装填区：录音时输入框让位给波形（两者不同时出现 —— 语音和打字是两条路）
  if (recBoxEl) recBoxEl.hidden = !rec;
  if (sayEl) {
    const field = sayEl.closest(".field");
    if (field) field.hidden = rec;
  }
  tickMicSec();
  refreshFire();   // 主按钮的 .m-* / 文案 / 提示行都跟着 micPhase 变
}

/** 秒表只靠需要的时候跑：面板平时是 1s 轮询，录制时才有“秒数在跳”的需求。 */
function startMicTicker() {
  if (micTicker) return;
  micTicker = setInterval(() => {
    if (micPhase === "recording" || micPhase === "arming") tickMicSec();
    else { clearInterval(micTicker); micTicker = null; }
  }, 200);
}

/** 记录中的“按住”阶段（鼠标穿透 / 面板自动收起都要让位，见下面的守卫）。 */
function micHolding() { return micPhase !== "idle"; }

function micDown(e) {
  if (micPhase !== "idle") return;            // 已在按着：重复的 down 忽略
  if (!CAP.wechat) { setStatus("微信发送能力已关闭，「按住说话」发不出去", "err"); return; }
  // ⚠ 主进程还是旧版时 preload 里根本没有 micDown（改 *.cjs 必须重打 asar 才生效，
  //   而 pet.html 是热替换的）—— 这种情况必须**说出来**，静静失败最糟：
  //   用户按半天会以为是手没按住，而这根本不是他能解决的问题。
  if (!window.pet || !window.pet.micDown) {
    setStatus("按住说话需要新版桌面端：主进程还是旧的（pet.html 已热替换、asar 未重打）", "err");
    return;
  }
  micPhase = "arming";
  micStartedAt = Date.now();
  renderMic();
  // 指针捕获：光标滑出按钮后 pointerup 仍送回这里。否则松手事件丢掉，
  // 只能等主进程那个 59s 上限兜底 —— 用户看到的是「按了没反应，还在录」。
  try { if (fireEl && e) fireEl.setPointerCapture(e.pointerId); } catch {}
  window.pet.micDown(voiceSel.value || "");
}

/**
 * 松手。**这里不直接改 micPhase**：松手只表示「要停」，下一个状态由主进程回传
 * （stop 要先录完再换声，换声那步可能要十几秒）。
 */
function micUp() {
  if (micPhase === "idle") return;
  if (window.pet && window.pet.micUp) window.pet.micUp();
}

// ⚠️ 主按钮的 pointerdown/up/click 只在一处挂（见上面「主按钮的两种手势」那段）。
//    改版前 holdMic 与 send 是两颗按钮，各挂一套；合并成一颗之后如果两处都挂，
//    录音会起两次、发送会触发两遍 —— 那是这次重构最容易犯的错。

// 主进程回传的录音状态：按钮文案/颜色/秒数全靠它（没有它就只能瞎显示）。
if (window.pet && window.pet.onMicState) {
  window.pet.onMicState((s) => {
    micPhase = (s && s.phase) || "idle";
    if (s && s.maxSeconds) micMaxS = Number(s.maxSeconds) || micMaxS;
    micStartedAt = (s && s.startedAt) || Date.now();
    renderMic();
    if (micHolding()) startMicTicker();
    // 一次发送结束（不论成败）就复查预检：微信可能刚被拉起/重启/被扔回登录页，
    // 而那正是下一次按下前最该知道的事。
    else void refreshWechatPrecheck(true);
    // 状态行也同步说一句：换声/发送这两段最长（换声十几秒），只靠按钮上那行小字容易被忽略。
    if (MIC_TIP[micPhase]) setStatus(MIC_TIP[micPhase], micPhase === "recording" ? "ok" : "");
  });
}

// 主进程回传：合成产物 → 自动播放
if (window.pet && window.pet.onPreviewResult) {
  window.pet.onPreviewResult((r) => {
    setBusy(previewBtn, false);   // 结果已回，不必再等那个 60s 兜底计时器
    if (!r || !r.ok) { setStatus("合成失败：" + ((r && r.error) || "未知错误"), "err"); return; }
    // `sendable === false` = 后端退回了**固定样板句**（你的文字没合出可用声音）：
    // 那是拿来确认"音色对不对"的，不是你要发的东西 —— 绝不能设进 lastPreview，
    // 否则主按钮会变成「发送试听」，发出去的是样板句而不是你打的字。
    if (r.sendable === false) {
      lastPreview = null;
      pendingPremix = false;
      refreshFire();              // 保持「合成并发送」
      setStatus(`${r.note || "你的文字没合出可用声音，改听固定样板句"}（${r.duration_s || "?"}s）`, "ok");
    } else {
      lastPreview = { wav: r.wav, url: r.url, duration_s: r.duration_s };
      // ★ 文字 + 音效片的那条链在这里接上：合成产物已经进了 lastPreview，
      //   直接交给 premixAndSend（它会读 lastPreview 当底，混完自己 sendWav）。
      //   注意**不能**再往下走去播试听 —— 用户要的是发出去，不是听一遍。
      if (pendingPremix) {
        pendingPremix = false;
        setBusy(sendBtn, false);
        void premixAndSend();
        return;
      }
      refreshFire();              // 主按钮切到「发送试听」
      setStatus(`已合成 ${r.duration_s || "?"}s，试听中…满意就点「发送试听」`, "ok");
    }
    try {
      if (previewAudio) previewAudio.pause();
      previewAudio = new Audio(r.url);
      previewAudio.onended = () => setStatus(lastPreview ? `试听完毕，点「发送试听」发出去` : "", "ok");
      void previewAudio.play();
    } catch {
      setStatus(`合成完成（${r.duration_s || "?"}s），但播放失败`, "err");
    }
  });
}

// 主进程回传：发送结果 → 面板状态行直接给结论
if (window.pet && window.pet.onSendResult) {
  window.pet.onSendResult((r) => {
    if (!r) return;
    void settleSendResult(r);
    refreshPanel();
  });
}

/** 读 /api/wechat/history 的最新一条；失败或无记录返回 null。 */
async function fetchLastHistory() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const items = j.items || [];
    return items[items.length - 1] || null;
  } catch {
    return null;
  }
}

/**
 * 把一次发送结果落到状态栏。
 *
 * warning 优先用回传值；回传里没有就补查一次历史 —— 兼容"主进程还是旧版、没透传
 * warning"的装机状态（改 *.cjs 要重打 asar，pet.html 却是热替换生效）。
 * 告警含义：录音环境有问题（典型是微信绑在物理麦上）→ 这条语音很可能是静音。
 * 背景见 2026-09-18 事故：此前这里无条件打绿勾「已发到微信 ✓」。
 *
 * 分段发送（2026-09-23）带来的两条新约束，都在下面显式处理：
 *   ① `warning` 是**单条**的属性，不是整批的。批次里第 1 条告警、第 2 条正常时，
 *      以前会把那条 warning 当成整批结论 → "已发出（3 条）但可能没声音"，
 *      而实际上后两条好好的。所以只报**哪几条**有问题，不否定整批。
 *   ② 时长也是**单条**的。批次里 duration_s 只代表其中一条，
 *      以前写成"已发出（12.3s）"会让人以为整段只有 12 秒 → 必须改成条数口径。
 */
async function settleSendResult(r, fallbackDurationS) {
  if (!r || !r.ok) {
    setStatus("发送失败：" + ((r && r.error) || "未知错误"), "err");
    return;
  }
  // 没有回传条数时（旧版主进程）按 1 条处理，口径与单条发送一致
  const total = Number(r.total_chunks) || 1;
  const sent = r.sent_chunks != null ? Number(r.sent_chunks) : total;
  const partial = r.outcome && r.outcome !== "ok";
  let warn = r.warning || "";
  let dur = r.duration_s || fallbackDurationS;
  if (!warn) {
    const last = await fetchLastHistory();
    // 只认刚发出的那条：ts 过旧说明是历史遗留告警，别拿来吓人
    if (last && (!last.ts || Date.now() / 1000 - last.ts <= 300)) {
      warn = last.warning || "";
      dur = dur || last.duration_s;
    }
  }
  // 条数口径：整批都发出去才算成功；中途落败要说清发出去几条，别含糊成"失败了"
  const count = total > 1 ? `${total} 条语音` : `${dur || "?"}s`;
  if (partial) {
    setStatus(
      `已发出 ${sent}/${total} 条（第 ${(r.failed_index ?? sent) + 1} 条失败）` +
        (r.remaining_wavs && r.remaining_wavs.length ? "，剩的可重发" : ""),
      "warn"
    );
    return;
  }
  if (warn) {
    // ★ 不把单条的告警说成整批：只说"这几条里有人听不见"，剩下的是好的
    setStatus(`已发出 ${count}，但可能有静音：${warn}`, "warn");
  } else {
    setStatus(`已发到微信 ✓（${count}）`, "ok");
  }
}

/**
 * 「合成并发送」的兜底看门狗。
 *
 * 为什么需要：主进程 pet-actions.cjs 的 doSendTextToWechat() 原先**从不回传**
 * pet:send-result（只有 sendWechatWav 回传），于是这条路径的状态栏永远停在
 * "合成中…"——2026-09-18 用户正是看到"已经合成完了，下面还写着合成中"来问的。
 * 主进程已修，但改 *.cjs 要重打 asar；这里用只读轮询兜住旧装机：一旦
 * /api/wechat/history 出现本次的新记录就收尾。收到正常回传时本循环会自行退出。
 *
 * ★ 分段发送（2026-09-23）下的关键改动：**"出现了新记录"不等于"整批发完了"**。
 *   长文会被切成 N 条依次录，每发一条就多一行历史 —— 如果照旧一看到新记录就收尾，
 *   第 1 条落地时就会打上绿勾"已发到微信 ✓"，而此时第 2、3 条还在录。
 *   更糟的是用户看到"已完成"就可能去动键鼠，正好打断正在进行的录制。
 *   对策：把"收尾"改成"**稳定计数**"——连续两次轮询条数不再变化才认为整批结束；
 *   而条数一旦等于回传的 total_chunks（后端明确告诉我们要几条）就立即收尾，
 *   不必白等一轮。没有 total_chunks 时（旧版后端）退化成原来的单条行为。
 */
async function watchSendOutcome() {
  const startedAt = Date.now() / 1000;
  let seen = 0;        // 本次已看到的历史条数
  let stableRounds = 0; // 连续未增长的轮数
  for (let i = 0; i < 300; i++) {                    // 最多约 600s（长文 N 条）
    await new Promise((res) => setTimeout(res, 2000));
    const el = document.getElementById("status");
    if (!el || !el.classList.contains("show")) return;
    if (!statusText.textContent.includes("合成中")) return;   // 已被回传收尾
    const last = await fetchLastHistory();
    if (!last || !last.ts || last.ts < startedAt - 5) continue;   // 本次还没有记录
    const cnt = await countHistorySince(startedAt);
    if (cnt > seen) {
      seen = cnt;
      stableRounds = 0;
      // 有进度就如实报，别一直显示"合成中…"让它看起来像卡住
      setStatus(
        cnt > 1 ? `合成中…已发出 ${cnt} 条，还有更多在录（别动键鼠）` : "合成中…",
        "ok"
      );
      continue;
    }
    stableRounds += 1;
    // 整批结束的判据：① 后端说过总共几条且已凑齐；② 或连续 3 轮（约 6s）不再增长。
    // ① 更准（段间等待时条数本来就不动，靠 ② 会白等或早退），优先用它。
    const wantTotal = Number(last.total_chunks) || 0;
    if ((wantTotal && cnt >= wantTotal) || (!wantTotal && stableRounds >= 2)) {
      await settleSendResult({
        ok: last.outcome === "ok",
        duration_s: last.duration_s,
        warning: last.warning || "",
        total_chunks: wantTotal || cnt,
        sent_chunks: cnt,
        outcome: last.outcome || "ok",
      });
      refreshPanel();
      return;
    }
  }
}

/** 数一数 startedAt 之后新增了几条历史（＝本批已发出几条）。失败返回 0。 */
async function countHistorySince(startedAt) {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return 0;
    const j = await r.json();
    return (j.items || []).filter((it) => it.ts && it.ts >= startedAt - 5).length;
  } catch {
    return 0;
  }
}

function overInteractive(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return !!(el && (el.closest("#pet") || el.closest("#bubble") || el.closest("#panel")));
}

petBox.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;   // 右键留给上下文菜单
  dragging = true;
  movedFar = false;
  downX = e.screenX; downY = e.screenY;
  window.pet && window.pet.dragStart();
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (dragging) {
    // 6px 死区：没拖出死区不算拖拽，mouseup 时按「单击角色」处理
    if (!movedFar && Math.hypot(e.screenX - downX, e.screenY - downY) > 6) movedFar = true;
    if (movedFar) { window.pet && window.pet.dragMove(); }
    return;
  }
  // ⚠ 按住说话期间必须保持窗口可交互：光标一旦被拖出面板，overInteractive 就返回 false
  // → setIgnoreMouse(true) → 整个透明窗变成点击穿透，pointerup 很可能就送不到页面了，
  // 录音只能等主进程 59s 上限自己停。
  const ignore = micHolding() ? false : !overInteractive(e);
  window.pet && window.pet.setIgnoreMouse(ignore);
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  window.pet && window.pet.dragEnd();   // 主进程侧保存位置
  // 拖拽结束时光标可能已出窗（elementFromPoint 为 null）→ 恢复全穿透
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
  // 单击角色（没拖动）：不再自动发送语音（太容易误触）。
  // 想发最近合成 → 右键桌宠「发送微信语音（用最近合成）」，或悬停用面板。
});
document.documentElement.addEventListener("mouseleave", () => {
  // 同 mousemove 的守卫：按住说话没结束时不能把窗口设成穿透（否则松手就可能收不到）
  if (!dragging && !micHolding()) window.pet && window.pet.setIgnoreMouse(true);
});
window.pet && window.pet.setIgnoreMouse(true);   // 初始全穿透，悬停角色后恢复

// ---------------- 待机小剧场 + 打盹 ----------------
// 闲着的时候自言自语 + 随机来一段动作，让桌宠「活着」；
// 长时间没人理（2.5 分钟+）还会随机打瞌睡（zZZ…）。
// 只在真正空闲（无级联/实时变声、无导览、状态为 idle）时触发，点气泡可跳过。
const IDLE_SKITS = [
  { lines: ["想发语音？右键我或悬停用面板～"], action: "idle", motion: "wiggle" },
  { lines: ["悬停我可以打字发语音哦"], action: "idle", motion: "wave" },
  { lines: ["看好了——", "转身！"], action: "idle", motion: "flip" },
  { lines: ["Q弹Q弹的～"], action: "idle", motion: "bounce" },
  { lines: ["飘啊飘～"], action: "listen", motion: "float" },
  { lines: ["今天也要开心呀！"], action: "play", motion: "dance" },
  { lines: ["别摇啦，头都晕了…"], action: "error", motion: "shake" },
  { lines: ["Ctrl+Alt+V 随时启停变声"], action: "think", motion: "nod" },
];
const DOZE_SKIT = { lines: ["zZZ…"], action: "listen", motion: "sleepy" };
let nextSkitAt = Date.now() + 30000;   // 出现半分钟后开始第一次
let idleSince = 0;                     // 连续空闲起点（ms），非 idle 时归零
let lastEarTwitch = 0;                 // 上次耳朵抖动时间（倾听时的小细节）
let earTwitching = false;
setInterval(() => {
  if (guide || statusBusy || lastKey !== "idle" || backendOffline) return;   // 后端离线时不待机表演
  const now = Date.now();
  if (now < nextSkitAt) return;
  const dozy = idleSince && now - idleSince > 150000 && Math.random() < 0.5;   // 闲久了的打盹
  nextSkitAt = now + (dozy ? 90000 : 45000) + Math.random() * 45000;
  const s = dozy ? DOZE_SKIT : IDLE_SKITS[Math.floor(Math.random() * IDLE_SKITS.length)];
  playGuide({ title: dozy ? "打盹" : "闲聊", lines: s.lines, action: s.action, motion: s.motion, duration: dozy ? 9000 : 6000 });
}, 5000);

// ---------------- 布局形态表（纵向预算门禁的枚举源）----------------
// 为什么需要它：面板纵向预算是**死的**（max-height 300px），而「哪个形态最挤」
// 不能靠人记得。tools/pet-panel-layout.cjs 会遍历这张表，逐个进入形态量高度
// （× 2 种气泡），再跟 tools/pet-panel-layout-budget.json 的基线比。
// **加形态必须重算基线**，否则门禁会红；这条约束替代了旧版「新页签必须有基线」。
// 每个形态都是「重置 → 摆出这一态」，不返回清理函数：门禁每次进形态前统一重置，
// 顺序扫描才不会互相污染（比如上一条的录音中状态漏到下一条）。
function resetLayoutState() {
  if (sayEl) sayEl.value = "";
  sfxPicks = [];
  lastPreview = null;
  pendingPremix = false;
  micPhase = "idle";
  wechatNote = null;
  if (recBoxEl) recBoxEl.hidden = true;
  const field = sayEl && sayEl.closest(".field");
  if (field) field.hidden = false;
  setBusy(sendBtn, false);
  setBusy(previewBtn, false);
  // 放歌是跨形态的状态（收着托盘也在放），扫描时不归零会污染后面每一个形态。
  bgmPlayingId = null;
  renderBgm();
  // 搜歌层同理：取回的歌、榜单、输入值与 busy 都不该漏到下一个形态。
  bgmFetched = null;
  songItems = [];
  songChartKey = "";
  songLoading = false;
  songBusy = false;
  songSrc = "douyin";
  if (songInputTimer) { clearTimeout(songInputTimer); songInputTimer = null; }
  if (songQEl) songQEl.value = "";
  if (songSrcEl) {
    for (const b of songSrcEl.querySelectorAll("button")) {
      b.classList.toggle("on", b.dataset.src === "douyin");
    }
  }
  renderSongList();
  songSetNote("");
  // 雷达层：回骨架文案 + 收绿点（轮询句柄不动 —— 真实应用里慢轮询要继续养绿点）。
  if (rdVerdictEl) rdVerdictEl.textContent = "观察中";
  if (rdReasonEl) rdReasonEl.textContent = "正在观察微信窗口…";
  if (rdSignalsEl) rdSignalsEl.innerHTML = "";
  if (rdNoteEl) { rdNoteEl.textContent = ""; rdNoteEl.className = ""; }
  if (rdCardEl) rdCardEl.className = "v-unknown";
  if (rdotEl) rdotEl.hidden = true;
  setLayer("");
  setStatus("", "");
  renderFxPicks();
  renderFxGrid();
  refreshFire();
}

/**
 * 形态里要用的样本。**不能只读 sfxItems**：门禁与截图都要能离线摆出这一态，
 * 而 catalog 是异步拉的 —— 拿空数组切两片，量到的「有音效片」会是个没有 chips 的空壳，
 * 这一态的最挤高度就永远量不到（那正是门禁存在的理由）。
 */
function fxPickSample(i) {
  return sfxItems[i] || { id: "s" + (i + 1), name: "音效" + (i + 1), icon: "🔔" };
}

const LAYOUT_STATES = {
  // 空草稿：主按钮 = 按住说话。这是用户 90% 时间看到的样子。
  idle: () => {},
  // 有文字：主按钮 = 合成并发送，试听出现。
  typed: () => {
    if (sayEl) sayEl.value = "今天真热啊，出去了";
    refreshFire();
  },
  // 文字 + 2 个音效片：装填区最高的形态（音效片单独一行）。
  picked: () => {
    if (sayEl) sayEl.value = "今天真热啊，出去了";
    sfxPicks = [0, 1].map((i) => {
      const it = fxPickSample(i);
      return { id: it.id, name: it.name, icon: it.icon,
               mode: i === 0 ? "layer" : "append", at_s: 0 };
    });
    renderFxPicks();
    renderFxGrid();
    refreshFire();
  },
  // 录制中：输入框让位给波形，主按钮转红。
  rec: () => {
    micPhase = "recording";
    micStartedAt = Date.now() - 2300;
    renderMic();
  },
  // 声音托盘：放歌行 + 音效网格 + 草稿（最挤的组合：有文字、有音效片）。
  tray: () => {
    if (sayEl) sayEl.value = "今天真热啊，出去了";
    sfxPicks = [0, 1].map((i) => {
      const it = fxPickSample(i);
      return { id: it.id, name: it.name, icon: it.icon, mode: "layer", at_s: 0 };
    });
    renderFxPicks();
    renderFxGrid();
    refreshFire();
    setLayer("tray");
  },
  // 放歌中：♪ 亮小点、选歌框锁住、按钮变 ■、角色身上的角标接手提示。
  // 托盘里唯一「有东西正在发生」的一态 —— 它和静止的托盘长得不一样才是对的。
  trayplay: () => {
    LAYOUT_STATES.tray();
    const song = bgmSongs[0] || { id: "demo-song", name: "demo-song.mp3" };
    bgmPlayingId = song.id || String(song.name).replace(/\.[^.]+$/, "");
    renderBgm();
  },
  // 搜歌层：来源行 + 搜索框 + 3 行结果 + 说明行（这层最挤的形态）。
  // songChartKey 先占位：setLayer("songs") 会触发一次「没榜单就拉」，
  // 不占位就会真去打网络，量到的骨架和截图都不稳定。
  songs: () => {
    songChartKey = "douyin";
    setLayer("songs");
    songItems = [
      { source: "douyin", rank: 1, title: "晴天", artist: "周杰伦", hot: 123450 },
      { source: "douyin", rank: 2, title: "起风了", artist: "买辣椒也用券", hot: 98760 },
      { source: "douyin", rank: 3, title: "孤勇者", artist: "陈奕迅", hot: 56780 },
    ];
    renderSongList();
    songSetNote("点一行去 B站 找音频");
  },
  // 微信雷达：雷达打开时 setLayer 会触发 radarTick(true) —— radarBusy=true 拦下它，
  // 再同步塞一份与预览台 FAKE 桩同值的样本：量到的是「满内容」的最挤形态
  // （大结论 + 原因一行 + 三条信号 + 提示行）。判断语义在后端，这里只是展示样本。
  radar: () => {
    radarBusy = true;
    renderRadar({
      ok: true, poll_hint_ms: 1500,
      verdict: { action: "soon", label: "可以回了", score: 3, source: "rule",
                 reason: "对方最后说话 42.0秒，等你回" },
      signals: { last_side: "left", streak: 2, gap_seconds: 42.0, gap_lower_bound: false,
                 my_last_reply_age: 120.0, frames_seen: 30 },
    });
    if (rdNoteEl) rdNoteEl.textContent = "点右上「重新观察」从头看";
    setLayer("radar");
    radarBusy = false;
  },
  // 更多抽屉：音色 + 引擎 + 直出 + 历史（抽屉打开时提示行与音效片收起，见 CSS）。
  drawer: () => setLayer("drawer"),
  // 合成中：主按钮转圈（busy 会把图标换成 spinner，尺寸不同）。
  busy: () => setBusy(sendBtn, true),
};
// 门禁从 window 上读（页面脚本与外部分析脚本的唯一契约）。别改名 ——
// tools/test-pet-panel-layout.cjs 的静态检查拿它当「形态是否登记」的真相源。
window.__petLayoutStates = LAYOUT_STATES;
window.__petResetLayoutState = resetLayoutState;

// 引擎分段的初始选中态（从 localStorage 恢复）。必须在 void tick() 之前 ——
// tick 会调 refreshEngineSeg()，但那时 runningEngine 还是 null，先渲染一次选中态。
setEngine(engine);
// ⚠️ 先拿到能力清单，再决定要不要轮询引擎状态 / 皮肤。
// 否则第一帧就会按「全都开着」去打已被关掉的接口 —— 不但刷 404，
// tick() 还会据此把好好的后端判成「离线」。
void (async () => {
  await loadCapabilities();
  refreshCapVisibility();
  // 雷达慢轮询在这里挂上：能力在才挂（radarSetPolling 内部判 CAP.radar）。
  // 绿点常驻面板 —— 用户不开层也能知道「该回了」。
  radarSetPolling();
  // 首帧：主按钮按空草稿渲染（托盘/抽屉都是收起态 —— 它们是「需要时才长出来」的）
  refreshFire();
  void tick();
  setInterval(tick, 1000);
  // 皮肤轮询：应用新皮肤后 5s 内热切换（无需重启桌宠）。
  // MOCK 调试模式下不请求后端（保持离线自演）。
  if (!MOCK && CAP.market) {
    loadSkin();
    setInterval(loadSkin, 5000);
  }
})();
</script>
