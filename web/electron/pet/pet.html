<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌宠</title>
<style>
  /* 桌宠渲染器：透明窗，只在角色与气泡区域接收鼠标，其余点击穿透 */
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none; cursor: default;
  }
  #root {
    width: 100vw; height: 100vh;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 8px 8px 10px;              /* 窗口内留边，让角色不至于贴边/顶到屏幕角 */
  }

  /* ---------------- 气泡 ---------------- */
  #bubble {
    max-width: 204px;
    margin-bottom: 6px;
    padding: 9px 12px 10px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    background: linear-gradient(160deg, rgba(255,255,255,0.92), rgba(248,250,252,0.88));
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:
      0 8px 24px rgba(15, 23, 42, 0.14),
      0 2px 6px rgba(15, 23, 42, 0.06),
      inset 0 1px 0 rgba(255,255,255,0.85);
    font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #0f172a;
    word-break: break-all;
    display: none;
  }
  /* 气泡底部小三角（引导感） */
  #bubble::after {
    content: "";
    position: absolute;
    left: 26px; bottom: -7px;
    width: 14px; height: 14px;
    transform: rotate(45deg);
    background: inherit;
    border-right: 1px solid rgba(148, 163, 184, 0.28);
    border-bottom: 1px solid rgba(148, 163, 184, 0.28);
    box-shadow: 3px 3px 6px rgba(15, 23, 42, 0.05);
    border-bottom-right-radius: 3px;
  }
  #bubble { position: relative; }
  /* 注意：类名是 s-error（与 BUBBLE.error.cls 对齐），早期写成 .error 导致红底从未生效 */
  #bubble.s-error {
    border-color: rgba(239, 68, 68, 0.45);
    background: linear-gradient(160deg, rgba(254,226,226,0.95), rgba(254,202,202,0.9));
    color: #b91c1c;
  }
  /* 导览气泡：头部标题 + 正文逐字打字 + 底部句子进度 */
  #bubble.guide {
    border-color: rgba(56, 189, 248, 0.5);
    background: linear-gradient(160deg, rgba(240,249,255,0.95), rgba(224,242,254,0.9));
    box-shadow:
      0 8px 24px rgba(14, 116, 144, 0.16),
      inset 0 1px 0 rgba(255,255,255,0.9);
    cursor: pointer;
  }
  #head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #title { font-weight: 600; font-size: 12px; letter-spacing: .3px; }
  #bubble .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    flex: 0 0 auto; background: #94a3b8;
    box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.16);
  }
  #bubble.s-listen  .dot { background: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.18); animation: pulse 1.1s infinite; }
  #bubble.s-think   .dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); animation: pulse 0.9s infinite; }
  #bubble.s-play    .dot { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
  #bubble.s-build   .dot { background: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,0.18); animation: pulse 1.3s infinite; }
  #bubble.s-error   .dot { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
  #bubble.guide     .dot { background: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,0.18); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #text { min-height: 18px; }

  #foot { display: none; margin-top: 6px; align-items: center; gap: 5px; }
  #bubble.guide #foot { display: flex; }
  #steps { display: flex; gap: 4px; margin-right: auto; }
  #steps i {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(14, 116, 144, 0.22); transition: background .2s;
  }
  #steps i.on { background: #0284c7; }
  #hint { font-size: 10px; color: #64748b; }

  /* ---------------- 快捷面板：悬停角色浮现，输入文字合成发送 / 实时变声开关 ---------------- */
  #panel {
    display: none;
    width: 204px;
    margin-bottom: 6px;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, 0.28);
    background: linear-gradient(165deg, rgba(255,255,255,0.94), rgba(241,245,249,0.9));
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:
      0 10px 28px rgba(15, 23, 42, 0.16),
      0 2px 8px rgba(15, 23, 42, 0.07),
      inset 0 1px 0 rgba(255,255,255,0.9);
    font: 12px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #0f172a;
  }
  #panel input {
    width: 100%; box-sizing: border-box;
    padding: 7px 10px; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.4); outline: none;
    font: inherit; background: rgba(255,255,255,0.85); color: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  #panel input::placeholder { color: #94a3b8; }
  #panel input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.16); }
  #panel .row { display: flex; gap: 6px; margin-top: 8px; }
  #panel button {
    flex: 1; padding: 6px 0; border-radius: 10px;
    border: 1px solid rgba(14, 165, 233, 0.4);
    background: linear-gradient(160deg, rgba(14,165,233,0.14), rgba(56,189,248,0.1));
    color: #0369a1;
    font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: transform .08s, background .15s, box-shadow .15s;
  }
  #panel button:hover {
    background: linear-gradient(160deg, rgba(14,165,233,0.24), rgba(56,189,248,0.16));
    box-shadow: 0 2px 8px rgba(14,165,233,0.2);
  }
  #panel button:active { transform: translateY(1px); }
  #panel button:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  #panel button.live-on {
    border-color: rgba(16, 185, 129, 0.5);
    background: linear-gradient(160deg, rgba(16,185,129,0.18), rgba(16,185,129,0.1));
    color: #047857;
  }
  #panel select {
    flex: 1; min-width: 0; padding: 6px 7px; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.4); outline: none;
    font: inherit; font-size: 11px; background: rgba(255,255,255,0.85); color: inherit;
  }
  #panel select:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.16); }
  #panel #recent { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  #panel .hitem {
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.35); background: rgba(241,245,249,0.8);
    font-size: 10.5px; color: #475569; cursor: pointer; white-space: nowrap;
    transition: border-color .15s, background .15s, color .15s;
  }
  #panel .hitem:hover { border-color: #0284c7; color: #0369a1; background: #e0f2fe; }
  #panel .hempty { font-size: 10.5px; color: #94a3b8; }
  /* 面板状态行：合成/发送结果直接显示在这里，不只看气泡 */
  #panel #status {
    margin-top: 7px; font-size: 10.5px; line-height: 1.45;
    color: #64748b; word-break: break-all; display: none;
    border-top: 1px solid rgba(148,163,184,0.18); padding-top: 6px;
  }
  #panel #status.show { display: block; }
  #panel #status.ok  { color: #047857; }
  #panel #status.err { color: #b91c1c; }

  /* ---------------- 角色 ---------------- */
  /* 尺寸由 JS 按皮肤 frameW/frameH 注入（--dw/--dh 显示尺寸，含整数倍放大），
     默认回退 150×150（芙宁娜内置）。像素素材放大时 image-rendering: pixelated 保持锐利。 */
  #pet {
    position: relative;
    width: var(--dw, 150px); height: var(--dh, 150px);
    cursor: grab;                  /* 拖拽由 JS+IPC 手动实现（app-region 在透明穿透窗上不可靠） */
    display: flex; align-items: flex-end; justify-content: center;
    transform-origin: 50% 85%;
    /* 角色脚下的椭圆投影，给「落地感」 */
    filter: drop-shadow(0 6px 10px rgba(15, 23, 42, 0.18));
  }
  /* 背景装饰光晕：径向渐变 + 细腻边框，让透明窗里角色不「飘」在裸桌面上 */
  #pet::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background:
      radial-gradient(50% 50% at 50% 78%, rgba(56,189,248,0.10), transparent 70%),
      radial-gradient(38% 32% at 50% 92%, rgba(15,23,42,0.10), transparent 80%);
    box-shadow:
      inset 0 0 0 1px rgba(148,163,184,0.18),
      inset 0 -6px 16px rgba(56,189,248,0.05);
    pointer-events: none;
    z-index: 0;
  }
  /* 光晕里的一点柔和高光（左上），增强立体感 */
  #pet::after {
    content: "";
    position: absolute;
    inset: 18px auto auto 22px;
    width: 26px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.55), transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  #pet #sprite { position: relative; z-index: 1; }
  /* 精灵图动画：<div> + WebP 背景 + steps() 关键帧（替代原 SVG 内 SMIL）。
     帧横向拼接，帧宽不定——--fw/--fh 由 JS 按皮肤注入，回退 150。 */
  #pet #sprite {
    width: var(--fw, 150px); height: var(--fh, 150px);
    -webkit-user-drag: none; pointer-events: auto;
    background-repeat: no-repeat;
    will-change: background-position;   /* 提示合成层，减少逐帧重绘掉帧 */
    transform: translateZ(0);
    animation: pet-steps 3.0s steps(37) infinite;   /* 默认 idle，运行时被 JS 覆盖 */
  }
  @keyframes pet-steps {
    from { background-position-x: 0; }
    to   { background-position-x: calc(var(--n, 37) * var(--fw, 150px) * -1); }
  }

  /* 页面专属动作：挂在 #pet 外层，与精灵图自身的逐帧动画互不干扰 */
  #pet.m-pop   { animation: m-pop .62s cubic-bezier(.34,1.56,.64,1) 2; }
  #pet.m-wave  { animation: m-wave 1.5s ease-in-out infinite; }
  #pet.m-lean  { animation: m-lean 2.4s ease-in-out infinite; }
  #pet.m-nod   { animation: m-nod 1.3s ease-in-out infinite; }
  #pet.m-sway  { animation: m-sway 3.2s ease-in-out infinite; }
  #pet.m-jump  { animation: m-jump .95s cubic-bezier(.3,.7,.4,1) infinite; }
  #pet.m-twirl { animation: m-twirl 2.4s ease-in-out infinite; }
  @keyframes m-pop   { 0%,100% { transform: scale(1); } 45% { transform: scale(1.14) translateY(-6px); } }
  @keyframes m-wave  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes m-lean  { 0%,100% { transform: translateX(-7px) rotate(-4deg); } 50% { transform: translateX(7px) rotate(4deg); } }
  @keyframes m-nod   { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(5px) rotate(6deg); } }
  @keyframes m-sway  { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  @keyframes m-jump  { 0%,55%,100% { transform: translateY(0) scaleY(1); } 22% { transform: translateY(-20px) scaleY(1.06); } 40% { transform: translateY(0) scaleY(.93); } }
  @keyframes m-twirl { 0%,72%,100% { transform: rotate(0) scale(1); } 30% { transform: rotate(180deg) scale(1.05) translateY(-10px); } }
  /* —— 二期动作：甩头 / 漂浮 / 扭动 / 转身 / Q弹 / 跳舞 —— */
  #pet.m-shake  { animation: m-shake .6s ease-in-out infinite; }
  #pet.m-float  { animation: m-float 2.6s ease-in-out infinite; }
  #pet.m-wiggle { animation: m-wiggle .5s ease-in-out infinite; }
  #pet.m-flip   { animation: m-flip 1.6s ease-in-out infinite; }
  #pet.m-bounce { animation: m-bounce 1.0s ease-in-out infinite; }
  #pet.m-dance  { animation: m-dance 1.8s ease-in-out infinite; }
  @keyframes m-shake  { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-6px) rotate(-4deg); } 40% { transform: translateX(6px) rotate(4deg); } 60% { transform: translateX(-5px) rotate(-3deg); } 80% { transform: translateX(5px) rotate(3deg); } }
  @keyframes m-float  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(2deg); } }
  @keyframes m-wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.03); } 75% { transform: rotate(8deg) scale(1.03); } }
  @keyframes m-flip   { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
  @keyframes m-bounce { 0%,100% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-16px) scale(.96,1.06); } 55% { transform: translateY(0) scale(1.08,.9); } 70% { transform: translateY(0) scale(.97,1.03); } }
  @keyframes m-dance  { 0%,100% { transform: rotate(0) translateY(0); } 15% { transform: rotate(-9deg) translateY(-8px); } 30% { transform: rotate(9deg) translateY(0); } 45% { transform: rotate(-9deg) translateY(-8px); } 60% { transform: rotate(9deg) translateY(0); } 75% { transform: rotate(-6deg) translateY(-6px); } }
  /* —— 三期动作：侧耳倾听 / 忙碌干活（状态联动，见 STATE_MOTION） —— */
  #pet.m-ear   { animation: m-ear 2.2s ease-in-out infinite; }
  #pet.m-work  { animation: m-work 1.2s ease-in-out infinite; }
  @keyframes m-ear   { 0%,100% { transform: rotate(0) translateX(0); } 40% { transform: rotate(-10deg) translateX(7px); } 60% { transform: rotate(-10deg) translateX(7px); } }
  @keyframes m-work  { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-2deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-3px) rotate(2deg); } }
  /* —— 四期动作：打瞌睡（点头） / 耳朵抖动（倾听时的细节） —— */
  #pet.m-sleepy    { animation: m-sleepy 3.2s ease-in-out infinite; }
  #pet.m-ear-twitch { animation: m-ear-twitch .5s ease-in-out; }
  @keyframes m-sleepy { 0%,8% { transform: rotate(0) translateY(0); } 55% { transform: rotate(-13deg) translateY(6px); } 62% { transform: rotate(2deg) translateY(0); } 70% { transform: rotate(-13deg) translateY(6px); } 77% { transform: rotate(2deg) translateY(0); } 100% { transform: rotate(-13deg) translateY(6px); } }
  @keyframes m-ear-twitch { 0%,100% { transform: rotate(0) translateX(0); } 15%,35%,55%,75% { transform: rotate(-6deg) translateX(4px); } 25%,45%,65%,85% { transform: rotate(6deg) translateX(-4px); } }
</style>
</head>
<body>
<div id="root">
  <div id="bubble">
    <div id="head"><span class="dot"></span><span id="title"></span></div>
    <div id="text"></div>
    <div id="foot"><span id="steps"></span><span id="hint">点我跳过</span></div>
  </div>
  <div id="panel">
    <input id="say" placeholder="输入文字，回车发微信语音" maxlength="200" />
    <div class="row">
      <select id="voiceSel" title="合成用的音色（默认=主界面当前选中）"></select>
      <button id="send" type="button" title="用选中音色合成，并录成微信语音消息">合成并发送</button>
      <button id="preview" type="button" title="只合成并试听，满意再点发送">试听</button>
      <button id="live" type="button" title="开关 RVC 实时变声（微信把 CABLE Output 当麦克风）">变声</button>
    </div>
    <div id="status"></div>
    <div id="recent" title="最近发送的语音，点一下重发"></div>
  </div>
  <div id="pet"><div id="sprite"></div></div>
</div>
<script>
"use strict";

/**
 * 桌宠渲染器，两种工作模式：
 *
 * 1) 状态模式（默认）：1s 轮询后端，按链路阶段切换动画。
 *    级联：未运行->idle / warming->build / capturing->listen / asr|tts->think /
 *          播放队列积压->play（气泡显示识别文字）/ error->error
 *    实时变声（RVC）：基础 listen，转写中->think，识别到文字->气泡字幕
 *
 * 2) 导览模式：主进程在前端切页时推来 { title, lines, action, motion, duration }，
 *    桌宠临时现身为该页做一次介绍（头部标题 + 正文逐字打字 + 句子进度点），
 *    并播放该页专属动作，讲完自动退回状态模式。变声运行中不让导览抢镜。
 *
 * sprite 来自 Ice-teapop/desktop-pet 芙宁娜主题（MIT）。
 */
const API = "http://127.0.0.1:8000/api/cascade/status";
const LIVE_API = "http://127.0.0.1:8000/api/rvc/live/status";

const SPRITES = {
  idle:   "svg/idle.webp",
  listen: "svg/idle-look.webp",
  think:  "svg/thinking.webp",
  play:   "svg/conducting.webp",
  build:  "svg/building.webp",
  error:  "svg/error.webp",
};
// 每个状态的帧数 / 单轮周期(s)，驱动 CSS steps 动画（原 SVG 内为逐帧离散平移 SMIL）
const SPRITE_ANIM = {
  idle:   { frames: 37, dur: 3.0 },
  listen: { frames: 37, dur: 3.0 },
  think:  { frames: 37, dur: 3.0 },
  play:   { frames: 22, dur: 1.8 },
  build:  { frames: 16, dur: 1.4 },
  error:  { frames: 37, dur: 3.0 },
};

// ---------------- 动态皮肤 ----------------
// skin.json（后端 /api/pet-market/applied）:
//   { id, frameW, frameH, states: { state: { sheet, frames, dur } } }
// 内置芙宁娜（id=furina）直接用本地 svg/*.webp，不依赖后端；其余皮肤 sheet
// 走 http://127.0.0.1:8000/api/pet-market/sheet/<id>/<sheet>。
const SKIN_SHEET_API = "http://127.0.0.1:8000/api/pet-market";
let petSkin = { id: "", frameW: 150, frameH: 150, states: {} };   // 当前皮肤（空=内置）
let skinScale = 1;   // 像素素材整数倍放大系数（保持锐利）

/** 取某状态的皮肤配置；缺省回退福灵娜内置。 */
function skinState(key) {
  if (petSkin.states[key]) return petSkin.states[key];
  if (key === "listen" && petSkin.states.idle) return petSkin.states.idle;   // 听→待机
  if (key === "build" && petSkin.states.play) return petSkin.states.play;    // 干活→玩耍
  return { sheet: "", frames: SPRITE_ANIM[key].frames, dur: SPRITE_ANIM[key].dur };
}

/** sheet 完整 URL：内置皮肤用本地 svg，远端皮肤用后端接口。 */
function sheetUrl(key, st) {
  if (!petSkin.id || petSkin.id === "furina") return SPRITES[key] || SPRITES.idle;
  return `${SKIN_SHEET_API}/sheet/${encodeURIComponent(petSkin.id)}/${encodeURIComponent(st.sheet)}`;
}

/**
 * 应用皮肤到 DOM：按 frameW/frameH 计算整数倍放大与显示尺寸。
 * ⚠️ 调用时机：必须在下方「DOM 引用」段取到 petBox / sprite 之后。
 *    本函数读写这两个 const 绑定，提前调用会撞上暂时性死区（TDZ）抛
 *    ReferenceError，把整个脚本打断——桌宠就只剩 CSS ::before 那圈光晕。
 */
function applySkin() {
  const fw = petSkin.frameW || 150, fh = petSkin.frameH || 150;
  // 目标显示高度 ≈150px；比它小的像素素材按整数倍放大（32→160），大的保持原尺寸
  skinScale = fh >= 150 ? 1 : Math.max(1, Math.ceil(150 / fh));
  const dw = fw * skinScale, dh = fh * skinScale;
  // 精灵图自身尺寸：--fw/--fh 既当宽高，也是 pet-steps 每一步的位移基准
  sprite.style.setProperty("--fw", dw + "px");
  sprite.style.setProperty("--fh", dh + "px");
  // 外框尺寸给 #pet（它才是 var(--dw/--dh) 的消费方）：
  // 这两条以前写在 sprite 上，而 #pet 是父元素、自定义属性不会向上继承，
  // 于是 #pet 永远退回 150px——换非 150 帧尺寸的皮肤时，::before 光晕会比角色小一圈。
  petBox.style.setProperty("--dw", dw + "px");
  petBox.style.setProperty("--dh", dh + "px");
  // 像素素材放大时锁锐利，矢量风格保持平滑
  sprite.style.imageRendering = skinScale > 1 ? "pixelated" : "auto";
}

/** 拉取当前应用皮肤配置；失败/后端离线保持现有皮肤不动。 */
async function loadSkin() {
  let cfg = null;
  try {
    const r = await fetch(`${SKIN_SHEET_API}/applied`, { cache: "no-store" });
    if (r.ok) cfg = await r.json();
  } catch {}
  if (!cfg || !cfg.id) return;
  if (cfg.id === petSkin.id) return;   // 没换肤
  petSkin = { id: cfg.id, frameW: cfg.frameW || 150, frameH: cfg.frameH || 150, states: cfg.states || {} };
  applySkin();
  // 预加载新皮肤各状态 sheet，避免首次切换白屏
  for (const key of Object.keys(SPRITE_ANIM)) {
    const st = skinState(key);
    if (st.sheet && sheetUrl(key, st) !== (SPRITES[key] || "")) new Image().src = sheetUrl(key, st);
  }
  lastKey = null;   // 强制下一帧重画
}

// 内置皮肤初始化（150×150）挪到下方「DOM 引用」段之后调用，见 applySkin 上的说明。
const BUBBLE = {
  // 桌宠现在默认常驻，待机时只留角色安静待着，别把「待机中」一直糊在屏幕上
  idle:   { cls: "",          title: "待机",     text: "待机中", hidden: true },
  listen: { cls: "s-listen",  title: "我在听",   text: "你说，我听着～" },
  think:  { cls: "s-think",   title: "工作中",   text: "听懂啦，正在处理…" },
  play:   { cls: "s-play",    title: "正在播",   text: "" },          // 播放中气泡让位给识别文字
  build:  { cls: "s-build",   title: "准备中",   text: "模型加载中…" },
  error:  { cls: "s-error",   title: "出错",     text: "出错了，请查看主窗口" },
};
// 状态→动作映射：让「倾听 / 干活」有对应的肢体语言
// build=准备中(轻晃) / listen=侧耳倾听 / think·play=忙碌干活 / error=甩头
const STATE_MOTION = { build: "wiggle", listen: "ear", think: "work", play: "work", error: "shake" };
const MOTIONS = ["pop", "wave", "lean", "nod", "sway", "jump", "twirl",
  "shake", "float", "wiggle", "flip", "bounce", "dance", "ear", "work", "sleepy", "ear-twitch"];

const petBox = document.getElementById("pet");
const sprite = document.getElementById("sprite");
const bubble = document.getElementById("bubble");
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const stepsEl = document.getElementById("steps");

// DOM 引用齐了才能初始化皮肤尺寸：applySkin() 会往 petBox/sprite 写内联自定义属性。
// 2026-09-10 b91707b 把这次调用放在了 DOM 引用之前（且 sprite 是 const），
// 触发「Cannot access 'sprite' before initialization」→ 整个脚本中断，
// 精灵图永远拿不到 background-image，桌宠只剩 CSS ::before 那圈光晕、且不再全窗穿透。
// 回归防护见 tools/test-pet-renderer-script.cjs。
applySkin();

let lastKey = null;       // 上次渲染的状态 key
let lastText = "";        // 当前句识别文字（出现=识别完成，清空=播出结束）
let statusBusy = false;   // 级联/实时变声是否在运行（运行中不让导览打断）
let guide = null;         // 导览播放中的状态
let guideTimers = [];
let typingTimer = null;
let backendOffline = false;   // 后端是否失联（两个状态接口都拉不到）
let offlineHintedAt = 0;      // 上次离线提示的时刻，避免每 1s 反复弹气泡刷屏

// 预加载所有 sprite，避免首次切换时白屏等待（WebP，单个最大 ~0.5MB）
for (const p of Object.values(SPRITES)) { new Image().src = p; }

// ---------------- 通用渲染 ----------------
function setSprite(key, motion) {
  const st = skinState(key);
  const url = sheetUrl(key, st);
  sprite.style.backgroundImage = `url("${url}")`;
  sprite.style.backgroundSize = (st.frames * (petSkin.frameW || 150) * skinScale) + "px " + ((petSkin.frameH || 150) * skinScale) + "px";
  sprite.style.setProperty("--n", String(st.frames));
  sprite.style.animation = `pet-steps ${st.dur}s steps(${st.frames}) infinite`;
  setMotion(motion);
}

function setMotion(motion) {
  petBox.classList.remove(...MOTIONS.map((m) => "m-" + m));
  if (!motion) return;
  petBox.classList.add("m-" + motion);
  // 重新触发一次动画（连续两页用同一个动作时也要有反应）
  void petBox.offsetWidth;
}

function setState(key, text) {
  if (guide) return;                       // 导览播放中，状态轮询不抢气泡
  if (key === lastKey && text === textEl.textContent) return;
  lastKey = key;
  setSprite(key, STATE_MOTION[key] || null);
  const info = BUBBLE[key];
  if (!info || (info.hidden && !text)) { bubble.style.display = "none"; return; }
  bubble.className = info.cls;
  bubble.style.display = "block";
  titleEl.textContent = info.title;
  textEl.classList.remove("typing");
  textEl.textContent = text || info.text;
}

// ---------------- 页面导览 ----------------
/** 单句停留时长：够读完，又不至于让人等（含后续打字时间） */
function lineMs(line) {
  return Math.min(4200, Math.max(2200, 1500 + line.length * 110));
}

function typeText(text) {
  if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
  textEl.classList.remove("typing");
  textEl.textContent = text;
}

function clearGuide() {
  guideTimers.forEach(clearTimeout);
  guideTimers = [];
  clearInterval(typingTimer);
  typingTimer = null;
  guide = null;
}

function endGuide() {
  if (!guide) return;
  clearGuide();
  setMotion(null);
  lastKey = null;             // 强制下一帧重画状态气泡
  void tick();
}

function playGuide(g) {
  clearGuide();
  const lines = Array.isArray(g.lines) ? g.lines.filter(Boolean) : [];
  if (!lines.length) return;
  guide = g;
  lastKey = null;
  setSprite(g.action || "idle", g.motion || "pop");

  bubble.className = "guide";
  bubble.style.display = "block";
  titleEl.textContent = g.title || "这一页";
  stepsEl.innerHTML = lines.map(() => "<i></i>").join("");

  let at = 0;
  lines.forEach((line, i) => {
    guideTimers.push(setTimeout(() => {
      if (!guide) return;
      Array.from(stepsEl.children).forEach((el, k) => el.classList.toggle("on", k === i));
      typeText(line);
    }, at));
    at += lineMs(line);
  });
  guideTimers.push(setTimeout(endGuide, at + 1000));
}

// 主进程在切页时推送；变声运行中静默丢弃（不打断状态展示）
if (window.pet && window.pet.onGuide) {
  window.pet.onGuide((g) => {
    if (statusBusy || !g) return;
    playGuide(g);
  });
}
// 点气泡：导览中=跳过；后端离线=打开后端日志；否则无操作
bubble.addEventListener("click", () => {
  if (guide) { endGuide(); return; }
  if (backendOffline && window.pet && window.pet.showBackendLog) {
    window.pet.showBackendLog();
  }
});

// ---------------- 状态轮询 ----------------
function render(s) {
  if (!s.running) { lastText = ""; setState("idle"); return; }

  if (s.child_error || s.stage === "error") { setState("error"); return; }
  switch (s.stage) {
    case "warming":
      setState("build");
      return;
    case "asr":
      setState("think", "听懂啦…");   // 此刻 last_text 还是上一句，不展示
      return;
    case "tts":
      // ASR 完成进入合成：last_text 即本句识别结果，展示文字 = 「听懂了的确认」
      if (s.last_text) lastText = s.last_text;
      setState("think", lastText ? `「${lastText}」` : "正在合声…");
      return;
    case "capturing":
      // playing 阶段在子进程里只存在几毫秒（同步处理后立刻回到 capturing），
      // 「正在播出」的真实信号是播放队列积压 queued_s > 0
      if (s.queued_s > 0.05) {
        // 轮询可能错过短暂的 tts 阶段，此时用 last_text 兜底
        if (s.last_text && s.last_text !== lastText) lastText = s.last_text;
        setState("play", lastText ? `「${lastText}」` : "正在播…");
      } else {
        lastText = "";                          // 队列空了 = 播完，回到「我在听」
        setState("listen", "我在听 · 你继续说");
      }
      return;
    default:
      setState("build");   // init 等未知阶段
  }
}

function renderLive(l) {
  // 实时变声模式：基础「我在听」动画 + 实时字幕（转写子进程挂在 asr_* 字段）
  if (l.asr_running) {
    if (l.asr_stage === "transcribing") {
      setState("think", "听懂啦…");
    } else {
      setState("listen", l.asr_last_text ? `「${l.asr_last_text}」` : "变声中 · 我听着");
    }
  } else {
    lastText = "";
    setState("listen", "变声中 · 我听着");   // 转写子进程未启动：只挂身份牌，不影响变声
  }
}

// 预览模式（调试用）：pet.html?mock=1 自动轮播各状态，不依赖后端
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const MOCK_SEQ = [
  { state: "listen", text: "聆听中…" },
  { state: "think", text: "「你好呀」" },
  { state: "play", text: "「你好呀」" },
  { state: "idle", text: "" },
  { state: "build", text: "模型加载中…" },
  { state: "error", text: "" },
];
let mockIdx = 0;
if (MOCK) {
  // 调试模式下也能预览页面导览：pet.html?mock=1 时 6s 后自动演一遍「音色工坊」
  const step = () => {
    if (guide) return;
    const m = MOCK_SEQ[mockIdx % MOCK_SEQ.length];
    mockIdx += 1;
    setState(m.state, m.text);
  };
  step();
  setInterval(step, 2500);
  setTimeout(() => {
    playGuide({
      title: "音色工坊",
      lines: ["一切从这里开始。", "丢进视频，我自动切片质检。", "挑够半分钟干净人声。"],
      action: "build",
      motion: "pop",
      duration: 8000,
    });
  }, 6000);
}

async function tick() {
  if (MOCK) return;
  if (guide) return;              // 导览期间不打断
  let cascadeData = null, live = null;
  let anyOk = false;
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (r.ok) { cascadeData = await r.json(); anyOk = true; }
  } catch {}
  try {
    const r = await fetch(LIVE_API, { cache: "no-store" });
    if (r.ok) { live = await r.json(); anyOk = true; }
  } catch {}
  // —— 后端健康：两个状态接口全挂 = 后端失联。离线时切 error 精灵 + 气泡提示
  // （不刷屏：离线只提示一次，恢复在线时再提示一次「回来啦」）——
  const wasOffline = backendOffline;
  backendOffline = !anyOk;
  if (backendOffline && !wasOffline) {
    offlineHintedAt = Date.now();
    lastKey = null;                 // 强制重画气泡，让「离线」立刻上屏
    setSprite("error", "shake");
    bubble.className = "s-error";
    bubble.style.display = "block";
    titleEl.textContent = "后端离线";
    textEl.textContent = "后端没起来，先开主程序（点此看日志）";
    return;                         // 直接跳过状态机，避免用空数据渲染「待机」
  }
  if (wasOffline && !backendOffline) {
    // 后端恢复：给一句「回来啦」反馈，10s 后自然回到状态机
    offlineHintedAt = Date.now();
    setState("idle");
    bubble.className = "s-play";
    bubble.style.display = "block";
    titleEl.textContent = "后端在线";
    textEl.textContent = "回来啦，随时可以用～";
    setTimeout(() => { if (!backendOffline && !guide) { lastKey = null; void tick(); } }, 3000);
  }
  statusBusy = Boolean((cascadeData && cascadeData.running) || (live && live.live_running));
  // 空闲计时：任何变声在跑就归零，否则记连续空闲起点（供「打盹」演出用）
  idleSince = statusBusy ? 0 : (idleSince || Date.now());
  // 快捷面板上的实时变声开关随真实状态走（面板隐藏时改了也不影响）
  if (live && typeof live.live_running === "boolean") {
    liveBtn.textContent = live.live_running ? "变声中 · 关" : "实时变声";
    liveBtn.classList.toggle("live-on", live.live_running);
  }
  if (cascadeData && cascadeData.running) {
    render(cascadeData);
  } else if (live && live.live_running) {
    renderLive(live);
  } else {
    lastText = "";
    setState("idle");   // 都没运行 / 后端没起：安静待机，不报错打扰
  }
  // 倾听细节：在听时偶尔抖一下耳朵（短暂打断 ear 动作，随后恢复）
  if (lastKey === "listen" && !guide && !earTwitching && Date.now() - lastEarTwitch > 8000) {
    earTwitching = true;
    lastEarTwitch = Date.now();
    setMotion("ear-twitch");
    setTimeout(() => {
      earTwitching = false;
      if (lastKey === "listen" && !guide) setMotion(STATE_MOTION.listen || "ear");
    }, 600);
  }
}

// ---------------- 手动拖拽 + 点击穿透 ----------------
// app-region: drag 与 setIgnoreMouseEvents 组合在透明窗上不可靠，改由 JS 主导：
// 悬停角色/气泡时关穿透，按下后由主进程按光标屏幕坐标挪窗口。
let dragging = false;
let movedFar = false;    // 本次按下是否拖出了死区（区分单击 vs 拖拽）
let downX = 0, downY = 0;

// ---------------- 快捷面板：悬停角色浮现 ----------------
const panel = document.getElementById("panel");
const sayEl = document.getElementById("say");
const sendBtn = document.getElementById("send");
const liveBtn = document.getElementById("live");
const voiceSel = document.getElementById("voiceSel");
const previewBtn = document.getElementById("preview");
const statusEl = document.getElementById("status");
const recentEl = document.getElementById("recent");
const VOICE_KEY = "pet_voice_id";
let panelTimer = null;

function showPanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panel.style.display = "block";
  refreshPanel();   // 每次浮现刷新：音色下拉 + 最近发送
}
function schedulePanelHide() {
  if (!panelTimer) panelTimer = setTimeout(() => {
    panel.style.display = "none";
    panelTimer = null;
  }, 500);
}
petBox.addEventListener("mouseenter", showPanel);
petBox.addEventListener("mouseleave", schedulePanelHide);
panel.addEventListener("mouseenter", showPanel);
panel.addEventListener("mouseleave", schedulePanelHide);

// 音色下拉：/api/voices 里挑有参考音频的（没参考的 RVC 模型合不了 TTS）
async function loadVoices() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/voices", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const usable = (j.voices || []).filter((v) => v.has_reference);
    const saved = localStorage.getItem(VOICE_KEY) || "";
    const cur = voiceSel.value || saved;
    const opts = [new Option("主界面选中", "")];
    for (const v of usable) opts.push(new Option(v.display_name || v.id, v.id));
    voiceSel.innerHTML = "";
    opts.forEach((o) => voiceSel.add(o));
    voiceSel.value = usable.some((v) => v.id === cur) ? cur : "";
  } catch {}
}

// 最近发送：后端 /api/wechat/history，点一条重发
async function loadRecent() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const items = (j.items || []).slice(0, 5);
    recentEl.innerHTML = items.length
      ? items.map((it) => {
          const t = new Date(it.ts * 1000);
          const hm = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
          return `<span class="hitem" data-wav="${it.wav}" title="重发 ${it.wav}（${it.duration_s}s）">${hm} · ${it.duration_s}s</span>`;
        }).join("")
      : '<span class="hempty">还没发过语音</span>';
  } catch {}
}
recentEl.addEventListener("click", (e) => {
  const it = e.target.closest(".hitem");
  if (it && window.pet && window.pet.sendWav) window.pet.sendWav(it.dataset.wav);
});

function refreshPanel() { loadVoices(); loadRecent(); }

// ---------------- 试听 / 发送 / 结果反馈 ----------------
let lastPreview = null;      // { wav, url, duration_s } 最近一次试听的合成产物
let previewAudio = null;

function setStatus(text, cls) {
  statusEl.textContent = text || "";
  statusEl.className = cls ? ("show " + cls) : "";
}

function doPreview() {
  const text = sayEl.value.trim();
  if (!text || !window.pet || !window.pet.previewText) return;
  const voiceId = voiceSel.value || "";
  if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);
  setStatus("合成中…");
  previewBtn.disabled = true;
  setTimeout(() => { previewBtn.disabled = false; }, 60000);
  window.pet.previewText(text, voiceId);
}

async function doSendText() {
  const text = sayEl.value.trim();
  if (!window.pet) return;
  // 发前探活：连不上后端立即提示，不闷头转圈被误判成卡死
  let alive = false;
  try { const r = await fetch("http://127.0.0.1:8000/api/health", { cache: "no-store" }); alive = r.ok; } catch {}
  if (!alive) { setStatus("后端未连接，请先启动变声后端（8000）", "err"); return; }
  // 有试听产物就直接发它（试听→发送两步走），否则一步到位「合成并发送」
  if (lastPreview && window.pet.sendWav) {
    setStatus(`发送中… 自动发到微信，全程别动键鼠`, "ok");
    window.pet.sendWav(lastPreview.wav);
    lastPreview = null;
  } else {
    if (!text) return;
    const voiceId = voiceSel.value || "";
    if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);   // 记住上次选的音色
    setStatus("合成中… 完成后自动发到微信，全程别动键鼠", "ok");
    if (window.pet.sendText) { window.pet.sendText(text, voiceId); sayEl.value = ""; }
  }
  sendBtn.disabled = true;
  setTimeout(() => { sendBtn.disabled = false; refreshPanel(); }, 25000);   // TTS+录音发送可能要十几秒
}
previewBtn.addEventListener("click", doPreview);
sendBtn.addEventListener("click", doSendText);
sayEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doSendText(); });
liveBtn.addEventListener("click", () => {
  if (window.pet && window.pet.liveToggle) window.pet.liveToggle();
});

// 主进程回传：合成产物 → 自动播放
if (window.pet && window.pet.onPreviewResult) {
  window.pet.onPreviewResult((r) => {
    if (!r || !r.ok) { setStatus("合成失败：" + ((r && r.error) || "未知错误"), "err"); return; }
    lastPreview = { wav: r.wav, url: r.url, duration_s: r.duration_s };
    setStatus(`已合成 ${r.duration_s || "?"}s，试听中…满意就点「发送」`, "ok");
    try {
      if (previewAudio) previewAudio.pause();
      previewAudio = new Audio(r.url);
      previewAudio.onended = () => setStatus(lastPreview ? `试听完毕，点「发送」发出去` : "", "ok");
      void previewAudio.play();
    } catch {
      setStatus(`合成完成（${r.duration_s || "?"}s），但播放失败`, "err");
    }
  });
}

// 主进程回传：发送结果 → 面板状态行直接给结论
if (window.pet && window.pet.onSendResult) {
  window.pet.onSendResult((r) => {
    if (!r) return;
    if (r.ok) setStatus(`已发到微信 ✓（${r.duration_s || "?"}s）`, "ok");
    else setStatus("发送失败：" + (r.error || "未知错误"), "err");
    refreshPanel();
  });
}

function overInteractive(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return !!(el && (el.closest("#pet") || el.closest("#bubble") || el.closest("#panel")));
}

petBox.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;   // 右键留给上下文菜单
  dragging = true;
  movedFar = false;
  downX = e.screenX; downY = e.screenY;
  window.pet && window.pet.dragStart();
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (dragging) {
    // 6px 死区：没拖出死区不算拖拽，mouseup 时按「单击角色」处理
    if (!movedFar && Math.hypot(e.screenX - downX, e.screenY - downY) > 6) movedFar = true;
    if (movedFar) { window.pet && window.pet.dragMove(); }
    return;
  }
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  window.pet && window.pet.dragEnd();   // 主进程侧保存位置
  // 拖拽结束时光标可能已出窗（elementFromPoint 为 null）→ 恢复全穿透
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
  // 单击角色（没拖动）：不再自动发送语音（太容易误触）。
  // 想发最近合成 → 右键桌宠「发送微信语音（用最近合成）」，或悬停用面板。
});
document.documentElement.addEventListener("mouseleave", () => {
  if (!dragging) window.pet && window.pet.setIgnoreMouse(true);
});
window.pet && window.pet.setIgnoreMouse(true);   // 初始全穿透，悬停角色后恢复

// ---------------- 待机小剧场 + 打盹 ----------------
// 闲着的时候自言自语 + 随机来一段动作，让桌宠「活着」；
// 长时间没人理（2.5 分钟+）还会随机打瞌睡（zZZ…）。
// 只在真正空闲（无级联/实时变声、无导览、状态为 idle）时触发，点气泡可跳过。
const IDLE_SKITS = [
  { lines: ["想发语音？右键我或悬停用面板～"], action: "idle", motion: "wiggle" },
  { lines: ["悬停我可以打字发语音哦"], action: "idle", motion: "wave" },
  { lines: ["看好了——", "转身！"], action: "idle", motion: "flip" },
  { lines: ["Q弹Q弹的～"], action: "idle", motion: "bounce" },
  { lines: ["飘啊飘～"], action: "listen", motion: "float" },
  { lines: ["今天也要开心呀！"], action: "play", motion: "dance" },
  { lines: ["别摇啦，头都晕了…"], action: "error", motion: "shake" },
  { lines: ["Ctrl+Alt+V 随时启停变声"], action: "think", motion: "nod" },
];
const DOZE_SKIT = { lines: ["zZZ…"], action: "listen", motion: "sleepy" };
let nextSkitAt = Date.now() + 30000;   // 出现半分钟后开始第一次
let idleSince = 0;                     // 连续空闲起点（ms），非 idle 时归零
let lastEarTwitch = 0;                 // 上次耳朵抖动时间（倾听时的小细节）
let earTwitching = false;
setInterval(() => {
  if (guide || statusBusy || lastKey !== "idle" || backendOffline) return;   // 后端离线时不待机表演
  const now = Date.now();
  if (now < nextSkitAt) return;
  const dozy = idleSince && now - idleSince > 150000 && Math.random() < 0.5;   // 闲久了的打盹
  nextSkitAt = now + (dozy ? 90000 : 45000) + Math.random() * 45000;
  const s = dozy ? DOZE_SKIT : IDLE_SKITS[Math.floor(Math.random() * IDLE_SKITS.length)];
  playGuide({ title: dozy ? "打盹" : "闲聊", lines: s.lines, action: s.action, motion: s.motion, duration: dozy ? 9000 : 6000 });
}, 5000);

void tick();
setInterval(tick, 1000);
// 皮肤轮询：应用新皮肤后 5s 内热切换（无需重启桌宠）。
// MOCK 调试模式下不请求后端（保持离线自演）。
if (!MOCK) {
  loadSkin();
  setInterval(loadSkin, 5000);
}
</script>
