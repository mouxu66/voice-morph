<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌宠</title>
<style>
  /* ================= 设计令牌：对齐主应用 web/src/styles/index.css =================
     主应用默认主题是「系统」（web/src/theme.ts: getStoredTheme() 兜底 "system"，
     resolve() 用 prefers-color-scheme 决定明暗），所以桌宠直接读 prefers-color-scheme
     就能在默认配置下与应用保持一致——不需要任何 IPC 或主进程改动，
     pet.html 属于热替换范围，改完重启桌面端即生效。
     若用户在应用里手动锁成 dark/light（localStorage vm-theme），两边会分叉；
     要彻底跟随需把主题经 IPC 推给桌宠窗口，那要动主进程 → 必须重打包。 */
  :root {
    /* 台面：与应用 --c-surface / --c-surface-2 同值 */
    --c-surface: 22 27 38;      /* #161b26 */
    --c-surface-2: 28 34 48;    /* #1c2230 */
    --c-surface-3: 36 43 60;
    --c-border: 38 46 64;       /* #262e40 */
    --c-border-2: 51 64 90;     /* #33405a */
    /* 文字：与应用 --c-t-* 同阶 */
    --c-t-strong: 255 255 255;
    --c-t-200: 226 232 240;
    --c-t-300: 203 213 225;
    --c-t-400: 148 163 184;
    --c-t-500: 100 116 139;
    /* 品牌：与应用 --c-accent 同值（紫 #7c5cf0，副色天蓝） */
    --c-accent: 124 92 240;
    --c-accent-h: 141 113 245;
    --c-accent-p: 105 76 222;
    --c-accent-2: 56 189 248;
    /* 语义色 */
    --c-ok: 52 211 153;
    --c-warn: 245 158 11;
    --c-err: 248 113 113;
    /* 玻璃层不透明度：暗色下要透出桌面，亮色下要压得住杂色壁纸 */
    --glass: 0.86;
    /* 投影：与应用 .glass-panel 同量级 */
    --elev-1: 0 2px 10px rgb(0 0 0 / 0.34);
    --elev-2: 0 10px 32px rgb(0 0 0 / 0.46);
    --hair: rgb(255 255 255 / 0.06);   /* 顶部内高光 */
    --c-shadow: 0 0 0;                 /* 角色落地投影色 */
    --sheen-a: 0.22;                   /* 角色柔光高光强度 */
    --font-body: Inter, "Segoe UI Variable Text", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --c-surface: 255 255 255;   /* #ffffff */
      --c-surface-2: 238 241 246; /* #eef1f6 */
      --c-surface-3: 226 231 240;
      --c-border: 216 221 231;    /* #d8dde7 */
      --c-border-2: 195 203 217;  /* #c3cbd9 */
      --c-t-strong: 15 23 42;
      --c-t-200: 31 41 55;
      --c-t-300: 51 65 85;
      --c-t-400: 71 85 105;
      --c-t-500: 100 116 139;
      --c-accent: 105 76 222;
      --c-accent-h: 124 92 240;
      --c-accent-p: 88 62 198;
      --c-accent-2: 14 165 233;
      --c-ok: 5 150 105;
      --c-warn: 217 119 6;
      --c-err: 220 38 38;
      --glass: 0.94;
      --elev-1: 0 2px 10px rgb(15 23 42 / 0.10);
      --elev-2: 0 10px 32px rgb(15 23 42 / 0.18);
      --hair: rgb(255 255 255 / 0.9);
      --c-shadow: 15 23 42;
      --sheen-a: 0.55;
    }
  }
  /* ⚠️ color-scheme 只挂在 #panel 上，绝不挂 :root：
     根元素设 color-scheme 会让 Chromium 去画「默认画布底色」，
     而这是个 transparent 窗，画布必须保持全透明（否则整窗出现一块实心矩形）。
     挂在 #panel 上照样能连带把 <select> 的原生下拉弹层和滚动条切成暗色
     —— color-scheme 是继承属性，会传给面板里的表单控件。 */
  #panel { color-scheme: dark; }
  @media (prefers-color-scheme: light) { #panel { color-scheme: light; } }
  /* 无障碍：跟随系统的「减少动态」（与应用 @layer base 里的同款处理） */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* 桌宠渲染器：透明窗，只在角色与气泡区域接收鼠标，其余点击穿透 */
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none; cursor: default;
    font-family: var(--font-body);
  }
  #root {
    width: 100vw; height: 100vh;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 8px 8px 10px;              /* 窗口内留边，让角色不至于贴边/顶到屏幕角 */
  }

  /* ---------------- 气泡：暗色玻璃 + 状态色点（对齐应用 .glass-panel） ---------------- */
  /* box-sizing: border-box 是必需的：max-width 204px 正好等于窗口可用宽（220 - 2×8 padding），
     用默认的 content-box 会再加上左右 padding 与边框，气泡横向溢出窗口被裁掉。 */
  #bubble {
    --bub-bd: rgb(var(--c-border) / 0.9);
    position: relative;
    box-sizing: border-box;
    max-width: 204px;
    /* 不参与收缩：气泡是文字块，被压扁就是切字。
       空间不够时让 #panel 去承担（它 overflow-y: auto，能优雅降级成内部滚动）。 */
    flex: 0 0 auto;
    margin-bottom: 6px;
    padding: 9px 12px 10px;
    border-radius: 14px;
    border: 1px solid var(--bub-bd);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair);
    font: 12px/1.5 var(--font-body);
    color: rgb(var(--c-t-200));
    /* 用 overflow-wrap 而不是 word-break: break-all —— 后者会把 "CABLE Output"
       从中间劈成 "CABLE Outpu / t"，中文照样能任意断行，所以没必要牺牲西文词形。 */
    overflow-wrap: anywhere;
    display: none;
    animation: bubble-in .22s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(6px) scale(.97); }
  }
  /* 气泡底部小三角（引导感）。自己也要 backdrop-filter，否则这块 14px 玻璃对不上主体。 */
  #bubble::after {
    content: "";
    position: absolute;
    left: 26px; bottom: -7px;
    width: 14px; height: 14px;
    transform: rotate(45deg);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-right: 1px solid var(--bub-bd);
    border-bottom: 1px solid var(--bub-bd);
    border-bottom-right-radius: 3px;
  }
  /* 注意：类名是 s-error（与 BUBBLE.error.cls 对齐），早期写成 .error 导致红底从未生效 */
  #bubble.s-error {
    --bub-bd: rgb(var(--c-err) / 0.45);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair),
                inset 0 0 0 1px rgb(var(--c-err) / 0.10);
    color: rgb(var(--c-err));
  }
  /* 导览气泡：头部标题 + 正文逐字打字 + 底部句子进度 */
  #bubble.guide {
    --bub-bd: rgb(var(--c-accent) / 0.5);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair),
                inset 0 0 0 1px rgb(var(--c-accent) / 0.12);
    cursor: pointer;
  }
  #head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #title {
    font-weight: 600; font-size: 11.5px; letter-spacing: .2px;
    color: rgb(var(--c-t-strong));
  }
  #bubble .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    flex: 0 0 auto; background: rgb(var(--c-t-500));
    box-shadow: 0 0 0 3px rgb(var(--c-t-500) / 0.16);
  }
  #bubble.s-listen .dot { background: rgb(var(--c-accent-2)); box-shadow: 0 0 0 3px rgb(var(--c-accent-2) / 0.20); animation: pulse 1.1s infinite; }
  #bubble.s-think  .dot { background: rgb(var(--c-warn));     box-shadow: 0 0 0 3px rgb(var(--c-warn) / 0.20);     animation: pulse .9s infinite; }
  #bubble.s-play   .dot { background: rgb(var(--c-ok));       box-shadow: 0 0 0 3px rgb(var(--c-ok) / 0.20); }
  #bubble.s-build  .dot { background: rgb(var(--c-accent-h)); box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.22);   animation: pulse 1.3s infinite; }
  #bubble.s-error  .dot { background: rgb(var(--c-err));      box-shadow: 0 0 0 3px rgb(var(--c-err) / 0.20); }
  #bubble.guide    .dot { background: rgb(var(--c-accent));   box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.22); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #text { min-height: 18px; color: rgb(var(--c-t-300)); }

  #foot { display: none; margin-top: 7px; align-items: center; gap: 5px; }
  #bubble.guide #foot { display: flex; }
  #steps { display: flex; gap: 4px; margin-right: auto; }
  /* 当前句从圆点拉成小胶囊，比单纯换色更好认（呼应应用的进度指示） */
  #steps i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgb(var(--c-t-500) / 0.35);
    transition: background .2s, width .2s, border-radius .2s;
  }
  #steps i.on { background: rgb(var(--c-accent)); width: 14px; border-radius: 999px; }
  #hint { font-size: 10px; color: rgb(var(--c-t-500)); }

  /* ---------------- 快捷面板：悬停角色浮现，输入文字合成发送 / 实时变声开关 ----------------
     宽度预算：窗口 220px，减去 #root 左右各 8px padding，可用正好 204px。
     所以面板与内部控件全部 box-sizing: border-box，且纵向排版要按 204px 来算。 */
  #panel {
    display: none;
    box-sizing: border-box;
    width: 204px;
    /* 窗口高 480、角色 150 + #root 上下留白 18 → 面板最多约 300px；
       导览气泡同时出现时可能顶到上限，超出部分内部滚动而不是撑破窗口。 */
    max-height: 300px;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin-bottom: 6px;
    padding: 11px;
    border-radius: 16px;                 /* 对齐应用 .glass-panel 的 rounded-2xl */
    border: 1px solid rgb(var(--c-border) / 0.9);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair);
    font: 12px/1.4 var(--font-body);
    color: rgb(var(--c-t-200));
    /* display:none → block 切换时 CSS 动画会自动重播，等于每次浮现都有入场 */
    animation: panel-in .2s cubic-bezier(.22, 1, .36, 1);
    scrollbar-width: thin;
    scrollbar-color: rgb(var(--c-border-2) / 0.7) transparent;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb {
    background: rgb(var(--c-border-2) / 0.7); border-radius: 999px;
  }

  /* —— 面板头：品牌标 + 标题 + 状态药丸 —— */
  #phead { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  #plogo {
    width: 17px; height: 17px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    background: linear-gradient(135deg, rgb(var(--c-accent-h)), rgb(var(--c-accent-p)));
    box-shadow: 0 2px 8px rgb(var(--c-accent) / 0.35);
    color: #fff;
  }
  #plogo svg { width: 11px; height: 11px; }
  #ptitle {
    font-size: 11.5px; font-weight: 600; letter-spacing: .3px;
    color: rgb(var(--c-t-strong));
  }
  #pill {
    margin-left: auto; flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 7px; border-radius: 999px;
    border: 1px solid rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
    font-size: 10px; color: rgb(var(--c-t-400));
    white-space: nowrap;
  }
  #pill b { font-weight: 500; }
  #pill i {
    width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto;
    background: rgb(var(--c-t-500));
  }
  /* 状态药丸色调：tone 由 JS 写在 className 上（见 setPill） */
  #pill.t-listen i { background: rgb(var(--c-accent-2)); box-shadow: 0 0 0 3px rgb(var(--c-accent-2) / 0.16); animation: pulse 1.1s infinite; }
  #pill.t-think  i { background: rgb(var(--c-warn));     box-shadow: 0 0 0 3px rgb(var(--c-warn) / 0.16);     animation: pulse .9s infinite; }
  #pill.t-play   i { background: rgb(var(--c-ok));       box-shadow: 0 0 0 3px rgb(var(--c-ok) / 0.16); }
  #pill.t-build  i { background: rgb(var(--c-accent-h)); box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.18);   animation: pulse 1.3s infinite; }
  #pill.t-err    i { background: rgb(var(--c-err));      box-shadow: 0 0 0 3px rgb(var(--c-err) / 0.16); }
  #pill.t-err {
    border-color: rgb(var(--c-err) / 0.45); color: rgb(var(--c-err));
  }

  /* —— 表单域：自绘前置图标（原生 input/select 放不进图标，用绝对定位的兄弟节点） —— */
  #panel .field { position: relative; display: block; margin-bottom: 6px; }
  #panel .field .lead {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: rgb(var(--c-t-500));
    pointer-events: none; transition: color .16s;
  }
  #panel .field:focus-within .lead { color: rgb(var(--c-accent-h)); }
  #panel input, #panel select {
    width: 100%; box-sizing: border-box;
    padding: 7px 10px 7px 28px;
    border-radius: 11px;
    border: 1px solid rgb(var(--c-border-2) / 0.65);
    outline: none;
    font: inherit;
    background: rgb(var(--c-surface-2) / 0.85);
    color: rgb(var(--c-t-200));
    transition: border-color .16s, box-shadow .16s, background .16s;
  }
  #panel input::placeholder { color: rgb(var(--c-t-500)); }
  #panel input:focus, #panel select:focus {
    border-color: rgb(var(--c-accent) / 0.75);
    box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.18);
    background: rgb(var(--c-surface-2));
  }
  #panel select {
    font-size: 11px; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    text-overflow: ellipsis;
  }
  /* 原生下拉箭头在暗色下不可控，自绘一个（与 #panel select 的 appearance:none 配对） */
  #panel .field.sel::after {
    content: ""; position: absolute; right: 12px; top: 50%;
    width: 5px; height: 5px; margin-top: -4px;
    border-right: 1.5px solid rgb(var(--c-t-500));
    border-bottom: 1.5px solid rgb(var(--c-t-500));
    transform: rotate(45deg); pointer-events: none;
  }

  /* —— 按钮行 —— */
  #panel .row { display: flex; gap: 6px; }
  #panel button {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 7px 0; border-radius: 11px;
    border: 1px solid rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
    color: rgb(var(--c-t-300));
    font: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer; white-space: nowrap; overflow: hidden;
    transition: background .16s, border-color .16s, color .16s, box-shadow .16s, transform .08s;
  }
  #panel button svg { width: 13px; height: 13px; flex: 0 0 auto; }
  #panel button:hover {
    border-color: rgb(var(--c-border-2));
    background: rgb(var(--c-surface-3) / 0.9);
    color: rgb(var(--c-t-strong));
  }
  #panel button:active { transform: translateY(1px); }
  #panel button:disabled { opacity: .45; cursor: default; box-shadow: none; transform: none; }
  #panel button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.25); }
  /* 主按钮：对齐应用 .btn-primary —— 品牌渐变 + 同色系投影，取代纯色块。
     flex 1.7（不是 1.35）：204px 面板减内边距 22px、再减两个 6px 间距只剩 170px，
     按 1.35:1:1 分下来主按钮仅 65px，而「合成并发送」+ 图标实测要 69px → 末字被切。
     1.7:1:1 → 82/49/49，主按钮留出约 9px 余量。 */
  #panel button.primary {
    flex: 1.7; border-color: transparent;
    background: linear-gradient(135deg, rgb(var(--c-accent-h)), rgb(var(--c-accent)));
    color: #fff;
    box-shadow: 0 2px 12px rgb(var(--c-accent) / 0.35);
  }
  #panel button.primary:hover {
    color: #fff; filter: brightness(1.1);
    box-shadow: 0 4px 20px rgb(var(--c-accent) / 0.5);
  }
  #panel button:not(.primary) { flex: 1; }
  /* 变声开启：语义绿（与气泡 s-play 的 ok 色同源） */
  #panel button.live-on {
    border-color: rgb(var(--c-ok) / 0.5);
    background: rgb(var(--c-ok) / 0.14);
    color: rgb(var(--c-ok));
  }
  #panel button.live-on:hover { background: rgb(var(--c-ok) / 0.2); color: rgb(var(--c-ok)); }
  /* 忙态：图标换成旋转圈 —— 「合成中」要有看得见的进行中信号，不能只靠变灰 */
  #panel button .spin { display: none; }
  #panel button.busy { pointer-events: none; }
  #panel button.busy svg { display: none; }
  #panel button.busy .spin { display: block; }
  #panel .spin {
    width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%;
    border: 1.5px solid currentColor; border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* —— 状态行：带图标的提示条（图标三选一，由 .ok/.err 决定显示哪个） ——
     max-height 是**必需**的，不是美化：状态文案里有一条是 `合成失败：${后端 detail}`，
     长度完全由后端决定。不封顶的话，一条长报错就能把面板撑到 300px 以上、
     把「最近发送」挤出去（量测里 ok-dark 已经只剩 3px 余量）。
     封到 42px（= 两行）后内容固定，更长的报错在状态行内部滚动，不再影响整体高度。 */
  #status {
    display: none; align-items: flex-start; gap: 6px;
    box-sizing: border-box;
    max-height: 42px; overflow-y: auto; overscroll-behavior: contain;
    margin-top: 7px; padding-top: 8px;
    border-top: 1px solid rgb(var(--c-border) / 0.85);
    font-size: 10.5px; line-height: 1.5;
    color: rgb(var(--c-t-400)); overflow-wrap: anywhere;
  }
  #status::-webkit-scrollbar { width: 4px; }
  #status::-webkit-scrollbar-track { background: transparent; }
  #status::-webkit-scrollbar-thumb {
    background: rgb(var(--c-border-2) / 0.8); border-radius: 999px;
  }
  #status.show { display: flex; }
  #status .sic { display: none; flex: 0 0 auto; width: 12px; height: 12px; margin-top: 1.5px; }
  #status .ic-info { display: block; color: rgb(var(--c-t-500)); }
  #status.ok  { color: rgb(var(--c-ok)); }
  #status.ok  .ic-info { display: none; }
  #status.ok  .ic-ok   { display: block; color: rgb(var(--c-ok)); }
  #status.err { color: rgb(var(--c-err)); }
  #status.err .ic-info { display: none; }
  #status.err .ic-err  { display: block; color: rgb(var(--c-err)); }

  /* —— 最近发送：胶囊 chip，点一下重发 ——
     固定单行 + 横向滚动，而不是 flex-wrap 换行。
     理由：换行时高度随 chip 文案浮动（3 条就占两行 50px），而面板纵向预算是死的，
     加一行「实时变声」后已经只剩几 px 余量。单行把这块钉死成 25px，宽度不够就横向滚。
     padding-right 留给右侧渐隐遮罩：内容没溢出时那 14px 是空的、渐隐看不出；
     溢出了才把被切的那半颗 chip 柔化掉，充当「还有更多」的提示。 */
  #panel #recent {
    margin-top: 8px; padding-right: 14px;
    display: flex; flex-wrap: nowrap; gap: 5px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 14px), transparent);
  }
  #panel #recent::-webkit-scrollbar { display: none; }
  #panel #recent:empty { display: none; }
  #panel .hitem {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgb(var(--c-border-2) / 0.6);
    background: rgb(var(--c-surface-2) / 0.7);
    font-size: 10.5px; color: rgb(var(--c-t-400));
    cursor: pointer; white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: border-color .16s, background .16s, color .16s;
  }
  #panel .hitem:hover {
    border-color: rgb(var(--c-accent) / 0.6);
    background: rgb(var(--c-accent) / 0.14);
    color: rgb(var(--c-accent-h));
  }
  #panel .hempty { font-size: 10.5px; color: rgb(var(--c-t-500)); }

  /* —— 实时变声引擎：RVC 实时 / 千问变声 二选一 ——
     两个引擎在后端是**互斥**的（互相 409：「两者抢 GPU 且都占 CABLE」），
     所以这里做成「选一个」的分段控件，而不是两个独立开关 —— 独立开关会让人以为能同时开。
     行内小标签「麦克风」是必需的：它点明这一行管的是**麦克风实时链路**，
     跟下面「输入文字 → 合成 → 发微信」那条完全不是一回事（用户反馈过的混淆点）。
     标签用「麦克风」而不是「实时变声」：后者 4 个字要多占 10px，
     而分段按钮的文字宽度是硬预算（实测 204px 下每个按钮只有 ~69px）。 */
  #engRow { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  #engLabel { flex: 0 0 auto; font-size: 10px; letter-spacing: .2px; color: rgb(var(--c-t-500)); }
  #engineSeg {
    flex: 1 1 auto; min-width: 0;
    display: flex; gap: 2px; padding: 2px;
    border-radius: 9px;
    border: 1px solid rgb(var(--c-border) / 0.9);
    background: rgb(var(--c-surface-2) / 0.55);
  }
  /* 覆盖 #panel button 的通用外观：分段按钮要矮、要平、不要阴影和 translate */
  #panel #engineSeg button {
    box-sizing: border-box;
    flex: 1 1 0; min-width: 0; height: 18px; padding: 0 3px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 7px; background: transparent;
    box-shadow: none; transform: none;
    font-size: 10px; font-weight: 600; line-height: 1;
    color: rgb(var(--c-t-400));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel #engineSeg button:hover { background: rgb(var(--c-surface-3) / 0.75); color: rgb(var(--c-t-200)); }
  /* 选中 = 品牌紫底；运行中 = 绿底 + 绿描边（放在 .on 之后，运行时绿盖紫）。
     运行态**不用**额外的小圆点元素：分段按钮宽度实测只剩几 px 余量，
     再插一个 5px 圆点 + 4px gap 会把它挤到省略号（而且 justify-content: center 的
     溢出还会让 scrollWidth 测不准）。整块变色同样一眼可辨，且零布局开销。 */
  #panel #engineSeg button.on {
    background: rgb(var(--c-accent) / 0.20);
    color: rgb(var(--c-accent-h));
    box-shadow: inset 0 0 0 1px rgb(var(--c-accent) / 0.34);
  }
  #panel #engineSeg button.running {
    background: rgb(var(--c-ok) / 0.18);
    color: rgb(var(--c-ok));
    box-shadow: inset 0 0 0 1px rgb(var(--c-ok) / 0.45);
    animation: pulse 1.6s infinite;
  }

  /* —— 气泡在屏时的「让位」规则 ——
     气泡与面板共用同一个 480px 高的窗口，可用高是：
       480(窗高) - 18(#root 上下留白) - 150(角色) - 6(面板下边距) - 气泡 - 6(气泡下边距)。
     实测（tools/pet-panel-preview.cjs --measure）气泡一起来面板就被压扁，
     底部「最近发送」那行被切掉一截并冒出内部滚动条：
       guide   气泡 82 → 面板只剩 217.8，自然高 224 → 切 6px
       think   气泡 60 → 面板只剩 240，  自然高 256 → 切 16px
       offline 气泡 78 → 面板只剩 222，  自然高 256 → 切 34px
     修法不是把面板整体做小（常态下那会牺牲呼吸感，而且最坏情况要砍掉 80px 才够），
     而是让它在【气泡占着地方】时主动让位：
       · 隐藏「最近发送」：气泡正在报当前状态时，重发上一条既不是重点、又恰好最占地方
         （50px 高 + 9px 上边距 = 59px，一让就够）。#recent 本来就会随数据在「有/无」
         之间切换（#panel #recent:empty 也是 display:none），所以它的出现/消失不是新行为。
         组合起来正好：待机时（无气泡）面板完整，一有活动就精简 —— 而活动期间本来也不重发。
       · 头部与字段的行距各收 2~3px，给更长的状态/导览文案留余量。
     让位后 guide 场景面板自然高降到 156，余量 60px（够再长 60px 的气泡）。
     JS 侧由 setBubbleVisible() 统一挂/摘 #root 上的 .compact —— 见那里的注释。 */
  #root.compact #panel #recent { display: none; }
  #root.compact #panel #phead { margin-bottom: 6px; }
  #root.compact #panel .field { margin-bottom: 5px; }

  /* ---------------- 角色 ---------------- */
  /* 尺寸由 JS 按皮肤 frameW/frameH 注入（--dw/--dh 显示尺寸，含整数倍放大），
     默认回退 150×150（芙宁娜内置）。像素素材放大时 image-rendering: pixelated 保持锐利。 */
  #pet {
    position: relative;
    width: var(--dw, 150px); height: var(--dh, 150px);
    cursor: grab;                  /* 拖拽由 JS+IPC 手动实现（app-region 在透明穿透窗上不可靠） */
    display: flex; align-items: flex-end; justify-content: center;
    transform-origin: 50% 85%;
    /* 角色脚下的椭圆投影，给「落地感」 */
    filter: drop-shadow(0 6px 10px rgb(var(--c-shadow) / 0.18));
  }
  #pet:active { cursor: grabbing; }
  /* 背景装饰光晕：径向渐变 + 细腻边框，让透明窗里角色不「飘」在裸桌面上。
     光晕改用品牌紫（原为天蓝），与面板主色同源。 */
  #pet::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background:
      radial-gradient(50% 50% at 50% 78%, rgb(var(--c-accent) / 0.16), transparent 70%),
      radial-gradient(38% 32% at 50% 92%, rgb(var(--c-shadow) / 0.14), transparent 80%);
    box-shadow:
      inset 0 0 0 1px rgb(var(--c-border-2) / 0.4),
      inset 0 -6px 16px rgb(var(--c-accent) / 0.07);
    pointer-events: none;
    z-index: 0;
  }
  /* 光晕里的一点柔和高光（左上），增强立体感。暗色下要收敛，否则在暗桌面上发白。 */
  #pet::after {
    content: "";
    position: absolute;
    inset: 18px auto auto 22px;
    width: 26px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgb(255 255 255 / var(--sheen-a)), transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  #pet #sprite { position: relative; z-index: 1; }
  /* 精灵图动画：<div> + WebP 背景 + steps() 关键帧（替代原 SVG 内 SMIL）。
     帧横向拼接，帧宽不定——--fw/--fh 由 JS 按皮肤注入，回退 150。 */
  #pet #sprite {
    width: var(--fw, 150px); height: var(--fh, 150px);
    -webkit-user-drag: none; pointer-events: auto;
    background-repeat: no-repeat;
    will-change: background-position;   /* 提示合成层，减少逐帧重绘掉帧 */
    transform: translateZ(0);
    animation: pet-steps 3.0s steps(37) infinite;   /* 默认 idle，运行时被 JS 覆盖 */
  }
  @keyframes pet-steps {
    from { background-position-x: 0; }
    to   { background-position-x: calc(var(--n, 37) * var(--fw, 150px) * -1); }
  }

  /* 页面专属动作：挂在 #pet 外层，与精灵图自身的逐帧动画互不干扰 */
  #pet.m-pop   { animation: m-pop .62s cubic-bezier(.34,1.56,.64,1) 2; }
  #pet.m-wave  { animation: m-wave 1.5s ease-in-out infinite; }
  #pet.m-lean  { animation: m-lean 2.4s ease-in-out infinite; }
  #pet.m-nod   { animation: m-nod 1.3s ease-in-out infinite; }
  #pet.m-sway  { animation: m-sway 3.2s ease-in-out infinite; }
  #pet.m-jump  { animation: m-jump .95s cubic-bezier(.3,.7,.4,1) infinite; }
  #pet.m-twirl { animation: m-twirl 2.4s ease-in-out infinite; }
  @keyframes m-pop   { 0%,100% { transform: scale(1); } 45% { transform: scale(1.14) translateY(-6px); } }
  @keyframes m-wave  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes m-lean  { 0%,100% { transform: translateX(-7px) rotate(-4deg); } 50% { transform: translateX(7px) rotate(4deg); } }
  @keyframes m-nod   { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(5px) rotate(6deg); } }
  @keyframes m-sway  { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  @keyframes m-jump  { 0%,55%,100% { transform: translateY(0) scaleY(1); } 22% { transform: translateY(-20px) scaleY(1.06); } 40% { transform: translateY(0) scaleY(.93); } }
  @keyframes m-twirl { 0%,72%,100% { transform: rotate(0) scale(1); } 30% { transform: rotate(180deg) scale(1.05) translateY(-10px); } }
  /* —— 二期动作：甩头 / 漂浮 / 扭动 / 转身 / Q弹 / 跳舞 —— */
  #pet.m-shake  { animation: m-shake .6s ease-in-out infinite; }
  #pet.m-float  { animation: m-float 2.6s ease-in-out infinite; }
  #pet.m-wiggle { animation: m-wiggle .5s ease-in-out infinite; }
  #pet.m-flip   { animation: m-flip 1.6s ease-in-out infinite; }
  #pet.m-bounce { animation: m-bounce 1.0s ease-in-out infinite; }
  #pet.m-dance  { animation: m-dance 1.8s ease-in-out infinite; }
  @keyframes m-shake  { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-6px) rotate(-4deg); } 40% { transform: translateX(6px) rotate(4deg); } 60% { transform: translateX(-5px) rotate(-3deg); } 80% { transform: translateX(5px) rotate(3deg); } }
  @keyframes m-float  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(2deg); } }
  @keyframes m-wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.03); } 75% { transform: rotate(8deg) scale(1.03); } }
  @keyframes m-flip   { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
  @keyframes m-bounce { 0%,100% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-16px) scale(.96,1.06); } 55% { transform: translateY(0) scale(1.08,.9); } 70% { transform: translateY(0) scale(.97,1.03); } }
  @keyframes m-dance  { 0%,100% { transform: rotate(0) translateY(0); } 15% { transform: rotate(-9deg) translateY(-8px); } 30% { transform: rotate(9deg) translateY(0); } 45% { transform: rotate(-9deg) translateY(-8px); } 60% { transform: rotate(9deg) translateY(0); } 75% { transform: rotate(-6deg) translateY(-6px); } }
  /* —— 三期动作：侧耳倾听 / 忙碌干活（状态联动，见 STATE_MOTION） —— */
  #pet.m-ear   { animation: m-ear 2.2s ease-in-out infinite; }
  #pet.m-work  { animation: m-work 1.2s ease-in-out infinite; }
  @keyframes m-ear   { 0%,100% { transform: rotate(0) translateX(0); } 40% { transform: rotate(-10deg) translateX(7px); } 60% { transform: rotate(-10deg) translateX(7px); } }
  @keyframes m-work  { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-2deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-3px) rotate(2deg); } }
  /* —— 四期动作：打瞌睡（点头） / 耳朵抖动（倾听时的细节） —— */
  #pet.m-sleepy    { animation: m-sleepy 3.2s ease-in-out infinite; }
  #pet.m-ear-twitch { animation: m-ear-twitch .5s ease-in-out; }
  @keyframes m-sleepy { 0%,8% { transform: rotate(0) translateY(0); } 55% { transform: rotate(-13deg) translateY(6px); } 62% { transform: rotate(2deg) translateY(0); } 70% { transform: rotate(-13deg) translateY(6px); } 77% { transform: rotate(2deg) translateY(0); } 100% { transform: rotate(-13deg) translateY(6px); } }
  @keyframes m-ear-twitch { 0%,100% { transform: rotate(0) translateX(0); } 15%,35%,55%,75% { transform: rotate(-6deg) translateX(4px); } 25%,45%,65%,85% { transform: rotate(6deg) translateX(-4px); } }
</style>
</head>
<body>
<div id="root">
  <div id="bubble">
    <div id="head"><span class="dot"></span><span id="title"></span></div>
    <div id="text"></div>
    <div id="foot"><span id="steps"></span><span id="hint">点我跳过</span></div>
  </div>
  <div id="panel">
    <!-- 面板头：品牌标 + 标题 + 状态药丸。药丸文案/色调由 setPill() 驱动，
         它同时把「角色现在在干什么」从气泡搬到了面板上——悬停时气泡可能被挡住。 -->
    <div id="phead">
      <span id="plogo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M3 10v4" /><path d="M7.5 6v12" /><path d="M12 3v18" /><path d="M16.5 7v10" /><path d="M21 10v4" />
        </svg>
      </span>
      <span id="ptitle">变声工坊</span>
      <span id="pill" class="pill t-idle"><i></i><b id="pillText">待机</b></span>
    </div>

    <!-- 实时变声引擎（麦克风链路）：RVC 实时 / 千问变声 二选一。
         两者互斥（后端互相 409：抢 GPU 且都占 CABLE），所以是「选一个」而不是两个开关。
         点另一个 = 自动停掉在跑的那个再开新的；都没在跑时只改选择、不自动启动。
         行内标签「麦克风」点明这行管的是麦克风实时链路，
         跟下面「输入文字 → 合成 → 发微信」那条不是一回事。
         运行态靠整块变绿表达（不是加小圆点）—— 按钮宽度只有几 px 余量，见 CSS 注释。 -->
    <div id="engRow">
      <span id="engLabel">麦克风</span>
      <div id="engineSeg" role="group" aria-label="实时变声引擎">
        <button type="button" id="engRvc" data-eng="rvc"
                title="RVC 实时：逐帧套音色，保留你的说话习惯，适合真人音色 / 低延迟">
          RVC 实时
        </button>
        <button type="button" id="engQwen" data-eng="qwen"
                title="千问变声：先识别成文字再合成换嗓，适合卡通 / 角色音色，比 RVC 慢一点">
          千问变声
        </button>
      </div>
    </div>

    <label class="field" for="say">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
      </svg>
      <!-- 文案写「自动合成发微信」而不是「发微信语音」：把这条链路跟上面的实时变声分开。
          完整解释（文字 → TTS 合成 → RVC 换声 → 自动录进微信，不是实时变声）放在 title 里，
          204px 宽塞不下，但鼠标悬停能看全。 -->
      <input id="say" placeholder="输入文字，自动合成发微信" maxlength="200"
             title="文字 → TTS 合成 → RVC 换声 → 自动录进微信。这条不是实时变声，用的是主界面选中的音色。" />
    </label>

    <div class="field sel">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M2 10v3" /><path d="M6 6v11" /><path d="M10 3v18" /><path d="M14 8v7" /><path d="M18 5v13" /><path d="M22 10v3" />
      </svg>
      <select id="voiceSel" title="合成用的音色（默认=主界面当前选中）"></select>
    </div>

    <!-- 音色下拉独占一行：以前它和三个按钮挤在同一 flex 行里，
         204px 分给 4 个控件后每个只剩 ~41px，「合成并发送」被 nowrap 挤到溢出。 -->
    <div class="row">
      <button id="send" class="primary" type="button" title="用选中音色合成，并录成微信语音消息">
        <span class="spin"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" />
        </svg>
        <span id="sendLabel">合成并发送</span>
      </button>
      <button id="preview" type="button" title="只合成并试听，满意再点发送">
        <span class="spin"></span>
        <!-- 用播放三角而不是耳机：耳机在 13px 下两个耳罩会糊成一团墨点，三角轮廓始终清楚 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="7 4 20 12 7 20 7 4" />
        </svg>
        <span>试听</span>
      </button>
      <button id="live" type="button" title="开关上面选中的实时变声引擎（微信把 CABLE Output 当麦克风）">
        <span class="spin"></span>
        <span id="liveLabel">开 RVC</span>
      </button>
    </div>

    <!-- 状态行：三个图标常驻、由 .ok/.err 决定显示哪一个（CSS 里切换，JS 只写文案与类名） -->
    <div id="status">
      <svg class="sic ic-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />
      </svg>
      <svg class="sic ic-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <svg class="sic ic-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" />
      </svg>
      <span id="statusText"></span>
    </div>

    <div id="recent" title="最近发送的语音，点一下重发"></div>
  </div>
  <div id="pet"><div id="sprite"></div></div>
</div>
<script>
"use strict";

/**
 * 桌宠渲染器，两种工作模式：
 *
 * 1) 状态模式（默认）：1s 轮询后端，按链路阶段切换动画。
 *    级联：未运行->idle / warming->build / capturing->listen / asr|tts->think /
 *          播放队列积压->play（气泡显示识别文字）/ error->error
 *    实时变声（RVC）：基础 listen，转写中->think，识别到文字->气泡字幕
 *
 * 2) 导览模式：主进程在前端切页时推来 { title, lines, action, motion, duration }，
 *    桌宠临时现身为该页做一次介绍（头部标题 + 正文逐字打字 + 句子进度点），
 *    并播放该页专属动作，讲完自动退回状态模式。变声运行中不让导览抢镜。
 *
 * sprite 来自 Ice-teapop/desktop-pet 芙宁娜主题（MIT）。
 */
const API = "http://127.0.0.1:8000/api/cascade/status";
const LIVE_API = "http://127.0.0.1:8000/api/rvc/live/status";

const SPRITES = {
  idle:   "svg/idle.webp",
  listen: "svg/idle-look.webp",
  think:  "svg/thinking.webp",
  play:   "svg/conducting.webp",
  build:  "svg/building.webp",
  error:  "svg/error.webp",
};
// 每个状态的帧数 / 单轮周期(s)，驱动 CSS steps 动画（原 SVG 内为逐帧离散平移 SMIL）
const SPRITE_ANIM = {
  idle:   { frames: 37, dur: 3.0 },
  listen: { frames: 37, dur: 3.0 },
  think:  { frames: 37, dur: 3.0 },
  play:   { frames: 22, dur: 1.8 },
  build:  { frames: 16, dur: 1.4 },
  error:  { frames: 37, dur: 3.0 },
};

// ---------------- 动态皮肤 ----------------
// skin.json（后端 /api/pet-market/applied）:
//   { id, frameW, frameH, states: { state: { sheet, frames, dur } } }
// 内置芙宁娜（id=furina）直接用本地 svg/*.webp，不依赖后端；其余皮肤 sheet
// 走 http://127.0.0.1:8000/api/pet-market/sheet/<id>/<sheet>。
const SKIN_SHEET_API = "http://127.0.0.1:8000/api/pet-market";
let petSkin = { id: "", frameW: 150, frameH: 150, states: {} };   // 当前皮肤（空=内置）
let skinScale = 1;   // 像素素材整数倍放大系数（保持锐利）

/** 取某状态的皮肤配置；缺省回退福灵娜内置。 */
function skinState(key) {
  if (petSkin.states[key]) return petSkin.states[key];
  if (key === "listen" && petSkin.states.idle) return petSkin.states.idle;   // 听→待机
  if (key === "build" && petSkin.states.play) return petSkin.states.play;    // 干活→玩耍
  return { sheet: "", frames: SPRITE_ANIM[key].frames, dur: SPRITE_ANIM[key].dur };
}

/** sheet 完整 URL：内置皮肤用本地 svg，远端皮肤用后端接口。 */
function sheetUrl(key, st) {
  if (!petSkin.id || petSkin.id === "furina") return SPRITES[key] || SPRITES.idle;
  return `${SKIN_SHEET_API}/sheet/${encodeURIComponent(petSkin.id)}/${encodeURIComponent(st.sheet)}`;
}

/**
 * 应用皮肤到 DOM：按 frameW/frameH 计算整数倍放大与显示尺寸。
 * ⚠️ 调用时机：必须在下方「DOM 引用」段取到 petBox / sprite 之后。
 *    本函数读写这两个 const 绑定，提前调用会撞上暂时性死区（TDZ）抛
 *    ReferenceError，把整个脚本打断——桌宠就只剩 CSS ::before 那圈光晕。
 */
function applySkin() {
  const fw = petSkin.frameW || 150, fh = petSkin.frameH || 150;
  // 目标显示高度 ≈150px；比它小的像素素材按整数倍放大（32→160），大的保持原尺寸
  skinScale = fh >= 150 ? 1 : Math.max(1, Math.ceil(150 / fh));
  const dw = fw * skinScale, dh = fh * skinScale;
  // 精灵图自身尺寸：--fw/--fh 既当宽高，也是 pet-steps 每一步的位移基准
  sprite.style.setProperty("--fw", dw + "px");
  sprite.style.setProperty("--fh", dh + "px");
  // 外框尺寸给 #pet（它才是 var(--dw/--dh) 的消费方）：
  // 这两条以前写在 sprite 上，而 #pet 是父元素、自定义属性不会向上继承，
  // 于是 #pet 永远退回 150px——换非 150 帧尺寸的皮肤时，::before 光晕会比角色小一圈。
  petBox.style.setProperty("--dw", dw + "px");
  petBox.style.setProperty("--dh", dh + "px");
  // 像素素材放大时锁锐利，矢量风格保持平滑
  sprite.style.imageRendering = skinScale > 1 ? "pixelated" : "auto";
}

/** 拉取当前应用皮肤配置；失败/后端离线保持现有皮肤不动。 */
async function loadSkin() {
  let cfg = null;
  try {
    const r = await fetch(`${SKIN_SHEET_API}/applied`, { cache: "no-store" });
    if (r.ok) cfg = await r.json();
  } catch {}
  if (!cfg || !cfg.id) return;
  if (cfg.id === petSkin.id) return;   // 没换肤
  petSkin = { id: cfg.id, frameW: cfg.frameW || 150, frameH: cfg.frameH || 150, states: cfg.states || {} };
  applySkin();
  // 预加载新皮肤各状态 sheet，避免首次切换白屏
  for (const key of Object.keys(SPRITE_ANIM)) {
    const st = skinState(key);
    if (st.sheet && sheetUrl(key, st) !== (SPRITES[key] || "")) new Image().src = sheetUrl(key, st);
  }
  lastKey = null;   // 强制下一帧重画
}

// 内置皮肤初始化（150×150）挪到下方「DOM 引用」段之后调用，见 applySkin 上的说明。
const BUBBLE = {
  // 桌宠现在默认常驻，待机时只留角色安静待着，别把「待机中」一直糊在屏幕上
  idle:   { cls: "",          title: "待机",     text: "待机中", hidden: true },
  listen: { cls: "s-listen",  title: "我在听",   text: "你说，我听着～" },
  think:  { cls: "s-think",   title: "工作中",   text: "听懂啦，正在处理…" },
  play:   { cls: "s-play",    title: "正在播",   text: "" },          // 播放中气泡让位给识别文字
  build:  { cls: "s-build",   title: "准备中",   text: "模型加载中…" },
  error:  { cls: "s-error",   title: "出错",     text: "出错了，请查看主窗口" },
};
// 状态药丸文案：比气泡标题更短（药丸只有 ~60px），色调类名 t-* 与 CSS 里的 #pill.t-* 配对。
// 它把「角色现在在干什么」搬到了面板上——悬停展开面板时，气泡往往被面板顶到窗口外看不见。
const PILL = {
  idle:   ["待机",   "idle"],
  listen: ["我在听", "listen"],
  think:  ["处理中", "think"],
  play:   ["正在播", "play"],
  build:  ["准备中", "build"],
  error:  ["出错",   "err"],
};
// 状态→动作映射：让「倾听 / 干活」有对应的肢体语言
// build=准备中(轻晃) / listen=侧耳倾听 / think·play=忙碌干活 / error=甩头
const STATE_MOTION = { build: "wiggle", listen: "ear", think: "work", play: "work", error: "shake" };
const MOTIONS = ["pop", "wave", "lean", "nod", "sway", "jump", "twirl",
  "shake", "float", "wiggle", "flip", "bounce", "dance", "ear", "work", "sleepy", "ear-twitch"];

const petBox = document.getElementById("pet");
const sprite = document.getElementById("sprite");
const bubble = document.getElementById("bubble");
const rootEl = document.getElementById("root");   // 气泡在屏时挂 .compact，让面板主动让位
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const stepsEl = document.getElementById("steps");
// 面板头部的状态药丸（声明点必须早于 setState 的首次调用，见下方 applySkin 的 TDZ 说明）
const pillEl = document.getElementById("pill");
const pillText = document.getElementById("pillText");

// DOM 引用齐了才能初始化皮肤尺寸：applySkin() 会往 petBox/sprite 写内联自定义属性。
// 2026-09-10 b91707b 把这次调用放在了 DOM 引用之前（且 sprite 是 const），
// 触发「Cannot access 'sprite' before initialization」→ 整个脚本中断，
// 精灵图永远拿不到 background-image，桌宠只剩 CSS ::before 那圈光晕、且不再全窗穿透。
// 回归防护见 tools/test-pet-renderer-script.cjs。
applySkin();

let lastKey = null;       // 上次渲染的状态 key
let lastText = "";        // 当前句识别文字（出现=识别完成，清空=播出结束）
let statusBusy = false;   // 级联/实时变声是否在运行（运行中不让导览打断）
let guide = null;         // 导览播放中的状态
let guideTimers = [];
let typingTimer = null;
let backendOffline = false;   // 后端是否失联（两个状态接口都拉不到）
let offlineHintedAt = 0;      // 上次离线提示的时刻，避免每 1s 反复弹气泡刷屏

// 预加载所有 sprite，避免首次切换时白屏等待（WebP，单个最大 ~0.5MB）
for (const p of Object.values(SPRITES)) { new Image().src = p; }

// ---------------- 通用渲染 ----------------
function setSprite(key, motion) {
  const st = skinState(key);
  const url = sheetUrl(key, st);
  sprite.style.backgroundImage = `url("${url}")`;
  sprite.style.backgroundSize = (st.frames * (petSkin.frameW || 150) * skinScale) + "px " + ((petSkin.frameH || 150) * skinScale) + "px";
  sprite.style.setProperty("--n", String(st.frames));
  sprite.style.animation = `pet-steps ${st.dur}s steps(${st.frames}) infinite`;
  setMotion(motion);
}

function setMotion(motion) {
  petBox.classList.remove(...MOTIONS.map((m) => "m-" + m));
  if (!motion) return;
  petBox.classList.add("m-" + motion);
  // 重新触发一次动画（连续两页用同一个动作时也要有反应）
  void petBox.offsetWidth;
}

/**
 * 面板头部状态药丸。text 为显示文案，tone ∈ idle|listen|think|play|build|err
 * （对应 CSS #pill.t-* 的圆点颜色与呼吸动画）。
 */
function setPill(text, tone) {
  pillText.textContent = text;
  pillEl.className = "pill t-" + (tone || "idle");
}

/**
 * 气泡显隐的唯一入口，同时把「气泡占了地方」这件事同步给 #root。
 *
 * 为什么必须收敛到一个入口：气泡与面板共用同一个 480px 窗口，气泡一起来面板就被压扁，
 * 底部「最近发送」会被切掉一截（实测 guide 切 6px / think 16px / offline 34px）。
 * 让位规则（#root.compact，见 CSS）只在气泡真的在屏时生效，所以这里必须与 display 同步。
 * 以前各处直接写 bubble.style.display，漏掉任何一处都会让面板带着多余的 #recent 去抢高度。
 */
function setBubbleVisible(show) {
  bubble.style.display = show ? "block" : "none";
  rootEl.classList.toggle("compact", !!show);
}

/**
 * @param {string} key  状态 key（对应 BUBBLE / PILL / STATE_MOTION）
 * @param {string} [text]  覆盖文案（识别到的文字等）
 * @param {string} [title] 覆盖标题。实时变声运行时用它把「我在听」换成引擎名，
 *                         这样不悬停也能从气泡上看出「现在是 RVC 还是千问」。
 */
function setState(key, text, title) {
  if (guide) return;                       // 导览播放中，状态轮询不抢气泡
  if (key === lastKey && text === textEl.textContent) return;
  lastKey = key;
  // 药丸必须写在下面的早退分支之前：待机时气泡是 hidden、会直接 return，
  // 若把 setPill 放在 return 之后，面板就会永远停在上一状态。
  const pill = PILL[key] || [key, "idle"];
  setPill(pill[0], pill[1]);
  setSprite(key, STATE_MOTION[key] || null);
  const info = BUBBLE[key];
  if (!info || (info.hidden && !text)) { setBubbleVisible(false); return; }
  bubble.className = info.cls;
  setBubbleVisible(true);
  titleEl.textContent = title || info.title;
  textEl.classList.remove("typing");
  textEl.textContent = text || info.text;
}

// ---------------- 页面导览 ----------------
/** 单句停留时长：够读完，又不至于让人等（含后续打字时间） */
function lineMs(line) {
  return Math.min(4200, Math.max(2200, 1500 + line.length * 110));
}

function typeText(text) {
  if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
  textEl.classList.remove("typing");
  textEl.textContent = text;
}

function clearGuide() {
  guideTimers.forEach(clearTimeout);
  guideTimers = [];
  clearInterval(typingTimer);
  typingTimer = null;
  guide = null;
  // 这里不碰气泡显隐/让位标记：endGuide() 紧接着会 void tick() → setState() 重画，
  // 由 setBubbleVisible() 统一决定气泡与 .compact。中途先动一次只会闪一下。
}

function endGuide() {
  if (!guide) return;
  clearGuide();
  setMotion(null);
  lastKey = null;             // 强制下一帧重画状态气泡
  void tick();
}

function playGuide(g) {
  clearGuide();
  const lines = Array.isArray(g.lines) ? g.lines.filter(Boolean) : [];
  if (!lines.length) return;
  guide = g;
  lastKey = null;
  setSprite(g.action || "idle", g.motion || "pop");

  bubble.className = "guide";
  setBubbleVisible(true);          // 导览气泡同样会占高度 → 面板让位（见 #root.compact 注释）
  titleEl.textContent = g.title || "这一页";
  stepsEl.innerHTML = lines.map(() => "<i></i>").join("");

  let at = 0;
  lines.forEach((line, i) => {
    guideTimers.push(setTimeout(() => {
      if (!guide) return;
      Array.from(stepsEl.children).forEach((el, k) => el.classList.toggle("on", k === i));
      typeText(line);
    }, at));
    at += lineMs(line);
  });
  guideTimers.push(setTimeout(endGuide, at + 1000));
}

// 主进程在切页时推送；变声运行中静默丢弃（不打断状态展示）
if (window.pet && window.pet.onGuide) {
  window.pet.onGuide((g) => {
    if (statusBusy || !g) return;
    playGuide(g);
  });
}
// 点气泡：导览中=跳过；后端离线=打开后端日志；否则无操作
bubble.addEventListener("click", () => {
  if (guide) { endGuide(); return; }
  if (backendOffline && window.pet && window.pet.showBackendLog) {
    window.pet.showBackendLog();
  }
});

// ---------------- 状态轮询 ----------------
function render(s) {
  if (!s.running) { lastText = ""; setState("idle"); return; }

  if (s.child_error || s.stage === "error") { setState("error"); return; }
  switch (s.stage) {
    case "warming":
      setState("build");
      return;
    case "asr":
      setState("think", "听懂啦…");   // 此刻 last_text 还是上一句，不展示
      return;
    case "tts":
      // ASR 完成进入合成：last_text 即本句识别结果，展示文字 = 「听懂了的确认」
      if (s.last_text) lastText = s.last_text;
      setState("think", lastText ? `「${lastText}」` : "正在合声…");
      return;
    case "capturing":
      // playing 阶段在子进程里只存在几毫秒（同步处理后立刻回到 capturing），
      // 「正在播出」的真实信号是播放队列积压 queued_s > 0
      if (s.queued_s > 0.05) {
        // 轮询可能错过短暂的 tts 阶段，此时用 last_text 兜底
        if (s.last_text && s.last_text !== lastText) lastText = s.last_text;
        setState("play", lastText ? `「${lastText}」` : "正在播…");
      } else {
        lastText = "";                          // 队列空了 = 播完，回到「我在听」
        setState("listen", "我在听 · 你继续说", "千问变声");
      }
      return;
    default:
      setState("build");   // init 等未知阶段
  }
}

function renderLive(l) {
  // 实时变声模式：基础「我在听」动画 + 实时字幕（转写子进程挂在 asr_* 字段）。
  // 标题固定写「RVC 实时」：气泡是唯一不悬停也能看到的地方，
  // 用户反馈「不知道现在用的是哪一种变身」，所以引擎名必须出现在这里。
  if (l.asr_running) {
    if (l.asr_stage === "transcribing") {
      setState("think", "听懂啦…", "RVC 实时");
    } else {
      setState("listen", l.asr_last_text ? `「${l.asr_last_text}」` : "变声中 · 我听着", "RVC 实时");
    }
  } else {
    lastText = "";
    setState("listen", "变声中 · 我听着", "RVC 实时");   // 转写子进程未启动：只挂身份牌，不影响变声
  }
}

// 预览模式（调试用）：pet.html?mock=1 自动轮播各状态，不依赖后端
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const MOCK_SEQ = [
  { state: "listen", text: "聆听中…" },
  { state: "think", text: "「你好呀」" },
  { state: "play", text: "「你好呀」" },
  { state: "idle", text: "" },
  { state: "build", text: "模型加载中…" },
  { state: "error", text: "" },
];
let mockIdx = 0;
if (MOCK) {
  // 调试模式下也能预览页面导览：pet.html?mock=1 时 6s 后自动演一遍「音色工坊」
  const step = () => {
    if (guide) return;
    const m = MOCK_SEQ[mockIdx % MOCK_SEQ.length];
    mockIdx += 1;
    setState(m.state, m.text);
  };
  step();
  setInterval(step, 2500);
  setTimeout(() => {
    playGuide({
      title: "音色工坊",
      lines: ["一切从这里开始。", "丢进视频，我自动切片质检。", "挑够半分钟干净人声。"],
      action: "build",
      motion: "pop",
      duration: 8000,
    });
  }, 6000);
}

async function tick() {
  if (MOCK) return;
  if (guide) return;              // 导览期间不打断
  let cascadeData = null, live = null;
  let anyOk = false;
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (r.ok) { cascadeData = await r.json(); anyOk = true; }
  } catch {}
  try {
    const r = await fetch(LIVE_API, { cache: "no-store" });
    if (r.ok) { live = await r.json(); anyOk = true; }
  } catch {}
  // —— 后端健康：两个状态接口全挂 = 后端失联。离线时切 error 精灵 + 气泡提示
  // （不刷屏：离线只提示一次，恢复在线时再提示一次「回来啦」）——
  const wasOffline = backendOffline;
  backendOffline = !anyOk;
  if (backendOffline) {
    // ⚠️ 离线期间必须**每帧**都 return，不能只 return「刚离线」那一帧。
    // 原来写成 `if (backendOffline && !wasOffline) { … return; }`，于是 1s 后的下一帧
    // 会继续往下走进状态机的 else 分支 → setState("idle") 把离线气泡藏掉、
    // 药丸改回「待机」，「后端离线」提示一闪而过（本次改版量测面板时发现的既有缺陷）。
    if (!wasOffline) {
      offlineHintedAt = Date.now();
      lastKey = null;                 // 强制重画气泡，让「离线」立刻上屏
      setSprite("error", "shake");
      bubble.className = "s-error";
      setBubbleVisible(true);
      titleEl.textContent = "后端离线";
      textEl.textContent = "后端没起来，先开主程序（点此看日志）";
      setPill("后端离线", "err");
      // 抖一下提醒，然后收成静态的 error 姿势 —— 后端长时间不恢复时不该一直晃
      setTimeout(() => { if (backendOffline && !guide) setMotion(null); }, 1800);
    }
    return;                           // 离线期间不进状态机，避免用空数据渲染「待机」
  }
  if (wasOffline) {
    // 后端恢复：给一句「回来啦」反馈，3s 后自然回到状态机
    offlineHintedAt = Date.now();
    setState("idle");
    bubble.className = "s-play";
    setBubbleVisible(true);
    titleEl.textContent = "后端在线";
    textEl.textContent = "回来啦，随时可以用～";
    setPill("在线", "play");
    setTimeout(() => { if (!backendOffline && !guide) { lastKey = null; void tick(); } }, 3000);
  }
  // 谁在跑：级联优先（两者互斥，真同时出现也只可能是切换的那一瞬间）
  runningEngine = (cascadeData && cascadeData.running) ? "qwen"
                : (live && live.live_running) ? "rvc" : null;
  statusBusy = Boolean(runningEngine);
  // 空闲计时：任何变声在跑就归零，否则记连续空闲起点（供「打盹」演出用）
  idleSince = statusBusy ? 0 : (idleSince || Date.now());
  // 引擎分段与「变声」按钮随真实状态走（面板隐藏时改了也不影响）。
  // ⚠️ 按钮文案只能写 #liveLabel，不能写 liveBtn.textContent —— 按钮里还有
  //    <span class="spin"> 与图标 <svg>，直接赋 textContent 会把它们整个抹掉。
  refreshEngineSeg();
  if (runningEngine === "qwen") {
    render(cascadeData);
    // 引擎名是「头条状态」，盖过 render() 内部 setState 写的「我在听」。
    // 必须放在 render 之后 —— setState 会重写药丸。
    setPill("千问变声中", "listen");
  } else if (runningEngine === "rvc") {
    renderLive(live);
    setPill("RVC 变声中", "listen");
  } else {
    lastText = "";
    setState("idle");   // 都没运行 / 后端没起：安静待机，不报错打扰
  }
  // 倾听细节：在听时偶尔抖一下耳朵（短暂打断 ear 动作，随后恢复）
  if (lastKey === "listen" && !guide && !earTwitching && Date.now() - lastEarTwitch > 8000) {
    earTwitching = true;
    lastEarTwitch = Date.now();
    setMotion("ear-twitch");
    setTimeout(() => {
      earTwitching = false;
      if (lastKey === "listen" && !guide) setMotion(STATE_MOTION.listen || "ear");
    }, 600);
  }
}

// ---------------- 手动拖拽 + 点击穿透 ----------------
// app-region: drag 与 setIgnoreMouseEvents 组合在透明窗上不可靠，改由 JS 主导：
// 悬停角色/气泡时关穿透，按下后由主进程按光标屏幕坐标挪窗口。
let dragging = false;
let movedFar = false;    // 本次按下是否拖出了死区（区分单击 vs 拖拽）
let downX = 0, downY = 0;

// ---------------- 快捷面板：悬停角色浮现 ----------------
const panel = document.getElementById("panel");
const sayEl = document.getElementById("say");
const sendBtn = document.getElementById("send");
const sendLabel = document.getElementById("sendLabel");
const liveBtn = document.getElementById("live");
const liveLabel = document.getElementById("liveLabel");
const engRvcBtn = document.getElementById("engRvc");
const engQwenBtn = document.getElementById("engQwen");
const voiceSel = document.getElementById("voiceSel");
const previewBtn = document.getElementById("preview");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const recentEl = document.getElementById("recent");
const VOICE_KEY = "pet_voice_id";
let panelTimer = null;
let panelOpen = false;       // 面板是否可见（Esc 收起、点击穿透判定都要用）
// 试听产物：声明点从「试听/发送」段前移到这里 —— refreshPanel() 会读它来决定主按钮文案，
// 而 refreshPanel 挂在 mouseenter 上，提前声明可彻底排除 TDZ 隐患。
let lastPreview = null;      // { wav, url, duration_s } 最近一次试听的合成产物
let previewAudio = null;

// ---------------- 实时变声引擎：RVC 实时 / 千问变声 ----------------
/**
 * 后端有两个**互斥**的实时变声引擎（互相 409：「两者抢 GPU 且都占 CABLE」）：
 *   rvc  —— 逐帧套音色，保留你的说话习惯，适合真人音色 / 低延迟
 *   qwen —— 先 ASR 识别成文字、再 TTS 合成换嗓，适合卡通 / 角色音色，慢一点
 * 所以面板上做成「选一个」的分段控件，而不是两个独立开关（后者会让人以为能同时开）。
 *
 * 用户原话：「这两个用户不确定到底用哪一种」「就没体现 rvc 的」「我感觉这个可以来回切换」。
 * 因此这里做三件事：① 选中项常驻高亮；② 真正在跑的那个亮呼吸点；③ 药丸与气泡都写出引擎名。
 */
const ENGINE_KEY = "pet_engine";
const ENGINES = {
  rvc:  { label: "RVC 实时", short: "RVC",  start: "/api/rvc/live/start", stop: "/api/rvc/live/stop" },
  qwen: { label: "千问变声", short: "千问", start: "/api/cascade/start",   stop: "/api/cascade/stop" },
};
const savedEngine = localStorage.getItem(ENGINE_KEY);
let engine = ENGINES[savedEngine] ? savedEngine : "rvc";   // 选中的引擎（持久化）
let runningEngine = null;   // 实际在跑的那个（都没跑=null）；由 tick() 每帧按两个状态接口刷新
let engineBusy = false;     // 启停进行中：防连点造成「停一半又启」的交叉状态

/** 刷新引擎分段的两个状态类，以及「变声」按钮的文案。 */
function refreshEngineSeg() {
  // ⚠️ 「选中」（engine）与「运行中」（runningEngine）必须分开表达：
  // 把「选中」当「已开启」会骗人 —— 用户完全可能在主界面开了 RVC，而桌宠上选的是千问。
  if (engRvcBtn) {
    engRvcBtn.classList.toggle("on", engine === "rvc");
    engRvcBtn.classList.toggle("running", runningEngine === "rvc");
  }
  if (engQwenBtn) {
    engQwenBtn.classList.toggle("on", engine === "qwen");
    engQwenBtn.classList.toggle("running", runningEngine === "qwen");
  }
  if (!liveLabel || !liveBtn) return;
  // 按钮文案把引擎名写进去 —— 原来只写「变声」，用户不知道点下去是哪一种。
  // 同时表达「点下去会发生什么」：正在跑本引擎→「停 X」，否则→「开 X」。
  const e = ENGINES[engine];
  const running = runningEngine === engine;
  liveLabel.textContent = (running ? "停 " : "开 ") + e.short;
  liveBtn.classList.toggle("live-on", running);
  liveBtn.title = running
    ? `${e.label} 运行中，点一下停止`
    : `启动${e.label}（麦克风实时换声；微信里把录音设备指向 CABLE Output 当麦克风）`;
}

function setEngine(next) {
  if (!ENGINES[next]) return;
  engine = next;
  try { localStorage.setItem(ENGINE_KEY, next); } catch {}
  refreshEngineSeg();
}

/**
 * 直连后端（不走主进程 IPC）。这是**设计内**的通道，不是绕过鉴权：
 * m2_server/server.py 的 _TokenMiddleware 对本机 127.0.0.1 直接放行，
 * _OriginGuardMiddleware + CORSMiddleware 也显式放行 file:// 页面（Origin: null）。
 * 走渲染进程的好处：桌宠的启停逻辑全部留在 pet.html 里，不必改 preload/main ——
 * 改主进程要重打 asar 才能生效，而 pet.html 是热替换就生效的。
 */
async function apiPost(path) {
  try {
    const r = await fetch("http://127.0.0.1:8000" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    let data = null;
    try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: String((e && e.message) || e) };
  }
}
function apiErr(r) {
  return (r.data && (r.data.detail || r.data.error)) || r.error || ("HTTP " + r.status);
}

/** 开关当前选中的引擎。两个互斥，所以启动前先把在跑的另一个停掉。 */
async function toggleLive() {
  if (engineBusy) return;
  const e = ENGINES[engine];
  engineBusy = true;
  setBusy(liveBtn, true);
  try {
    if (runningEngine === engine) {
      setStatus(`正在停止${e.label}…`, "");
      const r = await apiPost(e.stop);
      setStatus(r.ok ? `${e.label} 已停止` : `停止失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    } else {
      if (runningEngine) {
        // 后端对这种情况直接 409（「两者抢 GPU 且都占 CABLE」）。
        // 用户点的是另一个引擎，意图很明确，所以替他先停再开，而不是甩一句报错让他自己停。
        setStatus(`先停掉${ENGINES[runningEngine].label}，再切到${e.label}…`, "");
        const s = await apiPost(ENGINES[runningEngine].stop);
        if (!s.ok) { setStatus(`停不掉${ENGINES[runningEngine].label}：${apiErr(s)}`, "err"); return; }
      }
      setStatus(`正在启动${e.label}…模型就绪要一会儿`, "");
      const r = await apiPost(e.start);
      setStatus(r.ok ? `${e.label} 已开启` : `启动失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    }
  } finally {
    engineBusy = false;
    setBusy(liveBtn, false);
    void tick();       // 立刻回读真实状态，不等下一个 1s 轮询
  }
}

/**
 * 点分段里的另一个引擎。
 * 有引擎在跑 → 停掉它并开新的（用户已确认「自动停掉再开新的」）；
 * 都没在跑 → 只改选择、不自动启动（免得点错一下就占上 GPU 和 CABLE）。
 */
async function pickEngine(next) {
  if (next === engine) return;
  const wasRunning = runningEngine;
  setEngine(next);
  if (!wasRunning) {
    setStatus(`引擎已切到「${ENGINES[next].label}」，点「开 ${ENGINES[next].short}」启动`, "");
    return;
  }
  await toggleLive();
}

function showPanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = true;
  panel.style.display = "block";
  refreshPanel();   // 每次浮现刷新：音色下拉 + 最近发送 + 主按钮文案
}
function hidePanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = false;
  panel.style.display = "none";
}
function schedulePanelHide() {
  if (panelTimer) return;
  panelTimer = setTimeout(() => {
    panelTimer = null;
    panelOpen = false;
    panel.style.display = "none";
  }, 500);
}
petBox.addEventListener("mouseenter", showPanel);
petBox.addEventListener("mouseleave", schedulePanelHide);
panel.addEventListener("mouseenter", showPanel);
panel.addEventListener("mouseleave", schedulePanelHide);
// Esc 收起面板：面板占了大半屏，鼠标要移开 500ms 才自动收，键盘给一条快路
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && panelOpen) hidePanel();
});

// 音色下拉：/api/voices 里挑有参考音频的（没参考的 RVC 模型合不了 TTS）
async function loadVoices() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/voices", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const usable = (j.voices || []).filter((v) => v.has_reference);
    const saved = localStorage.getItem(VOICE_KEY) || "";
    const cur = voiceSel.value || saved;
    const opts = [new Option("主界面选中", "")];
    for (const v of usable) opts.push(new Option(v.display_name || v.id, v.id));
    voiceSel.innerHTML = "";
    opts.forEach((o) => voiceSel.add(o));
    voiceSel.value = usable.some((v) => v.id === cur) ? cur : "";
  } catch {}
}

/**
 * 相对时间。面板只有 204px 宽，chip 里塞「18:04 · 3.2s」既挤又难读；
 * 「刚刚 / 3 分钟前」一眼就知道是不是刚发的，精确时刻退到 tooltip 里。
 */
function relTime(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

// 最近发送：后端 /api/wechat/history，点一条重发
async function loadRecent() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const items = (j.items || []).slice(0, 5);
    recentEl.innerHTML = items.length
      ? items.map((it) => {
          const t = new Date(it.ts * 1000);
          const hm = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
          return `<span class="hitem" data-wav="${it.wav}" title="重发 ${it.wav}（${hm}，${it.duration_s}s）">${relTime(it.ts)} · ${it.duration_s}s</span>`;
        }).join("")
      : '<span class="hempty">还没发过语音</span>';
  } catch {}
}
recentEl.addEventListener("click", (e) => {
  const it = e.target.closest(".hitem");
  if (it && window.pet && window.pet.sendWav) window.pet.sendWav(it.dataset.wav);
});

function refreshPanel() { loadVoices(); loadRecent(); refreshSendLabel(); refreshEngineSeg(); }

// ---------------- 试听 / 发送 / 结果反馈 ----------------
// lastPreview / previewAudio 的声明已前移到「快捷面板」段的 DOM 引用处（排除 TDZ 隐患）。

/** 主按钮文案跟着「有没有待发的试听产物」走：只有试听→发送两步走时才叫「发送试听」。 */
function refreshSendLabel() {
  if (sendLabel) sendLabel.textContent = lastPreview ? "发送试听" : "合成并发送";
}

/** 忙态：禁用 + 把图标换成旋转圈（CSS: #panel button.busy）。
    「合成中」动辄十几秒，只把按钮变灰用户会以为卡死，转圈才看得见在动。 */
function setBusy(btn, on) {
  if (!btn) return;
  btn.disabled = !!on;
  btn.classList.toggle("busy", !!on);
}

/**
 * 状态行。cls ∈ ""(信息) | "ok" | "err"。
 *
 * ⚠️ 只要 text 非空就必须挂上 .show —— 早先的写法是
 * `className = cls ? "show " + cls : ""`，于是 `setStatus("合成中…")`（doPreview 的调用）
 * 把 className 清空，而 #status 只有 .show 才 display:flex，
 * 结果是「合成中…」这条提示从来没有真正显示过。
 */
function setStatus(text, cls) {
  statusText.textContent = text || "";
  statusEl.className = text ? ("show" + (cls ? " " + cls : "")) : "";
}

function doPreview() {
  const text = sayEl.value.trim();
  if (!text || !window.pet || !window.pet.previewText) return;
  const voiceId = voiceSel.value || "";
  if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);
  setStatus("合成中…");
  setBusy(previewBtn, true);
  setTimeout(() => setBusy(previewBtn, false), 60000);
  window.pet.previewText(text, voiceId);
}

async function doSendText() {
  const text = sayEl.value.trim();
  if (!window.pet) return;
  // 发前探活：连不上后端立即提示，不闷头转圈被误判成卡死
  let alive = false;
  try { const r = await fetch("http://127.0.0.1:8000/api/health", { cache: "no-store" }); alive = r.ok; } catch {}
  if (!alive) { setStatus("后端未连接，请先启动变声后端（8000）", "err"); return; }
  // 有试听产物就直接发它（试听→发送两步走），否则一步到位「合成并发送」
  if (lastPreview && window.pet.sendWav) {
    setStatus(`发送中… 自动发到微信，全程别动键鼠`, "ok");
    window.pet.sendWav(lastPreview.wav);
    lastPreview = null;
    refreshSendLabel();          // 待发产物已消费，主按钮立刻退回「合成并发送」
  } else {
    if (!text) return;
    const voiceId = voiceSel.value || "";
    if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);   // 记住上次选的音色
    setStatus("合成中… 完成后自动发到微信，全程别动键鼠", "ok");
    if (window.pet.sendText) { window.pet.sendText(text, voiceId); sayEl.value = ""; }
  }
  setBusy(sendBtn, true);
  setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);   // TTS+录音发送可能要十几秒
}
previewBtn.addEventListener("click", doPreview);
sendBtn.addEventListener("click", doSendText);
sayEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doSendText(); });
liveBtn.addEventListener("click", () => { void toggleLive(); });
// 引擎分段：点另一个 = 切过去（有引擎在跑就顺手换掉）。dataset.eng 与 ENGINES 的键一一对应。
[engRvcBtn, engQwenBtn].forEach((b) => {
  if (b) b.addEventListener("click", () => { void pickEngine(b.dataset.eng); });
});

// 主进程回传：合成产物 → 自动播放
if (window.pet && window.pet.onPreviewResult) {
  window.pet.onPreviewResult((r) => {
    setBusy(previewBtn, false);   // 结果已回，不必再等那个 60s 兜底计时器
    if (!r || !r.ok) { setStatus("合成失败：" + ((r && r.error) || "未知错误"), "err"); return; }
    lastPreview = { wav: r.wav, url: r.url, duration_s: r.duration_s };
    refreshSendLabel();           // 主按钮切到「发送试听」
    setStatus(`已合成 ${r.duration_s || "?"}s，试听中…满意就点「发送试听」`, "ok");
    try {
      if (previewAudio) previewAudio.pause();
      previewAudio = new Audio(r.url);
      previewAudio.onended = () => setStatus(lastPreview ? `试听完毕，点「发送试听」发出去` : "", "ok");
      void previewAudio.play();
    } catch {
      setStatus(`合成完成（${r.duration_s || "?"}s），但播放失败`, "err");
    }
  });
}

// 主进程回传：发送结果 → 面板状态行直接给结论
if (window.pet && window.pet.onSendResult) {
  window.pet.onSendResult((r) => {
    if (!r) return;
    if (r.ok) setStatus(`已发到微信 ✓（${r.duration_s || "?"}s）`, "ok");
    else setStatus("发送失败：" + (r.error || "未知错误"), "err");
    refreshPanel();
  });
}

function overInteractive(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return !!(el && (el.closest("#pet") || el.closest("#bubble") || el.closest("#panel")));
}

petBox.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;   // 右键留给上下文菜单
  dragging = true;
  movedFar = false;
  downX = e.screenX; downY = e.screenY;
  window.pet && window.pet.dragStart();
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (dragging) {
    // 6px 死区：没拖出死区不算拖拽，mouseup 时按「单击角色」处理
    if (!movedFar && Math.hypot(e.screenX - downX, e.screenY - downY) > 6) movedFar = true;
    if (movedFar) { window.pet && window.pet.dragMove(); }
    return;
  }
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  window.pet && window.pet.dragEnd();   // 主进程侧保存位置
  // 拖拽结束时光标可能已出窗（elementFromPoint 为 null）→ 恢复全穿透
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
  // 单击角色（没拖动）：不再自动发送语音（太容易误触）。
  // 想发最近合成 → 右键桌宠「发送微信语音（用最近合成）」，或悬停用面板。
});
document.documentElement.addEventListener("mouseleave", () => {
  if (!dragging) window.pet && window.pet.setIgnoreMouse(true);
});
window.pet && window.pet.setIgnoreMouse(true);   // 初始全穿透，悬停角色后恢复

// ---------------- 待机小剧场 + 打盹 ----------------
// 闲着的时候自言自语 + 随机来一段动作，让桌宠「活着」；
// 长时间没人理（2.5 分钟+）还会随机打瞌睡（zZZ…）。
// 只在真正空闲（无级联/实时变声、无导览、状态为 idle）时触发，点气泡可跳过。
const IDLE_SKITS = [
  { lines: ["想发语音？右键我或悬停用面板～"], action: "idle", motion: "wiggle" },
  { lines: ["悬停我可以打字发语音哦"], action: "idle", motion: "wave" },
  { lines: ["看好了——", "转身！"], action: "idle", motion: "flip" },
  { lines: ["Q弹Q弹的～"], action: "idle", motion: "bounce" },
  { lines: ["飘啊飘～"], action: "listen", motion: "float" },
  { lines: ["今天也要开心呀！"], action: "play", motion: "dance" },
  { lines: ["别摇啦，头都晕了…"], action: "error", motion: "shake" },
  { lines: ["Ctrl+Alt+V 随时启停变声"], action: "think", motion: "nod" },
];
const DOZE_SKIT = { lines: ["zZZ…"], action: "listen", motion: "sleepy" };
let nextSkitAt = Date.now() + 30000;   // 出现半分钟后开始第一次
let idleSince = 0;                     // 连续空闲起点（ms），非 idle 时归零
let lastEarTwitch = 0;                 // 上次耳朵抖动时间（倾听时的小细节）
let earTwitching = false;
setInterval(() => {
  if (guide || statusBusy || lastKey !== "idle" || backendOffline) return;   // 后端离线时不待机表演
  const now = Date.now();
  if (now < nextSkitAt) return;
  const dozy = idleSince && now - idleSince > 150000 && Math.random() < 0.5;   // 闲久了的打盹
  nextSkitAt = now + (dozy ? 90000 : 45000) + Math.random() * 45000;
  const s = dozy ? DOZE_SKIT : IDLE_SKITS[Math.floor(Math.random() * IDLE_SKITS.length)];
  playGuide({ title: dozy ? "打盹" : "闲聊", lines: s.lines, action: s.action, motion: s.motion, duration: dozy ? 9000 : 6000 });
}, 5000);

// 引擎分段的初始选中态（从 localStorage 恢复）。必须在 void tick() 之前 ——
// tick 会调 refreshEngineSeg()，但那时 runningEngine 还是 null，先渲染一次选中态。
setEngine(engine);
void tick();
setInterval(tick, 1000);
// 皮肤轮询：应用新皮肤后 5s 内热切换（无需重启桌宠）。
// MOCK 调试模式下不请求后端（保持离线自演）。
if (!MOCK) {
  loadSkin();
  setInterval(loadSkin, 5000);
}
</script>
</body>
</html>
