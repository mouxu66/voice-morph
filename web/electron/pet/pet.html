    mockIdx += 1;
    setState(m.state, m.text);
  };
  step();
  setInterval(step, 2500);
  setTimeout(() => {
    playGuide({
      title: "音色工坊",
      lines: ["一切从这里开始。", "丢进视频，我自动切片质检。", "挑够半分钟干净人声。"],
      action: "build",
      motion: "pop",
      duration: 8000,
    });
  }, 6000);
}

async function tick() {
  if (MOCK) return;
  if (guide) return;              // 导览期间不打断
  let cascadeData = null, live = null;
  let anyOk = false;
  if (CAP.live) {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (r.ok) { cascadeData = await r.json(); anyOk = true; }
    } catch {}
    try {
      const r = await fetch(LIVE_API, { cache: "no-store" });
      if (r.ok) { live = await r.json(); anyOk = true; }
    } catch {}
  } else {
    // ⚠️ 实时变声被关掉 → 上面两个接口**根本不存在**，绝不能据此判「后端离线」
    // （那会让桌宠在后端好好的时候永久显示「后端离线」）。改用 core.system 的
    // /api/health —— 核心能力不可关，它一定在。
    try {
      const r = await fetch(HEALTH_API, { cache: "no-store" });
      if (r.ok) anyOk = true;
    } catch {}
  }
  // —— 后端健康：两个状态接口全挂 = 后端失联。离线时切 error 精灵 + 气泡提示
  // （不刷屏：离线只提示一次，恢复在线时再提示一次「回来啦」）——
  const wasOffline = backendOffline;
  backendOffline = !anyOk;
  if (backendOffline) {
    // ⚠️ 离线期间必须**每帧**都 return，不能只 return「刚离线」那一帧。
    // 原来写成 `if (backendOffline && !wasOffline) { … return; }`，于是 1s 后的下一帧
    // 会继续往下走进状态机的 else 分支 → setState("idle") 把离线气泡藏掉、
    // 药丸改回「待机」，「后端离线」提示一闪而过（本次改版量测面板时发现的既有缺陷）。
    if (!wasOffline) {
      offlineHintedAt = Date.now();
      lastKey = null;                 // 强制重画气泡，让「离线」立刻上屏
      setSprite("error", "shake");
      bubble.className = "s-error";
      setBubbleVisible(true);
      titleEl.textContent = "后端离线";
      textEl.textContent = "后端没起来，先开主程序（点此看日志）";
      setPill("后端离线", "err", "后端没起来：先把主程序打开");
      refreshRemoteLatency(null);   // 离线时不能留着上次的推理耗时（看着像还在变声）
      // 预检条同理：后端都没了，预检不可能有结论。留着上次那句「微信已打开」
      // 会让用户以为这条链路的收尾（发送）是通的。
      setWechatNote("后端没起来 · 预检不可用", "bad");
      precheckAt = 0;               // 恢复在线时重新拉，不穿用离线前的时刻
      // 抖一下提醒，然后收成静态的 error 姿势 —— 后端长时间不恢复时不该一直晃
      setTimeout(() => { if (backendOffline && !guide) setMotion(null); }, 1800);
    }
    return;                           // 离线期间不进状态机，避免用空数据渲染「待机」
  }
  if (wasOffline) {
    // 后端恢复：给一句「回来啦」反馈，3s 后自然回到状态机
    offlineHintedAt = Date.now();
    setState("idle");
    bubble.className = "s-play";
    setBubbleVisible(true);
    titleEl.textContent = "后端在线";
    textEl.textContent = "回来啦，随时可以用～";
    setPill("在线", "play");
    void refreshWechatPrecheck(true);   // 恢复在线：预检也要重新看一次（微信可能被改了状态）
    setTimeout(() => { if (!backendOffline && !guide) { lastKey = null; void tick(); } }, 3000);
  }
  // 状态条随真实状态走（音色 + 推理耗时）。
  // ⚠ 耗时特别是要在这一层重算：离线那一帧必须把上次的数抹掉，否则后端挂了它还挂着「82ms」，
  //   看起来像变声还在跑。音色是本地信息（voiceSel），离线时照显。
  refreshRemoteVoice();
  refreshRemoteLatency(live);
  // 发送前预检：只在看着「按住说话」那一页时刷（它是那一页的东西，别人不看时
  // 每 5s 去枚举一次进程/窗口纯属浪费）。进页与刚发完那两次是 force 的，见 setTab / onMicState。
  if (panelOpen) void refreshWechatPrecheck(false);
  // 谁在跑：级联优先（两者互斥，真同时出现也只可能是切换的那一瞬间）
  runningEngine = (cascadeData && cascadeData.running) ? "qwen"
                : (live && live.live_running) ? "rvc" : null;
  statusBusy = Boolean(runningEngine);
  // 空闲计时：任何变声在跑就归零，否则记连续空闲起点（供「打盹」演出用）
  idleSince = statusBusy ? 0 : (idleSince || Date.now());
  // 引擎分段随真实状态走（面板隐藏时改了也不影响）。
  // 选中（.on）与运行中（.running，绿底呼吸）分开表达：把「选中」当「已开启」会骗人 ——
  // 用户完全可能在主界面开了 RVC，而桌宠上选的是千问。
  refreshEngineSeg();
  if (runningEngine === "qwen") {
    render(cascadeData);
    // 引擎名是「头条状态」，盖过 render() 内部 setState 写的「我在听」。
    // 必须放在 render 之后 —— setState 会重写药丸。
    setPill("千问变声中", "listen", "千问变声 正在变声 · 点一下停");
  } else if (runningEngine === "rvc") {
    renderLive(live);
    setPill("RVC 变声中", "listen", "RVC 实时 正在变声 · 点一下停");
  } else {
    lastText = "";
    setState("idle");   // 都没运行 / 后端没起：安静待机，不报错打扰
  }
  // 倾听细节：在听时偶尔抖一下耳朵（短暂打断 ear 动作，随后恢复）
  if (lastKey === "listen" && !guide && !earTwitching && Date.now() - lastEarTwitch > 8000) {
    earTwitching = true;
    lastEarTwitch = Date.now();
    setMotion("ear-twitch");
    setTimeout(() => {
      earTwitching = false;
      if (lastKey === "listen" && !guide) setMotion(STATE_MOTION.listen || "ear");
    }, 600);
  }
}

// ---------------- 实时变声引擎：RVC 实时 / 千问变声 ----------------
/**
 * 后端有两个**互斥**的实时变声引擎（互相 409：「两者抢 GPU 且都占 CABLE」）：
 *   rvc  —— 逐帧套音色，保留你的说话习惯，适合真人音色 / 低延迟
 *   qwen —— 先 ASR 识别成文字、再 TTS 合成换嗓，适合卡通 / 角色音色，慢一点
 * 所以面板上做成「选一个」的分段控件，而不是两个独立开关（后者会让人以为能同时开）。
 *
 * 用户原话：「这两个用户不确定到底用哪一种」「就没体现 rvc 的」「我感觉这个可以来回切换」。
 * 因此这里做三件事：① 选中项常驻高亮；② 真正在跑的那个亮呼吸点；③ 药丸与气泡都写出引擎名。
 */
const ENGINE_KEY = "pet_engine";
const ENGINES = {
  rvc:  { label: "RVC 实时", start: "/api/rvc/live/start", stop: "/api/rvc/live/stop" },
  qwen: { label: "千问变声", start: "/api/cascade/start",   stop: "/api/cascade/stop" },
};
const savedEngine = localStorage.getItem(ENGINE_KEY);
let engine = ENGINES[savedEngine] ? savedEngine : "rvc";   // 选中的引擎（持久化）
let runningEngine = null;   // 实际在跑的那个（都没跑=null）；由 tick() 每帧按两个状态接口刷新
let engineBusy = false;     // 启停进行中：防连点造成「停一半又启」的交叉状态

/** 刷新引擎分段的状态类（选中 .on / 运行中 .running）。
 *  2026-09-26 起启停就合在分段本身：没有独立的「开 RVC」按钮了。 */
function refreshEngineSeg() {
  if (engRvcBtn) {
    engRvcBtn.classList.toggle("on", engine === "rvc");
    engRvcBtn.classList.toggle("running", runningEngine === "rvc");
  }
  if (engQwenBtn) {
    engQwenBtn.classList.toggle("on", engine === "qwen");
    engQwenBtn.classList.toggle("running", runningEngine === "qwen");
  }
  // 「千问直出」只对千问引擎有意义（RVC 引擎下它描述的是一个不会发生的分支）。
  // 显示一个永远不起作用的勾选框比不显示更糟 —— 用户会以为勾上就能改变什么。
  const noRvc = document.getElementById("noRvcField");
  if (noRvc) noRvc.style.display = (!CAP.live || engine !== "qwen") ? "none" : "";
}

/** 启停进行中时分段的忙态：两颗按钮一起禁用（引擎互斥，中途谁都不能点）。 */
function setSegBusy(on) {
  [engRvcBtn, engQwenBtn].forEach((b) => { if (b) setBusy(b, on); });
}

function setEngine(next) {
  if (!ENGINES[next]) return;
  engine = next;
  try { localStorage.setItem(ENGINE_KEY, next); } catch {}
  refreshEngineSeg();
}

/**
 * 直连后端（不走主进程 IPC）。这是**设计内**的通道，不是绕过鉴权：
 * m2_server/server.py 的 _TokenMiddleware 对本机 127.0.0.1 直接放行，
 * _OriginGuardMiddleware + CORSMiddleware 也显式放行 file:// 页面（Origin: null）。
 * 走渲染进程的好处：桌宠的启停逻辑全部留在 pet.html 里，不必改 preload/main ——
 * 改主进程要重打 asar 才能生效，而 pet.html 是热替换就生效的。
 */
async function apiPost(path) {
  try {
    const r = await fetch("http://127.0.0.1:8000" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    let data = null;
    try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: String((e && e.message) || e) };
  }
}
function apiErr(r) {
  return (r.data && (r.data.detail || r.data.error)) || r.error || ("HTTP " + r.status);
}

/** 开关当前选中的引擎。两个互斥，所以启动前先把在跑的另一个停掉。 */
async function toggleLive() {
  if (engineBusy) return;
  const e = ENGINES[engine];
  engineBusy = true;
  setSegBusy(true);
  try {
    if (runningEngine === engine) {
      setStatus(`正在停止${e.label}…`, "");
      const r = await apiPost(e.stop);
      setStatus(r.ok ? `${e.label} 已停止` : `停止失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    } else {
      if (runningEngine) {
        // 后端对这种情况直接 409（「两者抢 GPU 且都占 CABLE」）。
        // 用户点的是另一个引擎，意图很明确，所以替他先停再开，而不是甩一句报错让他自己停。
        setStatus(`先停掉${ENGINES[runningEngine].label}，再切到${e.label}…`, "");
        const s = await apiPost(ENGINES[runningEngine].stop);
        if (!s.ok) { setStatus(`停不掉${ENGINES[runningEngine].label}：${apiErr(s)}`, "err"); return; }
      }
      setStatus(`正在启动${e.label}…模型就绪要一会儿`, "");
      const r = await apiPost(e.start);
      setStatus(r.ok ? `${e.label} 已开启` : `启动失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    }
  } finally {
    engineBusy = false;
    setSegBusy(false);
    void tick();       // 立刻回读真实状态，不等下一个 1s 轮询
  }
}

/**
 * 点分段里的某个引擎。
 *   · 点**没选中**的：切过去。有引擎在跑 → 停掉它并开新的（用户已确认「自动停掉再开新的」）；
 *     都没在跑 → 只改选择、不自动启动（免得点错一下就占上 GPU 和 CABLE）。
 *   · 点**已选中**的：启动 / 停止（2026-09-26 起这是唯一的启停入口 ——
 *     原来的「开 RVC」按钮与已选中项永远是同一个引擎，用户看着就是两个 RVC）。
 */
async function pickEngine(next) {
  if (!ENGINES[next]) return;
  if (next === engine) { await toggleLive(); return; }
  const wasRunning = runningEngine;
  setEngine(next);
  if (!wasRunning) {
    setStatus(`引擎已切到「${ENGINES[next].label}」，再点一下它启动`, "");
    return;
  }
  await toggleLive();
}

function showPanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = true;
  panel.style.display = "block";
  refreshPanel();   // 每次浮现刷新：音色下拉 + 最近发送 + 主按钮文案
}
function hidePanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = false;
  panel.style.display = "none";
}
function schedulePanelHide() {
  // 按住说话期间面板不能自己收：面板一 display:none，那颗按钮就没了 ——
  // 指针捕获被释放、秒数也看不到，而录音还在继续（用户只觉得“按住的东西凭空消失”）。
  if (micHolding()) return;
  if (panelTimer) return;
  panelTimer = setTimeout(() => {
    panelTimer = null;
    panelOpen = false;
    panel.style.display = "none";
  }, 500);
}
petBox.addEventListener("mouseenter", showPanel);
petBox.addEventListener("mouseleave", schedulePanelHide);
panel.addEventListener("mouseenter", showPanel);
panel.addEventListener("mouseleave", schedulePanelHide);
// Esc 收起面板：面板占了大半屏，鼠标要移开 500ms 才自动收，键盘给一条快路
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && panelOpen) hidePanel();
});

/**
 * 音色下拉。`/api/voices` 合并了两个来源（音色库档案 + RVC 实验目录），这里挑出**真能用**的：
 *   · 有参考音（has_reference）→ 能当 TTS 的语气参考，也能被 RVC 换成它自己；
 *   · 没参考音但有可推理权重（pth_exists，市场装的大多是这种）→ **仍然可选**：
 *     `send_text` / `preview_text` 会借一段别的参考音做语气，末尾再由 RVC 换成它
 *     （音色由 RVC 决定），所以选得中、也试听得成；
 *   · 两者都没有（只有语料、还没训练）→ 不列，列出来只会点一次错一次。
 *
 * 2026-09-22 之前这里只列 `has_reference` 的音色，依据是"没参考的 RVC 模型合不了 TTS"。
 * 局部结论没错，但把整条路堵死了：用户在「音色市场」装的音色一个都选不到，面板里永远
 * 只剩自训的那两个 —— 用户看到的就是"只能选两个音色"。现在按"这个音色能不能用"
 * 而不是"它有没有参考音"来筛，后端 `_tts_ref_for` 补齐了缺的那半段。
 */
async function loadVoices() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/voices", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    // 主界面当前选中的音色 id（后端 /api/voices 的 selected 字段）：
    // 下拉的默认项是「主界面选中」（value 空串），不查这个字段就不知道那是谁，
    // 状态条上的「当前音色」只能写成一句没用的「主界面选中」。
    voiceSelectedId = typeof j.selected === "string" ? j.selected : "";
    const usable = (j.voices || []).filter((v) => v.has_reference || v.pth_exists);
    const saved = localStorage.getItem(VOICE_KEY) || "";
    const cur = voiceSel.value || saved;
    const opts = [new Option("主界面选中", "")];
    for (const v of usable) {
      // 原生 <option> 渲染不了彩色徽标，沿用主界面 voiceLabel 的约定：名字 +（来源）
      const tag = v.source === "market" ? "市场" : "自训";
      opts.push(new Option(`${v.display_name || v.id}（${tag}）`, v.id));
    }
    voiceSel.innerHTML = "";
    opts.forEach((o) => voiceSel.add(o));
    voiceSel.value = usable.some((v) => v.id === cur) ? cur : "";
  } catch {}
  syncVoiceGates();   // 下拉换了一批 → 试听按钮的可用性跟着重算
}

/**
 * 「试听」的可用性（现已**不需要禁用任何音色**，这里只负责把当前音色写进 tooltip）。
 *
 * 以前的版本会禁用"没参考音的音色"（市场装的实时变声模型），因为试听只走 `/api/tts`，
 * 而那条链要求音色自带参考音，否则直接 404。
 * 现在试听走 `/api/wechat/preview_text`：借一段参考音做语气 → RVC 换成目标音色，
 * 且后端在三段降级里会退回固定样板句（见 `preview_text` 的 docstring），
 * 所以**下拉里列出的每个音色都能试听** —— 能被列出的前提就是它 has_reference ∨ pth_exists。
 */
function syncVoiceGates() {
  const named = optionTextById(voiceSel.value) ||
    ((voiceSel.options || [])[voiceSel.selectedIndex] || {}).text || "";
  const id = voiceSel.value || "";
  previewBtn.title = id
    ? `试听「${named}」：用你输入的文字合成，末尾过 RVC 换成这个音色（只播放，不发送）`
    : "试听（默认=主界面当前选中）：用你输入的文字合成，末尾过 RVC（只播放，不发送）";
  voiceSel.title = "合成用的音色（默认=主界面当前选中）";
  refreshRemoteVoice();
}

// ---------------- 状态条（#phead）：常驻遥控器的仪表盘 ----------------
// 三件套：药丸(pillEl，可点的变声开关) / 音色(#rmVoice) / 推理耗时(#rmLat)。
// 它们占的是原来「品牌标 + 标题」那一行 —— 面板纵向预算只剩 11px，加行就得砍功能（见 CSS）。

/** /api/voices 的 selected：主界面当前选中的音色 id（下拉 value 为空时用它反查名字）。 */
let voiceSelectedId = "";

/**
 * 状态条·音色 chip。显示的是**面板接下来真的会用的那个音色**：
 *   · 下拉选了具体音色 → 用它；
 *   · 下拉是「主界面选中」（value 空）= 后端 `selected_voice()` 说了算 → 用 `selected` 反查真名。
 * 为什么不用文本里的「（自训/市场）」尾巴：chip 只有 ~50px，尾巴一上就只剩省略号。
 * 查不到（旧后端 / 接口挂了）时退回「主界面选中」，**不编名字**。
 */
/**
 * 下拉里某个 value 对应的显示文本（找不到返回空串）。
 * 用下标循环而不是 for…of：HTMLOptionsCollection 在老引擎里不可迭代，
 * 而测试用的 DOM 桩给的是普通数组 —— 两种都得能跑。
 */
function optionTextById(id) {
  const opts = voiceSel && voiceSel.options;
  if (!opts || !id) return "";
  for (let i = 0; i < opts.length; i++) {
    if (opts[i] && String(opts[i].value) === String(id)) return opts[i].text || "";
  }
  return "";
}

function refreshRemoteVoice() {
  if (!rmVoiceEl) return;
  const id = voiceSel.value || "";
  const want = id || voiceSelectedId;
  let name = optionTextById(want);
  // 选中的音色不在下拉里（例如已删除、或只有权重没参考音被筛掉）时，id 本身也比空着强
  if (!name && id) name = id;
  if (!name && voiceSelectedId) name = voiceSelectedId;
  name = name.replace(/（(自训|市场)）$/, "").trim();
  rmVoiceEl.textContent = name || "主界面选中";
  rmVoiceEl.title = (id ? "按住说话/合成用这个音色：" : "用主界面选中的音色：")
    + (name || "还没选，去主界面挑一个");
}

/**
 * 状态条·推理耗时 chip。
 *
 * ★ 只在实时变声**正在跑**时显示：后端是从实时日志尾部取「推理耗时」的，变声停了以后
 *   那个数还留在日志里，照直报出来会让人以为现在也在跑（本机日志 4279 行就是这么来的）。
 *
 * ⚠️ 口径必须写清楚（tooltip）：这是**单块推理耗时**，不是端到端延迟 ——
 *   端到端还要加上分块缓冲（`block_ms`，由性能档位决定）与音频驱动缓冲。
 *   它和 README 里那个 p50 对不上不是谁错了，是两个数量的不是同一件事。
 */
function refreshRemoteLatency(live) {
  if (!rmLatEl) return;
  const ms = live && live.live_running ? Number(live.infer_ms) || 0 : 0;
  // 整行一起显隐（#latRow）：没在变声时抽屉里那一行只有「耗时 —」，
  // 是一行噪音，也最像「一个没填完的设置项」。
  if (latRowEl) latRowEl.hidden = !(ms > 0);
  rmLatEl.hidden = !(ms > 0);
  rmLatEl.textContent = ms > 0 ? Math.round(ms) + "ms" : "";
  if (!(ms > 0)) { rmLatEl.title = "变声开启后显示实测推理耗时"; return; }
  const p95 = Number(live.infer_ms_p95) || 0;
  const block = Number(live.block_ms) || 0;
  rmLatEl.title = `实测单块推理 ${Math.round(ms)}ms`
    + (p95 ? `（p95 ${Math.round(p95)}ms，最近 ${live.infer_samples || "?"} 块）` : "")
    + (block ? `；端到端还要加每块 ${block}ms 的缓冲与音频驱动缓冲` : "");
}

/**
 * 相对时间。面板只有 204px 宽，chip 里塞「18:04 · 3.2s」既挤又难读；
 * 「刚刚 / 3 分钟前」一眼就知道是不是刚发的，精确时刻退到 tooltip 里。
 */
function relTime(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

// 最近发送：后端 /api/wechat/history，点一条重发
async function loadRecent() {
  // 微信能力被关掉 → wechat_voice 路由不挂载，这个接口不存在。
  if (!CAP.wechat) return;
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const items = (j.items || []).slice(0, 5);
    recentEl.innerHTML = items.length
      ? items.map((it) => {
          const t = new Date(it.ts * 1000);
          const hm = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
          // 产物是**会话级**的（退出即删），历史里多数条目的文件早已不在。
          // ★ 不可用就**故意不带 `data-wav`**（点击派发只认它，见下面的监听器）：
          //   摆一个点了没反应的胶囊，用户只会以为桌宠卡了。
          //   `available` 缺省按不可用处理（旧后端不返回该字段时同理）。
          return it.available
            ? `<span class="hitem" data-wav="${esc(it.wav)}" title="重发 ${esc(it.wav)}（${hm}，${it.duration_s}s）">${relTime(it.ts)} · ${it.duration_s}s</span>`
            : `<span class="hitem hgone" title="${esc(it.wav)}（${hm}，${it.duration_s}s）—— 原文件已随会话清理，不能重发">${relTime(it.ts)} · 已清理</span>`;
        }).join("")
      : '<span class="hempty">还没发过语音</span>';
  } catch {}
}
recentEl.addEventListener("click", (e) => {
  const it = e.target.closest(".hitem");
  // ★ 只认带 `data-wav` 的：不可用条目故意不带它（见 loadRecent）。
  //   这道判断同时挡住 `sendWav(undefined)` —— 那会变成一次莫名其妙的失败。
  const wav = it && it.dataset.wav;
  if (wav && window.pet && window.pet.sendWav) window.pet.sendWav(wav);
});

// ---------------- 功能页切换 + 音效声板（sound.fx-board）----------------
/**
 * 「音效」页直连后端 /api/soundboard/*（与 loadRecent 同款通道，主进程零改动）：
 *   GET  /catalog  样本清单（图标/名字/时长）
 *   POST /play     立即播放（one-shot，请求返回时声音已经出发）
 *   POST /stop     停掉正在播的
 *   POST /warm     预热合成器（无超时握手 —— 必须 fire-and-forget，别 await 它）
 *   POST /premix   把勾选的音效**离线**混进一条合成产物，产出新 wav
 *
 * 混进语音的底（premix 的 wav 参数）：面板上刚试听的产物；没有就传 null ——
 * 后端自己取「最近一条 TTS 产物」（与发送链路同口径），两样都没有时 404，
 * 状态行引导用户先去「说话」页合成一条。产物 sfxmix_*.wav 直接 sendWav 发送。
 */
const SFX_BASE = "http://127.0.0.1:8000/api/soundboard";
// 曲库发现（sound.fx-board 的 music_api）：榜单只取元数据，音频仍走 yt-dlp 外部桥。
const MUSIC_BASE = "http://127.0.0.1:8000/api/music";
// chip 上的混入位置标记（一个汉字）：点击 chip 主体按 叠→头→尾 循环
const PICK_LABEL = { layer: "叠", prepend: "头", append: "尾" };

// ⚠️ 2026-10-23 删掉的三样东西（都在这一段的旧版里），别再捡回来：
//   · `activeTab` / `TAB_KEY` / `setTab()` —— 四个功能页签（说话/按住/音效/放歌）
//     「记住上次的页」这类需求，本质是页签本身不该存在；
//   · `sfxMode` / `FX_MODE_KEY` / `FX_MODES` —— 「实时播放 / 混进语音」模式分段。
//     一个动作被拆成「先选模式、再点格子」两步，而两种用法本来可以同时存在；
//   · 说话页的「插音效」胶囊条（`renderSayFx` / `insertSayMark`）。
//     `[名字]` 标记语法后端仍然支持（老历史、手打依旧生效），但面板里不再开**第二种**
//     加音效的入口 —— 两条路并存正是「按钮太多」的来源（用户 2026-10-23 反馈）。
let sfxItems = [];            // 声板样本（/catalog 的 items）
let sfxPicks = [];            // 这条语音里的音效：{ id, name, icon, mode, at_s }
let sfxPlayingId = null;      // 正在响的格子（乐观高亮用，超时后自动熄灭）
let sfxLoadedAt = 0;          // 上次拉 catalog 的时间（60s 节流，别每次悬停都打）
let sfxWarmDone = false;      // /warm 只发一次
// 「音效走虚拟声卡、本机扬声器不出声」那句话每次点格子都刷会把状态行占满，
// 而它是个一次性知识 → 首次实时播放时报一次就够（用户反馈"我都听不到"，2026-10-01）。
let sfxLiveHintShown = false;

/** innerHTML 转义：样本名/图标来自后端与用户导入，不能裸拼。 */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// ---------------- 面板的分层：声音托盘 / 更多抽屉 ----------------
// 两种「需要时才长出来」的区域，**互斥**（同时开会把面板顶到 300px 上限）：
//   tray   —— 声音：音效 + 放歌。共同点是「此刻送进虚拟声卡」，与主按钮的发送不是一条链路。
//   drawer —— 设置：音色 / 引擎 / 最近发送。进来的频率远低于发送，不该常驻。
// 为什么不分得更细（比如音效一个入口、放歌又一个）：那又会退化成页签 ——
// 用户得先想「这个声音属于哪一类」，而他要的只是「放个声」。
let panelLayer = "";           // "" | "tray" | "drawer" | "songs" | "radar"

/** 切换分层。next 为 "" 时全部收起。 */
function setLayer(next) {
  panelLayer = (next === "tray" || next === "drawer" || next === "songs" || next === "radar") ? next : "";
  if (trayEl) trayEl.hidden = panelLayer !== "tray";
  if (drawerEl) drawerEl.hidden = panelLayer !== "drawer";
  if (songLayerEl) songLayerEl.hidden = panelLayer !== "songs";
  if (radarLayerEl) radarLayerEl.hidden = panelLayer !== "radar";
  if (trayRowEl) {
    // 抽屉里的「声音」行：托盘从抽屉进去，所以现在只有「当前在不在这层」的状态色，
    // 没有 aria-expanded —— 它不是一个展开器，是一次跳转。
    trayRowEl.classList.toggle("on", panelLayer === "tray");
    if (trayRowLabelEl && panelLayer === "tray") trayRowLabelEl.textContent = "‹ 音效 · 放歌";
    else if (trayRowLabelEl && !trayRowLabelEl.textContent.startsWith("正在放")) {
      trayRowLabelEl.textContent = "音效 · 放歌";
    }
  }
  if (moreBtn) {
    moreBtn.classList.toggle("on", panelLayer === "drawer");
    moreBtn.setAttribute("aria-expanded", panelLayer === "drawer" ? "true" : "false");
  }
  // 分层打开时收起「属于别处」的行（见 CSS #panel.has-drawer / #panel.has-tray）：
  // 抽屉收起手势行与音效片，托盘收起手势行 —— 都是为了让当前分层在 300px 里站得下。
  if (panel) panel.classList.toggle("has-drawer", panelLayer === "drawer");
  if (panel) panel.classList.toggle("has-tray", panelLayer === "tray");
  if (panel) panel.classList.toggle("has-songs", panelLayer === "songs");
  if (panel) panel.classList.toggle("has-radar", panelLayer === "radar");
  // 分层打开时气泡让位（理由见 applyBubble）：82px 的气泡与 115px 的托盘不可能同时站下。
  if (rootEl) rootEl.classList.toggle("layer-open", !!panelLayer);
  applyBubble();
  // 打开托盘就强制刷新两批清单：音效是用户刚在声板里加的，歌是刚导入/翻唱的。
  // （不进托盘就不拉 —— 失败会把提示写进共用状态行，还可能把刚发完微信的结果顶掉。）
  if (panelLayer === "tray") { void loadSfx(true); void loadBgm(true); }
  if (panelLayer === "songs") {
    // 榜单有缓存就不重复打（后端另有 5 分钟缓存）；没有才拉。
    if (!songItems.length) void loadSongChart(false);
    // 打开即可输入 —— 这一层最常见的动作是「我脑子里有一首歌名」。
    queueMicrotask(() => { if (songQEl) songQEl.focus(); });
  }
  // 雷达层：打开立刻抓一帧并启动快轮询，关掉换回慢轮询（只养入口上的小绿点）。
  if (panelLayer === "radar") void radarTick(true);
  radarSetPolling();
  refreshFire();
  // 进任何一层都重排一次建议区：分层打开后可用空间变了（CSS 的 has-* 会收起别处的行），
  // 但那三条推荐仍然要跟着最新上下文走（比如刚点开抽屉换了引擎）。
  refreshRecs();
}

/** 拉声板清单并渲染。force=false 时 60s 内不重复拉（refreshPanel 每次悬停都跑）。 */
async function loadSfx(force) {
  // 能力关了：整个声板不拉，说话页那排胶囊也随之不渲染 —— renderSayFx 自带
  // `!CAP.fx → innerHTML=""` 的清空判据，所以这里不必再单独刷一次。
  // ⚠️ 这一行必须保持**逐字** `if (!CAP.fx) return;`：petCapabilityGate.test.ts
  // 拿它当"门控真的接到调用点上"的锚点（2026-10-01 曾因改成块语句把它弄红）。
  if (!CAP.fx) return;
  const now = Date.now();
  if (!force && now - sfxLoadedAt < 60000) return;
  sfxLoadedAt = now;
  try {
    const r = await fetch(SFX_BASE + "/catalog", { cache: "no-store" });
    if (!r.ok) {
      if (fxEmptyEl) fxEmptyEl.textContent = r.status === 404
        ? "声板插件没开：主界面 → 桌面 → 插件里打开「音效声板」"
        : "声板拉不到（HTTP " + r.status + "）";
      renderFxGrid();
      return;
    }
    const j = await r.json();
    sfxItems = (j.items || []).filter((it) => it && it.id);
    if (fxEmptyEl) {
      fxEmptyEl.textContent = sfxItems.length
        ? ""
        : "声板还是空的：主界面 → 离线变声 → 声板 里导几个音效";
    }
    renderFxGrid();
    // 预热只做一次（无超时握手，必须 fire-and-forget；失败无所谓，首次播放慢一点而已）
    if (sfxItems.length && !sfxWarmDone) {
      sfxWarmDone = true;
      void fetch(SFX_BASE + "/warm", { method: "POST" }).catch(() => {});
    }
  } catch {
    if (fxEmptyEl) fxEmptyEl.textContent = "后端没连上，声板不可用";
    renderFxGrid();
  }
}

/** 渲染音效网格。
 *  一个格子两个动作（仿 Spotify：点行播放、点 + 加进歌单）：
 *    · 点格子主体 → 现场播（one-shot 进虚拟声卡，微信那边听得到，本机不外放）
 *    · 点右上角 ＋ → 加进**这条语音**（草稿区下面长出音效片，发送时混进去）
 *  改版前这里必须先选「实时播放 / 混进语音」再点格子 —— 一个动作被拆成两步预判，
 *  而两种用法本来可以同时存在（正放着的那一格也完全可以被加进语音）。
 *  ＋ 用 <span role="button"> 而不是嵌套 <button>：HTML 不允许 button 套 button。 */
function renderFxGrid() {
  if (!fxGridEl) return;
  fxGridEl.innerHTML = sfxItems.map((it) => {
    const playing = sfxPlayingId === it.id ? " on" : "";
    const picked = sfxPicks.some((p) => p.id === it.id) ? " pick" : "";
    const dur = it.duration_s ? "（" + it.duration_s + "s）" : "";
    return `<button type="button" class="fxc${playing}${picked}" data-id="${esc(it.id)}"
      title="${esc(it.name)}${dur}：点这里现场播（进虚拟声卡，本机不响）；点右上角 ＋ 加进这条语音">
      <span class="fe">${esc(it.icon || "🎵")}</span><span class="fn">${esc(it.name)}</span><span class="fadd" role="button" aria-label="加进这条语音">${picked ? "✓" : "＋"}</span>
    </button>`;
  }).join("");
}

/** 草稿区的音效片：点主体轮换混入位置（叠→头→尾），点 × 移出。 */
function renderFxPicks() {
  if (!fxPicksEl) return;
  fxPicksEl.innerHTML = sfxPicks.map((p, i) => {
    return `<span class="fxchip" data-idx="${i}" title="点一下换混入位置（叠→头→尾），× 移出这条语音">
      ${esc(p.icon || "🎵")} ${esc(p.name)} <span class="fm">${PICK_LABEL[p.mode] || "叠"}</span><span class="fxrm" title="移出">×</span>
    </span>`;
  }).join("");
}

/** 实时播放：乐观高亮 + one-shot /play。再点同一个格子 = 停。 */
async function sfxPlay(it) {
  if (sfxPlayingId === it.id) {
    sfxPlayingId = null;
    renderFxGrid();
    void fetch(SFX_BASE + "/stop", { method: "POST" }).catch(() => {});
    return;
  }
  sfxPlayingId = it.id;
  renderFxGrid();
  try {
    const r = await fetch(SFX_BASE + "/play", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: it.id }),
    });
    if (!r.ok) setStatus("播放失败：HTTP " + r.status, "err");
    // 用户报障"加了音效我自己听不到"（2026-10-01）：音效只写进虚拟声卡（CABLE），
    // 本机扬声器**不出声**，要靠微信那边正在录音/或开「自我监听」才听得到。
    // 一次性说清（每次点都刷会把状态行占满），其余时候靠格子高亮给"已响"的反馈。
    else if (!sfxLiveHintShown) {
      sfxLiveHintShown = true;
      setStatus("已播：音效进虚拟声卡，微信那边听得到；本机不外放（想自己听请开「自我监听」）", "");
    }
  } catch {
    setStatus("后端没连上，播放失败", "err");
  }
  // 乐观高亮：duration_s 是后端给的实长；下限 300ms 防极短样本闪一下就灭
  const dur = Math.max(300, (it.duration_s || 0) * 1000);
  setTimeout(() => {
    if (sfxPlayingId === it.id) { sfxPlayingId = null; renderFxGrid(); }
  }, dur);
}

/** 加进这条语音 / 移出：已加 → 移出；没加 → 入队（混入位置默认「叠」，可在 chip 上轮换）。 */
function togglePick(it) {
  const i = sfxPicks.findIndex((p) => p.id === it.id);
  if (i >= 0) sfxPicks.splice(i, 1);
  else sfxPicks.push({ id: it.id, name: it.name, icon: it.icon, mode: "layer", at_s: 0 });
  renderFxGrid();
  renderFxPicks();
  refreshFire();
}

// 事件委托：格子/chip 都是 innerHTML 批量生成的，监听器挂容器上。
// ⚠️ `.fadd` 的判断必须在 `.fxc` 之前：它是格子内部的子元素，
//    先判断格子会把「点 ＋」吞成「点格子播一遍」（用户只想加进语音，却听了一耳朵）。
if (fxGridEl) fxGridEl.addEventListener("click", (e) => {
  const cell = e.target.closest(".fxc");
  if (!cell) return;
  const it = sfxItems.find((x) => x.id === cell.dataset.id);
  if (!it) return;
  if (e.target.closest(".fadd")) togglePick(it);
  else void sfxPlay(it);
});
if (fxPicksEl) fxPicksEl.addEventListener("click", (e) => {
  const chip = e.target.closest(".fxchip");
  if (!chip) return;
  const i = Number(chip.dataset.idx);
  if (!(i >= 0 && i < sfxPicks.length)) return;
  if (e.target.closest(".fxrm")) sfxPicks.splice(i, 1);
  else {
    const p = sfxPicks[i];
    p.mode = p.mode === "layer" ? "prepend" : p.mode === "prepend" ? "append" : "layer";
  }
  renderFxGrid();
  renderFxPicks();
  refreshFire();
});
// 三个入口：托盘（现在只从抽屉的「声音」行进）/ ⋯ 更多抽屉 / 状态条音色名。互斥由 setLayer 保证。
if (trayRowEl) {
  const openTray = () => setLayer("tray");
  trayRowEl.addEventListener("click", openTray);
  // 与 .drow[role=button] 的既有约定一致（见 radarRow）：键盘 Enter / 空格也能进
  trayRowEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTray(); }
  });
}
if (moreBtn) moreBtn.addEventListener("click", () => {
  setLayer(panelLayer === "drawer" ? "" : "drawer");
});
// 点状态条上的音色名 → 直接开抽屉（用户意图就是「换一个」）
if (voiceBtn) voiceBtn.addEventListener("click", () => setLayer("drawer"));

// ---------------- 放歌页（sound.fx-board 的「垫底层」）----------------
/**
 * `POST /bgm/start` 往 CABLE 垫一层长歌，`/bgm/stop` 停，`/bgm/gain` 实时调音量。
 * 三条不变量（都是踩过的坑，改之前先读完）：
 *
 *   1. **不能用 `/play` 放歌**：它是抢占式 one-shot，下一格音效会把歌掐断 ——
 *      那正是 board_worker.py 头注释里钉死的故障场景。长播放只走 /bgm/start、/bgm/stop。
 *   2. **`loop=true` 是刻意的**：`loop=false` 且播完时 worker **不会发任何消息**
 *      （协议不变量：stdout 绝不发未经请求的行），面板收不到"放完了"。要非循环
 *      兜底就得自己按 duration_s 倒计时，误差一路累积到「按钮亮着但没声音」。
 *      面板只有一颗按钮（放 / 停），所以：短了就循环，想停就按停。
 *   3. **播放中锁住选歌框**：垫层只有一层（后端 `_bgm_stop_stream()` 也是先停旧再起新），
 *      若选中项与正在放的那首不一致，「停」就变成猜谜。换歌 = 停 → 选 → 放，
 *      且按钮状态以 `/bgm/start` 返回的 `id` 为准，不乐观点亮。
 */
const BGM_KEY = "pet_bgm_name";
let bgmSongs = [];        // /bgm/recent 的 items
let bgmSelName = "";      // 当前选中的文件裸名（select 的 value）
let bgmPlayingId = null;  // 正在放的 id（= 文件名去扩展名，后端返回的就是它）
let bgmGainV = 0.3;       // 与后端 BGM_DEFAULT_GAIN 同值（≈ -10dB，压在人声下面）
let bgmLoadedAt = 0;
let bgmBusy = false;
let bgmGainTimer = null;
let bgmNote = "";         // 拉歌单失败的说明 —— 写在**页内**提示行，不抢共用状态行
// 本次会话从搜歌层取回的歌。后端产物在 session 目录（退出即删），所以
// /bgm/recent 永远不会列出它 —— 由这里把它**补进**下拉，才能在放歌卡里继续选/停。
let bgmFetched = null;

/** 秒 → `m:ss`（204px 里多一个字符都可能在 select 尾部变成省略号）。 */
function fmtDur(s) {
  const t = Math.max(0, Math.round(Number(s) || 0));
  return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
}

/** 默认选哪首：上次放过的 > 后端记的 last > 列表第一首。 */
function pickBgmName(items, last) {
  let saved = "";
  try { saved = localStorage.getItem(BGM_KEY) || ""; } catch {}
  for (const name of [saved, last]) {
    if (name && items.some((it) => it.name === name)) return name;
  }
  return items.length ? items[0].name : "";
}

/** 把歌单填进下拉。没有歌时**说清楚缺什么**，而不是一个空下拉（用户无从下手）。 */
function renderBgmOptions() {
  if (!bgmSelEl) return;
  if (!bgmSongs.length) {
    // 空态必须自己说清「怎么办」：那行常驻说明（#bgmHint）已经删了，
    // option 是这里唯一还能写字的地方。完整的路径在 title 里（见 renderBgm 末尾）。
    bgmSelEl.innerHTML = '<option value="">' + esc(bgmNote || "还没有歌 · 悬停看路径") + "</option>";
    return;
  }
  bgmSelEl.innerHTML = bgmSongs.map((it) => {
    // 搜歌层取回的歌有显示名（歌名），媒体库里的只有文件名 —— 前者优先。
    const label = (it.title || it.name.replace(/\.[^.]+$/, ""))
      + (it.duration_s ? " · " + fmtDur(it.duration_s) : "");
    return '<option value="' + esc(it.name) + '"' + (it.name === bgmSelName ? " selected" : "") + ">"
      + esc(label) + "</option>";
  }).join("");
  if (!bgmSelName) bgmSelName = bgmSongs[0].name;
}

/** 按钮/角标/滑块的单一镜像点 —— 任何状态变化后只调它。 */
function renderBgm() {
  const song = bgmSongs.find((it) => it.name === bgmSelName) || null;
  const playing = !!bgmPlayingId;
  if (bgmBtnEl) {
    bgmBtnEl.disabled = !song || bgmBusy;
    bgmBtnEl.classList.toggle("on", playing);
    bgmBtnEl.title = playing
      ? "停止放歌（歌还在放时点它就是停；本机扬声器不出声是正常的）"
      : "放歌：把歌实时垫进虚拟声卡，微信那边听得到；本机扬声器不出声（想自己听请开「自我监听」）。歌比说话短时循环补满";
  }
  if (bgmIcEl) bgmIcEl.textContent = playing ? "■" : "▶";
  if (bgmLabelEl) bgmLabelEl.textContent = playing ? "停止" : "放歌";
  if (bgmCardEl) bgmCardEl.classList.toggle("on", playing);
  // ♪ 上的「正在放」小点已随 2026-10-23 二次重构消失（♪ 按钮并入抽屉的「声音」行）。
  // 现在由抽屉行尾的文案 + 角色身上的 #bgmBadge 两处表达「正在放什么」。
  if (trayRowLabelEl) {
    const t = playing && song ? (song.title || song.name.replace(/\.[^.]+$/, "")) : "";
    trayRowLabelEl.textContent = t ? "正在放 " + t : "音效 · 放歌";
    trayRowLabelEl.title = t || "";
  }
  // 建议区里的「停止放歌」要跟着起停换文案（recommendations 是缓存渲染的，不是每帧重建）
  if (playing) refreshRecs();
  if (bgmSelEl) bgmSelEl.disabled = playing;   // 不变量 3：选中项必须就是正在放的那首
  if (bgmGainEl && document.activeElement !== bgmGainEl) bgmGainEl.value = String(bgmGainV);
  if (bgmBadgeEl) bgmBadgeEl.classList.toggle("on", playing);
  // 缺什么 / 错在哪只写进 select（一行）：它原来是一行独立的 #bgmHint，
  // 而「放歌行 26 + 说明 17 + 网格 81」在 300px 上限里滚出 17px —— 那行就是溢出的来源。
  // 空态与错因本来就由 renderBgmOptions 写成 option 文案，这里只补 title（悬停能看全）。
  if (bgmSelEl) {
    bgmSelEl.title = bgmNote || (bgmSongs.length
      ? "选一首歌：点右边的放歌键，实时垫进虚拟声卡（微信那边听得到，本机扬声器不出声）；放大镜可搜抖音/B站热歌"
      : "还没有歌：点右上角放大镜搜抖音/B站热歌；或主界面 → 实时变声 → 实时垫歌；或把 mp3 放进后端 media/songs");
  }
}

/** 拉歌单。force=false 时 60s 内不重复拉（refreshPanel 每次悬停都跑）。 */
async function loadBgm(force) {
  if (!CAP.fx) return;
  const now = Date.now();
  if (!force && now - bgmLoadedAt < 60000) return;
  bgmLoadedAt = now;
  try {
    const r = await fetch(SFX_BASE + "/bgm/recent", { cache: "no-store" });
    if (!r.ok) {
      bgmSongs = mergeFetchedSong([]);
      // 404 与「后端在但出错」是两件事：前者多半是后端比面板旧（/bgm/recent 还没有），
      // 后者该看日志 —— 猜错会把用户指去查错的环节。
      bgmNote = r.status === 404
        ? "要新版后端（/bgm/recent 没有）"
        : "歌单拉不到（HTTP " + r.status + "）";
      renderBgmOptions();
      renderBgm();
      return;
    }
    const j = await r.json();
    bgmSongs = mergeFetchedSong((j.items || []).filter((it) => it && it.name));
    bgmNote = "";
    bgmSelName = pickBgmName(bgmSongs, j.last || "");
    renderBgmOptions();
    renderBgm();
  } catch {
    bgmSongs = mergeFetchedSong([]);
    bgmNote = "后端没连上，放歌不可用";
    renderBgmOptions();
    renderBgm();
  }
}

/** 会话内取回的歌不在 /bgm/recent 里，合并进下拉时补在第一位（按文件名去重）。 */
function mergeFetchedSong(items) {
  const list = items.slice();
  if (bgmFetched && !list.some((it) => it.name === bgmFetched.name)) list.unshift(bgmFetched);
  return list;
}

/** 从错误响应里挖一句人话（FastAPI 的 detail；没有就报状态码）。 */
async function bgmErr(r) {
  try {
    const j = await r.json();
    if (j && j.detail) return String(j.detail).slice(0, 80);
  } catch {}
  return "HTTP " + r.status;
}

/** 主按钮：放 / 停。 */
async function toggleBgm() {
  if (bgmBusy) return;
  const song = bgmSongs.find((it) => it.name === bgmSelName) || null;
  if (!song) {
    setStatus("还没有歌：主界面 → 实时变声/发微信 页的「垫歌」里选一首", "err");
    return;
  }
  const stopping = !!bgmPlayingId;
  bgmBusy = true;
  renderBgm();
  try {
    const r = await fetch(SFX_BASE + (stopping ? "/bgm/stop" : "/bgm/start"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(stopping ? {} : { bgm: song.name, gain: bgmGainV, loop: true }),
    });
    if (!r.ok) {
      setStatus((stopping ? "停不掉：" : "放歌失败：") + await bgmErr(r), "err");
      return;
    }
    if (stopping) {
      bgmPlayingId = null;
      setStatus("已停", "");
    } else {
      const j = await r.json().catch(() => ({}));
      bgmPlayingId = j.id || song.id;
      try { localStorage.setItem(BGM_KEY, song.name); } catch {}
      // 一次性说清"为什么我听不到"（与音效格子同一条教训）
      setStatus("放歌中 · 微信那边听得到，本机扬声器不出声", "ok");
    }
  } catch {
    setStatus("后端没连上，" + (stopping ? "停不掉" : "放歌失败"), "err");
  } finally {
    bgmBusy = false;
    renderBgm();
  }
}

/** 音量：拖动只改本地值，停 250ms 再发（滑块 input 事件一次拖动能发几十次）。 */
function onBgmGainInput() {
  if (!bgmGainEl) return;
  bgmGainV = Math.min(1.5, Math.max(0, Number(bgmGainEl.value) || 0));
  if (!bgmPlayingId) return;      // 没在放就只记下，下次 /bgm/start 带上
  if (bgmGainTimer) clearTimeout(bgmGainTimer);
  bgmGainTimer = setTimeout(() => {
    bgmGainTimer = null;
    void fetch(SFX_BASE + "/bgm/gain", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gain: bgmGainV }),
    }).catch(() => {});
  }, 250);
}

// ---------------- 搜歌层（music_api：抖音榜发现 + B站取音）----------------
/**
 * 三条不变量（改之前先读完）：
 *
 *   1. **抖音榜只做发现**：接口能拿到歌名/歌手/热度，但 `play_url` 是空的（版权）。
 *      点一行 = 用「歌名 + 歌手」去 B站 搜，让用户看见取的是哪一条，不静默替人选。
 *   2. **取回的是会话产物**：后端落在 session 目录，退出即删；这里只把它塞进
 *      本次的 `bgmSongs`（`bgmFetched`），不写媒体库、不改 `/bgm/recent`。
 *   3. **点 B站行 = 取回 + 立即 `/bgm/start`**：与放歌键同一条链路（loop=true）。
 *      这一层的动作语义就是「放这首」，不再弹二次确认。
 */
let songSrc = "douyin";       // douyin | bilibili
let songItems = [];           // 当前列表（榜单或搜索结果）
let songChartKey = "";        // 已成功加载的榜单 key，避免每次开层都打网络
let songLoading = false;
let songBusy = false;         // 取回中：同时只允许一条
let songInputTimer = null;

/** 进度/错误只写这一行；空的时候 CSS 让它不占高度。 */
function songSetNote(text, isErr) {
  if (!songNoteEl) return;
  songNoteEl.textContent = text || "";
  songNoteEl.classList.toggle("err", !!isErr);
}

/** 热度/播放量 → `1.2亿` / `34w`。榜单返回的是整数，204px 里原样太长。 */
function fmtHot(n) {
  const v = Number(n) || 0;
  if (v >= 100000000) return (v / 100000000).toFixed(1) + "亿";
  if (v >= 10000) return Math.round(v / 10000) + "w";
  return v ? String(v) : "";
}

function renderSongList() {
  if (!songListEl) return;
  songListEl.innerHTML = songItems.map((it, i) => {
    const meta = [
      it.artist || "",
      it.duration_s ? fmtDur(it.duration_s) : "",
      it.hot ? fmtHot(it.hot) : "",
    ].filter(Boolean).join(" · ");
    const go = it.source === "douyin" ? "›" : "▶";
    return '<button type="button" class="srow" role="listitem" data-i="' + i + '">'
      + '<span class="sr">' + (it.rank || i + 1) + '</span>'
      + '<span class="si"><span class="st">' + esc(it.title || "") + '</span>'
      + '<span class="sm">' + esc(meta) + '</span></span>'
      + '<span class="sg">' + go + '</span></button>';
  }).join("");
}

/** 拉当前来源的榜单。`force=true` 用于「再点一次来源」刷新。 */
async function loadSongChart(force) {
  if (!CAP.fx || !songListEl) return;
  const src = songSrc;
  if (!force && songChartKey === src) return;
  songLoading = true;
  songSetNote("榜单加载中…");
  try {
    const r = await fetch(MUSIC_BASE + "/charts?source=" + encodeURIComponent(src), { cache: "no-store" });
    if (songSrc !== src) return;   // 用户已经切走了，别把旧结果盖回来
    if (!r.ok) {
      songItems = [];
      songChartKey = "";
      renderSongList();
      songSetNote(src === "douyin"
        ? "抖音榜没拉倒，点「B站榜」试试"
        : "B站榜没拉倒，检查网络/后端", true);
      return;
    }
    const j = await r.json();
    if (songSrc !== src) return;
    songItems = (j.items || []).filter((it) => it && it.title);
    songChartKey = src;
    renderSongList();
    songSetNote(songItems.length
      ? (src === "douyin" ? "点一行去 B站 找音频" : "点一行取回并实时放")
      : "榜单是空的");
  } catch {
    songItems = [];
    songChartKey = "";
    renderSongList();
    songSetNote("后端没连上，搜歌不可用", true);
  } finally {
    songLoading = false;
  }
}

/** 按歌名/歌手搜 B站。结果仍是「视频」，取音要点下一步。 */
async function runSongSearch(q) {
  const query = String(q || "").trim();
  if (!query || songLoading || songBusy) return;
  songLoading = true;
  songSetNote("搜索中…");
  try {
    const r = await fetch(MUSIC_BASE + "/search?q=" + encodeURIComponent(query) + "&limit=8", {
      cache: "no-store",
    });
    if (!r.ok) {
      songSetNote("B站搜索失败（HTTP " + r.status + "）", true);
      return;
    }
    const j = await r.json();
    if (songQEl && songQEl.value.trim() !== query) return;   // 输入已经变了
    songItems = (j.items || []).filter((it) => it && it.title);
    songChartKey = "";                                       // 清空输入时要能回到榜单
    renderSongList();
    songSetNote(songItems.length ? "以下是从 B站 匹配的音频，点一行取回" : "没搜到，换个歌名或歌手");
  } catch {
    songSetNote("后端没连上，搜歌不可用", true);
  } finally {
    songLoading = false;
  }
}

/** 取回一首并立即放。`idx` 只用于把对应行置忙态。 */
async function fetchAndPlaySong(it, idx) {
  if (songBusy) return;
  songBusy = true;
  const row = songListEl && songListEl.querySelector('.srow[data-i="' + idx + '"]');
  if (row) row.classList.add("busy");
  const jobId = "pet-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  songSetNote("准备取回…");
  // POST 是同步阻塞的（yt-dlp 跑多久它就有多久），进度靠并行的 GET 轮询。
  // `posting` 而不是 `found` 作为循环条件：作业要等 POST 到达后端才登记，
  // 最初几次 GET 一定 found=false —— 拿它当结束信号会永远停在「准备取回…」。
  let posting = true;
  const polling = (async () => {
    while (posting) {
      await new Promise((res) => setTimeout(res, 700));
      if (!posting) break;
      try {
        const pr = await fetch(MUSIC_BASE + "/fetch/" + jobId, { cache: "no-store" });
        if (!pr.ok) continue;
        const pj = await pr.json();
        if (!pj.found) continue;
        const pct = pj.percent == null ? "" : " " + Math.round(pj.percent) + "%";
        songSetNote((pj.stage || "取回中") + pct + " · 已 " + Math.round(pj.elapsed_s || 0) + "s");
      } catch {}
    }
  })();
  try {
    const r = await fetch(MUSIC_BASE + "/fetch", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: it.url, job_id: jobId, title: it.title, artist: it.artist || "" }),
    });
    if (!r.ok) {
      songSetNote("取回失败：" + await bgmErr(r), true);
      return;
    }
    const j = await r.json();
    const song = {
      id: String(j.name || "").replace(/\.[^.]+$/, ""),
      name: j.name,
      title: j.title || it.title,
      artist: j.artist || it.artist || "",
      duration_s: j.duration_s || it.duration_s || 0,
    };
    // 先选进下拉、再 /bgm/start —— 顺序反了会让「正在放」找不到对应项。
    bgmFetched = song;
    bgmSongs = [song, ...bgmSongs.filter((x) => x.name !== song.name)];
    bgmSelName = song.name;
    songSetNote("取回完成，正在放…");
    if (!await startFetchedBgm(song)) {
      songSetNote("取回了，但放歌失败：点 ‹ 回托盘再按「放歌」", true);
      return;
    }
    setLayer("tray");
    setStatus("正在放：" + (song.title || song.name) + " · 微信那边听得到", "ok");
  } catch {
    songSetNote("后端没连上，取回失败", true);
  } finally {
    posting = false;
    await polling;
    songBusy = false;
    if (row && row.isConnected) row.classList.remove("busy");
  }
}

/** 与放歌键同一条 /bgm/start；成功返回 true。 */
async function startFetchedBgm(song) {
  try {
    const r = await fetch(SFX_BASE + "/bgm/start", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bgm: song.name, gain: bgmGainV, loop: true }),
    });
    if (!r.ok) return false;
    const j = await r.json().catch(() => ({}));
    bgmPlayingId = j.id || song.id;
    try { localStorage.setItem(BGM_KEY, song.name); } catch {}
    renderBgmOptions();
    renderBgm();
    return true;
  } catch {
    return false;
  }
}

/** 点一行：抖音 → 去 B站搜；B站 → 取回并放。 */
function onSongRow(i) {
  const it = songItems[i];
  if (!it || songBusy) return;
  if (it.source === "douyin") {
    const q = (it.title + " " + (it.artist || "")).trim();
    if (songQEl) songQEl.value = q;
    void runSongSearch(q);
    return;
  }
  void fetchAndPlaySong(it, i);
}

if (bgmSelEl) bgmSelEl.addEventListener("change", () => {
  bgmSelName = bgmSelEl.value || "";
  try { localStorage.setItem(BGM_KEY, bgmSelName); } catch {}
  renderBgm();
});
if (bgmBtnEl) bgmBtnEl.addEventListener("click", () => void toggleBgm());
if (bgmGainEl) bgmGainEl.addEventListener("input", onBgmGainInput);
if (songBtnEl) songBtnEl.addEventListener("click", () => setLayer("songs"));
if (songBackEl) songBackEl.addEventListener("click", () => setLayer("tray"));
// 雷达层：入口在抽屉（radarRow），‹ 退出，「重新观察」清状态后立刻重抓。
// 行是 div[role=button] —— 键盘 Enter 也要能进（与 .drow 的可点行保持同一约定）。
function openRadar() { setLayer("radar"); }
if (radarRowEl) {
  radarRowEl.addEventListener("click", openRadar);
  radarRowEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRadar(); } });
}
if (radarBackEl) radarBackEl.addEventListener("click", () => setLayer(""));
if (radarLiveEl) radarLiveEl.addEventListener("click", () => resetRadar());
if (songSrcEl) songSrcEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-src]");
  if (!btn) return;
  const src = btn.dataset.src === "bilibili" ? "bilibili" : "douyin";
  const same = src === songSrc;
  songSrc = src;
  for (const b of songSrcEl.querySelectorAll("button")) b.classList.toggle("on", b === btn);
  if (songQEl) songQEl.value = "";
  if (same && songItems.length) { void loadSongChart(true); return; }   // 再点一次 = 刷新
  songChartKey = "";
  void loadSongChart(true);
});
if (songQEl) {
  songQEl.addEventListener("input", () => {
    if (songInputTimer) clearTimeout(songInputTimer);
    const q = songQEl.value.trim();
    if (!q) {
      // 清空就回到榜单；250ms 防抖避免用户连续退格时打一串请求。
      songInputTimer = setTimeout(() => {
        songInputTimer = null;
        songChartKey = "";
        void loadSongChart(true);
      }, 250);
      return;
    }
    if (q.length < 2) return;
    songInputTimer = setTimeout(() => {
      songInputTimer = null;
      void runSongSearch(q);
    }, 550);
  });
  songQEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (songInputTimer) { clearTimeout(songInputTimer); songInputTimer = null; }
    void runSongSearch(songQEl.value);
  });
}
if (songListEl) songListEl.addEventListener("click", (e) => {
  const row = e.target.closest(".srow");
  if (row) onSongRow(Number(row.dataset.i));
});
// ── 微信雷达：该不该回（hook.radar → /api/radar/*）────────────────────────
// 只读层：判断全在后端（像素行投影 + 规则引擎），这里只渲染 verdict/signals。
// 两档轮询：层开着 1.5s（后端 poll_hint_ms 给的值，后端 tick 实测 ~100ms）；
// 层关着 5s —— 只为入口上的小绿点（verdict.action === "now" 时点亮）。
// ⚠️ 能力关了必须整条链路停：polling 兜底、tick 直接 return（vitest 拿这行当锚点）。
const RADAR_BASE = "http://127.0.0.1:8000/api/radar";
let radarTimer = null;         // 快轮询句柄（层开着）
let radarTimerMs = 0;          // 快轮询当前用的间隔 —— 与 radarPollHintMs 不等就要重建
let radarBadgeTimer = null;    // 慢轮询句柄（层关着，养绿点）
let radarBusy = false;         // 上一次请求还没回来就不叠下一发
let radarPollHintMs = 1500;    // 跟随后端响应里的 poll_hint_ms 走

function radarSetPolling() {
  // 快轮询：只在层开着且能力在时跑。
  const wantFast = panelLayer === "radar" && CAP.radar;
  // 间隔变了必须重建定时器 —— 早先只判「有没有 timer」，于是后端把 poll_hint_ms
  // 从 1500 调到 800 时永远不生效（clearInterval 被 `!wantFast` 挡住、
  // setInterval 被 `!radarTimer` 挡住），跟注释承诺的「老前端自动跟上」相反。
  if (radarTimer && (!wantFast || radarTimerMs !== radarPollHintMs)) {
    clearInterval(radarTimer); radarTimer = null; radarTimerMs = 0;
  }
  if (wantFast && !radarTimer) {
    radarTimerMs = radarPollHintMs;
    radarTimer = setInterval(() => void radarTick(false), radarPollHintMs);
  }
  // 慢轮询：能力在就常驻（绿点要跟上「该回了」的变化）。
  if (CAP.radar && !radarBadgeTimer) radarBadgeTimer = setInterval(() => void radarTick(false), 5000);
  if (!CAP.radar && radarBadgeTimer) { clearInterval(radarBadgeTimer); radarBadgeTimer = null; }
}

/** 秒数 → 展示串。null 一律给「—」：宁可说不知道，也别把 null 显示成 0s。 */
function radarSecs(v) {
  return (v === null || v === undefined) ? "—" : `${Math.round(v)}s`;
}

function radarSigRows(s) {
  const rows = [];
  if (s.last_side === "left") {
    // gap_seconds 为 null 时不能写成「0s前」——那是凭空造出来的「刚发」。
    const g = s.gap_seconds;
    const gap = (g === null || g === undefined)
      ? "—"
      : (s.gap_lower_bound ? `≥${Math.round(g)}s 前` : `${Math.round(g)}s 前`);
    rows.push(["对方最后发言", gap]);
    if (s.streak > 1) rows.push(["连发", `${s.streak} 条`]);
  } else if (s.last_side === "right") {
    rows.push(["最后一条", "你说的"]);
    // 冷启动时 _last_right_ts 还是空的 → my_last_reply_age 为 null，
    // 早先 `?? 0` 会显示「等对方回 0s」，看着像刚发完，其实是不知道。
    rows.push(["等对方回", radarSecs(s.my_last_reply_age)]);
  } else {
    // 一个消息块都没识别到（ROI 没对准 / 空会话 / 刚切窗口）：
    // 早先落到 else 分支会声称「最后一条 你说的」，纯属编造。
    rows.push(["最后一条", "没看到消息"]);
  }
  rows.push(["已观察", `${s.frames_seen ?? 0} 帧`]);
  return rows;
}

function renderRadar(j) {
  const v = j.verdict || {};
  const act = v.action || "unknown";
  // 建议区要读这个结论（「该回了」时第一条就应该是它），所以在这里镜像一份。
  // ⚠️ 必须存在 renderRadar 里而不是 radarTick 里：绿点轮询也走这条路，
  //    而面板没开时同样需要知道「现在该不该回」。
  const prevAct = lastRadarAction();
  lastRadar = j;
  radarAt = Date.now();   // refreshPanel 用它判断「这份结论有多旧」
  if (rdCardEl) {
    // 卡片的配色类：v-none / v-wait / v-soon / v-now / v-unknown（见 CSS）。
    rdCardEl.className = "v-" + act;
    if (rdVerdictEl) rdVerdictEl.textContent = v.label || act;
    if (rdReasonEl) rdReasonEl.textContent = v.reason || "";
  }
  if (rdSignalsEl) {
    rdSignalsEl.innerHTML = radarSigRows(j.signals || {})
      .map(([k, val]) => `<span class="rrow"><span>${k}</span><b>${val}</b></span>`).join("");
  }
  // 入口小绿点：只有「该回了」才亮 —— 绿点常亮等于没有绿点。
  // 绿点挂在 ⋯（抽屉入口）上：抽屉里就有雷达行，角标语义成立。
  if (rdotEl) rdotEl.hidden = act !== "now";
  // 抽屉雷达行的行尾值：开抽屉不用点进去也能看到当前结论。
  if (radarRowLabelEl) {
    radarRowLabelEl.textContent = v.label || "查看";
    // 结论是「该回了」时上绿色：抽屉里不用读字也知道该动手（与 ⋯ 上的绿点同一语义）
    radarRowLabelEl.className = act === "now" ? "rd-now" : "";
  }
  // 「重新观察」只在真的在观测时有用（连不上/没窗口时重观察也无从观察）。
  if (radarLiveEl) radarLiveEl.hidden = !j.ok;
  // 结论变了才重排建议区：每 1.5s 重建 innerHTML 会把正在悬停的 chip 弄丢
  // （用户刚要把鼠标点上去，节点被换掉了）。
  if (panelOpen && lastRadarAction() !== prevAct) refreshRecs();
}

/** 抓一帧并渲染。层开着时整卡刷新；层关着时只动绿点（别把没开的层写成有字）。 */
async function radarTick(force) {
  // ⚠️ 这一行必须保持**逐字** `if (!CAP.radar) return;`：petCapabilityGate.test.ts
  // 拿它当「雷达轮询真的接了能力门控」的锚点。
  if (!CAP.radar) return;
  if (radarBusy) return;
  if (panelLayer !== "radar" && !force && !radarBadgeTimer) return;
  radarBusy = true;
  try {
    const r = await fetch(RADAR_BASE + "/state", { cache: "no-store" });
    if (!r.ok) {
      if (panelLayer === "radar" && rdNoteEl) {
        rdNoteEl.textContent = r.status === 404
          ? "雷达插件没开：主界面 → 桌面 → 插件里打开「微信状态雷达」"
          : "雷达拉不到（HTTP " + r.status + "）";
        rdNoteEl.className = "err";
      }
      return;
    }
    const j = await r.json();
    if (j.poll_hint_ms && j.poll_hint_ms !== radarPollHintMs) {
      // 只在值真变了时走重建（radarSetPolling 内部比 radarTimerMs），
      // 否则 1.5s 的轮询会因为每帧都「发现 hint 不一致」而被反复重建。
      radarPollHintMs = j.poll_hint_ms;
      radarSetPolling();
    }
    renderRadar(j);
    if (panelLayer === "radar" && rdNoteEl) {
      rdNoteEl.textContent = j.ok ? "" : (j.error || "观察不可用");
      rdNoteEl.className = j.ok ? "" : "err";
    }
  } catch {
    if (panelLayer === "radar" && rdNoteEl) {
      rdNoteEl.textContent = "后端没连上";
      rdNoteEl.className = "err";
    }
  } finally {
    radarBusy = false;
  }
}

function resetRadar() {
  // 换了会话想重新观察：后端清状态，本地立刻抓一帧（不等下个轮询周期）。
  if (!CAP.radar) return;
  void fetch(RADAR_BASE + "/reset", { method: "POST" }).then(() => {
    if (panelLayer === "radar") void radarTick(true);
  }).catch(() => {});
}

/**
 * 按能力清单收起桌宠上用不到的控件 —— 关掉的能力意味着后端**根本没有那些接口**，
 * 留着就是一按 404 的按钮。
 *
 * 只在清单**真正读到**之后才收（`CAP.loaded`）：读不到时保持原样，
 * 免得后端临时没起来就把桌宠弄成残废。
 */
function refreshCapVisibility() {
  if (!CAP.loaded) return;
  const hide = (id, off) => {
    const el = document.getElementById(id);
    if (el) el.style.display = off ? "none" : "";
  };
  // 引擎二选一分段归 CAP.live（没实时变声能力时它只会 404）。
  // 「千问直出」的显隐由 refreshEngineSeg 管：**除了能力，还要看当前引擎**
  // （RVC 引擎下它是一个永远不起作用的勾选框）。这里再 hide 一次就会把那条判断盖掉。
  hide("engRow", !CAP.live);
  // 「最近发送」归 hook.wechat（点一条重发打的是 wechat 那几个端点）。
  hide("recent", !CAP.wechat);
  // 声音托盘（音效 + 放歌）整体归 sound.fx-board：入口和盘体一起收，
  // 只收一个的话，已经开着托盘的用户会看到一个全 404 的空盘。
  // 入口从 phead 的 ♪ 变成抽屉里的「声音」行（2026-10-23），hide 的 id 跟着变 ——
  // 只改 HTML 不改这里，能力关掉时会留下一行点进去全 404 的入口。
  hide("trayRow", !CAP.fx);
  if (!CAP.fx && (panelLayer === "tray" || panelLayer === "songs")) setLayer("");
  // 雷达行与层一起归 hook.radar：能力关了后端就没有 /api/radar/*，
  // 已经开着雷达层的要被归位收起 —— 并把两档轮询都停掉（radarSetPolling）。
  hide("radarRow", !CAP.radar);
  if (!CAP.radar && panelLayer === "radar") setLayer("");
  radarSetPolling();
  // ⚠️ 主按钮与试听的显隐**不在这里**用 style.display 硬盖：它们的文案/可用性
  // 还要跟着「草稿有没有内容、是不是在录」变，两套机制会互相覆盖
  // （CAP 收起来 → refreshFire 又亮回去）。统一由 refreshFire 决定。
  // 药丸（变声开关）扫不到路由时不能装成能点：点它只会 404。
  // 不禁用（它同时也在报后端离线/在线），改由点击时给一句方向明确的提示。
  if (pillEl) pillEl.title = CAP.live
    ? (pillEl.title || "实时变声开关：点一下开 / 再点一下关")
    : "实时变声能力已关闭（主界面 → 桌面 → 插件里打开它）";
  // 能力刚变过：让依赖「能力 + 引擎」两者的行（千问直出）重算一次。
  refreshEngineSeg();
}

function refreshPanel() {
  loadVoices(); loadRecent(); refreshEngineSeg(); refreshCapVisibility(); refreshFire();
  // 建议区：每次浮现都重排一次（上下文可能在面板收起的那几秒里变过 ——
  // 对方发了新消息、歌放完了、提案执行完了）。提案清单同时拉一遍。
  //
  // 雷达结论也要**当场**抓一份：慢轮询是 5s 一次，如果只靠它，用户悬停打开面板的
  // 头 5 秒里推荐区永远看不到「该回了」—— 而这恰恰是它最该出现的时候。
  // 8s 节流是因为抓帧要 PrintWindow（30ms+），不能每次悬停都打。
  if (CAP.radar && (!lastRadar || Date.now() - radarAt > 8000)) void radarTick(true);
  refreshRecs();
  void loadProposals();
  // 托盘里的两批清单只在托盘可见时拉：它们对未打开托盘的场景没用，而拉失败会把提示
  // 写进共用状态行 —— 轻则占一行高度，重则把刚发完微信的结果顶掉。
  // 打开托盘那一下由 setLayer 强制拉（绕过节流：音效/歌往往刚在主界面加过）。
  if (panelLayer === "tray") { loadSfx(false); loadBgm(false); }
}

// ════════════════════════════════════════════════════════════════════════════
//  建议面板（2026-10-23 二次重构）
//
//  上一版把面板从「13 个常驻入口」压到 5 个（药丸 / 音色 / ♪ / ⋯ / 主按钮），
//  用户的原话是「功能太多显得很乱」「屏幕太小」。真正的病根不是数量，
//  而是**入口和此刻该做什么没有关系**：打开面板时，上下文其实已经把候选压到 2–3 个
//  （对方刚发消息 / 有提案等你点头 / 正在放歌 / 草稿里有字），剩下的 9 个是噪音。
//
//  所以这一版：
//    · 主面板只显示 `rankActions()` 的前 3 条 —— 它随上下文变，不是固定菜单；
//    · 音色 chip 不再是按钮，♪ 按钮整个删掉（音效/放歌进抽屉的「声音」行）；
//    · 想找某个功能：在输入框里打（`matchActions` 做关键词匹配），
//      或开 ⋯ 抽屉里的「全部功能」网格。两条路都通，但都不常驻。
//
//  ⚠️ 三条硬规矩（改这块之前先读）：
//    1. `rankActions` / `matchActions` / `labelFor` 必须是**纯函数**（只看入参），
//       因为它们被 test 用 `new Function` 沙箱抽出去跑真身（web/src/petActionPanel.test.ts）。
//       一旦里面读 DOM/localStorage，测试就只能改成数行数，那就退化成了假测试。
//    2. 主按钮能做的事**不进推荐**（发语音 / 试听）。推荐只放「主按钮干不了的」，
//       否则同一件事在面板上出现两次，用户又要在两个入口之间判断哪个是对的。
//    3. 推荐永远至少 3 条：空面板会让人以为坏了。信号只负责**排序**，不负责清空。
// ════════════════════════════════════════════════════════════════════════════

/**
 * 动作元数据（纯数据，不含任何副作用）。
 *
 * `cap` 是所属能力（对应 CAP 的键）；能力关掉时该动作既不显示也不匹配 ——
 * 因为后端根本没挂那些 router，点了就是 404（见 refreshCapVisibility 的同一套理由）。
 * `kw` 是搜索词：中英文都放，用户可能打「歌」也可能打「music」。
 */
const ACT_META = [
  { id: "song.find", label: "点歌", hint: "搜 B 站", cap: "fx",
    kw: "歌 音乐 点歌 发歌 搜歌 放歌 来一首 song music" },
  { id: "sfx.play", label: "音效", hint: "声板", cap: "fx",
    kw: "音效 声板 特效 掌声 笑声 sfx soundboard" },
  { id: "bgm.toggle", label: "放歌", hint: "", cap: "fx",
    kw: "放歌 垫歌 背景音乐 停歌 bgm music" },
  { id: "radar.open", label: "该不该回", hint: "看一眼", cap: "radar",
    kw: "雷达 该回 该不该 微信 等多久 回不回 radar" },
  { id: "live.toggle", label: "开变声", hint: "", cap: "live",
    kw: "变声 开关 实时 rvc 千问 live voice" },
  { id: "voice.pick", label: "换音色", hint: "", cap: "",
    kw: "音色 声音 换音 选音色 voice" },
  { id: "engine.rvc", label: "RVC 引擎", hint: "", cap: "live",
    kw: "引擎 rvc 实时 切换 engine" },
  { id: "engine.qwen", label: "千问引擎", hint: "", cap: "live",
    kw: "引擎 千问 qwen 切换 engine" },
  { id: "recent.resend", label: "最近发送", hint: "重发", cap: "wechat",
    kw: "最近 历史 重发 发送记录 recent history" },
  // ★ 下面两个**只**出现在搜索结果里，不进 rankActions 的兜底池：
  //   主按钮已经承担了它们（规矩 2），但打字时它们必须能被搜到，
  //   否则「我想发这段」会被主按钮抢走而用户不知道自己搜的东西在哪。
  { id: "draft.send", label: "发语音说这句", hint: "", cap: "wechat", searchOnly: true,
    kw: "发 发送 说 语音 读 念 send" },
  { id: "draft.preview", label: "先试听", hint: "", cap: "wechat", searchOnly: true,
    kw: "试听 预览 听听 preview" },
];

/** 动作的副作用。key 与 ACT_META 的 id 一一对应（keyof 关系靠测试保证）。 */
const ACT_RUN = {
  "song.find": () => setLayer("songs"),
  "sfx.play": () => setLayer("tray"),
  "bgm.toggle": () => { setLayer("tray"); void toggleBgm(); },
  "radar.open": () => setLayer("radar"),
  "live.toggle": () => { void toggleLive(); },
  "voice.pick": () => { setLayer("drawer"); queueMicrotask(() => voiceSel && voiceSel.focus()); },
  "engine.rvc": () => { void pickEngine("rvc"); },
  "engine.qwen": () => { void pickEngine("qwen"); },
  "recent.resend": () => setLayer("drawer"),
  "draft.send": () => { void fireSend(); },
  "draft.preview": () => doPreview(),
  // 提案的执行走单独一条（要带 pid），见 runAction
  "proposal.confirm": (pid) => { void confirmProposal(pid); },
};

/** 动作能力门（纯函数）。`cap` 为空 = 无门控（音色、提案）。 */
function actAvailable(meta, ctx) {
  const key = meta && meta.cap;
  if (!key) return true;
  const caps = (ctx && ctx.cap) || {};
  return caps[key] !== false;
}

/**
 * 给动作挑一个**当前语境下的**标签。
 *
 * 为什么不能直接用 `ACT_META.label`：同一个动作在不同状态下做的事相反
 * （放歌↔停止放歌、开变声↔关掉变声）。写死标签会出现「按钮说放歌，点了却停了」，
 * 这是本项目已经吃过一次的亏（旧版 `toggleLive()` 被两个开关共用）。
 */
function labelFor(id, ctx) {
  const c = ctx || {};
  if (id === "bgm.toggle") return c.bgm ? "停止放歌" : "放歌";
  if (id === "live.toggle") return c.live ? "关掉变声" : "开变声";
  if (id === "proposal.confirm") return c.pendingTitle ? "确认 " + c.pendingTitle : "确认发送";
  for (let i = 0; i < ACT_META.length; i++) if (ACT_META[i].id === id) return ACT_META[i].label;
  return id;
}

/**
 * 按上下文排序推荐。**纯函数**。
 *
 * ctx 形状：
 *   { draft: "idle"|"text"|"rec", text: string, query: string,
 *     radar: ""|"none"|"wait"|"soon"|"now"|"unknown",
 *     bgm: bool, live: bool, pending: int, pendingTitle: string,
 *     cap: { fx, radar, live, wechat }, freq: { [id]: count }, max: int }
 *
 * 返回 `[{ id, score, hint }]`，已按分数降序、已截断到 max 条。
 *
 * 分数表（写死在这里，测试逐条断言 —— 改分数就是改产品行为，必须同步改测试）：
 *   100  有提案等你点头（已经解析完，只差一个确认，没有比这更该出现的事）
 *    92  雷达判「该回了」      62「可以回了」
 *    88  正在放歌（这时最可能想做的是停/换）
 *    50  输入框有字 → 让路给搜索结果，rankActions 直接返回空（见末尾）
 *   30/26/22  兜底：点歌 / 音效 / 该不该回（空面板会让人以为坏了）
 *    18  变声没开 → 开变声（只在用户用过它之后才靠频率浮上来）
 *   +0~15  使用频率加成（每个 id 每次 +3，封顶 15）—— 常用功能自己浮上来，
 *          这就是「不用每次都打字」的那一半。
 */
function rankActions(ctx) {
  const c = ctx || {};
  const max = Math.max(1, parseInt(c.max, 10) || 3);
  const pool = new Map();
  const put = (id, score, hint) => {
    const meta = ACT_META.find((m) => m.id === id);
    // 提案不是 ACT_META 里的条目（它是后端给的动态动作），单独放行
    if (id !== "proposal.confirm" && (!meta || meta.searchOnly || !actAvailable(meta, c))) return;
    const cur = pool.get(id);
    if (!cur) pool.set(id, { id, score, hint: hint || "" });
    else if (score > cur.score) { cur.score = score; cur.hint = hint || cur.hint; }
  };

  // ── 信号 ──
  if (Number(c.pending) > 0) put("proposal.confirm", 100, "待确认");
  if (c.radar === "now") put("radar.open", 92, "对方在等");
  else if (c.radar === "soon") put("radar.open", 62, "可以回了");
  if (c.bgm) put("bgm.toggle", 88, "正在放");

  // ── 兜底池（信号只改排序，不清空）──
  put("song.find", 30, "搜 B 站");
  put("sfx.play", 26, "声板");
  put("radar.open", 22, "看一眼");
  if (c.live !== true) put("live.toggle", 18, "没开");

  // ── 输入框有字：这一区让给搜索结果（见 refreshRecs）──
  // 返回空数组而不是 undefined：调用方一律 `rows.length` 判空，少一种形状少一个 bug。
  if (String(c.query || "").trim()) return [];

  const freq = c.freq || {};
  const rows = [];
  pool.forEach((r) => {
    r.score += Math.min(15, (parseInt(freq[r.id], 10) || 0) * 3);
    rows.push(r);
  });
  // 同分时按 id 排，保证每次渲染顺序一致（否则同样输入下 chip 会自己跳来跳去）
  rows.sort((a, b) => (b.score - a.score) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return rows.slice(0, max);
}

/**
 * 关键词匹配（输入框打字时用）。**纯函数**。
 *
 * 只做包含匹配，不引入模糊算法：动作只有 11 个，包含匹配已经够用，
 * 而模糊匹配会带来「为什么『歌』没搜到点歌」这种无法解释的排序。
 * `searchOnly` 的动作（发语音 / 试听）只在这里出现 —— 它们不进推荐池。
 */
function matchActions(q, ctx) {
  const s = String(q || "").trim().toLowerCase();
  if (!s) return [];
  const out = [];
  for (const m of ACT_META) {
    if (!actAvailable(m, ctx)) continue;
    const label = labelFor(m.id, ctx).toLowerCase();
    const hay = (m.label + " " + m.kw).toLowerCase();
    let score = 0;
    if (label === s) score = 100;
    else if (label.startsWith(s)) score = 80;
    else if (label.includes(s)) score = 70;
    else if (hay.includes(s)) score = 55;
    if (score > 0) out.push({ id: m.id, score, hint: m.hint || "" });
  }
  out.sort((a, b) => (b.score - a.score) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return out.slice(0, 4);
}

// ---------------- 建议区的上下文与渲染 ----------------

/** 使用频率（localStorage）。缓存的是**同一个对象**，bump 之后下次读就带上新值。 */
const ACT_FREQ_KEY = "pet.actFreq";
let actFreqCache = null;
function actFreq() {
  if (actFreqCache) return actFreqCache;
  let v = {};
  try { v = JSON.parse(localStorage.getItem(ACT_FREQ_KEY) || "{}") || {}; } catch { v = {}; }
  actFreqCache = (typeof v === "object" && v) ? v : {};
  return actFreqCache;
}
function bumpFreq(id) {
  if (!id) return;
  const f = actFreq();
  f[id] = (parseInt(f[id], 10) || 0) + 1;
  try { localStorage.setItem(ACT_FREQ_KEY, JSON.stringify(f)); } catch {}
}

/** 雷达最近一次结论（renderRadar 写，面板建议区读）—— 单一镜像点。 */
let lastRadar = null;
/** 上次成功拿到雷达结论的时刻。用来判断「这份结论还能不能用来推荐」。 */
let radarAt = 0;
function lastRadarAction() {
  const v = lastRadar && lastRadar.verdict;
  return v && typeof v.action === "string" ? v.action : "";
}

/** 待确认 / 执行中的提案（loadProposals 写）。 */
let assistProps = [];
const ASSIST_BASE = "http://127.0.0.1:8000/api/assistant";

/** 由面板当前状态算一份 ctx（唯一装配点：纯函数要什么，这里给什么）。 */
function panelCtx() {
  const text = ((sayEl && sayEl.value) || "").trim();
  return {
    draft: draftKind(),
    text,
    query: text,
    radar: lastRadarAction(),
    bgm: !!bgmPlayingId,
    live: !!runningEngine,
    pending: assistProps.length,
    pendingTitle: assistProps.length ? shortTitle(assistProps[0]) : "",
    cap: { wechat: CAP.wechat, fx: CAP.fx, radar: CAP.radar, live: CAP.live },
    freq: actFreq(),
    max: 3,
  };
}

/** 提案标题压到 chip 装得下的长度（"发一首歌：晴天" → "发《晴天》"）。 */
function shortTitle(p) {
  if (!p || typeof p !== "object") return "";
  const spec = p.label || "";
  const q = (p.params && (p.params.query || p.params.text)) || "";
  if (q) {
    const head = p.kind === "song.send" ? "发《" : "说「";
    const tail = p.kind === "song.send" ? "》" : "」";
    return head + String(q).slice(0, 10) + tail;
  }
  return String(spec || p.title || "发送").slice(0, 12);
}

/** 图标表：与 ACT_META 分开，因为它是纯展示、测试不需要它。 */
const ACT_ICON = {
  "song.find": '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  "sfx.play": '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
  "bgm.toggle": '<polygon points="6 4 20 12 6 20 6 4"/>',
  "radar.open": '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  "live.toggle": '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/>',
  "voice.pick": '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M8 21h8"/>',
  "engine.rvc": '<path d="M4 12h4l2-6 4 12 2-6h4"/>',
  "engine.qwen": '<circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/>',
  "recent.resend": '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>',
  "draft.send": '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  "draft.preview": '<polygon points="7 4 20 12 7 20 7 4"/>',
  "proposal.confirm": '<path d="M20 6 9 17l-5-5"/>',
};

function actIcon(id) {
  const d = ACT_ICON[id] || '<circle cx="12" cy="12" r="9"/>';
  return '<svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
    + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
}

/** 后端 /observe 的最近一次结果。`q` 与输入框内容对齐时才被采用（防竞态）。 */
let obsState = { q: "", busy: false, hits: [], note: "", seq: 0 };
/** 上一次因为"听不懂/缺参数"而打到状态行的那句提示，用来在用户改字后撤掉。 */
let obsWarn = "";
let obsTimer = null;

/** 输入变化：立刻重排本地候选，再 debounce 打一次后端意图解析。 */
function onSayInput() {
  refreshFire();          // 主按钮文案 / 试听显隐（原行为，必须保留）
  refreshRecs();           // 推荐区立刻变成搜索结果（本地匹配，不等网络）
  scheduleObserve();      // 300ms 后向后端要「这句话能做什么」
}

/**
 * 300ms 后请后端解析这句话。**只解析，不执行**（dry_run），产出的是"可以做什么"的候选。
 *
 * 为什么不自己做正则：`assistant/extract.py` 已经有 60+ 条测试压着的中文意图解析，
 * 前端再写一套必然出现「面板说能点歌、后端说听不懂」的分裂。这是单一真相源问题，
 * 不是性能问题（本地往返 <15ms）。
 */
function scheduleObserve() {
  if (obsTimer) clearTimeout(obsTimer);
  const q = ((sayEl && sayEl.value) || "").trim();
  if (!q || q.length < 2) {
    obsState = { q: "", busy: false, hits: [], note: "", seq: obsState.seq + 1 };
    return;
  }
  obsTimer = setTimeout(() => { void runObserve(q); }, 300);
}

async function runObserve(q) {
  const seq = ++obsState.seq;
  obsState.busy = true;
  try {
    const r = await fetch(ASSIST_BASE + "/observe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: q, dry_run: true, source: "panel" }),
    });
    if (seq !== obsState.seq) return;   // 打字更快，这次结果已经过期
    if (!r.ok) { obsState = { q, busy: false, hits: [], note: "", seq }; return; }
    const j = await r.json();
    // 同一句话可能被解析成多条（"发首晴天再说句话"）—— 全留，渲染时再截断。
    obsState = { q, busy: false, hits: Array.isArray(j.proposals) ? j.proposals : [], note: j.note || "", seq };
    // 后端认出了句式但执行不了（音效名不认识 / 只有音效没要说的话）：原因必须让人看见，
    // 否则推荐区空白，用户会以为面板没反应。改字后由下一次 observe 自动撤掉。
    const warns = Array.isArray(j.warnings) ? j.warnings.filter(Boolean) : [];
    if (warns.length) {
      obsWarn = warns.join("；");
      setStatus(obsWarn, "warn");
    } else if (obsWarn && statusText.textContent === obsWarn) {
      obsWarn = "";
      setStatus("");
    }
  } catch {
    if (seq === obsState.seq) obsState = { q, busy: false, hits: [], note: "", seq };
  } finally {
    if (seq === obsState.seq) {
      // refreshFire 也要跟着跑：解析出点歌时主按钮的文案从「合成并发送」变成「发原话」，
      // 不重算就会一直写着默认文案，跟下面那条「发《晴天》」自相矛盾。
      refreshRecs();
      refreshFire();
    }
  }
}

/** 把一条推荐/候选渲染成按钮。`data-act` 交给全局委托，`data-pid` 带提案 id。 */
function recBtn(row) {
  const id = row.id;
  const label = row.label || labelFor(id, panelCtx());
  const cls = "rec" + (row.hot ? " hot" : "") + (row.warn ? " warn" : "");
  const pid = row.pid ? ` data-pid="${esc(row.pid)}"` : "";
  // data-idx 指向 obsState.hits 的下标：提案对象带 params，塞不进 DOM 属性，
  // 而把它序列化进属性又会被引号/长度坑到（中文 + 书名号）。下标是最小的那根线。
  const idx = (typeof row.idx === "number") ? ` data-idx="${row.idx}"` : "";
  const hint = row.hint ? `<span class="rh">${esc(row.hint)}</span>` : "";
  const title = row.title || label;
  return `<button type="button" class="${cls}" data-act="${esc(id)}"${pid}${idx} title="${esc(title)}">`
    + actIcon(row.icon || id) + `<span class="rl">${esc(label)}</span>${hint}</button>`;
}

/**
 * 重画建议区。三种形态，**同一个 DOM**（所以高度只有一处预算）：
 *   ① 输入框有字 → 搜索结果：后端解析出的提案在前，本地动作在后
 *   ② 输入框空   → `rankActions` 的前 3 条
 *   ③ 一条都没有 → 整块 hidden（不占高度）
 */
function refreshRecs() {
  if (!recsEl) return;
  const ctx = panelCtx();
  const rows = [];

  if (ctx.query) {
    // ① 后端解析出的提案：点了会**先创建提案**（不是直接发），
    //    创建成功后它会出现在推荐区顶部等第二次确认 —— 见 runAction。
    const q = ctx.query;
    if (obsState.q === q && obsState.hits.length) {
      for (let i = 0; i < obsState.hits.slice(0, 2).length; i++) {
        const p = obsState.hits[i];
        rows.push({
          id: "proposal.create", pid: "", idx: i, hot: true,
          label: shortTitle(p),
          hint: p.kind === "song.send" ? "点歌"
            : p.kind === "voice.say" ? ((p.params && p.params.sfx && p.params.sfx.length) ? "语音·音效" : "语音")
            : "草稿",
          title: (p.label || "") + "：" + (p.detail || ""),
          icon: p.kind === "song.send" ? "song.find" : "draft.send",
        });
      }
    }
    for (const m of matchActions(q, ctx)) {
      // 与上面重复的（比如已经解析出「发《晴天》」）不再单列「点歌」
      if (rows.some((r) => (r.icon || r.id) === m.id)) continue;
      rows.push({ ...m, label: labelFor(m.id, ctx) });
    }
    // ★ 兜底：打了字却一条动作都没匹配上 —— 这几个字至少能「原样发出去」。
    //   这是**产品规则**（输入框里的话默认归宿就是发出去），不是匹配结果，
    //   所以写在渲染层而不是 matchActions 里：那边保持「搜不到就是空」的诚实，
    //   测试也钉着这一条（搜 zzzz 必须返回空数组）。
    //   典型场景：用户打「发首晴天」，本地关键词匹配不到任何动作（"发首"不在 kw 里），
    //   后端若不可用就一条候选都没有 —— 面板看起来像没反应。
    if (!rows.length && ctx.text && ctx.cap.wechat !== false) {
      rows.push({
        id: "draft.send", label: "发语音说这句", hint: "原样发",
        title: "把这句原样合成语音发到微信（不解析、不改写）",
      });
    }
  } else {
    // ② 上下文推荐
    for (const r of rankActions(ctx)) {
      rows.push({
        id: r.id,
        label: labelFor(r.id, ctx),
        hint: r.hint,
        hot: r.id === "proposal.confirm",
        warn: r.id === "radar.open" && ctx.radar === "now",
        pid: r.id === "proposal.confirm" && assistProps[0] ? assistProps[0].id : "",
        title: r.id === "proposal.confirm" && assistProps[0]
          ? "点一下执行：" + (assistProps[0].detail || assistProps[0].title || "")
          : labelFor(r.id, ctx),
      });
    }
  }

  const final = rows.slice(0, 3);
  if (!final.length) {
    recsEl.innerHTML = "";
    recsEl.hidden = true;
    return;
  }
  recsEl.innerHTML = final.map(recBtn).join("");
  recsEl.hidden = false;
}

/** 全局点击委托：建议区 + 抽屉里的全量功能网格共用 `data-act`。 */
function runAction(id, pid, payload) {
  if (!id) return;
  bumpFreq(id);
  // 提案两步走：这一步**只创建**，创建完它就是推荐区顶部的「确认 X」，
  // 再由用户点第二下才真的发（与 assistant 的「一切发送都要人工确认」同一条规矩）。
  if (id === "proposal.create") {
    void createProposal(payload);
    return;
  }
  const fn = ACT_RUN[id];
  if (!fn) return;
  fn(pid);
}

// ---------------- 提案：面板是 assistant 的正门 ----------------
// 在这之前，`hook.assistant` 只能用 curl 驱动 —— 提案落在磁盘上，桌宠不知道它存在。
// 这一段把它接进建议区，规矩跟后端一致：**创建 ≠ 执行**，
// 点了候选只是「把这件事摆到桌上」，第二下点「确认」才动 TTS / RVC / 微信。

/** 拉待确认 / 执行中的提案。面板每次浮现调一次；失败静默（能力可能没开）。 */
async function loadProposals() {
  try {
    const r = await fetch(ASSIST_BASE + "/proposals?include_terminal=false", { cache: "no-store" });
    if (!r.ok) { assistProps = []; return; }
    const j = await r.json();
    const list = Array.isArray(j.proposals) ? j.proposals : [];
    assistProps = list.filter((p) => p && (p.status === "pending" || p.status === "running"));
  } catch { assistProps = []; }
  // 面板开着才重画：收起时画了也没人看，还会在下次浮现时被 refreshRecs 覆盖
  if (panelOpen) refreshRecs();
}

/** 由 /observe 的候选创建一条提案（不执行）。 */
async function createProposal(hit) {
  if (!hit || !hit.kind) return;
  setStatus("已加入待确认：" + shortTitle(hit));
  try {
    const r = await fetch(ASSIST_BASE + "/proposal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind: hit.kind, title: hit.title || "", params: hit.params || {} }),
    });
    if (!r.ok) {
      const t = await r.text().catch(() => "");
      setStatus("建提案失败（HTTP " + r.status + "）" + (t ? "：" + firstClause(t) : ""), "err");
      return;
    }
    // 清空输入框：否则推荐区会一直被「搜索结果」占着，看不到刚建好的「确认 X」
    if (sayEl) sayEl.value = "";
    obsState = { q: "", busy: false, hits: [], note: "", seq: obsState.seq + 1 };
    refreshFire();
    await loadProposals();
    setStatus("已加入待确认 · 点上面的「确认」才会真发");
  } catch {
    setStatus("建提案失败：后端没连上", "err");
  }
}

/** 执行一条提案并跟到终态。进度写状态行（与发送链路的 setStatus 同一个位置）。 */
async function confirmProposal(pid) {
  if (!pid) return;
  setStatus("开始执行…");
  try {
    const r = await fetch(ASSIST_BASE + "/proposals/" + encodeURIComponent(pid) + "/confirm", { method: "POST" });
    if (!r.ok) {
      const t = await r.text().catch(() => "");
      // 409 是「已经在跑 / 状态不允许」，不是失败 —— 原文回显比翻译成"失败"更准
      setStatus("没执行（HTTP " + r.status + "）" + (t ? "：" + firstClause(t) : ""), "err");
      void loadProposals();
      return;
    }
    void loadProposals();
    pollProposal(pid, 0);
  } catch {
    setStatus("执行失败：后端没连上", "err");
  }
}

/**
 * 跟提案到终态，把最后一步写进状态行。
 *
 * 为什么不轮询整张表：一条提案的每一步都已经在 `result.steps` 里（executor 逐步落盘），
 * 拉单条就够了；拉整张表会在提案多的时候把状态行刷成别人的进度。
 */
async function pollProposal(pid, n) {
  if (n > 240) return;   // 240 × 500ms = 2 分钟，超时就不再刷（不是失败，只是不再盯）
  try {
    const r = await fetch(ASSIST_BASE + "/proposals/" + encodeURIComponent(pid), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const p = j.proposal || {};
    const steps = (p.result && Array.isArray(p.result.steps)) ? p.result.steps : [];
    if (p.status === "running") {
      setStatus(steps.length ? steps[steps.length - 1] : (p.detail || "执行中…"));
      setTimeout(() => { void pollProposal(pid, n + 1); }, 500);
      return;
    }
    if (p.status === "done") {
      setStatus("完成：" + (steps.length ? steps[steps.length - 1] : (p.title || "已执行")), "ok");
    } else if (p.status === "failed") {
      setStatus("失败：" + (p.error || "执行器没给原因"), "err");
    } else {
      setStatus(steps.length ? steps[steps.length - 1] : "已结束");
    }
    void loadProposals();
  } catch {
    setTimeout(() => { void pollProposal(pid, n + 1); }, 1500);
  }
}

// 建议区的点击委托：`data-act` 是唯一契约。
// 用委托而不是给每条 chip 绑 listener：refreshRecs 会整块重写 innerHTML，
// 逐个绑就要在每次重画后重绑一遍，漏一次就是「点了没反应」。
document.addEventListener("click", (e) => {
  const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || !panel || !panel.contains(el)) return;
  e.preventDefault();
  const idx = el.dataset.idx;
  const payload = (idx !== undefined && obsState.hits[Number(idx)]) || null;
  if (el.dataset.act === "proposal.create" && !payload) return;
  runAction(el.dataset.act, el.dataset.pid || "", payload);
});


// ---------------- 主按钮：面板上唯一的动作 ----------------

/**
 * 草稿类型 —— 整个重构的核心判断。**类型由内容决定，不由页签决定**：
 *   rec  按住中（micPhase ≠ idle）—— 波形在装填区，主按钮变「松开发送」
 *   text 有内容（文字 / 试听产物 / 音效片）—— 主按钮变「合成并发送」
 *   idle 空 —— 主按钮变「按住说话」
 * 改版前这一步是「先选页签」：三个页签按**实现机制**分（文字合成 / 按键录音 / 声板），
 * 用户脑子里只有「我要发一条」，所以那层选择纯属翻译负担。
 */
function draftKind() {
  if (micPhase !== "idle") return "rec";
  const text = ((sayEl && sayEl.value) || "").trim();
  return (text || lastPreview || sfxPicks.length) ? "text" : "idle";
}

/**
 * 主按钮 / 试听 / 提示行的**唯一**刷新点 —— 任何状态变化后只调它。
 * （旧版是 refreshSendLabel + refreshFxActions 两处各算一半，同一件事两个真相源，
 *   于是「按钮写着发送、实际发的是另一页的东西」这种错必然会发生。）
 */
function refreshFire() {
  const kind = draftKind();
  const text = ((sayEl && sayEl.value) || "").trim();
  const picks = sfxPicks.length;
  const rec = kind === "rec";

  if (fireEl) {
    fireEl.classList.toggle("m-idle", kind === "idle");
    fireEl.classList.toggle("m-text", kind === "text");
    fireEl.classList.toggle("m-rec", kind === "rec");
    fireEl.title = kind === "idle"
      ? "按住不放说话（0.3~59 秒），松手自动换声发微信；想打字就点上面输入框"
      : kind === "rec"
        ? "松手结束并发送"
        : (lastPreview ? "把刚试听的那条发到微信" : "用选中音色合成，并录成微信语音消息");
    // 忙态（合成中/发送中）由 setBusy 管 disabled，这里别把它掰回来
    if (!fireEl.classList.contains("busy")) fireEl.disabled = !CAP.wechat;
  }

  if (fireLabel) {
    let label;
    if (kind === "rec") {
      // arming（等后端开麦）/ converting（换声）/ sending（发微信）都在这条分支里：
      // 那几秒按钮上写的是进度，不是手势 —— 用户松手后最想知道「现在到哪一步了」。
      label = (micPhase === "arming" || micPhase === "recording")
        ? "松开发送"
        : (MIC_TIP[micPhase] || "处理中…");
    } else if (kind === "text") {
      if (lastPreview) label = "发送试听";
      else if (text && picks) label = `合成并发送 · ${picks}`;
      // ★ 建议区里已经有「发《晴天》」这类解析结果时，主按钮必须说清自己发的是**原话**，
      //   否则两条路径（点候选 = 搜歌发片段 / 点按钮 = 念这几个字）看起来像同一件事。
      //   这是 2026-10-23 二次重构里唯一一处因为建议区而改文案的地方。
      else if (text) label = (obsState.q === text && obsState.hits.length) ? "发原话" : "合成并发送";
      else label = picks ? `发送 ${picks} 个音效` : "合成并发送";
    } else {
      // 微信能力关掉时不能说「按住说话」—— 按了发不出去。说清缺什么。
      label = CAP.wechat ? "按住说话" : "微信能力已关闭";
    }
    fireLabel.textContent = label;
  }

  // 试听：只在「有文字、没在录、微信能力在」时出现。它试听的是**文字合成**，
  // 与按住那条链路无关，所以按住中/空草稿时它没有意义。
  if (previewBtn) previewBtn.hidden = !(kind === "text" && !!text && CAP.wechat);

  refreshHint();
}

/** 手势提示行。三件事按优先级：录制中 > 微信预检 > 一句用法。 */
function refreshHint() {
  if (!hintEl) return;
  let text = "", tone = "", title = "";
  if (micPhase !== "idle") {
    // 说「正在录」而不是重复按钮上的「松开发送」；秒数在波形右边已经有了，
    // 这里只补一件按钮说不出来的事：**现在已经在听**。
    text = micPhase === "recording" ? "正在录 · 松手就发" : (MIC_TIP[micPhase] || "");
  } else if (wechatNote) {
    // 动作短语（按住说 / 点按钮发送）必须按**当前草稿**现算，不能跟着预检文案缓存 5 秒：
    // 用户在预检之后才开始打字，那 5 秒里提示会一直说「按住说」，而按住按钮此时是发送语义。
    const sending = !!((sayEl && sayEl.value) || "").trim();
    text = wechatNote.act
      ? wechatNote.text + " · " + (sending ? "点按钮发送" : "按住说，松手就发")
      : wechatNote.text;
    tone = wechatNote.tone; title = wechatNote.title;
  } else if (((sayEl && sayEl.value) || "").trim()) {
    // 有文字时按住按钮**不会**录音（主按钮这时是「发送」语义，pointerdown 直接返回）——
    // 所以不能写「或按住直接说」，那是个按了没反应的承诺。要说清怎么改回录音。
    text = "点按钮发送 · 要录音先清空文字";
  } else {
    text = "按住说，松手就发";
  }
  hintEl.textContent = text;
  hintEl.className = tone ? "t-" + tone : "";
  hintEl.title = title || text;
}

/** 微信预检结论（由 renderWechatPrecheck 写，refreshHint 读）—— 单一镜像点。 */
let wechatNote = null;   // { text, tone, title } | null
function setWechatNote(text, tone, title, act) {
  // act=true：这条状态后面要接「按住说，松手就发」或「点按钮发送」——
  // 由 refreshHint 按**当前草稿**决定接哪句。写死在文案里就会出现
  // 「输入框有一整句话，提示却让用户按住说」：有文字时按住按钮根本不录音
  // （主按钮这时是发送语义，pointerdown 直接返回），那是个按了没反应的承诺。
  wechatNote = text ? { text, tone: tone || "", title: title || text, act: !!act } : null;
  refreshHint();
}
/** 忙态：禁用 + 把图标换成旋转圈（CSS: #panel button.busy）。
    「合成中」动辄十几秒，只把按钮变灰用户会以为卡死，转圈才看得见在动。 */
function setBusy(btn, on) {
  if (!btn) return;
  btn.disabled = !!on;
  btn.classList.toggle("busy", !!on);
}

/**
 * 状态行。cls ∈ ""(信息) | "ok" | "err"。
 *
 * ⚠️ 只要 text 非空就必须挂上 .show —— 早先的写法是
 * `className = cls ? "show " + cls : ""`，于是 `setStatus("合成中…")`（doPreview 的调用）
 * 把 className 清空，而 #status 只有 .show 才 display:flex，
 * 结果是「合成中…」这条提示从来没有真正显示过。
 */
function setStatus(text, cls) {
  statusText.textContent = text || "";
  statusEl.className = text ? ("show" + (cls ? " " + cls : "")) : "";
}

function doPreview() {
  // 试听端点归 hook.wechat；能力关了就退回一个明确提示，别静静地去打一个不存在的路由。
  if (!CAP.wechat) { setStatus("微信发送能力已关闭，试听不可用", "err"); return; }
  const text = sayEl.value.trim();
  if (!text || !window.pet || !window.pet.previewText) return;
  const voiceId = voiceSel.value || "";
  if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);
  setStatus("合成中…");
  setBusy(previewBtn, true);
  setTimeout(() => setBusy(previewBtn, false), 60000);
  window.pet.previewText(text, voiceId, document.getElementById("noRvc")?.checked === true);
}

/**
 * 主按钮的发送 —— 草稿里有什么就发什么。
 *
 * 四种组合（原来要靠四个页签分开做的四件事，现在由**内容**决定）：
 *   文字 + 音效片 → 先合成试听产物，再混音效，再发送（三段串成一条链，见 pendingPremix）
 *   文字          → 一步到位 sendText（主进程做 TTS → RVC → 录进微信）
 *   只有音效片     → 混进「最近一条 TTS 产物」再发（底由后端自己取，与发送链路同口径）
 *   只有试听产物   → 直接发它（试听 → 发送两步走）
 */
async function fireSend() {
  const text = sayEl.value.trim();
  const picks = sfxPicks.length;
  if (!window.pet) return;
  if (!CAP.wechat) { setStatus("微信发送能力已关闭：主界面 → 桌面 → 插件里打开它", "err"); return; }
  // 发前探活：连不上后端立即提示，不闷头转圈被误判成卡死。
  // 报错分两种因（2026-09-18）：「没服务在听」该去启动后端，「HTTP 异常」该看日志，
  // 以前一律一句「后端未连接」，用户分不清。
  let probeErr = "";
  try {
    const r = await fetch("http://127.0.0.1:8000/api/health", { cache: "no-store" });
    if (!r.ok) probeErr = `后端在但返回异常（HTTP ${r.status}）：看日志 %APPDATA%\\voice-morph-desktop\\backend.log`;
  } catch {
    probeErr = "后端没连上：8000 端口没有服务在监听（变声后端未启动或已退出）。打开主界面会自动拉起后端，等就绪后再试";
  }
  if (probeErr) { setStatus(probeErr, "err"); return; }

  // ① 有试听产物、且没有音效片 → 直接发它
  if (lastPreview && !picks && window.pet.sendWav) {
    setStatus("发送中… 自动发到微信，全程别动键鼠", "ok");
    window.pet.sendWav(lastPreview.wav);
    lastPreview = null;
    refreshFire();               // 待发产物已消费，主按钮立刻退回「按住说话」
    setBusy(sendBtn, true);
    setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);
    return;
  }
  // ② 文字 + 音效片 → 先合成（onPreviewResult 里接着调 premixAndSend）
  if (text && picks) {
    pendingPremix = true;
    setStatus(`合成中… 完成后混入 ${picks} 个音效发微信`, "ok");
    setBusy(sendBtn, true);
    setTimeout(() => { setBusy(sendBtn, false); pendingPremix = false; }, 60000);
    const voiceId = voiceSel.value || "";
    if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);
    window.pet.previewText(text, voiceId, document.getElementById("noRvc")?.checked === true);
    return;
  }
  // ③ 只有音效片 → 混进最近一条 TTS 产物再发
  if (!text && picks) { await premixAndSend(); return; }
  // ④ 只有文字 → 一步到位
  if (text) {
    const voiceId = voiceSel.value || "";
    if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);   // 记住上次选的音色
    setStatus("合成中… 完成后自动发到微信，全程别动键鼠", "ok");
    if (window.pet.sendText) {
      window.pet.sendText(text, voiceId, document.getElementById("noRvc")?.checked === true);
      sayEl.value = "";
      refreshFire();
      void watchSendOutcome();   // 主进程旧版不回传结果时的兜底收尾（见函数注释）
    }
    setBusy(sendBtn, true);
    setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);   // TTS+录音发送可能要十几秒
  }
}

/**
 * 音效片 → 一条新 wav → 正常发送链路。
 *
 * 底的选择（/soundboard/premix 的 wav 参数）：
 *   · 面板上有刚试听的产物（lastPreview）→ 混进它（用户刚听过，最明确）；
 *   · 没有就传 null —— 后端自己取「最近一条 TTS 产物」（与发送链路同口径），
 *     典型场景：刚发过一条语音，打开托盘给「鼓掌」点＋，再点主按钮 = 给那条加个掌声；
 *   · 两样都没有 → 后端 404「还没有 TTS 产物」，原样透传，状态行引导先合成。
 * 产物（sfxmix_*.wav）设进 lastPreview 后直接 sendWav，走与「发送试听」完全相同的
 * 发送/回传/看门狗链路 —— 不新造一条发送路径。
 */
async function premixAndSend() {
  if (!window.pet || !window.pet.sendWav) return;
  const inserts = sfxPicks.map((p) => (p.mode === "layer"
    ? { sample: p.id, mode: p.mode, at_s: p.at_s }
    : { sample: p.id, mode: p.mode }));
  setStatus("正在混入音效…", "ok");
  setBusy(sendBtn, true);
  let j = null;
  try {
    const r = await fetch(SFX_BASE + "/premix", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wav: lastPreview ? lastPreview.wav : null, inserts }),
    });
    if (r.ok) j = await r.json();
    else {
      const d = await r.json().catch(() => ({}));
      setBusy(sendBtn, false);
      setStatus("预混失败：" + ((d && d.detail) || "HTTP " + r.status), "err");
      return;
    }
  } catch {
    setBusy(sendBtn, false);
    setStatus("预混失败：后端没连上", "err");
    return;
  }
  // skipped = 空音频之类的坏样本被后端跳过。必须说出口 —— 静默跳过会让
  // 「发出去的语音里少了那一声，而界面一切正常」，那是最难发现的失败。
  if (j.skipped && j.skipped.length) {
    setStatus(`混好了，但 ${j.skipped.length} 个音效是空文件被跳过`, "warn");
  }
  lastPreview = { wav: j.wav, url: "", duration_s: j.seconds };
  setStatus("发送中… 自动发到微信，全程别动键鼠", "ok");
  window.pet.sendWav(j.wav);
  lastPreview = null;            // 与「发送试听」同口径：待发产物已消费
  // 音效片发完就清空：它们属于**这一条**语音。留着的话下一条会被悄悄加上同样的音效。
  sfxPicks = [];
  renderFxGrid();
  renderFxPicks();
  refreshFire();
  void watchSendOutcome();       // sendWav 路径旧版主进程不回传结果，兜底收尾（同 fireSend）
  setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);
}

previewBtn.addEventListener("click", doPreview);
voiceSel.addEventListener("change", syncVoiceGates);
// 输入框内容一变，主按钮的文案/图标/试听显隐就跟着变 —— 「内容决定类型」的唯一触发器。
// 输入框双用（2026-10-23）：既是「要发的内容」，也是「找功能的搜索框」。
// 两者的区别不由模式开关决定，而由**下面这一行给出的候选**决定 —— 打字时建议区
// 变成搜索结果，不发出去就只是一次搜索（Enter 仍然是发送，没变）。
sayEl.addEventListener("input", onSayInput);
sayEl.addEventListener("keydown", (e) => { if (e.key === "Enter") void fireSend(); });

// —— 主按钮的两种手势 ——
// 空草稿：pointerdown 起录、pointerup 停（按住说话）
// 有内容：click 发送
// ★ 冲突点：pointerdown + pointerup 也会产生一次 click。用 fireArmed 吞掉那一次 ——
//   否则每按完一次录音就会紧接一次「发送」，把刚录的东西发两遍（或对着空草稿发呆）。
let fireArmed = false;
if (fireEl) {
  fireEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;                 // 右键留给上下文菜单
    if (draftKind() !== "idle") return;         // 有内容：这个按钮是「发送」，不是「录音」
    fireArmed = true;
    micDown(e);
  });
  fireEl.addEventListener("pointerup", () => {
    if (!fireArmed) return;
    micUp();
    // click 在本轮事件之后派发 → setTimeout(0) 排在它后面清标记，正好吞掉那一次
    setTimeout(() => { fireArmed = false; }, 0);
  });
  for (const ev of ["pointercancel", "lostpointercapture"]) {
    fireEl.addEventListener(ev, () => {
      if (!fireArmed) return;
      micUp();
      fireArmed = false;
    });
  }
  // 右键/长按菜单在按住手势里是干扰项
  fireEl.addEventListener("contextmenu", (e) => e.preventDefault());
  fireEl.addEventListener("click", () => {
    if (fireArmed) { fireArmed = false; return; }   // 刚按完录音的那一次 click，吞掉
    if (draftKind() === "idle") {
      // 点了一下但没按住：不报错，只说清手势（与微信点麦克风同款处理）
