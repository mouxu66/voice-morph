<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌宠</title>
<style>
  /* ================= 设计令牌：对齐主应用 web/src/styles/index.css =================
     主应用默认主题是「系统」（web/src/theme.ts: getStoredTheme() 兜底 "system"，
     resolve() 用 prefers-color-scheme 决定明暗），所以桌宠直接读 prefers-color-scheme
     就能在默认配置下与应用保持一致——不需要任何 IPC 或主进程改动，
     pet.html 属于热替换范围，改完重启桌面端即生效。
     若用户在应用里手动锁成 dark/light（localStorage vm-theme），两边会分叉；
     要彻底跟随需把主题经 IPC 推给桌宠窗口，那要动主进程 → 必须重打包。 */
  :root {
    /* 台面：与应用 --c-surface / --c-surface-2 同值 */
    --c-surface: 22 27 38;      /* #161b26 */
    --c-surface-2: 28 34 48;    /* #1c2230 */
    --c-surface-3: 36 43 60;
    --c-border: 38 46 64;       /* #262e40 */
    --c-border-2: 51 64 90;     /* #33405a */
    /* 文字：与应用 --c-t-* 同阶 */
    --c-t-strong: 255 255 255;
    --c-t-200: 226 232 240;
    --c-t-300: 203 213 225;
    --c-t-400: 148 163 184;
    --c-t-500: 100 116 139;
    /* 品牌：与应用 --c-accent 同值（紫 #7c5cf0，副色天蓝） */
    --c-accent: 124 92 240;
    --c-accent-h: 141 113 245;
    --c-accent-p: 105 76 222;
    --c-accent-2: 56 189 248;
    /* 语义色 */
    --c-ok: 52 211 153;
    --c-warn: 245 158 11;
    --c-err: 248 113 113;
    /* 玻璃层不透明度：暗色下要透出桌面，亮色下要压得住杂色壁纸 */
    --glass: 0.86;
    /* 投影：与应用 .glass-panel 同量级 */
    --elev-1: 0 2px 10px rgb(0 0 0 / 0.34);
    --elev-2: 0 10px 32px rgb(0 0 0 / 0.46);
    --hair: rgb(255 255 255 / 0.06);   /* 顶部内高光 */
    --c-shadow: 0 0 0;                 /* 角色落地投影色 */
    --sheen-a: 0.22;                   /* 角色柔光高光强度 */
    --font-body: Inter, "Segoe UI Variable Text", "Segoe UI",
                 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --c-surface: 255 255 255;   /* #ffffff */
      --c-surface-2: 238 241 246; /* #eef1f6 */
      --c-surface-3: 226 231 240;
      --c-border: 216 221 231;    /* #d8dde7 */
      --c-border-2: 195 203 217;  /* #c3cbd9 */
      --c-t-strong: 15 23 42;
      --c-t-200: 31 41 55;
      --c-t-300: 51 65 85;
      --c-t-400: 71 85 105;
      --c-t-500: 100 116 139;
      --c-accent: 105 76 222;
      --c-accent-h: 124 92 240;
      --c-accent-p: 88 62 198;
      --c-accent-2: 14 165 233;
      --c-ok: 5 150 105;
      --c-warn: 217 119 6;
      --c-err: 220 38 38;
      --glass: 0.94;
      --elev-1: 0 2px 10px rgb(15 23 42 / 0.10);
      --elev-2: 0 10px 32px rgb(15 23 42 / 0.18);
      --hair: rgb(255 255 255 / 0.9);
      --c-shadow: 15 23 42;
      --sheen-a: 0.55;
    }
  }
  /* ⚠️ color-scheme 只挂在 #panel 上，绝不挂 :root：
     根元素设 color-scheme 会让 Chromium 去画「默认画布底色」，
     而这是个 transparent 窗，画布必须保持全透明（否则整窗出现一块实心矩形）。
     挂在 #panel 上照样能连带把 <select> 的原生下拉弹层和滚动条切成暗色
     —— color-scheme 是继承属性，会传给面板里的表单控件。 */
  #panel { color-scheme: dark; }
  @media (prefers-color-scheme: light) { #panel { color-scheme: light; } }
  /* 无障碍：跟随系统的「减少动态」（与应用 @layer base 里的同款处理） */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  /* 桌宠渲染器：透明窗，只在角色与气泡区域接收鼠标，其余点击穿透 */
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none; cursor: default;
    font-family: var(--font-body);
  }
  #root {
    width: 100vw; height: 100vh;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding: 8px 8px 10px;              /* 窗口内留边，让角色不至于贴边/顶到屏幕角 */
  }

  /* ---------------- 气泡：暗色玻璃 + 状态色点（对齐应用 .glass-panel） ---------------- */
  /* box-sizing: border-box 是必需的：max-width 204px 正好等于窗口可用宽（220 - 2×8 padding），
     用默认的 content-box 会再加上左右 padding 与边框，气泡横向溢出窗口被裁掉。 */
  #bubble {
    --bub-bd: rgb(var(--c-border) / 0.9);
    position: relative;
    box-sizing: border-box;
    max-width: 204px;
    /* 不参与收缩：气泡是文字块，被压扁就是切字。
       空间不够时让 #panel 去承担（它 overflow-y: auto，能优雅降级成内部滚动）。 */
    flex: 0 0 auto;
    margin-bottom: 6px;
    padding: 9px 12px 10px;
    border-radius: 14px;
    border: 1px solid var(--bub-bd);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair);
    font: 12px/1.5 var(--font-body);
    color: rgb(var(--c-t-200));
    /* 用 overflow-wrap 而不是 word-break: break-all —— 后者会把 "CABLE Output"
       从中间劈成 "CABLE Outpu / t"，中文照样能任意断行，所以没必要牺牲西文词形。 */
    overflow-wrap: anywhere;
    display: none;
    animation: bubble-in .22s cubic-bezier(.22, 1, .36, 1);
  }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(6px) scale(.97); }
  }
  /* 气泡底部小三角（引导感）。自己也要 backdrop-filter，否则这块 14px 玻璃对不上主体。 */
  #bubble::after {
    content: "";
    position: absolute;
    left: 26px; bottom: -7px;
    width: 14px; height: 14px;
    transform: rotate(45deg);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-right: 1px solid var(--bub-bd);
    border-bottom: 1px solid var(--bub-bd);
    border-bottom-right-radius: 3px;
  }
  /* 注意：类名是 s-error（与 BUBBLE.error.cls 对齐），早期写成 .error 导致红底从未生效 */
  #bubble.s-error {
    --bub-bd: rgb(var(--c-err) / 0.45);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair),
                inset 0 0 0 1px rgb(var(--c-err) / 0.10);
    color: rgb(var(--c-err));
  }
  /* 导览气泡：头部标题 + 正文逐字打字 + 底部句子进度 */
  #bubble.guide {
    --bub-bd: rgb(var(--c-accent) / 0.5);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair),
                inset 0 0 0 1px rgb(var(--c-accent) / 0.12);
    cursor: pointer;
  }
  #head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #title {
    font-weight: 600; font-size: 11.5px; letter-spacing: .2px;
    color: rgb(var(--c-t-strong));
  }
  #bubble .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    flex: 0 0 auto; background: rgb(var(--c-t-500));
    box-shadow: 0 0 0 3px rgb(var(--c-t-500) / 0.16);
  }
  #bubble.s-listen .dot { background: rgb(var(--c-accent-2)); box-shadow: 0 0 0 3px rgb(var(--c-accent-2) / 0.20); animation: pulse 1.1s infinite; }
  #bubble.s-think  .dot { background: rgb(var(--c-warn));     box-shadow: 0 0 0 3px rgb(var(--c-warn) / 0.20);     animation: pulse .9s infinite; }
  #bubble.s-play   .dot { background: rgb(var(--c-ok));       box-shadow: 0 0 0 3px rgb(var(--c-ok) / 0.20); }
  #bubble.s-build  .dot { background: rgb(var(--c-accent-h)); box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.22);   animation: pulse 1.3s infinite; }
  #bubble.s-error  .dot { background: rgb(var(--c-err));      box-shadow: 0 0 0 3px rgb(var(--c-err) / 0.20); }
  #bubble.guide    .dot { background: rgb(var(--c-accent));   box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.22); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  #text { min-height: 18px; color: rgb(var(--c-t-300)); }

  #foot { display: none; margin-top: 7px; align-items: center; gap: 5px; }
  #bubble.guide #foot { display: flex; }
  #steps { display: flex; gap: 4px; margin-right: auto; }
  /* 当前句从圆点拉成小胶囊，比单纯换色更好认（呼应应用的进度指示） */
  #steps i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgb(var(--c-t-500) / 0.35);
    transition: background .2s, width .2s, border-radius .2s;
  }
  #steps i.on { background: rgb(var(--c-accent)); width: 14px; border-radius: 999px; }
  #hint { font-size: 10px; color: rgb(var(--c-t-500)); }

  /* ---------------- 快捷面板：「一个装填口，一个扳机」 ----------------
     2026-10-23 重构。改版前是 4 个页签 × 各自一套表单 + 共用动作行 + 状态行 + 最近发送，
     整块面板 13 个可点目标，纵向预算只剩 11px（289 / 300）。照那个加法，「发歌曲」
     只能再开第 5 个页签 —— 必然溢出，而且用户仍然要先想「这条东西属于哪个页」。

     改版后模型只有两层：
       #draft  装填区 —— 按草稿内容自己变形（空 / 文字 + 音效片 / 按住中的波形）
       #fire   主按钮 —— 面板上唯一的动作，文案跟着装填区变
     页签全部删除（它们是按**实现机制**分的：文字合成 / 按键录音 / 声板，不是按用户想做什么）。
     音效与放歌收进「声音托盘」#tray —— 两者的共同点是「此刻送进虚拟声卡，对面实时听到」；
     音色 / 引擎 / 历史收进「更多」#drawer —— 都是设置，不该跟发送动作抢地方。

     宽度预算：窗口 220px − #root 左右各 8px = 204px，内部全部 border-box。
     高度预算：max-height 300px（实测上限见 tools/pet-panel-layout-budget.json），
     空闲态目标 ≈153px —— 余量留给托盘与抽屉，不再靠「挤一挤」装下功能。 */
  #panel {
    display: none;
    box-sizing: border-box;
    width: 204px;
    /* 窗口高 480、角色 150 + #root 上下留白 18 → 面板最多约 300px；
       导览气泡同时出现时可能顶到上限，超出部分内部滚动而不是撑破窗口。 */
    max-height: 300px;
    overflow-y: auto;
    overscroll-behavior: contain;
    margin-bottom: 6px;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid rgb(var(--c-border) / 0.9);
    background: rgb(var(--c-surface) / var(--glass));
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: var(--elev-2), inset 0 1px 0 0 var(--hair);
    font: 12px/1.4 var(--font-body);
    color: rgb(var(--c-t-200));
    /* display:none → block 切换时 CSS 动画会自动重播，等于每次浮现都有入场 */
    animation: panel-in .2s cubic-bezier(.22, 1, .36, 1);
    scrollbar-width: thin;
    scrollbar-color: rgb(var(--c-border-2) / 0.7) transparent;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb {
    background: rgb(var(--c-border-2) / 0.7); border-radius: 999px;
  }

  /* —— 状态条（2026-10-23）：药丸 + 当前音色 + 两个入口 ——
     改版前这一行是「药丸 + 音色 + 推理耗时」，下面紧跟 4 个页签。现在页签没了，
     省下的高度换成了两个 26px 入口（♪ 声音 / ⋯ 更多）—— 常驻可点从 13 个降到 5 个
     （药丸、音色、♪、⋯、主按钮）。
     耗时是诊断信息，挪进「⋯」抽屉；它原本占 35px 宽，而那 35px 正是两个入口的位置。
     宽度预算 184px：药丸 77 + 音色 flex + 26 + 26 + 3×4 gap = 149 + 音色（≈40px）。 */
  #phead { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; min-width: 0; }
  /* 只读状态 chip（音色）：没有交互 → 没有 hover 反馈。包在 button 里只为可点开抽屉。 */
  #panel #rmVoice {
    flex: 1 1 auto; min-width: 0;
    font-size: 10px; color: rgb(var(--c-t-300));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel #rmLat {
    font-size: 10px; color: rgb(var(--c-t-500));
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel #rmLat[hidden] { display: none; }
  /* 音色按钮：外观是一枚 chip，内容是音色名。⚠️ 必须带 .vchip 类：
     `#panel button:not(.primary) { flex: 1 }` 的优先级 (0,2,0,1) 高过 `#panel #voiceBtn`
     的 (0,2,0,0)，少了类名它会被撑成整行，把 ♪ / ⋯ 顶出窗口。 */
  #panel #voiceBtn.vchip {
    flex: 1 1 auto; min-width: 34px; height: 20px; padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: flex-end;
    border-radius: 999px;
    border: 1px solid transparent; background: transparent; box-shadow: none;
    font-size: 10px; font-weight: 400;
  }
  #panel #voiceBtn.vchip:hover {
    border-color: rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
  }
  /* 图标入口（♪ / ⋯）：26px 见方 —— 鼠标场景的最小舒适点击面，不与主按钮抢视觉权重。
     选中态（托盘/抽屉打开）用品牌紫描边，让「现在开着什么」一眼可见。 */
  #panel .icb {
    flex: 0 0 auto; width: 26px; height: 26px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px;
    border: 1px solid transparent; background: transparent; box-shadow: none;
    color: rgb(var(--c-t-400));
  }
  #panel .icb svg { width: 15px; height: 15px; }
  #panel .icb:hover {
    border-color: rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.85);
    color: rgb(var(--c-t-strong));
  }
  #panel .icb.on {
    border-color: rgb(var(--c-accent) / 0.5);
    background: rgb(var(--c-accent) / 0.16);
    color: rgb(var(--c-accent-h));
  }
  #panel .icb { position: relative; }

  /* 药丸现在是个真 <button>（可点 = 变声开关）。⚠️ 选择器里那个 ".pill" 是必需的：
     `#panel button:not(.primary) { flex: 1 }` 是 (0,2,0,1)，比 `#panel #pill` (0,2,0,0) 高，
     少了类名药丸会被撑满头部一行。 */
  #panel #pill.pill {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 4px;
    height: 20px; padding: 0 8px 0 7px; border-radius: 999px;
    border: 1px solid rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
    font-size: 10px; font-weight: 400; color: rgb(var(--c-t-400));
    white-space: nowrap; cursor: pointer; box-shadow: none;
  }
  #panel #pill.pill:hover { border-color: rgb(var(--c-accent) / 0.6); color: rgb(var(--c-t-strong)); }
  #panel #pill.pill:active { transform: translateY(1px); }
  #pill b { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #pill i {
    width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto;
    background: rgb(var(--c-t-500));
  }
  /* 状态药丸色调：tone 由 JS 写在 className 上（见 setPill） */
  #pill.t-listen i { background: rgb(var(--c-accent-2)); box-shadow: 0 0 0 3px rgb(var(--c-accent-2) / 0.16); animation: pulse 1.1s infinite; }
  #pill.t-think  i { background: rgb(var(--c-warn));     box-shadow: 0 0 0 3px rgb(var(--c-warn) / 0.16);     animation: pulse .9s infinite; }
  #pill.t-play   i { background: rgb(var(--c-ok));       box-shadow: 0 0 0 3px rgb(var(--c-ok) / 0.16); }
  #pill.t-build  i { background: rgb(var(--c-accent-h)); box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.18);   animation: pulse 1.3s infinite; }
  #pill.t-err    i { background: rgb(var(--c-err));      box-shadow: 0 0 0 3px rgb(var(--c-err) / 0.16); }
  #pill.t-err {
    border-color: rgb(var(--c-err) / 0.45); color: rgb(var(--c-err));
  }

  /* —— 表单域：自绘前置图标（原生 input/select 放不进图标，用绝对定位的兄弟节点） —— */
  #panel .field { position: relative; display: block; margin-bottom: 6px; }
  /* 录音时输入框整块让位给波形（renderMic 里 field.hidden = rec）。
     ★ 这条不能省：`.field` 是 display:block，作者样式优先于 UA 的 [hidden]{display:none} ——
     少了它，录音时会**同时**出现输入框和波形，白占 33px 并把面板顶到 192px。 */
  #panel .field[hidden] { display: none; }
  #panel .field .lead {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: rgb(var(--c-t-500));
    pointer-events: none; transition: color .16s;
  }
  #panel .field:focus-within .lead { color: rgb(var(--c-accent-h)); }
  #panel input, #panel select {
    width: 100%; box-sizing: border-box;
    padding: 7px 10px 7px 28px;
    border-radius: 11px;
    border: 1px solid rgb(var(--c-border-2) / 0.65);
    outline: none;
    font: inherit;
    background: rgb(var(--c-surface-2) / 0.85);
    color: rgb(var(--c-t-200));
    transition: border-color .16s, box-shadow .16s, background .16s;
  }
  #panel input::placeholder { color: rgb(var(--c-t-500)); }
  #panel input:focus, #panel select:focus {
    border-color: rgb(var(--c-accent) / 0.75);
    box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.18);
    background: rgb(var(--c-surface-2));
  }
  #panel select {
    font-size: 11px; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    text-overflow: ellipsis;
  }
  /* 原生下拉箭头在暗色下不可控，自绘一个（与 #panel select 的 appearance:none 配对） */
  #panel .field.sel::after, #panel .drow.sel::after {
    content: ""; position: absolute; right: 12px; top: 50%;
    width: 5px; height: 5px; margin-top: -4px;
    border-right: 1.5px solid rgb(var(--c-t-500));
    border-bottom: 1.5px solid rgb(var(--c-t-500));
    transform: rotate(45deg); pointer-events: none;
  }

  /* —— 按钮基础外观 —— */
  #panel button {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 26px; padding: 0 10px; border-radius: 11px;
    border: 1px solid rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
    color: rgb(var(--c-t-300));
    font: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer; white-space: nowrap; overflow: hidden;
    transition: background .16s, border-color .16s, color .16s, box-shadow .16s, transform .08s;
  }
  #panel button svg { width: 13px; height: 13px; flex: 0 0 auto; }
  #panel button:hover {
    border-color: rgb(var(--c-border-2));
    background: rgb(var(--c-surface-3) / 0.9);
    color: rgb(var(--c-t-strong));
  }
  #panel button:active { transform: translateY(1px); }
  #panel button:disabled { opacity: .45; cursor: default; box-shadow: none; transform: none; }
  #panel button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.25); }
  /* 忙态：图标换成旋转圈 —— 「合成中」要有看得见的进行中信号，不能只靠变灰 */
  #panel button .spin { display: none; }
  #panel button.busy { pointer-events: none; }
  #panel button.busy svg { display: none; }
  #panel button.busy .spin { display: block; }
  #panel .spin {
    width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%;
    border: 1.5px solid currentColor; border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* —— 主按钮：面板上唯一的动作 ——
     44px 高。它同时承担三种语义，靠 .m-idle / .m-text / .m-rec 切图标与颜色：
       空草稿 → 按住说话（pointerdown 起录、pointerup 停）
       有内容 → 合成并发送
       录制中 → 松开发送（整块转红：绿在面板里已表示「已连接/正在播」）
     高度从旧版「动作行 29px」提到 44px 是这次重构最大的空间来源：删掉 4 个页签
     （22px）+ 引擎行（24px）+ 音色行（29px）+ 最近发送（23px）换来 98px。 */
  #panel #fireRow { display: flex; align-items: stretch; gap: 6px; }
  #panel #fire {
    flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px;
    border-radius: 14px; border-color: transparent;
    background: linear-gradient(135deg, rgb(var(--c-accent-h)), rgb(var(--c-accent)));
    color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 2px 12px rgb(var(--c-accent) / 0.35);
    /* 按住期间光标可能滑出按钮、也可能被系统当成滚动手势：都禁掉，
       否则 pointerup/pointercancel 会以难以预期的方式到达（见渲染层的手势注释）。 */
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #panel #fire:hover {
    color: #fff; filter: brightness(1.08);
    box-shadow: 0 4px 20px rgb(var(--c-accent) / 0.5);
  }
  #panel #fire .ic { display: none; width: 16px; height: 16px; }
  #panel #fire.m-idle .ic-mic { display: block; }
  #panel #fire.m-text .ic-send { display: block; }
  #panel #fire.m-rec  .ic-rec  { display: block; }
  #panel #fire.m-rec {
    background: rgb(var(--c-err) / 0.22);
    border-color: rgb(var(--c-err) / 0.6);
    color: rgb(var(--c-err));
    box-shadow: inset 0 0 0 1px rgb(var(--c-err) / 0.35);
  }
  #panel #fire.m-rec .ic-rec { fill: currentColor; }
  #panel #fire .ic-rec { fill: currentColor; }
  /* 试听：只在「有文字、没在录」时出现（它试听的是文字合成，与按住那条链路无关）。
     36×44 —— 比主按钮窄，但比旧版那颗 29px 的「试听」大：它现在是图标钮，
     靠宽高给足点击面，不再靠文字。 */
  #panel #preview {
    flex: 0 0 auto; width: 36px; height: 44px; padding: 0;
    border-radius: 14px;
  }
  #panel #preview svg { width: 14px; height: 14px; }
  #panel #preview[hidden] { display: none; }

  /* —— 装填区里的音效片（原「预混队列」，2026-10-23 挪进草稿）——
     从前它在音效页底部、和「发送」按钮一起；现在它是**这条语音的一部分**，
     所以长在草稿下面。单行横滚：高度必须钉死（换行会让面板高度随素材数浮动）。 */
  #fxPicks {
    display: flex; flex-wrap: nowrap; gap: 4px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    margin: -2px 0 6px;
  }
  #fxPicks::-webkit-scrollbar { display: none; }
  #fxPicks:empty { display: none; margin: 0; }
  #panel .fxchip {
    display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto;
    height: 18px; padding: 0 7px; border-radius: 999px;
    border: 1px solid rgb(var(--c-accent) / 0.45);
    background: rgb(var(--c-accent) / 0.12);
    font-size: 10px; color: rgb(var(--c-t-300));
    cursor: pointer; white-space: nowrap;
  }
  /* 混入位置字（叠/头/尾）：点 chip 主体循环切换 —— 一个汉字，9px 下也读得清 */
  #panel .fxchip .fm { font-size: 9px; color: rgb(var(--c-accent-h)); }
  #panel .fxchip .fxrm { color: rgb(var(--c-t-500)); font-weight: 600; padding: 0 1px; }
  #panel .fxchip .fxrm:hover { color: rgb(var(--c-err)); }

  /* —— 建议区（2026-10-23 二次重构）———————————————————————————————
     这一块替代了上一版的「音色 chip + ♪ 声音托盘入口」。理由是本项目已经踩过一次的
     老坑：**入口数量本身不是问题，入口不区分此刻有没有用才是问题**。
     12 个功能平铺时用户每次都要先扫一遍再挑；而打开面板的那一刻，上下文其实已经把
     候选压到 2–3 个了（对方刚发消息 / 草稿里有字 / 正在放歌 / 有提案等你点头）。

     所以这里只渲染 `rankActions()` 排在最前面的三条，其余全部退到
     ①输入框搜索 ②⋯ 抽屉的「全部功能」网格。三条之外不再有常驻入口。

     高度：每条 26px + 4px gap，最多 3 条 = 86px。空闲态整面板 ≈232px（上限 300px）。
     `#recs[hidden]` 必须显式写：flex 容器会盖掉 UA 的 [hidden]{display:none}。 */
  #recs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  #recs[hidden] { display: none; margin: 0; }
  #panel .rec {
    display: flex; align-items: center; gap: 6px;
    box-sizing: border-box; width: 100%; height: 26px; padding: 0 8px;
    /* flex: 0 0 auto 是必须的：`#panel button:not(.primary){flex:1}` 的优先级
       比本选择器高（多了 :not 里的类），不写死会在 #recs 这个 column flex 里被
       拉成等高，三条推荐把面板顶到上限。 */
    flex: 0 0 auto;
    border-radius: 9px;
    border: 1px solid rgb(var(--c-border-2) / 0.55);
    background: rgb(var(--c-surface-2) / 0.55);
    color: rgb(var(--c-t-200));
    font: inherit; font-size: 11px; text-align: left;
    justify-content: flex-start;
    cursor: pointer; transition: border-color .14s, background .14s;
  }
  #panel .rec:hover { border-color: rgb(var(--c-accent) / 0.55); background: rgb(var(--c-accent) / 0.1); }
  #panel .rec:focus-visible { outline: 2px solid rgb(var(--c-accent) / 0.6); outline-offset: 1px; }
  /* 图标位：15px 见方，纯描边 —— 与 .icb 保持同一套视觉，不加底色块 */
  #panel .rec .ri {
    flex: 0 0 13px; width: 13px; height: 13px;
    color: rgb(var(--c-t-400));
  }
  #panel .rec .rl {
    flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 右侧理由：只在**有话可说**时出现（"对方在等"），不写"推荐"这种废话 */
  #panel .rec .rh {
    flex: 0 0 auto; max-width: 62px;
    font-size: 9.5px; color: rgb(var(--c-t-500));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 值得打断用户的推荐（对方在等 / 有提案待确认）用绿色描边 —— 与药丸的「在跑」
     同色系，含义一致：**这里有个正在进行、需要你看一眼的事**。 */
  #panel .rec.hot { border-color: rgb(var(--c-ok) / 0.5); background: rgb(var(--c-ok) / 0.08); }
  #panel .rec.hot .rh { color: rgb(var(--c-ok)); }
  /* 琥珀 = 「在提醒你」，绿 = 「有东西等你确认」。两种信号必须不同色：
     上一版两条都用绿，视觉上是两团同样重的东西，用户反而看不出先做哪个。 */
  #panel .rec.warn { border-color: rgb(var(--c-warn) / 0.5); background: rgb(var(--c-warn) / 0.08); }
  #panel .rec.warn .rh { color: rgb(var(--c-warn)); }
  #panel .rec.busy { opacity: .55; pointer-events: none; }

  /* —— 按住中的波形（替代输入框）——
     为什么要有它：改版前「按住说话」是独立页签里的一颗大按钮，按下后除了秒数没有
     别的反馈，用户不知道「现在有没有在录」。波形 + 红点是那个问题的答案。
     26px 高：比输入框（32px）矮，所以录制中面板反而更矮 —— 预算不会因此变紧。 */
  #recBox {
    display: flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 10px; margin-bottom: 6px;
    border-radius: 11px;
    border: 1px solid rgb(var(--c-err) / 0.5);
    background: rgb(var(--c-err) / 0.10);
    color: rgb(var(--c-err));
  }
  #recBox[hidden] { display: none; }
  #recBox .rec-dot {
    flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; animation: pulse 1s infinite;
  }
  #recBox .bars { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0; }
  #recBox .bars i {
    flex: 1 1 0; min-width: 2px; max-width: 4px; height: 4px; border-radius: 2px;
    background: currentColor; opacity: .8;
    animation: rec-bar .9s ease-in-out infinite;
  }
  #recBox .bars i:nth-child(1) { animation-delay: 0s;    }
  #recBox .bars i:nth-child(2) { animation-delay: .12s;  }
  #recBox .bars i:nth-child(3) { animation-delay: .24s;  }
  #recBox .bars i:nth-child(4) { animation-delay: .36s;  }
  #recBox .bars i:nth-child(5) { animation-delay: .48s;  }
  #recBox .bars i:nth-child(6) { animation-delay: .60s;  }
  #recBox .bars i:nth-child(7) { animation-delay: .72s;  }
  #recBox .bars i:nth-child(8) { animation-delay: .30s;  }
  #recBox .bars i:nth-child(9) { animation-delay: .18s;  }
  @keyframes rec-bar { 0%,100% { height: 4px; } 50% { height: 14px; } }
  #micSec {
    flex: 0 0 auto; font-size: 10px; font-variant-numeric: tabular-nums;
    color: currentColor; opacity: .9;
  }

  /* —— 手势提示行：#hint ——
     常驻一行 11px。三件事按优先级轮流显示（JS: refreshHint）：
       录制中 → 「松手就发」；按住前的预检 → 「微信已打开 / 没在运行」；否则 → 一句用法。
     旧版预检（#holdPre）只在「按住」页里可见，改版后它跟着主按钮走 ——
     因为按住就是这个按钮的默认动作。整段原因进 title（省略号会切掉下一步）。 */
  #panel #gesture {
    margin-top: 5px;
    font-size: 10px; line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: rgb(var(--c-t-500));
  }
  #panel #gesture.t-ok   { color: rgb(var(--c-ok)); }
  #panel #gesture.t-warn { color: rgb(var(--c-warn)); }
  #panel #gesture.t-bad  { color: rgb(var(--c-err)); }

  /* —— 状态行：发送/合成的结论 ——
     max-height 是**必需**的：状态文案里有一条是 `合成失败：${后端 detail}`，
     长度完全由后端决定。封到 42px（两行）后内容固定，更长的在行内滚动，不再影响整体高度。 */
  #status {
    display: none; align-items: flex-start; gap: 6px;
    box-sizing: border-box;
    max-height: 42px; overflow-y: auto; overscroll-behavior: contain;
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid rgb(var(--c-border) / 0.85);
    font-size: 10.5px; line-height: 1.5;
    color: rgb(var(--c-t-400)); overflow-wrap: anywhere;
  }
  #status::-webkit-scrollbar { width: 4px; }
  #status::-webkit-scrollbar-track { background: transparent; }
  #status::-webkit-scrollbar-thumb {
    background: rgb(var(--c-border-2) / 0.8); border-radius: 999px;
  }
  #status.show { display: flex; }
  #status .sic { display: none; flex: 0 0 auto; width: 12px; height: 12px; margin-top: 1.5px; }
  #status .ic-info { display: block; color: rgb(var(--c-t-500)); }
  #status.ok  { color: rgb(var(--c-ok)); }
  #status.ok  .ic-info { display: none; }
  #status.ok  .ic-ok   { display: block; color: rgb(var(--c-ok)); }
  #status.err { color: rgb(var(--c-err)); }
  #status.err .ic-info { display: none; }
  #status.err .ic-err  { display: block; color: rgb(var(--c-err)); }
  /* 发送成功但录音环境有告警（典型：微信绑的不是 CABLE → 录进去很可能是静音）。 */
  #status.warn { color: rgb(var(--c-warn)); }
  #status.warn .ic-info { display: none; }
  #status.warn .ic-err  { display: block; color: rgb(var(--c-warn)); }

  /* —— 声音托盘 #tray：音效 + 放歌 ——
     为什么两者合成一个托盘而不是各留一个入口：它们的共同点是「此刻送进虚拟声卡，
     对面实时听到」（与主按钮的「发一条消息」是两条不同的链路），而且**可以同时用**
     —— 放着歌点音效不会把歌掐断（board_worker 的垫底层是独立音频流）。
     既然总是一起被用到，就不该让用户先选进哪个页面。
     托盘高度：放歌区 76 + 音效网格 2 行 78 ≈ 154，加进空闲态 153 → 约 307，
     所以 #fxGrid 钉死 max-height（超出内滚），面板整体仍受 300 上限保护。 */
  #tray {
    margin-top: 3px; padding-top: 4px;
    border-top: 1px solid rgb(var(--c-border) / 0.85);
  }
  #tray[hidden] { display: none; }
  /* 托盘打开时收起手势提示行：托盘是「此刻出声」，发送手势那句在它打开时不是重点，
     而 15px 正好把它从 300px 上限外面拉回来（#panel.has-tray，见抽屉那段同一条规则）。 */
  #panel.has-tray #gesture { display: none; }
  /* 托盘打开时也收起音效片（#fxPicks）。不是嫌它乱，是放歌卡从一行变两行要 42px，
     而这 42px 只能从这里借：托盘本身是「此刻出声」，装配草稿是另一件事 ——
     点格子上的 ＋ 仍有反馈（格子变 ✓、主按钮上的「·N」加一）。 */
  #panel.has-tray #fxPicks { display: none; }
  /* 放歌卡：两行（曲目 / 放歌键 + 音量），左侧一条品牌紫竖线做分组。
     2026-10-23 从「一行三个控件」恢复成两行 —— 用户原话「那个放歌的面板也没了呀」：
     功能一个没少，但压成一行之后它变成了音效网格的附属品。 */
  #bgmCard {
    position: relative;
    display: block; padding: 3px 3px 3px 7px; border-radius: 2px 10px 10px 2px;
    /* 一条紫色竖线而不是整块底框：204px 里 2px 的内边距沿根本露不出「卡面」，
       画个框只会多占高度还看不出来。竖线是分组标记里最便宜的一种 —— 0px 高度。 */
    border-left: 2px solid rgb(var(--c-accent) / 0.45);
  }
  /* 曲目行左侧的 ♪：204px 里放不下「放歌」两个字做标题，一个音符就是这块卡的名字。
     （tab 键焦点仍落在 select 上，装饰不参与命中。） */
  #bgmCard .field2::before {
    content: "♪"; position: absolute; left: 7px; top: 50%; z-index: 1;
    transform: translateY(-50%);
    font-size: 11px; line-height: 1; color: rgb(var(--c-t-400));
    pointer-events: none;
  }
  #bgmCard.on { border-left-color: rgb(var(--c-accent)); }
  #bgmCard .field2 { position: relative; min-width: 0; }
  /* 歌名单行。左内边距 19px 是给 ::before 那个 ♪ 让位（不是给 .lead 图标）；
     右 26px 给放大镜（搜歌入口）让位 —— 库里的歌找不到时，这里是唯一出口。 */
  #panel #bgmSel {
    width: 100%;
    padding: 4px 26px 4px 19px; font-size: 11px;
    height: 24px;
  }
  /* 搜歌入口：长在放歌卡里而不是 #phead 上 —— 顶栏 204px 已经塞不下第四个 26px
     图标（再挤就会把音色名压到 13px）。放大镜跟着「放歌」这张卡走，语义也最顺。 */
  #panel #songBtn {
    position: absolute; right: 1px; top: 1px;
    width: 22px; height: 22px; padding: 0;
    border: 0; background: transparent; color: rgb(var(--c-t-500));
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #panel #songBtn:hover { color: rgb(var(--c-accent-h)); }
  #panel #songBtn svg {
    width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.7;
  }
  #bgmCtlRow { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  /* 放歌键带字：「▶」单个三角在 204px 里太像「展开这一行」，
     而它其实是**此刻出声**（送进虚拟声卡，对面听得到）。字比图标更适合解释这件事。 */
  #panel #bgmBtn {
    flex: 1 1 auto; min-width: 0; height: 24px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; font-weight: 600;
  }
  #panel #bgmBtn.on {
    border-color: rgb(var(--c-accent) / 0.55);
    background: rgb(var(--c-accent) / 0.20);
    color: rgb(var(--c-accent-h));
  }
  /* 音量与放歌键同一行：旧版是一行独立滑块（18px），与歌名脱节又占高度 */
  #panel #bgmGain {
    flex: 0 0 56px; min-width: 0; height: 16px;
    padding: 0; border: 0; border-radius: 0; background: transparent;
    accent-color: rgb(var(--c-accent-h)); cursor: pointer;
  }
  /* ⚠️ 原来这里还有 #bgmHint（9.5px 的第二行灰字）—— 删了，理由见 DOM 那边同一条注释：
     「放歌行 + 说明行 + 网格」在 300px 上限里滚出 17px，而托盘里已经有放歌行本身
     在表达状态（选中项 = 正在放的那首；空态/错因写在 option 里）。 */
  /* 放歌中锁住选歌框：垫层只有一层，选中项与正在放的那首**必须**一致，
     否则「停」到底停的是哪首就成了猜谜。换歌 = 停 → 选 → 放。 */
  #panel #bgmSel:disabled { opacity: .55; cursor: default; }

  /* —— 音效网格 ——
     2 列 × 36px：204px 宽度下每格 87px，装得下「完结撒花」（4 字 × 10px）。
     旧版是 3 列 × 34px（每格 57px，名字被省略号吃掉一半）—— 3 列换来的只是
     「一行多一个」，却让每个名字都不可读，而托盘里本来就可以纵向滚。
     max-height 钉死两行：样本再多也只在网格内部滚动，不撑高面板。 */
  #fxGrid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
    max-height: 76px; overflow-y: auto; overscroll-behavior: contain;
    margin-top: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgb(var(--c-border-2) / 0.7) transparent;
  }
  #fxGrid:empty { display: none; margin-top: 0; }
  /* 格子 = 「点一下现场播」+ 右上角 ＋「加进这条语音」（仿 Spotify：点行播放、点 + 加歌单）。
     改版前必须先选「实时播放 / 混进语音」再点格子 —— 一个动作被拆成两步预判。 */
  #panel .fxc {
    position: relative;
    display: flex; align-items: center; gap: 4px;
    height: 36px; padding: 0 24px 0 7px;
    border-radius: 10px;
    border: 1px solid rgb(var(--c-border-2) / 0.7);
    background: rgb(var(--c-surface-2) / 0.8);
    color: rgb(var(--c-t-300));
    font: inherit; line-height: 1.1;
    cursor: pointer; overflow: hidden;
    transition: background .16s, border-color .16s, color .16s;
  }
  #panel .fxc:hover { border-color: rgb(var(--c-border-2)); background: rgb(var(--c-surface-3) / 0.9); color: rgb(var(--c-t-strong)); }
  #panel .fxc .fe { flex: 0 0 auto; font-size: 12px; line-height: 1; }
  #panel .fxc .fn {
    flex: 1 1 auto; min-width: 0; font-size: 10px; color: rgb(var(--c-t-400));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 播放中 = 品牌紫；已加进语音 = 品牌紫描边 + ＋ 变 ✓。
     ⚠️ 这两个状态可以**同时**存在（正放着的那一格也可以被加进语音）。 */
  #panel .fxc.on {
    background: rgb(var(--c-accent) / 0.22); border-color: rgb(var(--c-accent) / 0.55);
    color: rgb(var(--c-accent-h));
  }
  #panel .fxc.on .fn { color: rgb(var(--c-accent-h)); }
  #panel .fxc.pick { border-color: rgb(var(--c-accent) / 0.7); }
  #panel .fxc.pick .fn { color: rgb(var(--c-accent-h)); }
  /* ＋ 是格子里的**子按钮**：点格子播、点它加进语音。用绝对定位而不是 flex 子项，
     这样点它时 e.target 的判断不受布局影响（见事件委托）。 */
  #panel .fxc .fadd {
    position: absolute; right: 2px; top: 2px; bottom: 2px;
    width: 22px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: 11px; font-weight: 700; line-height: 1;
    color: rgb(var(--c-t-500)); background: transparent;
  }
  #panel .fxc .fadd:hover { background: rgb(var(--c-accent) / 0.18); color: rgb(var(--c-accent-h)); }
  #panel .fxc.pick .fadd { color: rgb(var(--c-accent-h)); }
  #fxEmpty { margin-top: 5px; font-size: 9.5px; line-height: 1.5; color: rgb(var(--c-t-500)); }
  #fxEmpty:empty { display: none; }

  /* —— 搜歌层 #songLayer：抖音榜 / B站榜 / B站搜索 ——
     为什么是「一整层」而不是放歌卡里再加一行：204px 宽里，榜单/搜索框/结果至少
     需要 180px 高，和放歌卡、音效网格叠在一起必然撑破 300px 上限。
     打开时把草稿区与主按钮一起收起 —— 找歌是独立任务，点一首歌后自动回到托盘继续放，
     不需要一边找歌一边看着「按住说话」。 */
  #panel.has-songs #draft,
  #panel.has-songs #fireRow,
  #panel.has-songs #gesture,
  #panel.has-songs #fxPicks { display: none; }
  /* ★ 必须有这条：下面给 #songLayer 写了 display，作者样式会盖掉 UA 的 [hidden]。
     这是本项目第 N 次踩同一个坑（见 .field[hidden] 与 #fxPicks:empty）。 */
  #songLayer[hidden] { display: none; }
  #songLayer { margin-top: 3px; }
  #songHead { display: flex; align-items: center; gap: 4px; }
  #songHead .st { font-size: 11px; font-weight: 650; color: rgb(var(--c-t-300)); }
  #panel #songBack {
    flex: 0 0 auto; width: 22px; height: 20px; padding: 0;
    border-radius: 7px; font-size: 13px; line-height: 1;
  }
  #songSrc { display: flex; gap: 3px; margin-left: auto; }
  #panel #songSrc button {
    height: 20px; padding: 0 7px; border-radius: 999px;
    border-color: transparent; background: transparent;
    font-size: 9.5px; color: rgb(var(--c-t-400));
  }
  #panel #songSrc button.on {
    color: rgb(var(--c-accent-h));
    border-color: rgb(var(--c-accent) / 0.45);
    background: rgb(var(--c-accent) / 0.14);
  }
  /* 搜索框复用主输入框的样式，但矮 4px（28 vs 32）：它只是这个分层里的工具行。 */
  #songQWrap { margin: 5px 0 4px; }
  #panel #songQ { height: 28px; padding: 4px 8px 4px 27px; font-size: 11px; }
  /* 结果列表钉死 3 行半：再多就在层内滚，不把面板顶高。 */
  #songList {
    max-height: 112px; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgb(var(--c-border-2) / 0.7) transparent;
  }
  #songList:empty { display: none; }
  /* 一行 = 排名/来源 + 歌名 + 歌手/时长 + 动作。整行是 button（点哪都触发），
     行内不再放子按钮 —— 204px 宽度里两颗热区只会互相抢点击。 */
  #panel .srow {
    display: flex; align-items: center; gap: 5px;
    width: 100%; height: 34px; padding: 0 6px;
    border: 0; border-radius: 8px; background: transparent;
    text-align: left; cursor: pointer;
  }
  #panel .srow:hover { background: rgb(var(--c-surface-3) / 0.85); }
  #panel .srow.busy { opacity: .62; pointer-events: none; }
  #panel .srow .sr {
    flex: 0 0 13px; text-align: right;
    font-size: 9px; color: rgb(var(--c-t-500));
  }
  #panel .srow .si { display: block; flex: 1 1 auto; min-width: 0; }
  #panel .srow .st {
    display: block;
    font-size: 10.5px; line-height: 1.25; color: rgb(var(--c-t-200));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel .srow .sm {
    display: block;
    font-size: 9px; line-height: 1.25; color: rgb(var(--c-t-500));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel .srow .sg { flex: 0 0 auto; font-size: 11px; color: rgb(var(--c-accent-h)); }
  #panel .srow.busy .sg { animation: pulse 1s infinite; }
  /* 取回进度/错误只写这一行；空的时候不占高度。 */
  #songNote { margin-top: 3px; font-size: 9.5px; line-height: 1.4; color: rgb(var(--c-t-500)); }
  #songNote:empty { display: none; }
  #songNote.err { color: rgb(var(--c-err)); }

  /* —— 微信雷达层 #radarLayer：「该不该回」（hook.radar）——
     为什么也是一整层：大结论 + 原因 + 三条信号，和搜歌层一样塞不进任何一行。
     打开时收起草稿区与主按钮 —— 看雷达的人此刻不想发消息；关掉能力时整层
     连同入口一起由 refreshCapVisibility 收（它是纯只读层，不发任何请求）。
     判断语义全在后端（judge.py 的 ACTION_LABEL），这里只做展示不造文案。 */
  #panel.has-radar #draft,
  #panel.has-radar #fireRow,
  #panel.has-radar #gesture,
  #panel.has-radar #fxPicks { display: none; }
  #radarLayer[hidden] { display: none; }
  #radarLayer { margin-top: 3px; }
  #radarHead { display: flex; align-items: center; gap: 4px; }
  #radarHead .st { font-size: 11px; font-weight: 650; color: rgb(var(--c-t-300)); }
  /* 「重新观察」：长得像状态字（9px 灰）但可点；压掉 button:not(.primary) 的 flex:1。 */
  #panel #radarLive {
    flex: 0 0 auto; margin-left: auto; height: auto; padding: 1px 2px;
    border: 0; background: transparent; box-shadow: none;
    font-size: 9px; color: rgb(var(--c-t-500));
  }
  #panel #radarLive:hover { color: rgb(var(--c-accent-h)); }
  #panel #radarBack {
    flex: 0 0 auto; width: 22px; height: 20px; padding: 0;
    border-radius: 7px; font-size: 13px; line-height: 1;
  }
  #rdCard {
    margin-top: 5px; padding: 9px 8px 8px; text-align: center;
    border-radius: 11px;
    border: 1px solid rgb(var(--c-border) / 0.9);
    background: rgb(var(--c-surface-2) / 0.55);
  }
  #rdVerdict { font-size: 17px; font-weight: 750; letter-spacing: .5px; color: rgb(var(--c-t-300)); }
  #rdCard.v-now     #rdVerdict { color: rgb(var(--c-ok)); }
  #rdCard.v-soon    #rdVerdict { color: rgb(var(--c-accent-h)); }
  #rdCard.v-wait    #rdVerdict { color: rgb(var(--c-warn)); }
  #rdCard.v-unknown #rdVerdict { color: rgb(var(--c-t-500)); }
  #rdReason { margin-top: 2px; font-size: 10px; line-height: 1.45; color: rgb(var(--c-t-400)); }
  /* 三条信号：标签靠左、值靠右；值用等宽数字 —— 秒数在跳动时不抖宽。 */
  #rdSignals { margin-top: 7px; display: grid; grid-template-columns: 1fr; gap: 2px; }
  #panel .rrow {
    display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
    font-size: 10px; color: rgb(var(--c-t-400));
  }
  #panel .rrow b {
    font-weight: 550; color: rgb(var(--c-t-200));
    font-variant-numeric: tabular-nums;
  }
  #rdNote { margin-top: 3px; font-size: 9.5px; line-height: 1.4; color: rgb(var(--c-t-500)); }
  #rdNote:empty { display: none; }
  #rdNote.err { color: rgb(var(--c-err)); }
  /* 抽屉里的雷达行：整行可点（div[role=button]），行尾值实时显示结论。 */
  #panel #radarRow { cursor: pointer; }
  #panel #radarRow:hover { border-color: rgb(var(--c-accent) / 0.55); }
  /* 行尾值必须靠右：.dl 是 flex:0 0 auto，label 不推就会紧贴标题左侧
     （实测「该不该回 该回了」挤成一坨，看着像一句不通的话）。 */
  #panel #radarRowLabel, #panel #trayRowLabel { margin-left: auto; font-size: 10px; color: rgb(var(--c-t-400)); }
  #panel #radarRowLabel.rd-now { color: rgb(var(--c-ok)); font-weight: 600; }
  /* ⋯ 按钮上的「该回了」绿点：不打开抽屉也能看见 —— 这是雷达存在的意义。 */
  #moreBtn .rdot {
    position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 999px;
    background: rgb(var(--c-ok));
    box-shadow: 0 0 0 2.5px rgb(var(--c-ok) / 0.25);
    animation: pulse 1.1s infinite;
  }

  /* —— 更多抽屉 #drawer：音色 / 引擎 / 最近发送 ——
     这些是「设置」，进来的频率远低于发送；放进抽屉后它们不再跟主按钮抢注意力。
     抽屉打开时收起提示行与音效片：那两样属于「发送」，而抽屉是「配置」——
     同时在场会让面板在 300px 上限边缘挣扎（见 #panel.has-drawer 那条）。
     高度：音色 26 + 引擎 26 + 直出 18 + 分隔 7 + 标题 14 + 历史 22 ≈ 120。 */
  #drawer {
    margin-top: 6px; padding-top: 7px;
    border-top: 1px solid rgb(var(--c-border) / 0.85);
  }
  #drawer[hidden] { display: none; }
  /* 每个分层打开时，面板只留**该分层自己**的内容：抽屉是「配置」，托盘是「声音」，
     而 #hint 讲的是发送手势与微信预检 —— 同时在场就会在 300px 上限边缘挣扎。
     建议区（#recs）同理：它是**主面板**的入口，进了分层就该让位。
     不收起的话，抽屉里再出现「点歌 / 音效 / 该不该回」三条，就是刚删掉的那种重复。 */
  /* 抽屉打开时底部留白收紧：内容本来就贴着 300px 上限，10px 的底 padding 换成 6px
     刚好把「最近发送」的最后一条从折缝里拉回来（实测 304 → 300）。 */
  #panel.has-drawer { padding-bottom: 6px; }
  #panel.has-drawer #gesture, #panel.has-drawer #fxPicks,
  #panel.has-drawer #recs,
  #panel.has-tray #recs,
  #panel.has-songs #recs,
  #panel.has-radar #recs { display: none; }
  #panel .drow { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  /* .drow 是 display:flex，而 UA 的 [hidden]{display:none} 优先级更低 —— 不写这条
     隐藏不掉（#latRow 靠它整行出现/消失）。 */
  #panel .drow[hidden] { display: none; }
  #panel .drow:last-child { margin-bottom: 0; }
  #panel .dl {
    flex: 0 0 auto; font-size: 10px; letter-spacing: .2px; color: rgb(var(--c-t-500));
  }
  #panel .drow select { flex: 1 1 auto; min-width: 0; padding: 4px 20px 4px 7px; height: 24px; font-size: 10.5px; }
  #panel .drow.sel { position: relative; }
  /* 引擎二选一：点没选中的 = 切过去；点已选中的 = 启动/停止（唯一启停入口）。
     两个引擎在后端互斥（互相 409：抢 GPU 且都占 CABLE），所以是「选一个」而不是两个开关。 */
  #engineSeg {
    flex: 1 1 auto; min-width: 0;
    display: flex; gap: 2px; padding: 2px;
    border-radius: 9px;
    border: 1px solid rgb(var(--c-border) / 0.9);
    background: rgb(var(--c-surface-2) / 0.55);
  }
  #panel #engineSeg button {
    box-sizing: border-box;
    flex: 1 1 0; min-width: 0; height: 18px; padding: 0 3px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 7px; background: transparent;
    box-shadow: none; transform: none;
    font-size: 10px; font-weight: 600; line-height: 1;
    color: rgb(var(--c-t-400));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #panel #engineSeg button:hover { background: rgb(var(--c-surface-3) / 0.75); color: rgb(var(--c-t-200)); }
  /* 选中 = 品牌紫底；运行中 = 绿底 + 绿描边（放在 .on 之后，运行时绿盖紫）。 */
  #panel #engineSeg button.on {
    background: rgb(var(--c-accent) / 0.20);
    color: rgb(var(--c-accent-h));
    box-shadow: inset 0 0 0 1px rgb(var(--c-accent) / 0.34);
  }
  #panel #engineSeg button.running {
    background: rgb(var(--c-ok) / 0.18);
    color: rgb(var(--c-ok));
    box-shadow: inset 0 0 0 1px rgb(var(--c-ok) / 0.45);
    animation: pulse 1.6s infinite;
  }
  /* 「千问直出」：勾上 = 纯千问零样本克隆（快、语气自然，不过 RVC）；
     不勾 = 合成后再过 RVC 换声（音色更像训练目标）。 */
  #noRvcField { display: flex; align-items: center; gap: 5px; height: 18px; cursor: pointer; }
  #noRvcField input {
    width: auto; flex: 0 0 auto; margin: 0; padding: 0; border: 0;
    accent-color: rgb(var(--c-accent-h));
  }
  #noRvcField span { font-size: 10px; color: rgb(var(--c-t-500)); }
  #panel .dsep { height: 1px; margin: 6px 0; background: rgb(var(--c-border) / 0.85); }
  #panel .dgroup { margin-bottom: 3px; font-size: 9.5px; letter-spacing: .2px; color: rgb(var(--c-t-500)); }

  /* 最近发送：单行横滚（换行会让高度随条目数浮动）。点一条 = 重发。 */
  #panel #recent {
    display: flex; flex-wrap: nowrap; gap: 4px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  #panel #recent::-webkit-scrollbar { display: none; }
  #panel #recent:empty { display: none; }
  #panel .hitem {
    display: inline-flex; align-items: center; flex: 0 0 auto;
    height: 20px; padding: 0 8px; border-radius: 999px;
    border: 1px solid rgb(var(--c-border-2) / 0.6);
    background: rgb(var(--c-surface-2) / 0.7);
    font-size: 10px; color: rgb(var(--c-t-400));
    cursor: pointer; white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: border-color .16s, background .16s, color .16s;
  }
  #panel .hitem:hover {
    border-color: rgb(var(--c-accent) / 0.6);
    background: rgb(var(--c-accent) / 0.14);
    color: rgb(var(--c-accent-h));
  }
  #panel .hempty { font-size: 10px; color: rgb(var(--c-t-500)); }
  /* 原文件已随会话清理的历史条目 —— **不可点**。
     ★ hover 也必须不变色：面板上"会变色 = 能点"是用户唯一的暗示，
       给一个和能点条目一样的 hover，等于骗他点一下、然后什么都不发生。 */
  #panel .hitem.hgone { cursor: default; opacity: .55; }
  #panel .hitem.hgone:hover {
    border-color: rgb(var(--c-border-2) / 0.6);
    background: rgb(var(--c-surface-2) / 0.7);
    color: rgb(var(--c-t-400));
  }

  /* —— 气泡在屏时的「让位」规则 ——
     气泡与面板共用同一个 480px 高的窗口，可用高是：
       480(窗高) - 18(#root 上下留白) - 150(角色) - 6(面板下边距) - 气泡 - 6(气泡下边距)。
     气泡一起来面板就被压扁。改版前面板自然高 289px（只剩 11px 余量），所以要让位；
     改版后空闲态只有 ~153px，最紧的形态是「托盘打开 + 大头气泡」——
     那时收起的不再是「最近发送」（它已经在抽屉里），而是**提示行与音效片**
     （它们都是可以稍后再看的辅助信息）。 */
  #root.compact #panel #gesture { display: none; }
  #root.compact #panel .field { margin-bottom: 4px; }
  #root.compact #panel #fxGrid { max-height: 40px; }
  /* 气泡在屏时收起音色 chip：头部这一行只有 184px，而药丸在「RVC 变声中」「后端离线」
     这类状态下要 66~77px，音色名（袋鼠骑士 = 40px）再占 72px 就装不下了 ——
     实测被压到 25px，「袋鼠骑士」变成「袋鼠…」，等于没显示。
     收掉它之后这一行只剩「状态 + ♪ + ⋯」，三样都读得全；音色名在气泡收起后立刻回来，
     而且抽屉里一直有。让位给**正在说话的那块气泡**，比让状态或入口变省略号合理。 */
  #root.compact #panel #voiceBtn { display: none; }
  /* ★ 气泡在屏时建议区只留**第一条**（2026-10-23 二次重构）。
     实测：气泡一起来，可用高从 298 掉到 216，而主面板（phead 26 + draft 33 +
     recs 86 + fireRow 44 + gesture 15）要 225px —— 底部被切 9px 并冒出内部滚动条。
     三条推荐里只有第一条是「此刻最该做的」，其余两条是备选；让位给正在说话的气泡，
     比给面板开一条滚动条合理（用户此时要么在读气泡、要么在等第一条）。
     纯 CSS 实现（不碰 JS）：:nth-child(n+2) 收掉其余，recs 高度 86→26。 */
  #root.compact #panel #recs .rec:nth-child(n+2) { display: none; }

  /* 放歌中角标：面板收起后（鼠标不在桌宠上）这是「歌还在放」的唯一提示。
     默认 display:none，靠 JS 挂 .on 才出现 —— 空闲时它不该在角色身上挂着。 */
  #bgmBadge {
    display: none; position: absolute; top: 6px; right: 6px; z-index: 3;
    width: 18px; height: 18px; border-radius: 999px;
    align-items: center; justify-content: center;
    font-size: 11px; line-height: 1;
    color: rgb(var(--c-accent-h));
    background: rgb(var(--c-surface-2) / 0.85);
    box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.4);
    pointer-events: none;
    animation: bgm-pop 1.8s ease-in-out infinite;
  }
  #bgmBadge.on { display: flex; }
  @keyframes bgm-pop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  /* ---------------- 角色 ---------------- */
  /* 尺寸由 JS 按皮肤 frameW/frameH 注入（--dw/--dh 显示尺寸，含整数倍放大），
     默认回退 150×150（芙宁娜内置）。像素素材放大时 image-rendering: pixelated 保持锐利。 */
  #pet {
    position: relative;
    width: var(--dw, 150px); height: var(--dh, 150px);
    cursor: grab;                  /* 拖拽由 JS+IPC 手动实现（app-region 在透明穿透窗上不可靠） */
    display: flex; align-items: flex-end; justify-content: center;
    transform-origin: 50% 85%;
    /* 角色脚下的椭圆投影，给「落地感」 */
    filter: drop-shadow(0 6px 10px rgb(var(--c-shadow) / 0.18));
  }
  #pet:active { cursor: grabbing; }
  /* 背景装饰光晕：径向渐变 + 细腻边框，让透明窗里角色不「飘」在裸桌面上。
     光晕改用品牌紫（原为天蓝），与面板主色同源。 */
  #pet::before {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background:
      radial-gradient(50% 50% at 50% 78%, rgb(var(--c-accent) / 0.16), transparent 70%),
      radial-gradient(38% 32% at 50% 92%, rgb(var(--c-shadow) / 0.14), transparent 80%);
    box-shadow:
      inset 0 0 0 1px rgb(var(--c-border-2) / 0.4),
      inset 0 -6px 16px rgb(var(--c-accent) / 0.07);
    pointer-events: none;
    z-index: 0;
  }
  /* 光晕里的一点柔和高光（左上），增强立体感。暗色下要收敛，否则在暗桌面上发白。 */
  #pet::after {
    content: "";
    position: absolute;
    inset: 18px auto auto 22px;
    width: 26px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgb(255 255 255 / var(--sheen-a)), transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  #pet #sprite { position: relative; z-index: 1; }
  /* 精灵图动画：<div> + WebP 背景 + steps() 关键帧（替代原 SVG 内 SMIL）。
     帧横向拼接，帧宽不定——--fw/--fh 由 JS 按皮肤注入，回退 150。 */
  #pet #sprite {
    width: var(--fw, 150px); height: var(--fh, 150px);
    -webkit-user-drag: none; pointer-events: auto;
    background-repeat: no-repeat;
    will-change: background-position;   /* 提示合成层，减少逐帧重绘掉帧 */
    transform: translateZ(0);
    animation: pet-steps 3.0s steps(37) infinite;   /* 默认 idle，运行时被 JS 覆盖 */
  }
  @keyframes pet-steps {
    from { background-position-x: 0; }
    to   { background-position-x: calc(var(--n, 37) * var(--fw, 150px) * -1); }
  }

  /* 页面专属动作：挂在 #pet 外层，与精灵图自身的逐帧动画互不干扰 */
  #pet.m-pop   { animation: m-pop .62s cubic-bezier(.34,1.56,.64,1) 2; }
  #pet.m-wave  { animation: m-wave 1.5s ease-in-out infinite; }
  #pet.m-lean  { animation: m-lean 2.4s ease-in-out infinite; }
  #pet.m-nod   { animation: m-nod 1.3s ease-in-out infinite; }
  #pet.m-sway  { animation: m-sway 3.2s ease-in-out infinite; }
  #pet.m-jump  { animation: m-jump .95s cubic-bezier(.3,.7,.4,1) infinite; }
  #pet.m-twirl { animation: m-twirl 2.4s ease-in-out infinite; }
  @keyframes m-pop   { 0%,100% { transform: scale(1); } 45% { transform: scale(1.14) translateY(-6px); } }
  @keyframes m-wave  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes m-lean  { 0%,100% { transform: translateX(-7px) rotate(-4deg); } 50% { transform: translateX(7px) rotate(4deg); } }
  @keyframes m-nod   { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(5px) rotate(6deg); } }
  @keyframes m-sway  { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  @keyframes m-jump  { 0%,55%,100% { transform: translateY(0) scaleY(1); } 22% { transform: translateY(-20px) scaleY(1.06); } 40% { transform: translateY(0) scaleY(.93); } }
  @keyframes m-twirl { 0%,72%,100% { transform: rotate(0) scale(1); } 30% { transform: rotate(180deg) scale(1.05) translateY(-10px); } }
  /* —— 二期动作：甩头 / 漂浮 / 扭动 / 转身 / Q弹 / 跳舞 —— */
  #pet.m-shake  { animation: m-shake .6s ease-in-out infinite; }
  #pet.m-float  { animation: m-float 2.6s ease-in-out infinite; }
  #pet.m-wiggle { animation: m-wiggle .5s ease-in-out infinite; }
  #pet.m-flip   { animation: m-flip 1.6s ease-in-out infinite; }
  #pet.m-bounce { animation: m-bounce 1.0s ease-in-out infinite; }
  #pet.m-dance  { animation: m-dance 1.8s ease-in-out infinite; }
  @keyframes m-shake  { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-6px) rotate(-4deg); } 40% { transform: translateX(6px) rotate(4deg); } 60% { transform: translateX(-5px) rotate(-3deg); } 80% { transform: translateX(5px) rotate(3deg); } }
  @keyframes m-float  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(2deg); } }
  @keyframes m-wiggle { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-8deg) scale(1.03); } 75% { transform: rotate(8deg) scale(1.03); } }
  @keyframes m-flip   { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
  @keyframes m-bounce { 0%,100% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-16px) scale(.96,1.06); } 55% { transform: translateY(0) scale(1.08,.9); } 70% { transform: translateY(0) scale(.97,1.03); } }
  @keyframes m-dance  { 0%,100% { transform: rotate(0) translateY(0); } 15% { transform: rotate(-9deg) translateY(-8px); } 30% { transform: rotate(9deg) translateY(0); } 45% { transform: rotate(-9deg) translateY(-8px); } 60% { transform: rotate(9deg) translateY(0); } 75% { transform: rotate(-6deg) translateY(-6px); } }
  /* —— 三期动作：侧耳倾听 / 忙碌干活（状态联动，见 STATE_MOTION） —— */
  #pet.m-ear   { animation: m-ear 2.2s ease-in-out infinite; }
  #pet.m-work  { animation: m-work 1.2s ease-in-out infinite; }
  @keyframes m-ear   { 0%,100% { transform: rotate(0) translateX(0); } 40% { transform: rotate(-10deg) translateX(7px); } 60% { transform: rotate(-10deg) translateX(7px); } }
  @keyframes m-work  { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(-2deg); } 50% { transform: translateY(0) rotate(0); } 75% { transform: translateY(-3px) rotate(2deg); } }
  /* —— 四期动作：打瞌睡（点头） / 耳朵抖动（倾听时的细节） —— */
  #pet.m-sleepy    { animation: m-sleepy 3.2s ease-in-out infinite; }
  #pet.m-ear-twitch { animation: m-ear-twitch .5s ease-in-out; }
  @keyframes m-sleepy { 0%,8% { transform: rotate(0) translateY(0); } 55% { transform: rotate(-13deg) translateY(6px); } 62% { transform: rotate(2deg) translateY(0); } 70% { transform: rotate(-13deg) translateY(6px); } 77% { transform: rotate(2deg) translateY(0); } 100% { transform: rotate(-13deg) translateY(6px); } }
  @keyframes m-ear-twitch { 0%,100% { transform: rotate(0) translateX(0); } 15%,35%,55%,75% { transform: rotate(-6deg) translateX(4px); } 25%,45%,65%,85% { transform: rotate(6deg) translateX(-4px); } }
</style>
</head>
<body>
<div id="root">
  <div id="bubble">
    <div id="head"><span class="dot"></span><span id="title"></span></div>
    <div id="text"></div>
    <div id="foot"><span id="steps"></span><span id="hint">点我跳过</span></div>
  </div>
  <div id="panel">
    <!-- ══ 状态条（2026-10-23 重构）═════════════════════════════════════════════
         只有四样：变声开关（药丸）、当前音色、声音托盘 ♪、更多 ⋯。
         改版前这里是「药丸 + 音色 + 耗时」+ 下面 4 个页签（说话 / 按住 / 音效 / 放歌），
         整块面板 13 个可点目标，发一条语音要做 5 个决定：切页签 → 选引擎 → 选音色
         → 过不过 RVC → 发送还是先试听。用户原话：「按钮太多了，一看就是没设计好」。
         耗时是诊断信息，挪进「⋯」抽屉 —— 它原来那 35px 正好是两个入口的位置。
         药丸是**唯一**的变声开关（旧版还有一组「RVC / 千问」分段调的是同一个
         toggleLive()，一个功能两个开关，代码注释里自己都写着"不存在两套逻辑"）。 -->
    <div id="phead">
      <button type="button" id="pill" class="pill t-idle"
              title="实时变声开关（点一下开 / 再点一下关）"><i></i><b id="pillText">待机</b></button>
      <!-- 音色**不是功能，是状态**：它显示面板接下来真会用哪个声音，所以留在状态条上，
           但不给按钮外观（透明底、无边框、字号 10）—— 上一版它长得像一颗按钮，
           13 个可点目标里有它一份。点它仍然能打开抽屉换音色，只是不再抢眼。 -->
      <button type="button" id="voiceBtn" class="vchip" title="当前音色：点一下打开「更多」换">
        <span id="rmVoice">—</span>
      </button>
      <!-- ⋯ 是**唯一的**功能入口（2026-10-23 二次重构后）：
           音色 / 引擎 / 声音（音效+放歌）/ 该不该回 / 最近发送 / 全部功能，全在里面。
           ♪ 原位置并入抽屉的「声音」行 —— 托盘还在，只是不再是常驻按钮。
           放歌中不再由 ♪ 上的小点表达，改由桌宠身上的 #bgmBadge 接手。 -->
      <button type="button" id="moreBtn" class="icb" aria-expanded="false" aria-controls="drawer"
              title="音色 / 引擎 / 声音 / 该不该回 / 最近发送（全部功能都在这里）">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="19" cy="12" r="1.9" />
        </svg>
        <i class="rdot" id="rdot" hidden aria-hidden="true"></i>
      </button>
    </div>

    <!-- ── 装填区：一条草稿 ──────────────────────────────────────────────────
         类型由**内容**决定，不由页签决定：
           空         → 输入框等打字（主按钮 = 按住说话）
           有文字     → 文字 + 音效片（主按钮 = 合成并发送）
           按住中     → 波形 + 秒数（主按钮 = 松开发送）
         这是整个重构的核心：三个页签（说话 / 按住 / 音效）是按**实现机制**分的，
         而用户脑子里只有「我要发一条」。删掉那层选择，发一条语音就只剩 1 个决定。 -->
    <div id="draft">
      <label class="field" for="say">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <!-- 文案从「输入文字，自动合成发微信」收到「说点什么…」：
             那条链路（文字 → TTS → RVC → 自动录进微信）写进 title，
             204px 宽的占位文字只能是「邀请」，不能是「说明书」。 -->
        <input id="say" placeholder="说点什么，或找功能" maxlength="200"
               title="打一行字：合成 → 换声 → 发进微信。也能当搜索框用 —— 打「歌」「变声」「音效」会给出对应入口。空着不写就按住按钮直接说。" />
      </label>
      <!-- 这条语音里的音效片（原「预混队列」）。点 chip 主体循环切换混入位置（叠→头→尾），
           点 × 移出。它长在草稿下面，因为它**就是这条语音的一部分**。 -->
      <div id="fxPicks" aria-label="这条语音里的音效"></div>
      <!-- 录音中的波形：替代输入框。旧版按下去只有一个秒数，用户不确定「到底在不在录」。 -->
      <div id="recBox" hidden aria-live="polite">
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span id="micSec">0.0s</span>
      </div>
    </div>

    <!-- ── 建议区（2026-10-23 二次重构的主角）────────────────────────────────
         渲染 `rankActions()` 选出的最多 3 条，**随上下文变**：
           有提案等你点头 → 「确认 发《晴天》」（.hot，绿色描边：这是正在进行的事）
           雷达判「该回了」→ 「回一句」
           草稿有字       → 「发语音说这句」；后端解析出点歌意图时换成「发《晴天》」
           正在放歌       → 「停止放歌」
           没有任何信号   → 兜底三条：点歌 / 音效 / 该不该回（空面板会让人以为坏了）
         输入框有字时这一区**变成搜索结果**（本地动作 + 后端 /observe 解析出的提案），
         于是「想用的功能找不到」也有路：打字就能找，不用记它藏在哪个抽屉。
         ⚠️ hidden 时整块不占高度 —— CSS 里显式写了 #recs[hidden]{display:none}，
         因为 flex 容器会盖掉 UA 的 [hidden]{display:none}（本项目踩过三次）。 -->
    <div id="recs" hidden></div>

    <!-- ── 主按钮：面板上唯一的动作 ──────────────────────────────────────────
         文案与颜色跟着装填区变（见 CSS 的 .m-idle / .m-text / .m-rec）：
           空草稿：🎙 按住说话   —— pointerdown 起录、pointerup 停
           有内容：✈ 合成并发送
           录制中：● 松开发送
         为什么一个按钮能同时有两种手势：因为「有没有内容」已经把场景分开了 ——
         空草稿时按下去只能是说话，有内容时按下去只能是发送，没有歧义。
         ⚠️ 不做「上滑取消」：这是鼠标场景（桌面端），不是触屏；主进程也没有取消接口
         （改 *.cjs 要重打 asar）。松手即发，录音太短由后端拒掉并给提示。 -->
    <div id="fireRow">
      <button type="button" id="fire" class="m-idle"
              title="按住说话（松手就发）／ 输入框有字时点一下合成并发送">
        <span class="spin"></span>
        <svg class="ic ic-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 10v1a7 7 0 0 0 14 0v-1" /><path d="M12 18v4" />
        </svg>
        <svg class="ic ic-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" />
        </svg>
        <svg class="ic ic-rec" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="12" r="6" />
        </svg>
        <span id="fireLabel">按住说话</span>
      </button>
      <!-- 试听：只在「有文字、没在录」时出现。旧版它是动作行里一颗 49px 的按钮，
           与「合成并发送」并排、权重相当 —— 试听只是发送的前置检查，不该平起平坐。 -->
      <button type="button" id="preview" hidden title="只合成试听，满意再点发送">
        <span class="spin"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="7 4 20 12 7 20 7 4" />
        </svg>
      </button>
    </div>

    <!-- ── 手势提示行 ──────────────────────────────────────────────────────
         三件事按优先级轮流显示（JS: refreshHint）：录制中 → 「松手就发」；
         按之前 → 微信预检（开没开 / 会不会重启）；其余 → 一句用法。
         旧版它是「按住」页里的 #holdPre，只在那一页可见；现在跟着主按钮走 ——
         因为按住就是这个按钮的默认动作，"微信没开"必须在按下**之前**说。 -->
    <div id="gesture" aria-live="polite">按住说，松手就发</div>

    <!-- ── 声音托盘：音效 + 放歌 ────────────────────────────────────────────
         两个都是「此刻送进虚拟声卡」的东西，所以放同一个托盘；发送链路留在主按钮。
         改版前音效页自己有一套「实时播放 / 混进语音」模式分段 + 网格 + 队列 + 发送按钮，
         放歌页又有一套「选歌 + 放歌 + 音量 + 提示」—— 41px 的页签把它们隔开，
         用户要先想「这个声音属于哪一类」才能找到入口。 -->
    <div id="tray" hidden>
      <!-- 放歌是一块**独立的卡**，不是一行控件。
           2026-10-23 上一版把它压成「下拉 + ▶ + 滑块」一行（26px），用户的一句
           「那个放歌的面板也没了呀」说明压过头了：功能一个没少，但视觉上它变成了
           音效网格的附属品，找放歌的人会以为整页被删了。现在恢复「曲目 + 放歌键 +
           音量」两行，并给它自己的底框 —— 一眼能看出这是一台放歌机。
           同一版里删掉的 #bgmHint（「进微信，本机不出声」）不再回来：那句话改由
           放歌键的 title 与第一次点音效时的状态行承担，常驻说明书才是「乱」的来源。
           高度靠「托盘打开时收起音效片（#fxPicks）」换 —— 见 #panel.has-tray 那段。 -->
      <div id="bgmCard">
        <div class="field2">
          <select id="bgmSel" title="选一首歌：本次导入/翻唱的（退出应用会清空），或 media/songs 里常驻的">
            <option value="">加载中…</option>
          </select>
          <!-- 搜歌：抖音热歌榜只做「发现」（歌名/歌手），点一首后再用 B站 匹配取音。
               取回的音频只在本次会话里（后端 session 目录，退出即删），不进媒体库。 -->
          <button type="button" id="songBtn" title="搜歌：抖音热榜 / B站榜 / B站搜索，点一首直接实时放">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="7" cy="7" r="5"></circle>
              <path d="M11 11l4 4"></path>
            </svg>
          </button>
        </div>
        <div id="bgmCtlRow">
          <button type="button" id="bgmBtn"
                  title="放歌：把歌实时垫进虚拟声卡，微信那边听得到；本机扬声器不出声。歌比说话短时循环补满">
            <span id="bgmIc">▶</span><span id="bgmLabel">放歌</span>
          </button>
          <input id="bgmGain" type="range" min="0" max="1" step="0.05" value="0.3"
                 aria-label="歌的音量"
                 title="歌的音量（默认 0.3 ≈ -10dB：垫在人声下面，说话才听得清）" />
        </div>
      </div>
      <!-- 音效空态说明（声板没开 / 还是空的 / 后端没连上），有素材时为空。 -->
      <div id="fxEmpty"></div>
      <!-- 音效网格：点格子 = 现场播，点格子右上角的 ＋ = 加进这条语音。
           两种用法同时存在，不用先选模式（旧版必须先切「实时播放 / 混进语音」）。 -->
      <div id="fxGrid"></div>
    </div>

    <!-- ── 搜歌层：抖音热榜 / B站音乐榜 / B站搜索 ───────────────────────────
         从放歌卡右上角的放大镜进来。抖音榜返回的是「歌名 + 歌手 + 热度」，没有音频
         （版权接口 play_url 为空），点一行会用「歌名 + 歌手」去 B站 搜，B站结果再点
         才取音 —— 两步是为了让用户看见「这是从 B站 找的哪一条」，不静默替人选。
         B站榜的每一行本身就是视频地址，点一下直接取音 + 实时放。 -->
    <div id="songLayer" hidden>
      <div id="songHead">
        <button type="button" id="songBack" title="返回放歌">‹</button>
        <span class="st">找歌</span>
        <div id="songSrc" role="group" aria-label="榜单来源">
          <button type="button" data-src="douyin" class="on">抖音榜</button>
          <button type="button" data-src="bilibili">B站榜</button>
        </div>
      </div>
      <label class="field" id="songQWrap" for="songQ">
        <svg class="lead" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M11 11l4 4" fill="none" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
        <input id="songQ" type="search" placeholder="搜歌名或歌手，回车" maxlength="60"
               autocomplete="off" spellcheck="false" />
      </label>
      <div id="songList" role="list"></div>
      <div id="songNote" aria-live="polite"></div>
    </div>

    <!-- ── 微信雷达层：该不该回 ───────────────────────────────────────────────
         hook.radar 的展示面。判断在后端（像素行投影 + 规则引擎），这里只渲染
         verdict.label / reason / signals —— 前端不造文案，不抄判断。
         层打开时 1.5s 轮询（后端 poll_hint_ms 给的值）；关掉后降为 5s 的徽标轮询，
         只为入口上的小绿点。能力关了整层连同入口一起收（refreshCapVisibility）。 -->
    <div id="radarLayer" hidden>
      <div id="radarHead">
        <button type="button" id="radarBack" title="返回">‹</button>
        <span class="st">该不该回</span>
        <!-- 右侧两用：观测中就当「重新观察」按钮用（换了会话点它重算）；连不上时空着。 -->
        <button type="button" id="radarLive" title="换了聊天窗口？点一下重新观察">重新观察</button>
      </div>
      <div id="rdCard" class="v-unknown">
        <div id="rdVerdict">观察中</div>
        <div id="rdReason">正在观察微信窗口…</div>
        <div id="rdSignals"></div>
      </div>
      <div id="rdNote" aria-live="polite"></div>
    </div>

    <!-- ── 更多抽屉：音色 / 引擎 / 最近发送 ─────────────────────────────────
         三样都是「设置」，进来的频率远低于发送。放在抽屉里之后，它们不再跟主按钮
         抢注意力；抽屉打开时提示行与音效片收起（见 CSS #panel.has-drawer）。 -->
    <div id="drawer" hidden>
      <div class="drow sel" title="合成用的音色（「主界面选中」= 跟主界面走）">
        <span class="dl">音色</span>
        <select id="voiceSel"></select>
      </div>
      <!-- 声音：音效声板 + 放歌（2026-10-23 从 phead 的 ♪ 按钮挪进来）。
           两者共同点是「此刻送进虚拟声卡，对面实时听到」，与主按钮的「发一条消息到微信」
           是两条链路，可以同时用，所以仍然共用同一个托盘。行尾显示当前状态，
           这样不用进托盘也知道「正在放什么歌」。 -->
      <div class="drow" id="trayRow" role="button" tabindex="0"
           title="声音托盘：音效声板 + 放歌（都是此刻送进虚拟声卡，微信那边听得到；本机喇叭不出声）">
        <span class="dl">声音</span>
        <span id="trayRowLabel">音效 · 放歌</span>
      </div>
      <!-- 实时变声引擎：RVC 实时 / 千问变声 二选一。
           两者互斥（后端互相 409：抢 GPU 且都占 CABLE），所以是「选一个」而不是两个开关。
           启停合并进分段：点没选中的 = 切过去；点已选中的 = 启动/停止。
           运行态靠整块变绿表达（.running），选中态是品牌紫（.on）。 -->
      <div class="drow" id="engRow">
        <span class="dl" id="engLabel">引擎</span>
        <div id="engineSeg" role="group" aria-label="实时变声引擎（点已选中的引擎启动或停止）">
          <button type="button" id="engRvc" data-eng="rvc"
                  title="RVC 实时：逐帧套音色，保留你的说话习惯，适合真人音色 / 低延迟。再点一下已选中的引擎 = 启动 / 停止">RVC 实时</button>
          <button type="button" id="engQwen" data-eng="qwen"
                  title="千问变声：先识别成文字再合成换嗓，适合卡通 / 角色音色，比 RVC 慢一点。再点一下已选中的引擎 = 启动 / 停止">千问</button>
        </div>
      </div>
      <label id="noRvcField" for="noRvc"
             title="勾上：纯千问克隆（快、语气自然，不过 RVC）；不勾：合成后再过 RVC 换声（音色更像训练目标）">
        <input id="noRvc" type="checkbox" />
        <span>千问直出</span>
      </label>
      <!-- 推理耗时：诊断信息。旧版常驻状态条（35px 宽），把它挪进来才腾得出 ♪ / ⋯ 的位置。
           ⚠️ 整行随数据出现：没在变声时这一行只有「耗时 —」，是一行噪音（也是抽屉里
           最容易被误认为设置项的那一行）。变声跑起来它自己长出来，那时才有人要看。 -->
      <div class="drow" id="latRow" hidden style="margin-top:4px" title="实时变声的实测推理耗时（p95）">
        <span class="dl">耗时</span>
        <span id="rmLat" hidden>—</span>
      </div>
      <!-- 微信雷达行：跟「耗时」同款 drow（不加 dsep/dgroup 头 —— 抽屉纵向余量只有
           29px，只塞得下一行）。行尾的 label 由 5s 轮询实时换成结论文案，
           所以开抽屉本身就等于看了一眼雷达；点行进雷达层看信号细节。
           ⋯ 按钮上的绿点（.rdot）负责「不用开抽屉也知道该回了」。 -->
      <div class="drow" id="radarRow" role="button" tabindex="0"
           title="微信雷达：对方最后发言 / 连发几条 / 等了多久 —— 该不该回，一眼看。点开看细节">
        <span class="dl">该不该回</span>
        <span id="radarRowLabel">查看</span>
      </div>
      <div class="dsep"></div>
      <!-- 这里曾有一张 11 项的「全部功能」网格，2026-10-23 撤掉了：
           ① 抽屉本身已经把 11 个动作里的 9 个铺开了（音色/声音（音效+放歌）/引擎×2/
              千问直出/该不该回/最近发送），网格列出来的第一行就是重复；
           ② 剩下没入口的（点歌）走「声音 → 托盘 → 放大镜」，本来就通；
           ③ 真要「找某个功能」有更快的路：在上面的输入框里打字。`ACT_META` 的 kw
              覆盖全部 11 个动作（中英文都有），输入框一打就出候选 —— 比展开一张
              被 300px 上限截断的表更直接。
           实测：网格展开 164px，抽屉从 300px 涨到 476px，只能看到 2 行。 -->
      <!-- margin 是算出来的：抽屉在 300px 上限里只剩 8px 余量（音色/声音/引擎/
           千问直出/该不该回/全部功能 六行已经占满），所以这里用 4px 而不是 dsep 的 13px。 -->
      <div class="dgroup" id="recentHead" style="margin-top:4px">最近发送</div>
      <div id="recent" title="最近发送的语音，点一下重发"></div>
    </div>

    <!-- 状态行：发送/合成的结论（图标三选一，由 .ok/.err/.warn 决定显示哪个） -->
    <div id="status">
      <svg class="sic ic-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />
      </svg>
      <svg class="sic ic-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <svg class="sic ic-err" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" />
      </svg>
      <span id="statusText"></span>
    </div>
  </div>
  <div id="pet"><div id="sprite"></div><span id="bgmBadge" title="正在放歌">♪</span></div>
</div>
<script>
"use strict";

/**
 * 桌宠渲染器，两种工作模式：
 *
 * 1) 状态模式（默认）：1s 轮询后端，按链路阶段切换动画。
 *    级联：未运行->idle / warming->build / capturing->listen / asr|tts->think /
 *          播放队列积压->play（气泡显示识别文字）/ error->error
 *    实时变声（RVC）：基础 listen，转写中->think，识别到文字->气泡字幕
 *
 * 2) 导览模式：主进程在前端切页时推来 { title, lines, action, motion, duration }，
 *    桌宠临时现身为该页做一次介绍（头部标题 + 正文逐字打字 + 句子进度点），
 *    并播放该页专属动作，讲完自动退回状态模式。变声运行中不让导览抢镜。
 *
 * sprite 来自 Ice-teapop/desktop-pet 芙宁娜主题（MIT）。
 */
const API = "http://127.0.0.1:8000/api/cascade/status";
const LIVE_API = "http://127.0.0.1:8000/api/rvc/live/status";
// core.system 的能力，**永远挂载**。实时变声被关掉时用它判断「后端在不在」（见下面 CAP 门控）
const HEALTH_API = "http://127.0.0.1:8000/api/health";
// 发送前预检（hook.wechat 的能力，随该能力一起关）：只读，不动声卡、不碰微信
const PRECHECK_API = "http://127.0.0.1:8000/api/wechat/precheck";

// ===CAP-GATE-START===
// ---------------- 能力门控（2026-09-20）----------------
// 桌宠请求的后端接口里有 3 个属于**可关能力**，关掉以后对应 router 根本不挂载
// （实测：关 pet.market → pet_market_api 不挂载；关 sound.rvc-live → rvc_live + cascade
//  不挂载；关 hook.wechat → wechat_voice 不挂载），桌宠点下去就是 404。
//
// ⚠️ 更糟的是 tick() 原本拿「cascade + live 两个接口都拉不到」当**后端离线**的判据：
// 一旦关掉 sound.rvc-live，这两个接口同时消失 → 桌宠会**永久显示「后端离线」**，
// 而后端其实好好的。所以桌宠必须认识能力清单，不能假装所有能力都在。
const CAP_DEPS = {
  market: "pet.market", live: "sound.rvc-live", wechat: "hook.wechat",
  fx: "sound.fx-board",   // 音效声板（2026-09-26 面板加「音效」页时一并纳入门控）
  radar: "hook.radar",    // 微信「该不该回」雷达（2026-10-23 面板加雷达层时纳入）
};
const CAP = { market: true, live: true, wechat: true, fx: true, radar: true, loaded: false };

/**
 * 由 `GET /api/plugins` 的响应算出各处门控。
 *
 * **取不到清单时一律当作"开着"** —— 后端没起来、或清单接口自己出错，都不该把桌宠
 * 弄成残废：那是把"我猜错了"变成"看起来坏了"。只有**明确写着 enabled=false** 的才关。
 *
 * 只看 `enabled`，不看 `state`：被别的启用中能力依赖而保留的能力是
 * `state=disabled / enabled=true`（路由仍然挂着），拿 `state` 判会把还在的能力藏掉。
 */
function capStateFromCatalog(json) {
  const all = { market: true, live: true, wechat: true, fx: true, radar: true };
  const list = json && Array.isArray(json.plugins) ? json.plugins : null;
  if (!list) return all;
  for (const p of list) {
    if (!p || typeof p.id !== "string") continue;
    for (const key of Object.keys(CAP_DEPS)) {
      if (p.id === CAP_DEPS[key] && p.enabled === false) all[key] = false;
    }
  }
  return all;
}
// ===CAP-GATE-END===

/** 拉一次能力清单并落进 CAP；失败保持现状（全开）。 */
async function loadCapabilities() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/plugins", { cache: "no-store" });
    if (!r.ok) return;
    const s = capStateFromCatalog(await r.json());
    CAP.market = s.market;
    CAP.live = s.live;
    CAP.wechat = s.wechat;
    CAP.fx = s.fx;
    CAP.radar = s.radar;
    CAP.loaded = true;
  } catch {}
}

const SPRITES = {
  idle:   "svg/idle.webp",
  listen: "svg/idle-look.webp",
  think:  "svg/thinking.webp",
  play:   "svg/conducting.webp",
  build:  "svg/building.webp",
  error:  "svg/error.webp",
};
// 每个状态的帧数 / 单轮周期(s)，驱动 CSS steps 动画（原 SVG 内为逐帧离散平移 SMIL）
const SPRITE_ANIM = {
  idle:   { frames: 37, dur: 3.0 },
  listen: { frames: 37, dur: 3.0 },
  think:  { frames: 37, dur: 3.0 },
  play:   { frames: 22, dur: 1.8 },
  build:  { frames: 16, dur: 1.4 },
  error:  { frames: 37, dur: 3.0 },
};

// ---------------- 动态皮肤 ----------------
// skin.json（后端 /api/pet-market/applied）:
//   { id, frameW, frameH, states: { state: { sheet, frames, dur } } }
// 内置芙宁娜（id=furina）直接用本地 svg 目录里的 webp，不依赖后端；其余皮肤 sheet
// 走 http://127.0.0.1:8000/api/pet-market/sheet/<id>/<sheet>。
const SKIN_SHEET_API = "http://127.0.0.1:8000/api/pet-market";
let petSkin = { id: "", frameW: 150, frameH: 150, states: {} };   // 当前皮肤（空=内置）
let skinScale = 1;   // 像素素材整数倍放大系数（保持锐利）

/** 取某状态的皮肤配置；缺省回退福灵娜内置。 */
function skinState(key) {
  if (petSkin.states[key]) return petSkin.states[key];
  if (key === "listen" && petSkin.states.idle) return petSkin.states.idle;   // 听→待机
  if (key === "build" && petSkin.states.play) return petSkin.states.play;    // 干活→玩耍
  return { sheet: "", frames: SPRITE_ANIM[key].frames, dur: SPRITE_ANIM[key].dur };
}

/** sheet 完整 URL：内置皮肤用本地 svg，远端皮肤用后端接口。 */
function sheetUrl(key, st) {
  if (!petSkin.id || petSkin.id === "furina") return SPRITES[key] || SPRITES.idle;
  return `${SKIN_SHEET_API}/sheet/${encodeURIComponent(petSkin.id)}/${encodeURIComponent(st.sheet)}`;
}

/**
 * 应用皮肤到 DOM：按 frameW/frameH 计算整数倍放大与显示尺寸。
 * ⚠️ 调用时机：必须在下方「DOM 引用」段取到 petBox / sprite 之后。
 *    本函数读写这两个 const 绑定，提前调用会撞上暂时性死区（TDZ）抛
 *    ReferenceError，把整个脚本打断——桌宠就只剩 CSS ::before 那圈光晕。
 */
function applySkin() {
  const fw = petSkin.frameW || 150, fh = petSkin.frameH || 150;
  // 目标显示高度 ≈150px；比它小的像素素材按整数倍放大（32→160），大的保持原尺寸
  skinScale = fh >= 150 ? 1 : Math.max(1, Math.ceil(150 / fh));
  const dw = fw * skinScale, dh = fh * skinScale;
  // 精灵图自身尺寸：--fw/--fh 既当宽高，也是 pet-steps 每一步的位移基准
  sprite.style.setProperty("--fw", dw + "px");
  sprite.style.setProperty("--fh", dh + "px");
  // 外框尺寸给 #pet（它才是 var(--dw/--dh) 的消费方）：
  // 这两条以前写在 sprite 上，而 #pet 是父元素、自定义属性不会向上继承，
  // 于是 #pet 永远退回 150px——换非 150 帧尺寸的皮肤时，::before 光晕会比角色小一圈。
  petBox.style.setProperty("--dw", dw + "px");
  petBox.style.setProperty("--dh", dh + "px");
  // 像素素材放大时锁锐利，矢量风格保持平滑
  sprite.style.imageRendering = skinScale > 1 ? "pixelated" : "auto";
}

/** 拉取当前应用皮肤配置；失败/后端离线保持现有皮肤不动。 */
async function loadSkin() {
  // 人偶市场被关掉 → 皮肤接口不存在。直接用内置皮肤，别每 5s 白打一次 404。
  if (!CAP.market) return;
  let cfg = null;
  try {
    const r = await fetch(`${SKIN_SHEET_API}/applied`, { cache: "no-store" });
    if (r.ok) cfg = await r.json();
  } catch {}
  if (!cfg || !cfg.id) return;
  if (cfg.id === petSkin.id) return;   // 没换肤
  petSkin = { id: cfg.id, frameW: cfg.frameW || 150, frameH: cfg.frameH || 150, states: cfg.states || {} };
  applySkin();
  // 预加载新皮肤各状态 sheet，避免首次切换白屏
  for (const key of Object.keys(SPRITE_ANIM)) {
    const st = skinState(key);
    if (st.sheet && sheetUrl(key, st) !== (SPRITES[key] || "")) new Image().src = sheetUrl(key, st);
  }
  lastKey = null;   // 强制下一帧重画
}

// 内置皮肤初始化（150×150）挪到下方「DOM 引用」段之后调用，见 applySkin 上的说明。
const BUBBLE = {
  // 桌宠现在默认常驻，待机时只留角色安静待着，别把「待机中」一直糊在屏幕上
  idle:   { cls: "",          title: "待机",     text: "待机中", hidden: true },
  listen: { cls: "s-listen",  title: "我在听",   text: "你说，我听着～" },
  think:  { cls: "s-think",   title: "工作中",   text: "听懂啦，正在处理…" },
  play:   { cls: "s-play",    title: "正在播",   text: "" },          // 播放中气泡让位给识别文字
  build:  { cls: "s-build",   title: "准备中",   text: "模型加载中…" },
  error:  { cls: "s-error",   title: "出错",     text: "出错了，请查看主窗口" },
};
// 状态药丸文案：比气泡标题更短（药丸只有 ~60px），色调类名 t-* 与 CSS 里的 #pill.t-* 配对。
// 它把「角色现在在干什么」搬到了面板上——悬停展开面板时，气泡往往被面板顶到窗口外看不见。
const PILL = {
  idle:   ["待机",   "idle"],
  listen: ["我在听", "listen"],
  think:  ["处理中", "think"],
  play:   ["正在播", "play"],
  build:  ["准备中", "build"],
  error:  ["出错",   "err"],
};
// 状态→动作映射：让「倾听 / 干活」有对应的肢体语言
// build=准备中(轻晃) / listen=侧耳倾听 / think·play=忙碌干活 / error=甩头
const STATE_MOTION = { build: "wiggle", listen: "ear", think: "work", play: "work", error: "shake" };
const MOTIONS = ["pop", "wave", "lean", "nod", "sway", "jump", "twirl",
  "shake", "float", "wiggle", "flip", "bounce", "dance", "ear", "work", "sleepy", "ear-twitch"];

const petBox = document.getElementById("pet");
const sprite = document.getElementById("sprite");
const bubble = document.getElementById("bubble");
const rootEl = document.getElementById("root");   // 气泡在屏时挂 .compact，让面板主动让位
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const stepsEl = document.getElementById("steps");
// 面板头部的状态药丸（声明点必须早于 setState 的首次调用，见下方 applySkin 的 TDZ 说明）
const pillEl = document.getElementById("pill");
const pillText = document.getElementById("pillText");

// DOM 引用齐了才能初始化皮肤尺寸：applySkin() 会往 petBox/sprite 写内联自定义属性。
// 2026-09-10 b91707b 把这次调用放在了 DOM 引用之前（且 sprite 是 const），
// 触发「Cannot access 'sprite' before initialization」→ 整个脚本中断，
// 精灵图永远拿不到 background-image，桌宠只剩 CSS ::before 那圈光晕、且不再全窗穿透。
// 回归防护见 tools/test-pet-renderer-script.cjs。
applySkin();

let lastKey = null;       // 上次渲染的状态 key
let lastText = "";        // 当前句识别文字（出现=识别完成，清空=播出结束）
let statusBusy = false;   // 级联/实时变声是否在运行（运行中不让导览打断）
let guide = null;         // 导览播放中的状态
let guideTimers = [];
let typingTimer = null;
let backendOffline = false;   // 后端是否失联（两个状态接口都拉不到）
let offlineHintedAt = 0;      // 上次离线提示的时刻，避免每 1s 反复弹气泡刷屏

// 预加载所有 sprite，避免首次切换时白屏等待（WebP，单个最大 ~0.5MB）
for (const p of Object.values(SPRITES)) { new Image().src = p; }

// ---------------- 通用渲染 ----------------
function setSprite(key, motion) {
  const st = skinState(key);
  const url = sheetUrl(key, st);
  sprite.style.backgroundImage = `url("${url}")`;
  sprite.style.backgroundSize = (st.frames * (petSkin.frameW || 150) * skinScale) + "px " + ((petSkin.frameH || 150) * skinScale) + "px";
  sprite.style.setProperty("--n", String(st.frames));
  sprite.style.animation = `pet-steps ${st.dur}s steps(${st.frames}) infinite`;
  setMotion(motion);
}

function setMotion(motion) {
  petBox.classList.remove(...MOTIONS.map((m) => "m-" + m));
  if (!motion) return;
  petBox.classList.add("m-" + motion);
  // 重新触发一次动画（连续两页用同一个动作时也要有反应）
  void petBox.offsetWidth;
}

/**
 * 面板头部状态药丸。text 为显示文案，tone ∈ idle|listen|think|play|build|err
 * （对应 CSS #pill.t-* 的圆点颜色与呼吸动画）。
 */
function setPill(text, tone, title) {
  pillText.textContent = text;
  pillEl.className = "pill t-" + (tone || "idle");
  // tooltip 跟着状态走。★ 引擎名（RVC / 千问）现在住在这里而不是文案里 —— 状态条上
  // 药丸只有 3 个汉字的宽度预算（见 CSS #phead），而「RVC 变声中」实测要 77px，
  // 一放就把右边的音色 chip 挤没。悬停能看全，和面板其它 tooltip 一个路数。
  pillEl.title = title || "实时变声开关：点一下开 / 再点一下关";
}

/**
 * 气泡显隐的唯一入口，同时把「气泡占了地方」这件事同步给 #root。
 *
 * 为什么必须收敛到一个入口：气泡与面板共用同一个 480px 窗口，气泡一起来面板就被压扁，
 * 底部「最近发送」会被切掉一截（实测 guide 切 6px / think 16px / offline 34px）。
 * 让位规则（#root.compact，见 CSS）只在气泡真的在屏时生效，所以这里必须与 display 同步。
 * 以前各处直接写 bubble.style.display，漏掉任何一处都会让面板带着多余的 #recent 去抢高度。
 */
let bubbleWanted = false;
/**
 * 气泡的**实际**显隐 = 想显示 且 没有分层开着。
 *
 * 为什么分层要比气泡优先：气泡是 82px，占面板可高（298px）的 27%。
 * 打开托盘/抽屉那一刻，两者同时在场必然溢出 —— 实测 tray -26px、drawer -56px
 * （204×300 上限就在那里，不是能靠缩字号挤回来的量）。
 * 而这两件事本来就是两种模式：气泡是「宠物在说话」，托盘/抽屉是「我在操作它」。
 * 让位只影响显示：guide 的计时器、文案、当前步骤都不动，收起分层立刻回到原样。
 */
function applyBubble() {
  const blocked = !!(rootEl && rootEl.classList.contains("layer-open"));
  const show = bubbleWanted && !blocked;
  bubble.style.display = show ? "block" : "none";
  rootEl.classList.toggle("compact", show);
}
function setBubbleVisible(show) {
  bubbleWanted = !!show;
  applyBubble();
}

/**
 * @param {string} key  状态 key（对应 BUBBLE / PILL / STATE_MOTION）
 * @param {string} [text]  覆盖文案（识别到的文字等）
 * @param {string} [title] 覆盖标题。实时变声运行时用它把「我在听」换成引擎名，
 *                         这样不悬停也能从气泡上看出「现在是 RVC 还是千问」。
 */
function setState(key, text, title) {
  if (guide) return;                       // 导览播放中，状态轮询不抢气泡
  if (key === lastKey && text === textEl.textContent) return;
  lastKey = key;
  // 药丸必须写在下面的早退分支之前：待机时气泡是 hidden、会直接 return，
  // 若把 setPill 放在 return 之后，面板就会永远停在上一状态。
  const pill = PILL[key] || [key, "idle"];
  setPill(pill[0], pill[1]);
  setSprite(key, STATE_MOTION[key] || null);
  const info = BUBBLE[key];
  if (!info || (info.hidden && !text)) { setBubbleVisible(false); return; }
  bubble.className = info.cls;
  setBubbleVisible(true);
  titleEl.textContent = title || info.title;
  textEl.classList.remove("typing");
  textEl.textContent = text || info.text;
}

// ---------------- 页面导览 ----------------
/** 单句停留时长：够读完，又不至于让人等（含后续打字时间） */
function lineMs(line) {
  return Math.min(4200, Math.max(2200, 1500 + line.length * 110));
}

function typeText(text) {
  if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
  textEl.classList.remove("typing");
  textEl.textContent = text;
}

function clearGuide() {
  guideTimers.forEach(clearTimeout);
  guideTimers = [];
  clearInterval(typingTimer);
  typingTimer = null;
  guide = null;
  // 这里不碰气泡显隐/让位标记：endGuide() 紧接着会 void tick() → setState() 重画，
  // 由 setBubbleVisible() 统一决定气泡与 .compact。中途先动一次只会闪一下。
}

function endGuide() {
  if (!guide) return;
  clearGuide();
  setMotion(null);
  lastKey = null;             // 强制下一帧重画状态气泡
  void tick();
}

function playGuide(g) {
  clearGuide();
  const lines = Array.isArray(g.lines) ? g.lines.filter(Boolean) : [];
  if (!lines.length) return;
  guide = g;
  lastKey = null;
  setSprite(g.action || "idle", g.motion || "pop");

  bubble.className = "guide";
  setBubbleVisible(true);          // 导览气泡同样会占高度 → 面板让位（见 #root.compact 注释）
  titleEl.textContent = g.title || "这一页";
  stepsEl.innerHTML = lines.map(() => "<i></i>").join("");

  let at = 0;
  lines.forEach((line, i) => {
    guideTimers.push(setTimeout(() => {
      if (!guide) return;
      Array.from(stepsEl.children).forEach((el, k) => el.classList.toggle("on", k === i));
      typeText(line);
    }, at));
    at += lineMs(line);
  });
  guideTimers.push(setTimeout(endGuide, at + 1000));
}

// 主进程在切页时推送；变声运行中静默丢弃（不打断状态展示）
if (window.pet && window.pet.onGuide) {
  window.pet.onGuide((g) => {
    if (statusBusy || !g) return;
    playGuide(g);
  });
}
// 点气泡：导览中=跳过；后端离线=打开后端日志；否则无操作
bubble.addEventListener("click", () => {
  if (guide) { endGuide(); return; }
  if (backendOffline && window.pet && window.pet.showBackendLog) {
    window.pet.showBackendLog();
  }
});

// ---------------- 状态轮询 ----------------
function render(s) {
  if (!s.running) { lastText = ""; setState("idle"); return; }

  if (s.child_error || s.stage === "error") { setState("error"); return; }
  switch (s.stage) {
    case "warming":
      setState("build");
      return;
    case "asr":
      setState("think", "听懂啦…");   // 此刻 last_text 还是上一句，不展示
      return;
    case "tts":
      // ASR 完成进入合成：last_text 即本句识别结果，展示文字 = 「听懂了的确认」
      if (s.last_text) lastText = s.last_text;
      setState("think", lastText ? `「${lastText}」` : "正在合声…");
      return;
    case "capturing":
      // playing 阶段在子进程里只存在几毫秒（同步处理后立刻回到 capturing），
      // 「正在播出」的真实信号是播放队列积压 queued_s > 0
      if (s.queued_s > 0.05) {
        // 轮询可能错过短暂的 tts 阶段，此时用 last_text 兜底
        if (s.last_text && s.last_text !== lastText) lastText = s.last_text;
        setState("play", lastText ? `「${lastText}」` : "正在播…");
      } else {
        lastText = "";                          // 队列空了 = 播完，回到「我在听」
        setState("listen", "我在听 · 你继续说", "千问变声");
      }
      return;
    default:
      setState("build");   // init 等未知阶段
  }
}

function renderLive(l) {
  // 实时变声模式：基础「我在听」动画 + 实时字幕（转写子进程挂在 asr_* 字段）。
  // 标题固定写「RVC 实时」：气泡是唯一不悬停也能看到的地方，
  // 用户反馈「不知道现在用的是哪一种变身」，所以引擎名必须出现在这里。
  if (l.asr_running) {
    if (l.asr_stage === "transcribing") {
      setState("think", "听懂啦…", "RVC 实时");
    } else {
      setState("listen", l.asr_last_text ? `「${l.asr_last_text}」` : "变声中 · 我听着", "RVC 实时");
    }
  } else {
    lastText = "";
    setState("listen", "变声中 · 我听着", "RVC 实时");   // 转写子进程未启动：只挂身份牌，不影响变声
  }
}

// 预览模式（调试用）：pet.html?mock=1 自动轮播各状态，不依赖后端
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const MOCK_SEQ = [
  { state: "listen", text: "聆听中…" },
  { state: "think", text: "「你好呀」" },
  { state: "play", text: "「你好呀」" },
  { state: "idle", text: "" },
  { state: "build", text: "模型加载中…" },
  { state: "error", text: "" },
];
let mockIdx = 0;
if (MOCK) {
  // 调试模式下也能预览页面导览：pet.html?mock=1 时 6s 后自动演一遍「音色工坊」
  const step = () => {
    if (guide) return;
    const m = MOCK_SEQ[mockIdx % MOCK_SEQ.length];
