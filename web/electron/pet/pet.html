<script>
"use strict";

/**
 * 桌宠渲染器，两种工作模式：
 *
 * 1) 状态模式（默认）：1s 轮询后端，按链路阶段切换动画。
 *    级联：未运行->idle / warming->build / capturing->listen / asr|tts->think /
 *          播放队列积压->play（气泡显示识别文字）/ error->error
 *    实时变声（RVC）：基础 listen，转写中->think，识别到文字->气泡字幕
 *
 * 2) 导览模式：主进程在前端切页时推来 { title, lines, action, motion, duration }，
 *    桌宠临时现身为该页做一次介绍（头部标题 + 正文逐字打字 + 句子进度点），
 *    并播放该页专属动作，讲完自动退回状态模式。变声运行中不让导览抢镜。
 *
 * sprite 来自 Ice-teapop/desktop-pet 芙宁娜主题（MIT）。
 */
const API = "http://127.0.0.1:8000/api/cascade/status";
const LIVE_API = "http://127.0.0.1:8000/api/rvc/live/status";
// core.system 的能力，**永远挂载**。实时变声被关掉时用它判断「后端在不在」（见下面 CAP 门控）
const HEALTH_API = "http://127.0.0.1:8000/api/health";

// ===CAP-GATE-START===
// ---------------- 能力门控（2026-09-20）----------------
// 桌宠请求的后端接口里有 3 个属于**可关能力**，关掉以后对应 router 根本不挂载
// （实测：关 pet.market → pet_market_api 不挂载；关 sound.rvc-live → rvc_live + cascade
//  不挂载；关 hook.wechat → wechat_voice 不挂载），桌宠点下去就是 404。
//
// ⚠️ 更糟的是 tick() 原本拿「cascade + live 两个接口都拉不到」当**后端离线**的判据：
// 一旦关掉 sound.rvc-live，这两个接口同时消失 → 桌宠会**永久显示「后端离线」**，
// 而后端其实好好的。所以桌宠必须认识能力清单，不能假装所有能力都在。
const CAP_DEPS = {
  market: "pet.market", live: "sound.rvc-live", wechat: "hook.wechat",
  fx: "sound.fx-board",   // 音效声板（2026-09-26 面板加「音效」页时一并纳入门控）
};
const CAP = { market: true, live: true, wechat: true, fx: true, loaded: false };

/**
 * 由 `GET /api/plugins` 的响应算出各处门控。
 *
 * **取不到清单时一律当作"开着"** —— 后端没起来、或清单接口自己出错，都不该把桌宠
 * 弄成残废：那是把"我猜错了"变成"看起来坏了"。只有**明确写着 enabled=false** 的才关。
 *
 * 只看 `enabled`，不看 `state`：被别的启用中能力依赖而保留的能力是
 * `state=disabled / enabled=true`（路由仍然挂着），拿 `state` 判会把还在的能力藏掉。
 */
function capStateFromCatalog(json) {
  const all = { market: true, live: true, wechat: true, fx: true };
  const list = json && Array.isArray(json.plugins) ? json.plugins : null;
  if (!list) return all;
  for (const p of list) {
    if (!p || typeof p.id !== "string") continue;
    for (const key of Object.keys(CAP_DEPS)) {
      if (p.id === CAP_DEPS[key] && p.enabled === false) all[key] = false;
    }
  }
  return all;
}
// ===CAP-GATE-END===

/** 拉一次能力清单并落进 CAP；失败保持现状（全开）。 */
async function loadCapabilities() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/plugins", { cache: "no-store" });
    if (!r.ok) return;
    const s = capStateFromCatalog(await r.json());
    CAP.market = s.market;
    CAP.live = s.live;
    CAP.wechat = s.wechat;
    CAP.fx = s.fx;
    CAP.loaded = true;
  } catch {}
}

const SPRITES = {
  idle:   "svg/idle.webp",
  listen: "svg/idle-look.webp",
  think:  "svg/thinking.webp",
  play:   "svg/conducting.webp",
  build:  "svg/building.webp",
  error:  "svg/error.webp",
};
// 每个状态的帧数 / 单轮周期(s)，驱动 CSS steps 动画（原 SVG 内为逐帧离散平移 SMIL）
const SPRITE_ANIM = {
  idle:   { frames: 37, dur: 3.0 },
  listen: { frames: 37, dur: 3.0 },
  think:  { frames: 37, dur: 3.0 },
  play:   { frames: 22, dur: 1.8 },
  build:  { frames: 16, dur: 1.4 },
  error:  { frames: 37, dur: 3.0 },
};

// ---------------- 动态皮肤 ----------------
// skin.json（后端 /api/pet-market/applied）:
//   { id, frameW, frameH, states: { state: { sheet, frames, dur } } }
// 内置芙宁娜（id=furina）直接用本地 svg/*.webp，不依赖后端；其余皮肤 sheet
// 走 http://127.0.0.1:8000/api/pet-market/sheet/<id>/<sheet>。
const SKIN_SHEET_API = "http://127.0.0.1:8000/api/pet-market";
let petSkin = { id: "", frameW: 150, frameH: 150, states: {} };   // 当前皮肤（空=内置）
let skinScale = 1;   // 像素素材整数倍放大系数（保持锐利）

/** 取某状态的皮肤配置；缺省回退福灵娜内置。 */
function skinState(key) {
  if (petSkin.states[key]) return petSkin.states[key];
  if (key === "listen" && petSkin.states.idle) return petSkin.states.idle;   // 听→待机
  if (key === "build" && petSkin.states.play) return petSkin.states.play;    // 干活→玩耍
  return { sheet: "", frames: SPRITE_ANIM[key].frames, dur: SPRITE_ANIM[key].dur };
}

/** sheet 完整 URL：内置皮肤用本地 svg，远端皮肤用后端接口。 */
function sheetUrl(key, st) {
  if (!petSkin.id || petSkin.id === "furina") return SPRITES[key] || SPRITES.idle;
  return `${SKIN_SHEET_API}/sheet/${encodeURIComponent(petSkin.id)}/${encodeURIComponent(st.sheet)}`;
}

/**
 * 应用皮肤到 DOM：按 frameW/frameH 计算整数倍放大与显示尺寸。
 * ⚠️ 调用时机：必须在下方「DOM 引用」段取到 petBox / sprite 之后。
 *    本函数读写这两个 const 绑定，提前调用会撞上暂时性死区（TDZ）抛
 *    ReferenceError，把整个脚本打断——桌宠就只剩 CSS ::before 那圈光晕。
 */
function applySkin() {
  const fw = petSkin.frameW || 150, fh = petSkin.frameH || 150;
  // 目标显示高度 ≈150px；比它小的像素素材按整数倍放大（32→160），大的保持原尺寸
  skinScale = fh >= 150 ? 1 : Math.max(1, Math.ceil(150 / fh));
  const dw = fw * skinScale, dh = fh * skinScale;
  // 精灵图自身尺寸：--fw/--fh 既当宽高，也是 pet-steps 每一步的位移基准
  sprite.style.setProperty("--fw", dw + "px");
  sprite.style.setProperty("--fh", dh + "px");
  // 外框尺寸给 #pet（它才是 var(--dw/--dh) 的消费方）：
  // 这两条以前写在 sprite 上，而 #pet 是父元素、自定义属性不会向上继承，
  // 于是 #pet 永远退回 150px——换非 150 帧尺寸的皮肤时，::before 光晕会比角色小一圈。
  petBox.style.setProperty("--dw", dw + "px");
  petBox.style.setProperty("--dh", dh + "px");
  // 像素素材放大时锁锐利，矢量风格保持平滑
  sprite.style.imageRendering = skinScale > 1 ? "pixelated" : "auto";
}

/** 拉取当前应用皮肤配置；失败/后端离线保持现有皮肤不动。 */
async function loadSkin() {
  // 人偶市场被关掉 → 皮肤接口不存在。直接用内置皮肤，别每 5s 白打一次 404。
  if (!CAP.market) return;
  let cfg = null;
  try {
    const r = await fetch(`${SKIN_SHEET_API}/applied`, { cache: "no-store" });
    if (r.ok) cfg = await r.json();
  } catch {}
  if (!cfg || !cfg.id) return;
  if (cfg.id === petSkin.id) return;   // 没换肤
  petSkin = { id: cfg.id, frameW: cfg.frameW || 150, frameH: cfg.frameH || 150, states: cfg.states || {} };
  applySkin();
  // 预加载新皮肤各状态 sheet，避免首次切换白屏
  for (const key of Object.keys(SPRITE_ANIM)) {
    const st = skinState(key);
    if (st.sheet && sheetUrl(key, st) !== (SPRITES[key] || "")) new Image().src = sheetUrl(key, st);
  }
  lastKey = null;   // 强制下一帧重画
}

// 内置皮肤初始化（150×150）挪到下方「DOM 引用」段之后调用，见 applySkin 上的说明。
const BUBBLE = {
  // 桌宠现在默认常驻，待机时只留角色安静待着，别把「待机中」一直糊在屏幕上
  idle:   { cls: "",          title: "待机",     text: "待机中", hidden: true },
  listen: { cls: "s-listen",  title: "我在听",   text: "你说，我听着～" },
  think:  { cls: "s-think",   title: "工作中",   text: "听懂啦，正在处理…" },
  play:   { cls: "s-play",    title: "正在播",   text: "" },          // 播放中气泡让位给识别文字
  build:  { cls: "s-build",   title: "准备中",   text: "模型加载中…" },
  error:  { cls: "s-error",   title: "出错",     text: "出错了，请查看主窗口" },
};
// 状态药丸文案：比气泡标题更短（药丸只有 ~60px），色调类名 t-* 与 CSS 里的 #pill.t-* 配对。
// 它把「角色现在在干什么」搬到了面板上——悬停展开面板时，气泡往往被面板顶到窗口外看不见。
const PILL = {
  idle:   ["待机",   "idle"],
  listen: ["我在听", "listen"],
  think:  ["处理中", "think"],
  play:   ["正在播", "play"],
  build:  ["准备中", "build"],
  error:  ["出错",   "err"],
};
// 状态→动作映射：让「倾听 / 干活」有对应的肢体语言
// build=准备中(轻晃) / listen=侧耳倾听 / think·play=忙碌干活 / error=甩头
const STATE_MOTION = { build: "wiggle", listen: "ear", think: "work", play: "work", error: "shake" };
const MOTIONS = ["pop", "wave", "lean", "nod", "sway", "jump", "twirl",
  "shake", "float", "wiggle", "flip", "bounce", "dance", "ear", "work", "sleepy", "ear-twitch"];

const petBox = document.getElementById("pet");
const sprite = document.getElementById("sprite");
const bubble = document.getElementById("bubble");
const rootEl = document.getElementById("root");   // 气泡在屏时挂 .compact，让面板主动让位
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const stepsEl = document.getElementById("steps");
// 面板头部的状态药丸（声明点必须早于 setState 的首次调用，见下方 applySkin 的 TDZ 说明）
const pillEl = document.getElementById("pill");
const pillText = document.getElementById("pillText");

// DOM 引用齐了才能初始化皮肤尺寸：applySkin() 会往 petBox/sprite 写内联自定义属性。
// 2026-09-10 b91707b 把这次调用放在了 DOM 引用之前（且 sprite 是 const），
// 触发「Cannot access 'sprite' before initialization」→ 整个脚本中断，
// 精灵图永远拿不到 background-image，桌宠只剩 CSS ::before 那圈光晕、且不再全窗穿透。
// 回归防护见 tools/test-pet-renderer-script.cjs。
applySkin();

let lastKey = null;       // 上次渲染的状态 key
let lastText = "";        // 当前句识别文字（出现=识别完成，清空=播出结束）
let statusBusy = false;   // 级联/实时变声是否在运行（运行中不让导览打断）
let guide = null;         // 导览播放中的状态
let guideTimers = [];
let typingTimer = null;
let backendOffline = false;   // 后端是否失联（两个状态接口都拉不到）
let offlineHintedAt = 0;      // 上次离线提示的时刻，避免每 1s 反复弹气泡刷屏

// 预加载所有 sprite，避免首次切换时白屏等待（WebP，单个最大 ~0.5MB）
for (const p of Object.values(SPRITES)) { new Image().src = p; }

// ---------------- 通用渲染 ----------------
function setSprite(key, motion) {
  const st = skinState(key);
  const url = sheetUrl(key, st);
  sprite.style.backgroundImage = `url("${url}")`;
  sprite.style.backgroundSize = (st.frames * (petSkin.frameW || 150) * skinScale) + "px " + ((petSkin.frameH || 150) * skinScale) + "px";
  sprite.style.setProperty("--n", String(st.frames));
  sprite.style.animation = `pet-steps ${st.dur}s steps(${st.frames}) infinite`;
  setMotion(motion);
}

function setMotion(motion) {
  petBox.classList.remove(...MOTIONS.map((m) => "m-" + m));
  if (!motion) return;
  petBox.classList.add("m-" + motion);
  // 重新触发一次动画（连续两页用同一个动作时也要有反应）
  void petBox.offsetWidth;
}

/**
 * 面板头部状态药丸。text 为显示文案，tone ∈ idle|listen|think|play|build|err
 * （对应 CSS #pill.t-* 的圆点颜色与呼吸动画）。
 */
function setPill(text, tone) {
  pillText.textContent = text;
  pillEl.className = "pill t-" + (tone || "idle");
}

/**
 * 气泡显隐的唯一入口，同时把「气泡占了地方」这件事同步给 #root。
 *
 * 为什么必须收敛到一个入口：气泡与面板共用同一个 480px 窗口，气泡一起来面板就被压扁，
 * 底部「最近发送」会被切掉一截（实测 guide 切 6px / think 16px / offline 34px）。
 * 让位规则（#root.compact，见 CSS）只在气泡真的在屏时生效，所以这里必须与 display 同步。
 * 以前各处直接写 bubble.style.display，漏掉任何一处都会让面板带着多余的 #recent 去抢高度。
 */
function setBubbleVisible(show) {
  bubble.style.display = show ? "block" : "none";
  rootEl.classList.toggle("compact", !!show);
}

/**
 * @param {string} key  状态 key（对应 BUBBLE / PILL / STATE_MOTION）
 * @param {string} [text]  覆盖文案（识别到的文字等）
 * @param {string} [title] 覆盖标题。实时变声运行时用它把「我在听」换成引擎名，
 *                         这样不悬停也能从气泡上看出「现在是 RVC 还是千问」。
 */
function setState(key, text, title) {
  if (guide) return;                       // 导览播放中，状态轮询不抢气泡
  if (key === lastKey && text === textEl.textContent) return;
  lastKey = key;
  // 药丸必须写在下面的早退分支之前：待机时气泡是 hidden、会直接 return，
  // 若把 setPill 放在 return 之后，面板就会永远停在上一状态。
  const pill = PILL[key] || [key, "idle"];
  setPill(pill[0], pill[1]);
  setSprite(key, STATE_MOTION[key] || null);
  const info = BUBBLE[key];
  if (!info || (info.hidden && !text)) { setBubbleVisible(false); return; }
  bubble.className = info.cls;
  setBubbleVisible(true);
  titleEl.textContent = title || info.title;
  textEl.classList.remove("typing");
  textEl.textContent = text || info.text;
}

// ---------------- 页面导览 ----------------
/** 单句停留时长：够读完，又不至于让人等（含后续打字时间） */
function lineMs(line) {
  return Math.min(4200, Math.max(2200, 1500 + line.length * 110));
}

function typeText(text) {
  if (typingTimer) { clearInterval(typingTimer); typingTimer = null; }
  textEl.classList.remove("typing");
  textEl.textContent = text;
}

function clearGuide() {
  guideTimers.forEach(clearTimeout);
  guideTimers = [];
  clearInterval(typingTimer);
  typingTimer = null;
  guide = null;
  // 这里不碰气泡显隐/让位标记：endGuide() 紧接着会 void tick() → setState() 重画，
  // 由 setBubbleVisible() 统一决定气泡与 .compact。中途先动一次只会闪一下。
}

function endGuide() {
  if (!guide) return;
  clearGuide();
  setMotion(null);
  lastKey = null;             // 强制下一帧重画状态气泡
  void tick();
}

function playGuide(g) {
  clearGuide();
  const lines = Array.isArray(g.lines) ? g.lines.filter(Boolean) : [];
  if (!lines.length) return;
  guide = g;
  lastKey = null;
  setSprite(g.action || "idle", g.motion || "pop");

  bubble.className = "guide";
  setBubbleVisible(true);          // 导览气泡同样会占高度 → 面板让位（见 #root.compact 注释）
  titleEl.textContent = g.title || "这一页";
  stepsEl.innerHTML = lines.map(() => "<i></i>").join("");

  let at = 0;
  lines.forEach((line, i) => {
    guideTimers.push(setTimeout(() => {
      if (!guide) return;
      Array.from(stepsEl.children).forEach((el, k) => el.classList.toggle("on", k === i));
      typeText(line);
    }, at));
    at += lineMs(line);
  });
  guideTimers.push(setTimeout(endGuide, at + 1000));
}

// 主进程在切页时推送；变声运行中静默丢弃（不打断状态展示）
if (window.pet && window.pet.onGuide) {
  window.pet.onGuide((g) => {
    if (statusBusy || !g) return;
    playGuide(g);
  });
}
// 点气泡：导览中=跳过；后端离线=打开后端日志；否则无操作
bubble.addEventListener("click", () => {
  if (guide) { endGuide(); return; }
  if (backendOffline && window.pet && window.pet.showBackendLog) {
    window.pet.showBackendLog();
  }
});

// ---------------- 状态轮询 ----------------
function render(s) {
  if (!s.running) { lastText = ""; setState("idle"); return; }

  if (s.child_error || s.stage === "error") { setState("error"); return; }
  switch (s.stage) {
    case "warming":
      setState("build");
      return;
    case "asr":
      setState("think", "听懂啦…");   // 此刻 last_text 还是上一句，不展示
      return;
    case "tts":
      // ASR 完成进入合成：last_text 即本句识别结果，展示文字 = 「听懂了的确认」
      if (s.last_text) lastText = s.last_text;
      setState("think", lastText ? `「${lastText}」` : "正在合声…");
      return;
    case "capturing":
      // playing 阶段在子进程里只存在几毫秒（同步处理后立刻回到 capturing），
      // 「正在播出」的真实信号是播放队列积压 queued_s > 0
      if (s.queued_s > 0.05) {
        // 轮询可能错过短暂的 tts 阶段，此时用 last_text 兜底
        if (s.last_text && s.last_text !== lastText) lastText = s.last_text;
        setState("play", lastText ? `「${lastText}」` : "正在播…");
      } else {
        lastText = "";                          // 队列空了 = 播完，回到「我在听」
        setState("listen", "我在听 · 你继续说", "千问变声");
      }
      return;
    default:
      setState("build");   // init 等未知阶段
  }
}

function renderLive(l) {
  // 实时变声模式：基础「我在听」动画 + 实时字幕（转写子进程挂在 asr_* 字段）。
  // 标题固定写「RVC 实时」：气泡是唯一不悬停也能看到的地方，
  // 用户反馈「不知道现在用的是哪一种变身」，所以引擎名必须出现在这里。
  if (l.asr_running) {
    if (l.asr_stage === "transcribing") {
      setState("think", "听懂啦…", "RVC 实时");
    } else {
      setState("listen", l.asr_last_text ? `「${l.asr_last_text}」` : "变声中 · 我听着", "RVC 实时");
    }
  } else {
    lastText = "";
    setState("listen", "变声中 · 我听着", "RVC 实时");   // 转写子进程未启动：只挂身份牌，不影响变声
  }
}

// 预览模式（调试用）：pet.html?mock=1 自动轮播各状态，不依赖后端
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const MOCK_SEQ = [
  { state: "listen", text: "聆听中…" },
  { state: "think", text: "「你好呀」" },
  { state: "play", text: "「你好呀」" },
  { state: "idle", text: "" },
  { state: "build", text: "模型加载中…" },
  { state: "error", text: "" },
];
let mockIdx = 0;
if (MOCK) {
  // 调试模式下也能预览页面导览：pet.html?mock=1 时 6s 后自动演一遍「音色工坊」
  const step = () => {
    if (guide) return;
    const m = MOCK_SEQ[mockIdx % MOCK_SEQ.length];
    mockIdx += 1;
    setState(m.state, m.text);
  };
  step();
  setInterval(step, 2500);
  setTimeout(() => {
    playGuide({
      title: "音色工坊",
      lines: ["一切从这里开始。", "丢进视频，我自动切片质检。", "挑够半分钟干净人声。"],
      action: "build",
      motion: "pop",
      duration: 8000,
    });
  }, 6000);
}

async function tick() {
  if (MOCK) return;
  if (guide) return;              // 导览期间不打断
  let cascadeData = null, live = null;
  let anyOk = false;
  if (CAP.live) {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (r.ok) { cascadeData = await r.json(); anyOk = true; }
    } catch {}
    try {
      const r = await fetch(LIVE_API, { cache: "no-store" });
      if (r.ok) { live = await r.json(); anyOk = true; }
    } catch {}
  } else {
    // ⚠️ 实时变声被关掉 → 上面两个接口**根本不存在**，绝不能据此判「后端离线」
    // （那会让桌宠在后端好好的时候永久显示「后端离线」）。改用 core.system 的
    // /api/health —— 核心能力不可关，它一定在。
    try {
      const r = await fetch(HEALTH_API, { cache: "no-store" });
      if (r.ok) anyOk = true;
    } catch {}
  }
  // —— 后端健康：两个状态接口全挂 = 后端失联。离线时切 error 精灵 + 气泡提示
  // （不刷屏：离线只提示一次，恢复在线时再提示一次「回来啦」）——
  const wasOffline = backendOffline;
  backendOffline = !anyOk;
  if (backendOffline) {
    // ⚠️ 离线期间必须**每帧**都 return，不能只 return「刚离线」那一帧。
    // 原来写成 `if (backendOffline && !wasOffline) { … return; }`，于是 1s 后的下一帧
    // 会继续往下走进状态机的 else 分支 → setState("idle") 把离线气泡藏掉、
    // 药丸改回「待机」，「后端离线」提示一闪而过（本次改版量测面板时发现的既有缺陷）。
    if (!wasOffline) {
      offlineHintedAt = Date.now();
      lastKey = null;                 // 强制重画气泡，让「离线」立刻上屏
      setSprite("error", "shake");
      bubble.className = "s-error";
      setBubbleVisible(true);
      titleEl.textContent = "后端离线";
      textEl.textContent = "后端没起来，先开主程序（点此看日志）";
      setPill("后端离线", "err");
      // 抖一下提醒，然后收成静态的 error 姿势 —— 后端长时间不恢复时不该一直晃
      setTimeout(() => { if (backendOffline && !guide) setMotion(null); }, 1800);
    }
    return;                           // 离线期间不进状态机，避免用空数据渲染「待机」
  }
  if (wasOffline) {
    // 后端恢复：给一句「回来啦」反馈，3s 后自然回到状态机
    offlineHintedAt = Date.now();
    setState("idle");
    bubble.className = "s-play";
    setBubbleVisible(true);
    titleEl.textContent = "后端在线";
    textEl.textContent = "回来啦，随时可以用～";
    setPill("在线", "play");
    setTimeout(() => { if (!backendOffline && !guide) { lastKey = null; void tick(); } }, 3000);
  }
  // 谁在跑：级联优先（两者互斥，真同时出现也只可能是切换的那一瞬间）
  runningEngine = (cascadeData && cascadeData.running) ? "qwen"
                : (live && live.live_running) ? "rvc" : null;
  statusBusy = Boolean(runningEngine);
  // 空闲计时：任何变声在跑就归零，否则记连续空闲起点（供「打盹」演出用）
  idleSince = statusBusy ? 0 : (idleSince || Date.now());
  // 引擎分段随真实状态走（面板隐藏时改了也不影响）。
  // 选中（.on）与运行中（.running，绿底呼吸）分开表达：把「选中」当「已开启」会骗人 ——
  // 用户完全可能在主界面开了 RVC，而桌宠上选的是千问。
  refreshEngineSeg();
  if (runningEngine === "qwen") {
    render(cascadeData);
    // 引擎名是「头条状态」，盖过 render() 内部 setState 写的「我在听」。
    // 必须放在 render 之后 —— setState 会重写药丸。
    setPill("千问变声中", "listen");
  } else if (runningEngine === "rvc") {
    renderLive(live);
    setPill("RVC 变声中", "listen");
  } else {
    lastText = "";
    setState("idle");   // 都没运行 / 后端没起：安静待机，不报错打扰
  }
  // 倾听细节：在听时偶尔抖一下耳朵（短暂打断 ear 动作，随后恢复）
  if (lastKey === "listen" && !guide && !earTwitching && Date.now() - lastEarTwitch > 8000) {
    earTwitching = true;
    lastEarTwitch = Date.now();
    setMotion("ear-twitch");
    setTimeout(() => {
      earTwitching = false;
      if (lastKey === "listen" && !guide) setMotion(STATE_MOTION.listen || "ear");
    }, 600);
  }
}

// ---------------- 手动拖拽 + 点击穿透 ----------------
// app-region: drag 与 setIgnoreMouseEvents 组合在透明窗上不可靠，改由 JS 主导：
// 悬停角色/气泡时关穿透，按下后由主进程按光标屏幕坐标挪窗口。
let dragging = false;
let movedFar = false;    // 本次按下是否拖出了死区（区分单击 vs 拖拽）
let downX = 0, downY = 0;

// ---------------- 快捷面板：悬停角色浮现 ----------------
const panel = document.getElementById("panel");
const sayEl = document.getElementById("say");
const sendBtn = document.getElementById("send");
const sendLabel = document.getElementById("sendLabel");
const engRvcBtn = document.getElementById("engRvc");
const engQwenBtn = document.getElementById("engQwen");
const voiceSel = document.getElementById("voiceSel");
const previewBtn = document.getElementById("preview");
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const recentEl = document.getElementById("recent");
const tabSpeakBtn = document.getElementById("tabSpeak");
const tabFxBtn = document.getElementById("tabFx");
const speakPaneEl = document.getElementById("speakPane");
const fxPaneEl = document.getElementById("fxPane");
const fxGridEl = document.getElementById("fxGrid");
const fxPicksEl = document.getElementById("fxPicks");
const fxEmptyEl = document.getElementById("fxEmpty");
const fxModeLiveBtn = document.getElementById("fxModeLive");
const fxModePremixBtn = document.getElementById("fxModePremix");
const VOICE_KEY = "pet_voice_id";
let panelTimer = null;
let panelOpen = false;       // 面板是否可见（Esc 收起、点击穿透判定都要用）
// 试听产物：声明点从「试听/发送」段前移到这里 —— refreshPanel() 会读它来决定主按钮文案，
// 而 refreshPanel 挂在 mouseenter 上，提前声明可彻底排除 TDZ 隐患。
let lastPreview = null;      // { wav, url, duration_s } 最近一次试听的合成产物
let previewAudio = null;

// ---------------- 实时变声引擎：RVC 实时 / 千问变声 ----------------
/**
 * 后端有两个**互斥**的实时变声引擎（互相 409：「两者抢 GPU 且都占 CABLE」）：
 *   rvc  —— 逐帧套音色，保留你的说话习惯，适合真人音色 / 低延迟
 *   qwen —— 先 ASR 识别成文字、再 TTS 合成换嗓，适合卡通 / 角色音色，慢一点
 * 所以面板上做成「选一个」的分段控件，而不是两个独立开关（后者会让人以为能同时开）。
 *
 * 用户原话：「这两个用户不确定到底用哪一种」「就没体现 rvc 的」「我感觉这个可以来回切换」。
 * 因此这里做三件事：① 选中项常驻高亮；② 真正在跑的那个亮呼吸点；③ 药丸与气泡都写出引擎名。
 */
const ENGINE_KEY = "pet_engine";
const ENGINES = {
  rvc:  { label: "RVC 实时", start: "/api/rvc/live/start", stop: "/api/rvc/live/stop" },
  qwen: { label: "千问变声", start: "/api/cascade/start",   stop: "/api/cascade/stop" },
};
const savedEngine = localStorage.getItem(ENGINE_KEY);
let engine = ENGINES[savedEngine] ? savedEngine : "rvc";   // 选中的引擎（持久化）
let runningEngine = null;   // 实际在跑的那个（都没跑=null）；由 tick() 每帧按两个状态接口刷新
let engineBusy = false;     // 启停进行中：防连点造成「停一半又启」的交叉状态

/** 刷新引擎分段的状态类（选中 .on / 运行中 .running）。
 *  2026-09-26 起启停就合在分段本身：没有独立的「开 RVC」按钮了。 */
function refreshEngineSeg() {
  if (engRvcBtn) {
    engRvcBtn.classList.toggle("on", engine === "rvc");
    engRvcBtn.classList.toggle("running", runningEngine === "rvc");
  }
  if (engQwenBtn) {
    engQwenBtn.classList.toggle("on", engine === "qwen");
    engQwenBtn.classList.toggle("running", runningEngine === "qwen");
  }
}

/** 启停进行中时分段的忙态：两颗按钮一起禁用（引擎互斥，中途谁都不能点）。 */
function setSegBusy(on) {
  [engRvcBtn, engQwenBtn].forEach((b) => { if (b) setBusy(b, on); });
}

function setEngine(next) {
  if (!ENGINES[next]) return;
  engine = next;
  try { localStorage.setItem(ENGINE_KEY, next); } catch {}
  refreshEngineSeg();
}

/**
 * 直连后端（不走主进程 IPC）。这是**设计内**的通道，不是绕过鉴权：
 * m2_server/server.py 的 _TokenMiddleware 对本机 127.0.0.1 直接放行，
 * _OriginGuardMiddleware + CORSMiddleware 也显式放行 file:// 页面（Origin: null）。
 * 走渲染进程的好处：桌宠的启停逻辑全部留在 pet.html 里，不必改 preload/main ——
 * 改主进程要重打 asar 才能生效，而 pet.html 是热替换就生效的。
 */
async function apiPost(path) {
  try {
    const r = await fetch("http://127.0.0.1:8000" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    let data = null;
    try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: String((e && e.message) || e) };
  }
}
function apiErr(r) {
  return (r.data && (r.data.detail || r.data.error)) || r.error || ("HTTP " + r.status);
}

/** 开关当前选中的引擎。两个互斥，所以启动前先把在跑的另一个停掉。 */
async function toggleLive() {
  if (engineBusy) return;
  const e = ENGINES[engine];
  engineBusy = true;
  setSegBusy(true);
  try {
    if (runningEngine === engine) {
      setStatus(`正在停止${e.label}…`, "");
      const r = await apiPost(e.stop);
      setStatus(r.ok ? `${e.label} 已停止` : `停止失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    } else {
      if (runningEngine) {
        // 后端对这种情况直接 409（「两者抢 GPU 且都占 CABLE」）。
        // 用户点的是另一个引擎，意图很明确，所以替他先停再开，而不是甩一句报错让他自己停。
        setStatus(`先停掉${ENGINES[runningEngine].label}，再切到${e.label}…`, "");
        const s = await apiPost(ENGINES[runningEngine].stop);
        if (!s.ok) { setStatus(`停不掉${ENGINES[runningEngine].label}：${apiErr(s)}`, "err"); return; }
      }
      setStatus(`正在启动${e.label}…模型就绪要一会儿`, "");
      const r = await apiPost(e.start);
      setStatus(r.ok ? `${e.label} 已开启` : `启动失败：${apiErr(r)}`, r.ok ? "ok" : "err");
    }
  } finally {
    engineBusy = false;
    setSegBusy(false);
    void tick();       // 立刻回读真实状态，不等下一个 1s 轮询
  }
}

/**
 * 点分段里的某个引擎。
 *   · 点**没选中**的：切过去。有引擎在跑 → 停掉它并开新的（用户已确认「自动停掉再开新的」）；
 *     都没在跑 → 只改选择、不自动启动（免得点错一下就占上 GPU 和 CABLE）。
 *   · 点**已选中**的：启动 / 停止（2026-09-26 起这是唯一的启停入口 ——
 *     原来的「开 RVC」按钮与已选中项永远是同一个引擎，用户看着就是两个 RVC）。
 */
async function pickEngine(next) {
  if (!ENGINES[next]) return;
  if (next === engine) { await toggleLive(); return; }
  const wasRunning = runningEngine;
  setEngine(next);
  if (!wasRunning) {
    setStatus(`引擎已切到「${ENGINES[next].label}」，再点一下它启动`, "");
    return;
  }
  await toggleLive();
}

function showPanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = true;
  panel.style.display = "block";
  refreshPanel();   // 每次浮现刷新：音色下拉 + 最近发送 + 主按钮文案
}
function hidePanel() {
  if (panelTimer) { clearTimeout(panelTimer); panelTimer = null; }
  panelOpen = false;
  panel.style.display = "none";
}
function schedulePanelHide() {
  if (panelTimer) return;
  panelTimer = setTimeout(() => {
    panelTimer = null;
    panelOpen = false;
    panel.style.display = "none";
  }, 500);
}
petBox.addEventListener("mouseenter", showPanel);
petBox.addEventListener("mouseleave", schedulePanelHide);
panel.addEventListener("mouseenter", showPanel);
panel.addEventListener("mouseleave", schedulePanelHide);
// Esc 收起面板：面板占了大半屏，鼠标要移开 500ms 才自动收，键盘给一条快路
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && panelOpen) hidePanel();
});

/**
 * 音色下拉。`/api/voices` 合并了两个来源（音色库档案 + RVC 实验目录），这里挑出**真能用**的：
 *   · 有参考音（has_reference）→ 能当 TTS 的语气参考，也能被 RVC 换成它自己；
 *   · 没参考音但有可推理权重（pth_exists，市场装的大多是这种）→ **仍然可选**：
 *     `send_text` / `preview_text` 会借一段别的参考音做语气，末尾再由 RVC 换成它
 *     （音色由 RVC 决定），所以选得中、也试听得成；
 *   · 两者都没有（只有语料、还没训练）→ 不列，列出来只会点一次错一次。
 *
 * 2026-09-22 之前这里只列 `has_reference` 的音色，依据是"没参考的 RVC 模型合不了 TTS"。
 * 局部结论没错，但把整条路堵死了：用户在「音色市场」装的音色一个都选不到，面板里永远
 * 只剩自训的那两个 —— 用户看到的就是"只能选两个音色"。现在按"这个音色能不能用"
 * 而不是"它有没有参考音"来筛，后端 `_tts_ref_for` 补齐了缺的那半段。
 */
async function loadVoices() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/voices", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const usable = (j.voices || []).filter((v) => v.has_reference || v.pth_exists);
    const saved = localStorage.getItem(VOICE_KEY) || "";
    const cur = voiceSel.value || saved;
    const opts = [new Option("主界面选中", "")];
    for (const v of usable) {
      // 原生 <option> 渲染不了彩色徽标，沿用主界面 voiceLabel 的约定：名字 +（来源）
      const tag = v.source === "market" ? "市场" : "自训";
      opts.push(new Option(`${v.display_name || v.id}（${tag}）`, v.id));
    }
    voiceSel.innerHTML = "";
    opts.forEach((o) => voiceSel.add(o));
    voiceSel.value = usable.some((v) => v.id === cur) ? cur : "";
  } catch {}
  syncVoiceGates();   // 下拉换了一批 → 试听按钮的可用性跟着重算
}

/**
 * 「试听」的可用性（现已**不需要禁用任何音色**，这里只负责把当前音色写进 tooltip）。
 *
 * 以前的版本会禁用"没参考音的音色"（市场装的实时变声模型），因为试听只走 `/api/tts`，
 * 而那条链要求音色自带参考音，否则直接 404。
 * 现在试听走 `/api/wechat/preview_text`：借一段参考音做语气 → RVC 换成目标音色，
 * 且后端在三段降级里会退回固定样板句（见 `preview_text` 的 docstring），
 * 所以**下拉里列出的每个音色都能试听** —— 能被列出的前提就是它 has_reference ∨ pth_exists。
 */
function syncVoiceGates() {
  const named = (voiceSel.options[voiceSel.selectedIndex] || {}).text || "";
  const id = voiceSel.value || "";
  previewBtn.title = id
    ? `试听「${named}」：用你输入的文字合成，末尾过 RVC 换成这个音色（只播放，不发送）`
    : "试听（默认=主界面当前选中）：用你输入的文字合成，末尾过 RVC（只播放，不发送）";
  voiceSel.title = "合成用的音色（默认=主界面当前选中）";
}

/**
 * 相对时间。面板只有 204px 宽，chip 里塞「18:04 · 3.2s」既挤又难读；
 * 「刚刚 / 3 分钟前」一眼就知道是不是刚发的，精确时刻退到 tooltip 里。
 */
function relTime(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

// 最近发送：后端 /api/wechat/history，点一条重发
async function loadRecent() {
  // 微信能力被关掉 → wechat_voice 路由不挂载，这个接口不存在。
  if (!CAP.wechat) return;
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    const items = (j.items || []).slice(0, 5);
    recentEl.innerHTML = items.length
      ? items.map((it) => {
          const t = new Date(it.ts * 1000);
          const hm = `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
          return `<span class="hitem" data-wav="${it.wav}" title="重发 ${it.wav}（${hm}，${it.duration_s}s）">${relTime(it.ts)} · ${it.duration_s}s</span>`;
        }).join("")
      : '<span class="hempty">还没发过语音</span>';
  } catch {}
}
recentEl.addEventListener("click", (e) => {
  const it = e.target.closest(".hitem");
  if (it && window.pet && window.pet.sendWav) window.pet.sendWav(it.dataset.wav);
});

// ---------------- 功能页切换 + 音效声板（sound.fx-board）----------------
/**
 * 「音效」页直连后端 /api/soundboard/*（与 loadRecent 同款通道，主进程零改动）：
 *   GET  /catalog  样本清单（图标/名字/时长）
 *   POST /play     立即播放（one-shot，请求返回时声音已经出发）
 *   POST /stop     停掉正在播的
 *   POST /warm     预热合成器（无超时握手 —— 必须 fire-and-forget，别 await 它）
 *   POST /premix   把勾选的音效**离线**混进一条合成产物，产出新 wav
 *
 * 混进语音的底（premix 的 wav 参数）：面板上刚试听的产物；没有就传 null ——
 * 后端自己取「最近一条 TTS 产物」（与发送链路同口径），两样都没有时 404，
 * 状态行引导用户先去「说话」页合成一条。产物 sfxmix_*.wav 直接 sendWav 发送。
 */
const SFX_BASE = "http://127.0.0.1:8000/api/soundboard";
const TAB_KEY = "pet_panel_tab";
const FX_MODE_KEY = "pet_fx_mode";
const FX_MODES = { live: "实时播放", premix: "混进语音" };
// chip 上的混入位置标记（一个汉字）：点击 chip 主体按 叠→头→尾 循环
const PICK_LABEL = { layer: "叠", prepend: "头", append: "尾" };

let activeTab = "speak";      // 当前功能页（localStorage 恢复，见 bootstrap）
let sfxItems = [];            // 声板样本（/catalog 的 items）
let sfxMode = "live";         // live=点格子立即出声；premix=点格子勾进预混队列
let sfxPicks = [];            // 预混队列：{ id, name, icon, mode, at_s }
let sfxPlayingId = null;      // 正在响的格子（乐观高亮用，超时后自动熄灭）
let sfxLoadedAt = 0;          // 上次拉 catalog 的时间（60s 节流，别每次悬停都打）
let sfxWarmDone = false;      // /warm 只发一次

try { if (localStorage.getItem(TAB_KEY) === "fx") activeTab = "fx"; } catch {}
try { if (localStorage.getItem(FX_MODE_KEY) === "premix") sfxMode = "premix"; } catch {}

/** innerHTML 转义：样本名/图标来自后端与用户导入，不能裸拼。 */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/** 切功能页。save=false 用于恢复/门控归位（不重复写 localStorage）。 */
function setTab(next, save) {
  activeTab = next === "fx" ? "fx" : "speak";
  if (save) { try { localStorage.setItem(TAB_KEY, activeTab); } catch {} }
  if (tabSpeakBtn) tabSpeakBtn.classList.toggle("on", activeTab === "speak");
  if (tabFxBtn) tabFxBtn.classList.toggle("on", activeTab === "fx");
  if (speakPaneEl) speakPaneEl.classList.toggle("on", activeTab === "speak");
  if (fxPaneEl) fxPaneEl.classList.toggle("on", activeTab === "fx");
  if (activeTab === "fx") void loadSfx(true);   // 进音效页就刷新清单（强制，绕过节流）
  refreshFxActions();
}

/** 拉声板清单并渲染。force=false 时 60s 内不重复拉（refreshPanel 每次悬停都跑）。 */
async function loadSfx(force) {
  if (!CAP.fx) return;
  const now = Date.now();
  if (!force && now - sfxLoadedAt < 60000) return;
  sfxLoadedAt = now;
  try {
    const r = await fetch(SFX_BASE + "/catalog", { cache: "no-store" });
    if (!r.ok) {
      if (fxEmptyEl) fxEmptyEl.textContent = r.status === 404
        ? "声板插件没开：主界面 → 桌面 → 插件里打开「音效声板」"
        : "声板拉不到（HTTP " + r.status + "）";
      renderFxGrid();
      return;
    }
    const j = await r.json();
    sfxItems = (j.items || []).filter((it) => it && it.id);
    if (fxEmptyEl) {
      fxEmptyEl.textContent = sfxItems.length
        ? ""
        : "声板还是空的：主界面 → 离线变声 → 声板 里导几个音效";
    }
    renderFxGrid();
    // 预热只做一次（无超时握手，必须 fire-and-forget；失败无所谓，首次播放慢一点而已）
    if (sfxItems.length && !sfxWarmDone) {
      sfxWarmDone = true;
      void fetch(SFX_BASE + "/warm", { method: "POST" }).catch(() => {});
    }
  } catch {
    if (fxEmptyEl) fxEmptyEl.textContent = "后端没连上，声板不可用";
    renderFxGrid();
  }
}

function renderFxGrid() {
  if (!fxGridEl) return;
  fxGridEl.innerHTML = sfxItems.map((it) => {
    const playing = sfxPlayingId === it.id ? " on" : "";
    const picked = sfxPicks.some((p) => p.id === it.id) ? " pick" : "";
    return `<button type="button" class="fxc${playing}${picked}" data-id="${esc(it.id)}"
      title="${esc(it.name)}${it.duration_s ? "（" + it.duration_s + "s）" : ""}">
      <span class="fe">${esc(it.icon || "🎵")}</span><span class="fn">${esc(it.name)}</span>
    </button>`;
  }).join("");
}

function renderFxPicks() {
  if (!fxPicksEl) return;
  fxPicksEl.innerHTML = sfxPicks.map((p, i) => {
    return `<span class="fxchip" data-idx="${i}" title="点一下换混入位置（叠→头→尾），× 移出">
      ${esc(p.icon || "🎵")} ${esc(p.name)} <span class="fm">${PICK_LABEL[p.mode] || "叠"}</span><span class="fxrm" title="移出">×</span>
    </span>`;
  }).join("");
}

/** 实时播放：乐观高亮 + one-shot /play。再点同一个格子 = 停。 */
async function sfxPlay(it) {
  if (sfxPlayingId === it.id) {
    sfxPlayingId = null;
    renderFxGrid();
    void fetch(SFX_BASE + "/stop", { method: "POST" }).catch(() => {});
    return;
  }
  sfxPlayingId = it.id;
  renderFxGrid();
  try {
    const r = await fetch(SFX_BASE + "/play", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: it.id }),
    });
    if (!r.ok) setStatus("播放失败：HTTP " + r.status, "err");
  } catch {
    setStatus("后端没连上，播放失败", "err");
  }
  // 乐观高亮：duration_s 是后端给的实长；下限 300ms 防极短样本闪一下就灭
  const dur = Math.max(300, (it.duration_s || 0) * 1000);
  setTimeout(() => {
    if (sfxPlayingId === it.id) { sfxPlayingId = null; renderFxGrid(); }
  }, dur);
}

/** 预混队列：已勾 → 移出；没勾 → 入队（混入位置默认「叠」，可在 chip 上轮换）。 */
function togglePick(it) {
  const i = sfxPicks.findIndex((p) => p.id === it.id);
  if (i >= 0) sfxPicks.splice(i, 1);
  else sfxPicks.push({ id: it.id, name: it.name, icon: it.icon, mode: "layer", at_s: 0 });
  renderFxGrid();
  renderFxPicks();
  refreshFxActions();
}

// 事件委托：格子/chip 都是 innerHTML 批量生成的，监听器挂容器上
if (fxGridEl) fxGridEl.addEventListener("click", (e) => {
  const cell = e.target.closest(".fxc");
  if (!cell) return;
  const it = sfxItems.find((x) => x.id === cell.dataset.id);
  if (!it) return;
  if (sfxMode === "premix") togglePick(it);
  else void sfxPlay(it);
});
if (fxPicksEl) fxPicksEl.addEventListener("click", (e) => {
  const chip = e.target.closest(".fxchip");
  if (!chip) return;
  const i = Number(chip.dataset.idx);
  if (!(i >= 0 && i < sfxPicks.length)) return;
  if (e.target.closest(".fxrm")) sfxPicks.splice(i, 1);
  else {
    const p = sfxPicks[i];
    p.mode = p.mode === "layer" ? "prepend" : p.mode === "prepend" ? "append" : "layer";
  }
  renderFxGrid();
  renderFxPicks();
  refreshFxActions();
});
[tabSpeakBtn, tabFxBtn].forEach((b) => {
  if (b) b.addEventListener("click", () => setTab(b.dataset.tab, true));
});
function refreshFxModeSeg() {
  if (fxModeLiveBtn) fxModeLiveBtn.classList.toggle("on", sfxMode === "live");
  if (fxModePremixBtn) fxModePremixBtn.classList.toggle("on", sfxMode === "premix");
}
[fxModeLiveBtn, fxModePremixBtn].forEach((b) => {
  if (b) b.addEventListener("click", () => {
    if (!b || !FX_MODES[b.dataset.mode]) return;
    sfxMode = b.dataset.mode;
    try { localStorage.setItem(FX_MODE_KEY, sfxMode); } catch {}
    refreshFxModeSeg();
    renderFxGrid();
    refreshFxActions();
  });
});

/**
 * 按能力清单收起桌宠上用不到的控件 —— 关掉的能力意味着后端**根本没有那些接口**，
 * 留着就是一按 404 的按钮。
 *
 * 只在清单**真正读到**之后才收（`CAP.loaded`）：读不到时保持原样，
 * 免得后端临时没起来就把桌宠弄成残废。
 */
function refreshCapVisibility() {
  if (!CAP.loaded) return;
  const hide = (id, off) => {
    const el = document.getElementById(id);
    if (el) el.style.display = off ? "none" : "";
  };
  hide("engRow", !CAP.live);      // 「麦克风」+ 引擎二选一分段（启停已并入分段，无独立按钮）
  // ⚠️ 「最近发送」「试听」「发送」三个都属于 hook.wechat（后两个打的是
  //    /api/wechat/*）—— 关掉它之后这些接口根本不存在，留着就是一按 404 的按钮。
  //    试听曾经就是这么给市场音色变成死钮的（那次是把按钮禁用，也不是消失），
  //    所以这里一并收：能力没了就该看不见，而不是点了才知道。
  hide("recent", !CAP.wechat);    // 「最近发送」（点一条重发）
  hide("preview", !CAP.wechat);   // 「试听」（不发送的 TTS+RVC 试听）
  hide("send", !CAP.wechat);      // 「合成并发送」
  // 「音效」页整体归 sound.fx-board：入口（tabRow）和页体（fxPane）一起收，
  // 只藏 tabRow 不藏 fxPane 的话，localStorage 里残留 tab=fx 的用户会看到一个
  // 没法切走、还打 404 的死页。收掉后强制回「说话」页。
  hide("tabRow", !CAP.fx);
  hide("fxPane", !CAP.fx);
  if (!CAP.fx && activeTab === "fx") setTab("speak", false);
}

function refreshPanel() {
  loadVoices(); loadRecent(); loadSfx(false); refreshSendLabel(); refreshEngineSeg();
  refreshFxModeSeg(); refreshCapVisibility(); refreshFxActions();
}

// ---------------- 试听 / 发送 / 结果反馈 ----------------
// lastPreview / previewAudio 的声明已前移到「快捷面板」段的 DOM 引用处（排除 TDZ 隐患）。

/** 主按钮/试听按钮的显隐与文案跟着功能页走：
    说话页 —— 试听 + 「合成并发送 / 发送试听」（原有语义）；
    音效页 —— 试听没有意义（它试听的是文字合成）→ 藏；主按钮 = 发送预混队列，
              没勾选时无从谈起 → 禁用。 */
function refreshSendLabel() {
  if (!sendLabel) return;
  if (activeTab === "fx") {
    sendLabel.textContent = sfxPicks.length ? `发送（${sfxPicks.length} 个音效）` : "发送";
  } else {
    sendLabel.textContent = lastPreview ? "发送试听" : "合成并发送";
  }
}

function refreshFxActions() {
  const fx = activeTab === "fx";
  // 试听按钮：fx 页藏（没有文字可合成）；CAP.wechat 关掉时 refreshCapVisibility 已藏，
  // 这里的条件取并集，避免切页时把 CAP 收起来的按钮又亮回去。
  if (previewBtn) previewBtn.style.display = (fx || !CAP.wechat) ? "none" : "";
  if (sendBtn) sendBtn.disabled = fx && !sfxPicks.length ? true : false;
  refreshSendLabel();
}

/** 忙态：禁用 + 把图标换成旋转圈（CSS: #panel button.busy）。
    「合成中」动辄十几秒，只把按钮变灰用户会以为卡死，转圈才看得见在动。 */
function setBusy(btn, on) {
  if (!btn) return;
  btn.disabled = !!on;
  btn.classList.toggle("busy", !!on);
}

/**
 * 状态行。cls ∈ ""(信息) | "ok" | "err"。
 *
 * ⚠️ 只要 text 非空就必须挂上 .show —— 早先的写法是
 * `className = cls ? "show " + cls : ""`，于是 `setStatus("合成中…")`（doPreview 的调用）
 * 把 className 清空，而 #status 只有 .show 才 display:flex，
 * 结果是「合成中…」这条提示从来没有真正显示过。
 */
function setStatus(text, cls) {
  statusText.textContent = text || "";
  statusEl.className = text ? ("show" + (cls ? " " + cls : "")) : "";
}

function doPreview() {
  // 试听端点归 hook.wechat；能力关了就退回一个明确提示，别静静地去打一个不存在的路由。
  if (!CAP.wechat) { setStatus("微信发送能力已关闭，试听不可用", "err"); return; }
  const text = sayEl.value.trim();
  if (!text || !window.pet || !window.pet.previewText) return;
  const voiceId = voiceSel.value || "";
  if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);
  setStatus("合成中…");
  setBusy(previewBtn, true);
  setTimeout(() => setBusy(previewBtn, false), 60000);
  window.pet.previewText(text, voiceId, document.getElementById("noRvc")?.checked === true);
}

async function doSendText() {
  const text = sayEl.value.trim();
  if (!window.pet) return;
  // 发前探活：连不上后端立即提示，不闷头转圈被误判成卡死。
  // 报错分两种因（2026-09-18）：「没服务在听」该去启动后端，「HTTP 异常」该看日志，
  // 以前一律一句「后端未连接」，用户分不清。
  let probeErr = "";
  try {
    const r = await fetch("http://127.0.0.1:8000/api/health", { cache: "no-store" });
    if (!r.ok) probeErr = `后端在但返回异常（HTTP ${r.status}）：看日志 %APPDATA%\\voice-morph-desktop\\backend.log`;
  } catch {
    probeErr = "后端没连上：8000 端口没有服务在监听（变声后端未启动或已退出）。打开主界面会自动拉起后端，等就绪后再试";
  }
  if (probeErr) { setStatus(probeErr, "err"); return; }
  // 音效页：发送 = 把预混队列混进一条语音一起发（见 premixAndSend 注释）
  if (activeTab === "fx") {
    if (!sfxPicks.length) return;
    await premixAndSend();
    return;
  }
  // 有试听产物就直接发它（试听→发送两步走），否则一步到位「合成并发送」
  if (lastPreview && window.pet.sendWav) {
    setStatus(`发送中… 自动发到微信，全程别动键鼠`, "ok");
    window.pet.sendWav(lastPreview.wav);
    lastPreview = null;
    refreshSendLabel();          // 待发产物已消费，主按钮立刻退回「合成并发送」
  } else {
    if (!text) return;
    const voiceId = voiceSel.value || "";
    if (voiceId) localStorage.setItem(VOICE_KEY, voiceId);   // 记住上次选的音色
    setStatus("合成中… 完成后自动发到微信，全程别动键鼠", "ok");
    if (window.pet.sendText) {
      window.pet.sendText(text, voiceId, document.getElementById("noRvc")?.checked === true);
      sayEl.value = "";
      void watchSendOutcome();   // 主进程旧版不回传结果时的兜底收尾（见函数注释）
    }
  }
  setBusy(sendBtn, true);
  setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);   // TTS+录音发送可能要十几秒
}

/**
 * 音效页的发送：预混队列 → 一条新 wav → 正常发送链路。
 *
 * 底的选择（/soundboard/premix 的 wav 参数）：
 *   · 面板上有刚试听的产物（lastPreview）→ 混进它（用户刚听过，最明确）；
 *   · 没有就传 null —— 后端自己取「最近一条 TTS 产物」（与发送链路同口径），
 *     典型场景：刚在说话页发过一条，切到音效页勾上「鼓掌」再点发送 = 给那条语音加个掌声；
 *   · 两样都没有 → 后端 404「还没有 TTS 产物」，原样透传，状态行引导先合成。
 * 产物（sfxmix_*.wav）设进 lastPreview 后直接 sendWav，走与「发送试听」完全相同的
 * 发送/回传/看门狗链路 —— 不新造一条发送路径。
 */
async function premixAndSend() {
  if (!window.pet || !window.pet.sendWav) return;
  const inserts = sfxPicks.map((p) => (p.mode === "layer"
    ? { sample: p.id, mode: p.mode, at_s: p.at_s }
    : { sample: p.id, mode: p.mode }));
  setStatus("正在混入音效…", "ok");
  setBusy(sendBtn, true);
  let j = null;
  try {
    const r = await fetch(SFX_BASE + "/premix", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wav: lastPreview ? lastPreview.wav : null, inserts }),
    });
    if (r.ok) j = await r.json();
    else {
      const d = await r.json().catch(() => ({}));
      setBusy(sendBtn, false);
      setStatus("预混失败：" + ((d && d.detail) || "HTTP " + r.status), "err");
      return;
    }
  } catch {
    setBusy(sendBtn, false);
    setStatus("预混失败：后端没连上", "err");
    return;
  }
  // skipped = 空音频之类的坏样本被后端跳过。必须说出口 —— 静默跳过会让
  // 「发出去的语音里少了那一声，而界面一切正常」，那是最难发现的失败。
  if (j.skipped && j.skipped.length) {
    setStatus(`混好了，但 ${j.skipped.length} 个音效是空文件被跳过`, "warn");
  }
  lastPreview = { wav: j.wav, url: "", duration_s: j.seconds };
  setStatus("发送中… 自动发到微信，全程别动键鼠", "ok");
  window.pet.sendWav(j.wav);
  lastPreview = null;            // 与「发送试听」同口径：待发产物已消费
  refreshSendLabel();
  void watchSendOutcome();       // sendWav 路径旧版主进程不回传结果，兜底收尾（同 doSendText）
  setTimeout(() => { setBusy(sendBtn, false); refreshPanel(); }, 25000);
}
previewBtn.addEventListener("click", doPreview);
voiceSel.addEventListener("change", syncVoiceGates);
sendBtn.addEventListener("click", doSendText);
sayEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doSendText(); });
// 引擎分段（唯一启停入口）：点已选中的 = 启动/停止，点另一个 = 切过去。
// dataset.eng 与 ENGINES 的键一一对应。
[engRvcBtn, engQwenBtn].forEach((b) => {
  if (b) b.addEventListener("click", () => { void pickEngine(b.dataset.eng); });
});

// 主进程回传：合成产物 → 自动播放
if (window.pet && window.pet.onPreviewResult) {
  window.pet.onPreviewResult((r) => {
    setBusy(previewBtn, false);   // 结果已回，不必再等那个 60s 兜底计时器
    if (!r || !r.ok) { setStatus("合成失败：" + ((r && r.error) || "未知错误"), "err"); return; }
    // `sendable === false` = 后端退回了**固定样板句**（你的文字没合出可用声音）：
    // 那是拿来确认"音色对不对"的，不是你要发的东西 —— 绝不能设进 lastPreview，
    // 否则主按钮会变成「发送试听」，发出去的是样板句而不是你打的字。
    if (r.sendable === false) {
      lastPreview = null;
      refreshSendLabel();         // 保持「合成并发送」
      setStatus(`${r.note || "你的文字没合出可用声音，改听固定样板句"}（${r.duration_s || "?"}s）`, "ok");
    } else {
      lastPreview = { wav: r.wav, url: r.url, duration_s: r.duration_s };
      refreshSendLabel();         // 主按钮切到「发送试听」
      setStatus(`已合成 ${r.duration_s || "?"}s，试听中…满意就点「发送试听」`, "ok");
    }
    try {
      if (previewAudio) previewAudio.pause();
      previewAudio = new Audio(r.url);
      previewAudio.onended = () => setStatus(lastPreview ? `试听完毕，点「发送试听」发出去` : "", "ok");
      void previewAudio.play();
    } catch {
      setStatus(`合成完成（${r.duration_s || "?"}s），但播放失败`, "err");
    }
  });
}

// 主进程回传：发送结果 → 面板状态行直接给结论
if (window.pet && window.pet.onSendResult) {
  window.pet.onSendResult((r) => {
    if (!r) return;
    void settleSendResult(r);
    refreshPanel();
  });
}

/** 读 /api/wechat/history 的最新一条；失败或无记录返回 null。 */
async function fetchLastHistory() {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const items = j.items || [];
    return items[items.length - 1] || null;
  } catch {
    return null;
  }
}

/**
 * 把一次发送结果落到状态栏。
 *
 * warning 优先用回传值；回传里没有就补查一次历史 —— 兼容"主进程还是旧版、没透传
 * warning"的装机状态（改 *.cjs 要重打 asar，pet.html 却是热替换生效）。
 * 告警含义：录音环境有问题（典型是微信绑在物理麦上）→ 这条语音很可能是静音。
 * 背景见 2026-09-18 事故：此前这里无条件打绿勾「已发到微信 ✓」。
 *
 * 分段发送（2026-09-23）带来的两条新约束，都在下面显式处理：
 *   ① `warning` 是**单条**的属性，不是整批的。批次里第 1 条告警、第 2 条正常时，
 *      以前会把那条 warning 当成整批结论 → "已发出（3 条）但可能没声音"，
 *      而实际上后两条好好的。所以只报**哪几条**有问题，不否定整批。
 *   ② 时长也是**单条**的。批次里 duration_s 只代表其中一条，
 *      以前写成"已发出（12.3s）"会让人以为整段只有 12 秒 → 必须改成条数口径。
 */
async function settleSendResult(r, fallbackDurationS) {
  if (!r || !r.ok) {
    setStatus("发送失败：" + ((r && r.error) || "未知错误"), "err");
    return;
  }
  // 没有回传条数时（旧版主进程）按 1 条处理，口径与单条发送一致
  const total = Number(r.total_chunks) || 1;
  const sent = r.sent_chunks != null ? Number(r.sent_chunks) : total;
  const partial = r.outcome && r.outcome !== "ok";
  let warn = r.warning || "";
  let dur = r.duration_s || fallbackDurationS;
  if (!warn) {
    const last = await fetchLastHistory();
    // 只认刚发出的那条：ts 过旧说明是历史遗留告警，别拿来吓人
    if (last && (!last.ts || Date.now() / 1000 - last.ts <= 300)) {
      warn = last.warning || "";
      dur = dur || last.duration_s;
    }
  }
  // 条数口径：整批都发出去才算成功；中途落败要说清发出去几条，别含糊成"失败了"
  const count = total > 1 ? `${total} 条语音` : `${dur || "?"}s`;
  if (partial) {
    setStatus(
      `已发出 ${sent}/${total} 条（第 ${(r.failed_index ?? sent) + 1} 条失败）` +
        (r.remaining_wavs && r.remaining_wavs.length ? "，剩的可重发" : ""),
      "warn"
    );
    return;
  }
  if (warn) {
    // ★ 不把单条的告警说成整批：只说"这几条里有人听不见"，剩下的是好的
    setStatus(`已发出 ${count}，但可能有静音：${warn}`, "warn");
  } else {
    setStatus(`已发到微信 ✓（${count}）`, "ok");
  }
}

/**
 * 「合成并发送」的兜底看门狗。
 *
 * 为什么需要：主进程 pet-actions.cjs 的 doSendTextToWechat() 原先**从不回传**
 * pet:send-result（只有 sendWechatWav 回传），于是这条路径的状态栏永远停在
 * "合成中…"——2026-09-18 用户正是看到"已经合成完了，下面还写着合成中"来问的。
 * 主进程已修，但改 *.cjs 要重打 asar；这里用只读轮询兜住旧装机：一旦
 * /api/wechat/history 出现本次的新记录就收尾。收到正常回传时本循环会自行退出。
 *
 * ★ 分段发送（2026-09-23）下的关键改动：**"出现了新记录"不等于"整批发完了"**。
 *   长文会被切成 N 条依次录，每发一条就多一行历史 —— 如果照旧一看到新记录就收尾，
 *   第 1 条落地时就会打上绿勾"已发到微信 ✓"，而此时第 2、3 条还在录。
 *   更糟的是用户看到"已完成"就可能去动键鼠，正好打断正在进行的录制。
 *   对策：把"收尾"改成"**稳定计数**"——连续两次轮询条数不再变化才认为整批结束；
 *   而条数一旦等于回传的 total_chunks（后端明确告诉我们要几条）就立即收尾，
 *   不必白等一轮。没有 total_chunks 时（旧版后端）退化成原来的单条行为。
 */
async function watchSendOutcome() {
  const startedAt = Date.now() / 1000;
  let seen = 0;        // 本次已看到的历史条数
  let stableRounds = 0; // 连续未增长的轮数
  for (let i = 0; i < 300; i++) {                    // 最多约 600s（长文 N 条）
    await new Promise((res) => setTimeout(res, 2000));
    const el = document.getElementById("status");
    if (!el || !el.classList.contains("show")) return;
    if (!statusText.textContent.includes("合成中")) return;   // 已被回传收尾
    const last = await fetchLastHistory();
    if (!last || !last.ts || last.ts < startedAt - 5) continue;   // 本次还没有记录
    const cnt = await countHistorySince(startedAt);
    if (cnt > seen) {
      seen = cnt;
      stableRounds = 0;
      // 有进度就如实报，别一直显示"合成中…"让它看起来像卡住
      setStatus(
        cnt > 1 ? `合成中…已发出 ${cnt} 条，还有更多在录（别动键鼠）` : "合成中…",
        "ok"
      );
      continue;
    }
    stableRounds += 1;
    // 整批结束的判据：① 后端说过总共几条且已凑齐；② 或连续 3 轮（约 6s）不再增长。
    // ① 更准（段间等待时条数本来就不动，靠 ② 会白等或早退），优先用它。
    const wantTotal = Number(last.total_chunks) || 0;
    if ((wantTotal && cnt >= wantTotal) || (!wantTotal && stableRounds >= 2)) {
      await settleSendResult({
        ok: last.outcome === "ok",
        duration_s: last.duration_s,
        warning: last.warning || "",
        total_chunks: wantTotal || cnt,
        sent_chunks: cnt,
        outcome: last.outcome || "ok",
      });
      refreshPanel();
      return;
    }
  }
}

/** 数一数 startedAt 之后新增了几条历史（＝本批已发出几条）。失败返回 0。 */
async function countHistorySince(startedAt) {
  try {
    const r = await fetch("http://127.0.0.1:8000/api/wechat/history", { cache: "no-store" });
    if (!r.ok) return 0;
    const j = await r.json();
    return (j.items || []).filter((it) => it.ts && it.ts >= startedAt - 5).length;
  } catch {
    return 0;
  }
}

function overInteractive(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return !!(el && (el.closest("#pet") || el.closest("#bubble") || el.closest("#panel")));
}

petBox.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;   // 右键留给上下文菜单
  dragging = true;
  movedFar = false;
  downX = e.screenX; downY = e.screenY;
  window.pet && window.pet.dragStart();
  e.preventDefault();
});
document.addEventListener("mousemove", (e) => {
  if (dragging) {
    // 6px 死区：没拖出死区不算拖拽，mouseup 时按「单击角色」处理
    if (!movedFar && Math.hypot(e.screenX - downX, e.screenY - downY) > 6) movedFar = true;
    if (movedFar) { window.pet && window.pet.dragMove(); }
    return;
  }
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
});
document.addEventListener("mouseup", (e) => {
  if (!dragging) return;
  dragging = false;
  window.pet && window.pet.dragEnd();   // 主进程侧保存位置
  // 拖拽结束时光标可能已出窗（elementFromPoint 为 null）→ 恢复全穿透
  window.pet && window.pet.setIgnoreMouse(!overInteractive(e));
  // 单击角色（没拖动）：不再自动发送语音（太容易误触）。
  // 想发最近合成 → 右键桌宠「发送微信语音（用最近合成）」，或悬停用面板。
});
document.documentElement.addEventListener("mouseleave", () => {
  if (!dragging) window.pet && window.pet.setIgnoreMouse(true);
});
window.pet && window.pet.setIgnoreMouse(true);   // 初始全穿透，悬停角色后恢复

// ---------------- 待机小剧场 + 打盹 ----------------
// 闲着的时候自言自语 + 随机来一段动作，让桌宠「活着」；
// 长时间没人理（2.5 分钟+）还会随机打瞌睡（zZZ…）。
// 只在真正空闲（无级联/实时变声、无导览、状态为 idle）时触发，点气泡可跳过。
const IDLE_SKITS = [
  { lines: ["想发语音？右键我或悬停用面板～"], action: "idle", motion: "wiggle" },
  { lines: ["悬停我可以打字发语音哦"], action: "idle", motion: "wave" },
  { lines: ["看好了——", "转身！"], action: "idle", motion: "flip" },
  { lines: ["Q弹Q弹的～"], action: "idle", motion: "bounce" },
  { lines: ["飘啊飘～"], action: "listen", motion: "float" },
  { lines: ["今天也要开心呀！"], action: "play", motion: "dance" },
  { lines: ["别摇啦，头都晕了…"], action: "error", motion: "shake" },
  { lines: ["Ctrl+Alt+V 随时启停变声"], action: "think", motion: "nod" },
];
const DOZE_SKIT = { lines: ["zZZ…"], action: "listen", motion: "sleepy" };
let nextSkitAt = Date.now() + 30000;   // 出现半分钟后开始第一次
let idleSince = 0;                     // 连续空闲起点（ms），非 idle 时归零
let lastEarTwitch = 0;                 // 上次耳朵抖动时间（倾听时的小细节）
let earTwitching = false;
setInterval(() => {
  if (guide || statusBusy || lastKey !== "idle" || backendOffline) return;   // 后端离线时不待机表演
  const now = Date.now();
  if (now < nextSkitAt) return;
  const dozy = idleSince && now - idleSince > 150000 && Math.random() < 0.5;   // 闲久了的打盹
  nextSkitAt = now + (dozy ? 90000 : 45000) + Math.random() * 45000;
  const s = dozy ? DOZE_SKIT : IDLE_SKITS[Math.floor(Math.random() * IDLE_SKITS.length)];
  playGuide({ title: dozy ? "打盹" : "闲聊", lines: s.lines, action: s.action, motion: s.motion, duration: dozy ? 9000 : 6000 });
}, 5000);

// 引擎分段的初始选中态（从 localStorage 恢复）。必须在 void tick() 之前 ——
// tick 会调 refreshEngineSeg()，但那时 runningEngine 还是 null，先渲染一次选中态。
setEngine(engine);
// ⚠️ 先拿到能力清单，再决定要不要轮询引擎状态 / 皮肤。
// 否则第一帧就会按「全都开着」去打已被关掉的接口 —— 不但刷 404，
// tick() 还会据此把好好的后端判成「离线」。
void (async () => {
  await loadCapabilities();
  refreshCapVisibility();
  // 恢复上次的功能页（localStorage 残留 tab=fx 时上面 CAP 门控已把它归位到 speak）
  setTab(activeTab, false);
  refreshFxModeSeg();
  void tick();
  setInterval(tick, 1000);
  // 皮肤轮询：应用新皮肤后 5s 内热切换（无需重启桌宠）。
  // MOCK 调试模式下不请求后端（保持离线自演）。
  if (!MOCK && CAP.market) {
    loadSkin();
    setInterval(loadSkin, 5000);
  }
})();
</script>
