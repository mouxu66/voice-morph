<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>提示</title>
<style>
  /* 置顶提示横幅：全屏顶部居中，大字号 + 倒计时 + 进度条，任何窗口上都可见 */
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; user-select: none;
  }
  #wrap {
    width: 100vw; height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 3vh;
  }
  #card {
    width: 520px; box-sizing: border-box;
    padding: 16px 20px 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 41, 59, 0.94));
    border: 2px solid rgba(56, 189, 248, 0.65);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 4px rgba(56, 189, 248, 0.12);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #f8fafc;
    text-align: center;
  }
  #card.stage-prep   { border-color: rgba(245, 158, 11, 0.7); }
  #card.stage-press  { border-color: rgba(239, 68, 68, 0.8); }
  #card.stage-release{ border-color: rgba(16, 185, 129, 0.8); }
  #card.stage-done   { border-color: rgba(16, 185, 129, 0.8); }

  #title {
    font-size: 30px; font-weight: 800; letter-spacing: 1px; line-height: 1.25;
  }
  #title .big { font-size: 38px; }
  #sub {
    margin-top: 6px; font-size: 16px; color: #cbd5e1; line-height: 1.5;
  }
  #sub b { color: #fbbf24; }
  #countdown {
    margin-top: 10px; font-size: 20px; font-weight: 700;
    color: #fbbf24; font-variant-numeric: tabular-nums;
  }
  #bar {
    margin-top: 10px; height: 10px; border-radius: 999px;
    background: rgba(148, 163, 184, 0.25); overflow: hidden;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    border-radius: 999px; transition: width 100ms linear;
    background: linear-gradient(90deg, #f59e0b, #ef4444);
  }
  #card.stage-release #bar > i, #card.stage-done #bar > i { background: linear-gradient(90deg, #10b981, #34d399); }
  /* 未知时长时的「转圈」进度条 */
  #bar > i.indeterminate {
    width: 40% !important;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  #icon {
    font-size: 34px; line-height: 1; margin-bottom: 4px;
  }
  /* 按住 Alt 时红点脉冲，提醒「现在按住」 */
  #pulse {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: #ef4444; margin-right: 10px;
    animation: pulse 0.8s infinite; vertical-align: 2px;
  }
  #card:not(.stage-press) #pulse { display: none; }
  @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="card" class="stage-prep">
    <div id="icon">🎤</div>
    <div id="title">准备播放语音</div>
    <div id="sub">音频马上开始，请先切到微信聊天窗口</div>
    <div id="countdown">2 秒后开始…</div>
    <div id="bar"><i></i></div>
  </div>
</div>
<script>
  // 渲染层：接收主进程推送的阶段与倒计时
  const card = document.getElementById("card");
  const titleEl = document.getElementById("title");
  const subEl = document.getElementById("sub");
  const cdEl = document.getElementById("countdown");
  const barEl = document.querySelector("#bar > i");
  const iconEl = document.getElementById("icon");

  // 每个阶段的图标与提示词
  const STAGE = {
    prep:    { icon: "🎤", text: "准备播放语音" },
    press:   { icon: "", text: "按住 Alt 说话！" },
    release: { icon: "✅", text: "松开 Alt，语音已发送！" },
    done:    { icon: "✅", text: "完成" },
  };

  if (window.altHint && window.altHint.onHint) {
    window.altHint.onHint((g) => {
      if (!g || !g.stage) return;
      const s = STAGE[g.stage] || STAGE.prep;
      card.className = "stage-" + g.stage;
      iconEl.textContent = s.icon;
      titleEl.innerHTML = (g.stage === "press")
        ? '<span id="pulse"></span>按住 <b style="color:#f87171;font-size:44px;">Alt</b> 说话！'
        : s.text;
      subEl.innerHTML = (g.sub || "").replace(/\n/g, "<br>");
      if (g.remainS != null) {
        cdEl.style.display = "block";
        cdEl.textContent = `还剩 ${g.remainS} 秒`;
      } else {
        cdEl.style.display = "none";
      }
      if (g.progress === -1) {
        barEl.classList.add("indeterminate");
      } else {
        barEl.classList.remove("indeterminate");
        if (g.progress != null) barEl.style.width = (g.progress * 100).toFixed(1) + "%";
      }
    });
  }
</script>
</body>
</html>
