[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by black)
  "B008",   # do not perform function calls in argument defaults
  "B904",   # raise without from inside except (for custom exceptions)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "E402"]  # allow assert, ignore module level imports
"m2_server/tests/*" = ["S101", "E402"]
"m2_server/clip_qc.py" = ["E741"]  # ambiguous variable 'l' is typed
"m2_server/wechat_voice.py" = ["E402"]  # dynamic imports for performance

[tool.ruff.isort]
known-first-party = ["m2_server"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
    | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["m2_server"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "m2_server.tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=m2_server --cov-report=term-missing --cov-report=html --cov-report=json"
testpaths = ["m2_server/tests"]
# 这里**故意没有** asyncio_mode / asyncio_default_fixture_loop_scope：
# 它们是 pytest-asyncio 的配置，而本项目没有任何 async 用例、也没把该插件写进
# requirements-dev.txt —— 留着就是一份**看着像已接好、实际是惰性**的配置
# （CI 上只会多两条 PytestConfigWarning: Unknown config option）。
# 真要写 async 用例时，把插件加进 requirements-dev.txt + THIRD_PARTY_NOTICES.md，
# 再把这两项一起加回来。判据见 m2_server/tests/test_check_ci_fidelity.py §6。
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
  "error::DeprecationWarning",
  # anyio 4.15 起把 `anyio.abc.BlockingPortal` 变成了惰性别名（getattr 时发废弃警告），
  # 而 starlette 1.6.0 的 testclient.py 顶层还在引用它 → **import fastapi.testclient 就红**。
  # 同样是第三方库自己的事（本项目改不了），不豁免它 → 所有用 TestClient 的用例整片假红。
  # 2026-09-19 实测：干净 venv（anyio 4.15.1）6 条收集期 ERROR，本机 .venv（anyio 4.14.2）全绿。
  # 与上一条同一口径：只豁免这一条具体消息，别放宽成 ignore::DeprecationWarning。
  # ⚠️ starlette 更新后应回来删掉这行（它引用对了就不会再发）。
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  # pydub 在模块顶层 `import audioop`，Python 3.12+ 会发 DeprecationWarning；
  # 这是第三方库的事，本项目改不了。不豁免它 → 所有 import 到 pydub 的用例整片假红
  # （2026-09-19 实测：test_voices_api 6 条全红，且干净树上同样红 = 与业务代码无关）。
  # 只豁免这一条具体消息，别放宽成 ignore::DeprecationWarning（那会放过自己的废弃用法）。
  "ignore:'audioop' is deprecated:DeprecationWarning:pydub.utils",
]

[tool.coverage.run]
source = ["m2_server"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]
